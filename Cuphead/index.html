<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuphead - Build Folder Inspector</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #101114;
    color: #eee;
    font-family: Arial, sans-serif;
}

h1 {
    color: #e5b45b;
}

#status {
    padding: 12px;
    background: #20232a;
    border-radius: 8px;
    margin: 15px 0;
}

#results {
    margin-top: 15px;
}

.file {
    padding: 12px;
    margin-bottom: 8px;
    background: #20232a;
    border: 1px solid #383b43;
    border-radius: 7px;
    overflow-wrap: anywhere;
}

.filename {
    font-weight: bold;
    color: #e5b45b;
}

.details {
    color: #aaa;
    font-size: 12px;
    margin-top: 5px;
}

a {
    color: #80baff;
    overflow-wrap: anywhere;
}

button {
    padding: 12px 18px;
    background: #d6a34a;
    border: 0;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 5px 5px 0;
}

pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #08090b;
    padding: 12px;
    border-radius: 7px;
    max-height: 400px;
    overflow: auto;
    font-size: 12px;
}

#summary {
    color: #aaa;
    margin: 12px 0;
}
</style>
</head>

<body>

<h1>CUPHEAD BUILD INSPECTOR</h1>

<p>
This diagnostic checks the actual files in the Cuphead GitHub repository.
It does not download the game or modify anything.
</p>

<button onclick="inspectBuild()">Inspect Build Folder</button>
<button onclick="copyResults()">Copy Results</button>

<div id="status">Waiting to inspect repository...</div>
<div id="summary"></div>
<div id="results"></div>

<h3>Raw diagnostic output</h3>
<pre id="rawOutput">No results yet.</pre>

<script>
"use strict";

const API_URL =
"https://api.github.com/repos/AMoldyWaffle/Cuphead/contents/Build";

const RAW_ROOT =
"https://raw.githubusercontent.com/AMoldyWaffle/Cuphead/main/Build/";

const statusElement = document.getElementById("status");
const resultsElement = document.getElementById("results");
const rawOutputElement = document.getElementById("rawOutput");
const summaryElement = document.getElementById("summary");

let outputText = "";

function setStatus(message) {
    statusElement.textContent = message;
}

function formatSize(bytes) {
    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }

    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

async function inspectBuild() {
    resultsElement.innerHTML = "";
    summaryElement.textContent = "";
    outputText = "";

    setStatus("Connecting to GitHub API...");

    try {
        const response = await fetch(API_URL, {
            cache: "no-store",
            headers: {
                "Accept": "application/vnd.github+json"
            }
        });

        if (!response.ok) {
            throw new Error(
                "GitHub API returned HTTP " + response.status
            );
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
            throw new Error("GitHub did not return a file listing.");
        }

        const sorted = files.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        let totalSize = 0;
        let fileCount = 0;
        let directoryCount = 0;

        const lines = [];

        lines.push("CUPHEAD REPOSITORY BUILD FOLDER");
        lines.push("Repository: AMoldyWaffle/Cuphead");
        lines.push("Path: Build/");
        lines.push("========================================");
        lines.push("");

        for (const file of sorted) {
            const isDirectory = file.type === "dir";

            if (isDirectory) {
                directoryCount++;
            } else {
                fileCount++;
                totalSize += file.size || 0;
            }

            const downloadURL =
                file.download_url ||
                (isDirectory ? "" : RAW_ROOT + encodeURIComponent(file.name));

            const card = document.createElement("div");
            card.className = "file";

            const name = document.createElement("div");
            name.className = "filename";
            name.textContent =
                (isDirectory ? "[FOLDER] " : "[FILE] ") + file.name;

            const details = document.createElement("div");
            details.className = "details";

            details.textContent =
                "Size: " + (isDirectory ? "N/A" : formatSize(file.size || 0)) +
                " | Type: " + file.type;

            card.appendChild(name);
            card.appendChild(details);

            if (downloadURL) {
                const link = document.createElement("a");
                link.href = downloadURL;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Open download URL";
                card.appendChild(document.createElement("br"));
                card.appendChild(link);
            }

            resultsElement.appendChild(card);

            lines.push(
                file.type +
                " | " +
                file.name +
                " | " +
                (file.size || 0) +
                " bytes"
            );

            if (downloadURL) {
                lines.push("URL: " + downloadURL);
            }

            lines.push("");
        }

        lines.push("========================================");
        lines.push("Files: " + fileCount);
        lines.push("Folders: " + directoryCount);
        lines.push("Total listed file size: " + formatSize(totalSize));

        outputText = lines.join("\n");
        rawOutputElement.textContent = outputText;

        summaryElement.textContent =
            fileCount + " files, " +
            directoryCount + " folders, " +
            formatSize(totalSize) + " total";

        setStatus("Inspection complete.");

    } catch (error) {
        setStatus("Inspection failed: " + error.message);

        outputText =
            "ERROR: " + error.message +
            "\n\nPossible causes:\n" +
            "- GitHub API access is blocked.\n" +
            "- Network connection failed.\n" +
            "- Repository or folder could not be found.";

        rawOutputElement.textContent = outputText;
    }
}

async function copyResults() {
    if (!outputText) {
        setStatus("Nothing to copy yet.");
        return;
    }

    try {
        await navigator.clipboard.writeText(outputText);
        setStatus("Results copied to clipboard.");
    } catch (error) {
        rawOutputElement.focus;
        setStatus("Clipboard unavailable. Copy the raw diagnostic output manually.");
    }
}

inspectBuild();
</script>

</body>
</html>
