name: Update game catalog

on:
  push:
    branches: [main]
    paths:
      - "Games/**"
      - "scripts/generate-games-index.py"
      - ".github/workflows/update-game-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate JavaScript catalog
        run: python3 scripts/generate-games-index.py
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- games-index.js; then
            echo "Game catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games-index.js
          git commit -m "Automatically update game catalog"
          git push
