<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Cuphead — Isolated Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#f4f4f8;font:14px system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#status{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;max-width:min(90vw,520px);border:1px solid #333;border-radius:10px;background:#101014;color:#ddd;text-align:center;line-height:1.5}
#status[hidden]{display:none}
</style>
</head>
<body>
<div id="status" role="status">Opening Cuphead in its isolated game frame…</div>
<iframe id="game" title="Cuphead game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
"use strict";
const params=new URLSearchParams(location.search);
const GAME_URL=params.get("game");
const frame=document.getElementById("game");
const status=document.getElementById("status");
if(!GAME_URL){
 status.textContent="Cuphead runner error: no game URL was provided.";
}else{
 let loaded=false;
 const timeout=setTimeout(()=>{
  if(!loaded)status.textContent="Cuphead is taking longer than expected to start. The collection controls remain available outside this frame.";
 },12000);
 frame.addEventListener("load",()=>{
  loaded=true;
  clearTimeout(timeout);
  status.hidden=true;
 });
 frame.addEventListener("error",()=>{
  status.textContent="Cuphead could not be loaded. Use the collection Back button to return.";
 });
 frame.src=GAME_URL;
}
</script>
</body>
</html>
