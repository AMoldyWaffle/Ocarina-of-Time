<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060a"><title>Cuphead — Isolated Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#f4f4f8;font:14px system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#bar{position:fixed;z-index:5;top:10px;left:10px;display:flex;gap:8px;opacity:.22;transition:opacity .18s}#bar:hover,#bar:focus-within{opacity:1}
button,a{border:1px solid #777;background:#171717ef;color:#fff;border-radius:7px;padding:9px 12px;font:600 12px system-ui;text-decoration:none;cursor:pointer}
#status{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;max-width:min(90vw,520px);border:1px solid #333;border-radius:10px;background:#101014;color:#ddd;text-align:center;line-height:1.5}#status[hidden]{display:none}
</style></head><body>
<div id="bar"><button id="back" type="button">Back to Collection</button><a id="direct" target="_blank" rel="noopener">Open game directly</a></div>
<div id="status" role="status">Opening Cuphead in an isolated game frame…</div>
<iframe id="game" title="Cuphead game" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
"use strict";
const GAME_URL=__GAME_URL__;
const COLLECTION_URL="https://amoldywaffle.github.io/Ocarina-of-Time/";
const frame=document.getElementById("game"),status=document.getElementById("status");
document.getElementById("direct").href=GAME_URL;
document.getElementById("back").addEventListener("click",()=>location.href=COLLECTION_URL);
let loaded=false;
const timeout=setTimeout(()=>{if(!loaded)status.textContent="Cuphead is taking longer than expected. The game is still loading; use Open game directly if the frame stays blank.";},12000);
frame.addEventListener("load",()=>{loaded=true;clearTimeout(timeout);status.hidden=true;});
frame.addEventListener("error",()=>{status.textContent="The isolated game frame could not load. Try Open game directly.";});
frame.src=GAME_URL;
</script></body></html>
