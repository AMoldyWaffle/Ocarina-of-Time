<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA III</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas.emscripten{display:block;width:100vw;height:100vh;object-fit:contain}
#loading{position:absolute;z-index:10;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font:14px monospace;text-align:center;white-space:pre-wrap;max-width:90%;line-height:1.6}
</style>
</head>
<body>
<div id="loading">Loading GTA III...</div>

<script>
(function(){
var original=Element.prototype.requestPointerLock;
if(original)Element.prototype.requestPointerLock=function(){
try{
var result=original.call(this);
if(result&&result.catch)result.catch(function(){});
return result;
}catch(e){}
};
})();

Element.prototype.requestFullscreen=
Element.prototype.webkitRequestFullscreen=function(){
return Promise.reject(new DOMException('blocked'));
};
document.exitFullscreen=document.webkitExitFullscreen=function(){};

[
'fullscreenElement',
'webkitFullscreenElement'
].forEach(function(name){
Object.defineProperty(document,name,{
configurable:true,
get:function(){return null}
});
});

[
'fullscreenEnabled',
'webkitFullscreenEnabled'
].forEach(function(name){
Object.defineProperty(document,name,{
configurable:true,
get:function(){return false}
});
});

(function(){
var RealAC=window.AudioContext||window.webkitAudioContext;
if(!RealAC)return;
var contexts=[];
function resumeAll(){
contexts.forEach(function(ctx){
if(ctx.state==='suspended')ctx.resume().catch(function(){});
});
}
document.addEventListener('click',resumeAll);
document.addEventListener('touchstart',resumeAll);
document.addEventListener('keydown',resumeAll);
var Wrapper=function(options){
var ctx=new RealAC(options);
contexts.push(ctx);
if(ctx.state==='suspended')ctx.resume().catch(function(){});
return ctx;
};
Wrapper.prototype=RealAC.prototype;
window.AudioContext=Wrapper;
if(window.webkitAudioContext)window.webkitAudioContext=Wrapper;
})();

window.addEventListener('unhandledrejection',function(event){
console.error(event.reason);
var loading=document.getElementById('loading');
if(loading&&event.reason){
loading.textContent='ERROR:\n'+
(event.reason.message||event.reason);
}
});
</script>

<script>
var Module={
preRun:[],
postRun:[],
canvas:(function(){
var canvas=document.createElement('canvas');
canvas.id='canvas';
canvas.className='emscripten';
document.body.appendChild(canvas);
return canvas;
})(),
setStatus:function(message){
var loading=document.getElementById('loading');
if(loading)loading.textContent=message;
},
totalDependencies:0,
monitorRunDependencies:function(left){
this.totalDependencies=Math.max(this.totalDependencies,left);
Module.setStatus(left
?'Preparing game...\n'+
(this.totalDependencies-left)+' / '+this.totalDependencies
:'');
}
};
Module.setStatus('Initializing GTA III...');
</script>

<script>
(function(){
'use strict';

var REPO='AMoldyWaffle/GTA3';
var BRANCH='main';

var HOSTS=[
'https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/',
'https://cdn.jsdelivr.net/gh/'+REPO+'@'+BRANCH+'/',
'https://raw.githack.com/'+REPO+'/'+BRANCH+'/'
];

var CHUNKS_PER_BATCH=4;
var REQUEST_TIMEOUT=300000;
var CHUNK_CACHE_NAME='gta3-chunk-cache-v1';
var CHUNK_CACHE_MAX_AGE=24*60*60*1000;

function status(message){
Module.setStatus(message);
}

function makeUrl(host,file){
return host+file+'?t='+Date.now();
}

function fetchText(url){
var controller=new AbortController();
var timeout=setTimeout(function(){
controller.abort();
},REQUEST_TIMEOUT);

return fetch(url,{
signal:controller.signal,
cache:'no-store',
credentials:'omit'
}).then(function(response){
if(!response.ok){
throw new Error('HTTP '+response.status);
}
return response.text();
}).finally(function(){
clearTimeout(timeout);
});
}

async function getText(file){
var errors=[];

for(var i=0;i<HOSTS.length;i++){
status(
'Downloading '+file+'...\n'+
'Source '+(i+1)+' of '+HOSTS.length
);

try{
var text=await fetchText(makeUrl(HOSTS[i],file));
if(!text)throw new Error('Empty response');
if(/^\s*(<!DOCTYPE|<html)/i.test(text)){
throw new Error('Invalid file response');
}
return text;
}catch(error){
errors.push(
'Source '+(i+1)+': '+(error.message||String(error))
);
}
}

throw new Error(
'Could not download '+file+'.\n\n'+
errors.join('\n')
);
}

async function loadScript(file){
var errors=[];
var source=null;

for(var i=0;i<HOSTS.length;i++){
try{
status(
'Downloading game engine...\n'+
'Source '+(i+1)+' of '+HOSTS.length
);

source=await fetchText(makeUrl(HOSTS[i],file));

if(!source||source.length<1000){
throw new Error('Invalid JavaScript response');
}

if(/^\s*(<!DOCTYPE|<html)/i.test(source)){
throw new Error('Invalid file response');
}

break;

}catch(error){
errors.push(
'Source '+(i+1)+': '+(error.message||String(error))
);
source=null;
}
}

if(!source){
throw new Error(
'Unable to download game engine.\n'+errors.join('\n')
);
}

status('Starting game...');

var blob=new Blob([source],{type:'text/javascript'});
source=null;

var blobUrl=URL.createObjectURL(blob);

try{
await new Promise(function(resolve,reject){
var script=document.createElement('script');
var finished=false;

var timeout=setTimeout(function(){
if(finished)return;
finished=true;
script.remove();
reject(new Error('Script execution timed out'));
},REQUEST_TIMEOUT);

script.onload=function(){
if(finished)return;
finished=true;
clearTimeout(timeout);
script.remove();
resolve();
};

script.onerror=function(){
if(finished)return;
finished=true;
clearTimeout(timeout);
script.remove();
reject(new Error('Could not start game'));
};

script.src=blobUrl;
document.head.appendChild(script);
});
}finally{
URL.revokeObjectURL(blobUrl);
}
}

function extractBase64(source,variable){
var marker='window.'+variable;
var start=source.indexOf(marker);

if(start<0){
marker=variable;
start=source.indexOf(marker);
}

if(start<0){
throw new Error('Invalid game data');
}

var equals=source.indexOf('=',start);
var quote=source.indexOf('"',equals);

if(quote<0){
quote=source.indexOf("'",equals);
}

if(quote<0){
throw new Error('Invalid game data format');
}

var end=source.indexOf(source.charAt(quote),quote+1);

if(end<0){
throw new Error('Incomplete game data');
}

return source.substring(quote+1,end);
}

function decodeBase64(base64){
if(typeof Uint8Array.fromBase64==='function'){
return Uint8Array.fromBase64(base64);
}

var binary=atob(base64);
var bytes=new Uint8Array(binary.length);

for(var i=0;i<binary.length;i++){
bytes[i]=binary.charCodeAt(i);
}

return bytes;
}

async function fetchChunk(index){
var file='re3.chunk.'+index+'.js';
var errors=[];
var cache=null;
var cacheKey='https://gta3-cache.invalid/chunks/'+index;

try{
if('caches' in window){
cache=await caches.open(CHUNK_CACHE_NAME);
var cached=await cache.match(cacheKey);

if(cached){
var savedAt=Number(cached.headers.get('x-gta3-cached-at')||0);

if(savedAt>0&&Date.now()-savedAt<CHUNK_CACHE_MAX_AGE){
var cachedBytes=new Uint8Array(await cached.arrayBuffer());
if(cachedBytes.length){
status('Using cached GTA III data part '+(index+1)+'...');
return cachedBytes;
}
}

await cache.delete(cacheKey);
}
}
}catch(cacheError){
console.warn('[GTA III cache] Read failed:',cacheError);
cache=null;
}

for(var i=0;i<HOSTS.length;i++){
var source=null;

try{
source=await fetchText(makeUrl(HOSTS[i],file));

var encoded=extractBase64(source,'__CHUNK');
source=null;

var bytes=decodeBase64(encoded);
encoded=null;

if(cache){
try{
await cache.put(cacheKey,new Response(bytes,{
headers:{'x-gta3-cached-at':String(Date.now())}
}));
}catch(cacheError){
console.warn('[GTA III cache] Could not save part:',cacheError);
}
}

return bytes;

}catch(error){
source=null;
errors.push(
'Source '+(i+1)+': '+(error.message||String(error))
);
}
}

throw new Error(
'Failed to download game data part '+index+'.\n'+
errors.join('\n')
);
}

async function start(){
try{
status('Downloading WebAssembly data...');

var wasmSource=await getText('re3.wasm.js');
var wasmEncoded=extractBase64(wasmSource,'__WASM_B64');
wasmSource=null;

status('Preparing WebAssembly...');

var wasmBytes=decodeBase64(wasmEncoded);
wasmEncoded=null;

Module.wasmBinary=wasmBytes.buffer;
wasmBytes=null;

status('Loading game-data information...');

var infoSource=await getText('chunks.json.js');

var countMatch=infoSource.match(/__CHUNK_COUNT\s*=\s*(\d+)/);
var sizeMatch=infoSource.match(/__DATA_SIZE\s*=\s*(\d+)/);

infoSource=null;

if(!countMatch||!sizeMatch){
throw new Error('Could not read game-data information');
}

var count=Number(countMatch[1]);
var dataSize=Number(sizeMatch[1]);

if(!Number.isSafeInteger(count)||count<1||
!Number.isSafeInteger(dataSize)||dataSize<1){
throw new Error('Invalid game-data information');
}

countMatch=null;
sizeMatch=null;

status(
'Allocating game memory...\n'+
Math.round(dataSize/1048576)+' MB required'
);

var gameBuffer=new Uint8Array(dataSize);
var offset=0;
var completed=0;

for(var batchStart=0;batchStart<count;){
var remaining=count-batchStart;
var batchSize=Math.min(remaining,CHUNKS_PER_BATCH);
var batchEnd=Math.min(batchStart+batchSize,count);

status(
'Downloading GTA III data...\n'+
completed+' / '+count+' parts complete\n'+
Math.round(offset/1048576)+' / '+
Math.round(dataSize/1048576)+' MB assembled'
);

var batch=await Promise.all(
Array.from(
{length:batchEnd-batchStart},
function(_,position){
return fetchChunk(batchStart+position);
}
)
);

for(var j=0;j<batch.length;j++){
var chunk=batch[j];

if(offset+chunk.length>dataSize){
throw new Error(
'Unexpected data size in part '+(batchStart+j)
);
}

gameBuffer.set(chunk,offset);
offset+=chunk.length;
batch[j]=null;
completed++;
}

batch=null;
batchStart=batchEnd;
}

if(offset!==dataSize){
throw new Error(
'Game data is incomplete: '+
offset+' / '+dataSize+' bytes'
);
}

status('Preparing game files...');

Module.getPreloadedPackage=function(name){
if(/re3\.data$/.test(name)){
return gameBuffer.buffer;
}
return undefined;
};

status('Starting GTA III...');

await loadScript('re3.js');

}catch(error){
console.error(error);
status(
'GTA III ERROR:\n\n'+
(error&&error.message?error.message:String(error))
);
}
}

start();
})();
</script>
</body>
</html>
