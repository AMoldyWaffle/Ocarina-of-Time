<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base id="assetBase" href="https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight</title>
<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:white}
body{display:flex;align-items:center;justify-content:center}
#loadingScreen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 100%,rgba(100,0,0,.24),transparent 65%),#000;transition:opacity .5s}
#loadingScreen::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.8) 100%)}
.loader-content{position:relative;width:min(480px,85%);text-align:center}
#status{font-size:14px;color:#ddd;margin-bottom:12px}
#overallBar{height:5px;width:100%;background:#222;overflow:hidden;border-radius:5px}
#overallProgress{width:0%;height:100%;background:#bd1717;box-shadow:0 0 15px #b00000;transition:width .2s ease}
.progress-row{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:24px;margin-bottom:8px}
.small-bar{width:100%;height:3px;background:#191919;border-radius:3px;overflow:hidden}
.small-progress{height:100%;width:0%;background:#a51616;transition:width .15s}
#percentage{margin-top:18px;font-size:13px;color:#aaa;letter-spacing:2px}
#details{margin-top:24px;color:#777;font-size:11px;line-height:1.8;overflow-wrap:anywhere}
#loadingError{display:none;margin-top:25px;color:#ff5555;font-size:12px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow-y:auto}
#retryButton{display:none;margin-top:20px;border:1px solid #941818;background:#210707;color:white;padding:12px 28px;cursor:pointer;letter-spacing:2px}
#retryButton:hover{background:#481010}
#unity-container{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;background:#000}
#unity-canvas{display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);max-width:100%;max-height:calc(100% - 45px);aspect-ratio:16/10;background:#000}
#unity-footer{width:min(960px,100%);height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#777;font-size:12px}
#fullscreenButton{background:#171717;border:1px solid #333;color:white;padding:7px 15px;cursor:pointer}
#fullscreenButton:hover,.saveButton:hover{background:#333}
.saveButton{background:#171717;border:1px solid #333;color:white;padding:7px 12px;cursor:pointer;font-size:12px}
#saveStatus{color:#aaa;font-size:11px;margin-left:8px}
#resolutionScale{background:#171717;border:1px solid #333;color:white;padding:7px 8px;font-size:12px;max-width:125px}
@media(max-width:600px){#unity-canvas{width:100vw;height:auto;max-height:calc(100vh - 38px)}}
</style>
</head>
<body>

<div id="loadingScreen">
    <div class="loader-content">
        <div id="status">Preparing game...</div>
        <div id="overallBar"><div id="overallProgress"></div></div>
        <div id="percentage">0%</div>

        <div class="progress-row"><span>GAME DATA</span><span id="dataCount">0 / 44</span></div>
        <div class="small-bar"><div class="small-progress" id="dataProgress"></div></div>

        <div class="progress-row"><span>WEBASSEMBLY</span><span id="wasmCount">0 / 3</span></div>
        <div class="small-bar"><div class="small-progress" id="wasmProgress"></div></div>

        <div id="details">Initializing storage...</div>
        <div id="loadingError"></div>
        <button id="retryButton" onclick="startGame()">RETRY</button>
    </div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-footer">
        <span>Hollow Knight <span id="saveStatus" aria-live="polite"></span></span>
        <div style="display:flex;gap:7px;align-items:center">
            <select id="resolutionScale" class="saveButton" aria-label="Graphics resolution" title="Graphics resolution">
                <option value="1">Graphics: 1.00x</option>
                <option value="0.85">Graphics: 0.85x</option>
                <option value="0.70">Graphics: 0.70x</option>
                <option value="0.60" selected>Graphics: 0.60x</option>
                <option value="0.50">Graphics: 0.50x</option>
                <option value="0.45">Graphics: 0.45x</option>
            </select>
            <button class="saveButton" id="saveButton" type="button">SAVE FILE</button>
            <button class="saveButton" id="loadButton" type="button">LOAD FILE</button>
            <button id="fullscreenButton">FULLSCREEN</button>
        </div>
        <input id="saveFileInput" type="file" accept=".hksave,.json,application/json" hidden>
    </div>
</div>

<script>
"use strict";

/* CONFIGURATION */

const CONFIG = {
    baseURLs: [
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://quantil.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://originfastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://github.com/AMoldyWaffle/Hollow-Knight/raw/refs/heads/main/",
        "https://github.com/AMoldyWaffle/Hollow-Knight/raw/main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/refs/heads/main/"
    ],

    buildURL: "Build/",
    loader: "hk.loader.js",
    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",
    dataParts: 44,
    wasmParts: 3,
    framework: "hk.framework.js",
    streamingAssets: "StreamingAssets",

    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",

    // New version intentionally invalidates older cached downloads.
    cacheVersion: "hk-proxy-validated-v10",
    storageDirectory: "HollowKnightCache",
    databaseName: "HollowKnightFileCache",

    // Retry each chunk through multiple mirrors.
    chunkRetries: 2,
    maxParallelChunks: 8,

    // If known, put the exact expected sizes of individual pieces here.
    // Leave empty until verified against the original repository files.
    expectedPartSizes: {
        data: [],
        wasm: []
    }
};

/* ELEMENTS */

const $ = id => document.getElementById(id);
const loadingScreen = $("loadingScreen");
const unityContainer = $("unity-container");
const canvas = $("unity-canvas");
const statusText = $("status");
const details = $("details");
const overallProgress = $("overallProgress");
const percentage = $("percentage");
const dataProgress = $("dataProgress");
const wasmProgress = $("wasmProgress");
const dataCount = $("dataCount");
const wasmCount = $("wasmCount");
const errorElement = $("loadingError");
const retryButton = $("retryButton");

let completedData = 0;
let completedWasm = 0;
let storageMode = null;
let storageRoot = null;
let database = null;
let starting = false;
let activeBaseURL = CONFIG.baseURLs[0];
let frameworkBlobURL = null;
let loaderBlobURL = null;

/* MIRROR LOADING */

function getOrderedMirrors(excluded = []) {
    return [
        activeBaseURL,
        ...CONFIG.baseURLs.filter(url => url !== activeBaseURL)
    ].filter((url, index, all) =>
        !excluded.includes(url) && all.indexOf(url) === index
    );
}

async function fetchFromMirror(relativePath, baseURL, options = {}) {
    const url = new URL(relativePath, baseURL).href;
    const response = await fetch(url, {
        ...options,
        cache: "no-store",
        redirect: "follow"
    });

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    if (response.type === "opaque") {
        throw new Error("Opaque response cannot be validated");
    }

    return response;
}

async function fetchAsset(relativePath, options = {}) {
    const failures = [];

    for (const baseURL of getOrderedMirrors()) {
        try {
            const response = await fetchFromMirror(relativePath, baseURL, options);
            activeBaseURL = baseURL;

            const baseElement = $("assetBase");
            if (baseElement) baseElement.href = baseURL;

            return response;
        } catch (error) {
            failures.push(
                new URL(relativePath, baseURL).hostname + ": " + error.message
            );
        }
    }

    // Last-resort API endpoint for smaller files.
    try {
        const apiURL =
            "https://api.github.com/repos/AMoldyWaffle/Hollow-Knight/contents/" +
            relativePath.split("/").map(encodeURIComponent).join("/") +
            "?ref=main";

        const response = await fetch(apiURL, { cache: "no-store" });

        if (response.ok) {
            const payload = await response.json();

            if (payload && payload.encoding === "base64" && payload.content) {
                const binary = atob(payload.content.replace(/\s/g, ""));
                const bytes = new Uint8Array(binary.length);

                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                return new Response(bytes, {
                    status: 200,
                    headers: { "Content-Type": "application/octet-stream" }
                });
            }
        }
    } catch (error) {
        failures.push("API fallback: " + error.message);
    }

    throw new Error(
        "Unable to retrieve asset: " + relativePath + "\n" +
        failures.join("\n")
    );
}

/*
 * Downloads a chunk from one mirror, checks it, and retries other mirrors
 * if it appears incomplete. Range requests are deliberately not used here.
 */
async function fetchValidatedPart(prefix, index) {
    const partName = prefix + "." + String(index).padStart(3, "0");
    const relativePath = CONFIG.buildURL + partName;
    const kind = prefix === CONFIG.dataPrefix ? "data" : "wasm";
    const expectedSizes = CONFIG.expectedPartSizes[kind] || [];
    const expectedSize = expectedSizes[index] || null;

    const failures = [];
    const mirrors = getOrderedMirrors();

    const maxAttempts = Math.min(
        mirrors.length,
        CONFIG.chunkRetries + 1
    );

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const mirror = mirrors[attempt];

        try {
            statusText.textContent = "Downloading " + prefix + "...";
            details.textContent =
                "Part " + (index + 1) + " of " +
                (prefix === CONFIG.dataPrefix ? CONFIG.dataParts : CONFIG.wasmParts) +
                " · Attempt " + (attempt + 1);

            const response = await fetchFromMirror(relativePath, mirror);
            const blob = await response.blob();

            if (!blob.size) {
                throw new Error("Empty response");
            }

            const contentLength = response.headers.get("content-length");

            if (
                contentLength &&
                !response.headers.get("content-encoding") &&
                Number(contentLength) !== blob.size
            ) {
                throw new Error(
                    "Content-Length mismatch: expected " +
                    contentLength + ", received " + blob.size
                );
            }

            if (expectedSize && blob.size !== expectedSize) {
                throw new Error(
                    "Incorrect chunk size: expected " +
                    expectedSize + ", received " + blob.size
                );
            }

            activeBaseURL = mirror;

            const baseElement = $("assetBase");
            if (baseElement) baseElement.href = mirror;

            return blob;

        } catch (error) {
            failures.push(
                mirror.split("/")[2] + ": " + error.message
            );
        }
    }

    throw new Error(
        "All mirrors failed for " + partName + "\n" +
        failures.join("\n")
    );
}

/* PARALLEL WORKER */

async function mapWithConcurrency(items, concurrency, worker) {
    const results = new Array(items.length);
    let nextIndex = 0;

    async function runWorker() {
        while (true) {
            const index = nextIndex++;
            if (index >= items.length) return;
            results[index] = await worker(items[index], index);
        }
    }

    const workers = Array.from(
        { length: Math.min(concurrency, items.length) },
        () => runWorker()
    );

    await Promise.all(workers);
    return results;
}

/* PROGRESS */

function setOverall(value) {
    value = Math.max(0, Math.min(100, value));
    overallProgress.style.width = value + "%";
    percentage.textContent = Math.floor(value) + "%";
}

function updateProgress() {
    dataProgress.style.width =
        completedData / CONFIG.dataParts * 100 + "%";

    wasmProgress.style.width =
        completedWasm / CONFIG.wasmParts * 100 + "%";

    dataCount.textContent =
        completedData + " / " + CONFIG.dataParts;

    wasmCount.textContent =
        completedWasm + " / " + CONFIG.wasmParts;

    const total = CONFIG.dataParts + CONFIG.wasmParts;
    setOverall((completedData + completedWasm) / total * 70);
}

function updatePartProgress(prefix, completed) {
    if (prefix === CONFIG.dataPrefix) {
        completedData = completed;
    } else {
        completedWasm = completed;
    }
    updateProgress();
}

function yieldUI() {
    return new Promise(resolve => requestAnimationFrame(resolve));
}

/* INDEXEDDB */

function openDatabase() {
    return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
            reject(new Error("IndexedDB is unavailable."));
            return;
        }

        const request = indexedDB.open(CONFIG.databaseName, 1);

        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("files")) {
                db.createObjectStore("files");
            }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(
            new Error("IndexedDB is blocked by another connection.")
        );
    });
}

function idbGet(key) {
    return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readonly");
        const request = transaction.objectStore("files").get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function idbPut(key, value) {
    return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readwrite");
        transaction.objectStore("files").put(value, key);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}

function idbDelete(key) {
    return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readwrite");
        transaction.objectStore("files").delete(key);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
    });
}

/* STORAGE */

async function initializeStorage() {
    statusText.textContent = "Initializing storage...";
    details.textContent = "Checking available browser storage.";

    try {
        if (
            navigator.storage &&
            typeof navigator.storage.getDirectory === "function"
        ) {
            if (navigator.storage.persist) {
                try { await navigator.storage.persist(); } catch (_) {}
            }

            const root = await navigator.storage.getDirectory();

            storageRoot = await root.getDirectoryHandle(
                CONFIG.storageDirectory,
                { create: true }
            );

            storageMode = "opfs";
            details.textContent = "Using disk-backed storage.";
            return;
        }
    } catch (error) {
        console.warn("OPFS unavailable:", error);
    }

    try {
        database = await openDatabase();
        storageMode = "indexeddb";
        details.textContent = "Using IndexedDB storage.";
        return;
    } catch (error) {
        throw new Error(
            "No usable browser storage system is available.\n\n" +
            "Storage error: " + error.message
        );
    }
}

/* OPFS CACHE */

async function getOPFSCachedFile(filename) {
    try {
        const fileHandle = await storageRoot.getFileHandle(filename);
        const markerHandle = await storageRoot.getFileHandle(filename + ".complete");

        const file = await fileHandle.getFile();
        const marker = await markerHandle.getFile();
        const markerText = await marker.text();

        if (
            file.size > 0 &&
            markerText === CONFIG.cacheVersion + ":" + file.size
        ) {
            console.log("Valid cache:", filename, file.size);
            return file;
        }
    } catch (_) {}

    return null;
}

async function markOPFSComplete(filename, size) {
    const handle = await storageRoot.getFileHandle(
        filename + ".complete",
        { create: true }
    );

    const writer = await handle.createWritable();

    try {
        await writer.write(CONFIG.cacheVersion + ":" + size);
        await writer.close();
    } catch (error) {
        try { await writer.abort(); } catch (_) {}
        throw error;
    }
}

/* INDEXEDDB CACHE */

async function getIDBCachedFile(filename) {
    try {
        const cached = await idbGet(
            CONFIG.cacheVersion + ":" + filename
        );

        if (
            cached &&
            cached.blob instanceof Blob &&
            cached.blob.size > 0 &&
            cached.size === cached.blob.size &&
            cached.version === CONFIG.cacheVersion
        ) {
            return cached.blob;
        }
    } catch (_) {}

    return null;
}

/* OPFS MERGER */

async function mergeOPFS(prefix, partCount, progressCallback) {
    const cached = await getOPFSCachedFile(prefix);

    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    try { await storageRoot.removeEntry(prefix + ".complete"); } catch (_) {}

    const outputHandle = await storageRoot.getFileHandle(
        prefix,
        { create: true }
    );

    const writer = await outputHandle.createWritable({
        keepExistingData: false
    });

    let totalBytes = 0;
    let completed = 0;

    try {
        const batchSize = Math.min(CONFIG.maxParallelChunks, 8);

        for (let batchStart = 0; batchStart < partCount; batchStart += batchSize) {
            const indices = Array.from(
                { length: Math.min(batchSize, partCount - batchStart) },
                (_, offset) => batchStart + offset
            );

            const blobs = await mapWithConcurrency(
                indices,
                batchSize,
                async index => {
                    return await fetchValidatedPart(prefix, index);
                }
            );

            for (const blob of blobs) {
                await writer.write(blob);
                totalBytes += blob.size;
                completed++;
                progressCallback(completed);
            }

            await yieldUI();
        }

        await writer.close();

        const mergedFile = await outputHandle.getFile();

        if (
            mergedFile.size === 0 ||
            mergedFile.size !== totalBytes
        ) {
            throw new Error(
                "Merged file size validation failed for " + prefix
            );
        }

        await markOPFSComplete(prefix, mergedFile.size);
        return mergedFile;

    } catch (error) {
        try { await writer.abort(); } catch (_) {}
        try { await storageRoot.removeEntry(prefix); } catch (_) {}
        try { await storageRoot.removeEntry(prefix + ".complete"); } catch (_) {}
        throw error;
    }
}

/* INDEXEDDB MERGER */

async function mergeIndexedDB(prefix, partCount, progressCallback) {
    const cached = await getIDBCachedFile(prefix);

    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    let completed = 0;

    const indices = Array.from(
        { length: partCount },
        (_, index) => index
    );

    const parts = await mapWithConcurrency(
        indices,
        CONFIG.maxParallelChunks,
        async index => {
            const partName =
                prefix + "." + String(index).padStart(3, "0");

            const partKey =
                CONFIG.cacheVersion + ":part:" + partName;

            let partBlob = null;

            try {
                const saved = await idbGet(partKey);

                if (
                    saved &&
                    saved.blob instanceof Blob &&
                    saved.blob.size > 0 &&
                    saved.size === saved.blob.size &&
                    saved.version === CONFIG.cacheVersion
                ) {
                    partBlob = saved.blob;
                }
            } catch (_) {}

            if (!partBlob) {
                partBlob = await fetchValidatedPart(prefix, index);

                await idbPut(partKey, {
                    blob: partBlob,
                    size: partBlob.size,
                    version: CONFIG.cacheVersion
                });
            }

            completed++;
            progressCallback(completed);

            return partBlob;
        }
    );

    statusText.textContent = "Combining " + prefix + "...";
    details.textContent = "Verifying downloaded pieces.";

    const totalBytes = parts.reduce(
        (sum, blob) => sum + blob.size,
        0
    );

    const mergedBlob = new Blob(parts, {
        type: prefix === CONFIG.wasmPrefix
            ? "application/wasm"
            : "application/octet-stream"
    });

    if (
        mergedBlob.size === 0 ||
        mergedBlob.size !== totalBytes
    ) {
        throw new Error(
            "IndexedDB merge validation failed: " + prefix
        );
    }

    await idbPut(
        CONFIG.cacheVersion + ":" + prefix,
        {
            blob: mergedBlob,
            size: mergedBlob.size,
            version: CONFIG.cacheVersion
        }
    );

    return mergedBlob;
}

/* MERGE SELECTOR */

async function mergeFile(prefix, partCount, progressCallback) {
    if (storageMode === "opfs") {
        return await mergeOPFS(prefix, partCount, progressCallback);
    }

    if (storageMode === "indexeddb") {
        return await mergeIndexedDB(prefix, partCount, progressCallback);
    }

    throw new Error("Storage has not been initialized.");
}

/* PREPARE FILES */

async function prepareGameFiles() {
    await initializeStorage();

    statusText.textContent = "Preparing game files in parallel...";

    const [dataFile, wasmFile] = await Promise.all([
        mergeFile(CONFIG.dataPrefix, CONFIG.dataParts, completed => {
            updatePartProgress(CONFIG.dataPrefix, completed);
        }),
        mergeFile(CONFIG.wasmPrefix, CONFIG.wasmParts, completed => {
            updatePartProgress(CONFIG.wasmPrefix, completed);
        })
    ]);

    return { dataFile, wasmFile };
}

/* UNITY LOADER */

async function loadUnityLoader() {
    if (typeof createUnityInstance === "function") return;

    statusText.textContent = "Loading Unity engine...";

    const response = await fetchAsset(
        CONFIG.buildURL + CONFIG.loader
    );

    const blob = await response.blob();

    if (!blob.size) {
        throw new Error("Unity loader download was empty.");
    }

    loaderBlobURL = URL.createObjectURL(
        new Blob([blob], { type: "text/javascript" })
    );

    const script = document.createElement("script");
    script.src = loaderBlobURL;
    script.async = true;

    await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(
            new Error("Could not execute the Unity loader.")
        );
        document.head.appendChild(script);
    });

    if (typeof createUnityInstance !== "function") {
        throw new Error(
            "Unity loader loaded, but createUnityInstance is missing."
        );
    }
}

/* PORTABLE SAVE / RESTORE */

const SAVE_FORMAT = "hollow-knight-browser-save-v1";
const saveStatus = $("saveStatus");
const saveFileInput = $("saveFileInput");
const resolutionScale = $("resolutionScale");
const HK_SCALE_KEY = "hollowKnightGraphicsScale";

try {
    const savedScale = localStorage.getItem(HK_SCALE_KEY);
    if (savedScale && Array.from(resolutionScale.options).some(option => option.value === savedScale)) {
        resolutionScale.value = savedScale;
    }
} catch (_) {}

resolutionScale.addEventListener("change", () => {
    try { localStorage.setItem(HK_SCALE_KEY, resolutionScale.value); } catch (_) {}
    setSaveStatus("Graphics: " + Number(resolutionScale.value).toFixed(2) + "x — reload to apply");
});

function setSaveStatus(message) {
    if (saveStatus) saveStatus.textContent = message;
}

function bytesToBase64(bytes) {
    let binary = "";
    const step = 0x8000;

    for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(
            ...bytes.subarray(i, i + step)
        );
    }

    return btoa(binary);
}

function encodeSaveValue(value) {
    if (value instanceof ArrayBuffer) {
        return {
            __hkType: "ArrayBuffer",
            data: bytesToBase64(new Uint8Array(value))
        };
    }

    if (ArrayBuffer.isView(value)) {
        return {
            __hkType: "TypedArray",
            name: value.constructor.name,
            data: bytesToBase64(
                new Uint8Array(
                    value.buffer,
                    value.byteOffset,
                    value.byteLength
                )
            )
        };
    }

    if (value instanceof Date) {
        return { __hkType: "Date", value: value.toISOString() };
    }

    if (Array.isArray(value)) {
        return value.map(encodeSaveValue);
    }

    if (value && typeof value === "object") {
        const out = {};
        for (const [key, item] of Object.entries(value)) {
            out[key] = encodeSaveValue(item);
        }
        return out;
    }

    return value;
}

async function encodeSaveValueAsync(value) {
    if (value instanceof Blob) {
        return {
            __hkType: "Blob",
            type: value.type,
            data: bytesToBase64(
                new Uint8Array(await value.arrayBuffer())
            )
        };
    }

    if (
        value instanceof ArrayBuffer ||
        ArrayBuffer.isView(value) ||
        value instanceof Date
    ) {
        return encodeSaveValue(value);
    }

    if (Array.isArray(value)) {
        return await Promise.all(value.map(encodeSaveValueAsync));
    }

    if (value && typeof value === "object") {
        const out = {};
        for (const [key, item] of Object.entries(value)) {
            out[key] = await encodeSaveValueAsync(item);
        }
        return out;
    }

    return value;
}

function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}

function decodeSaveValue(value) {
    if (Array.isArray(value)) {
        return value.map(decodeSaveValue);
    }

    if (!value || typeof value !== "object") {
        return value;
    }

    if (value.__hkType === "ArrayBuffer") {
        return base64ToBytes(value.data).buffer;
    }

    if (value.__hkType === "Blob") {
        return new Blob(
            [base64ToBytes(value.data)],
            { type: value.type || "" }
        );
    }

    if (value.__hkType === "Date") {
        return new Date(value.value);
    }

    if (value.__hkType === "TypedArray") {
        const bytes = base64ToBytes(value.data);

        const constructors = {
            Int8Array, Uint8Array, Uint8ClampedArray,
            Int16Array, Uint16Array, Int32Array, Uint32Array,
            Float32Array, Float64Array,
            BigInt64Array, BigUint64Array
        };

        const Ctor = constructors[value.name] || Uint8Array;
        const copy = bytes.buffer.slice(
            bytes.byteOffset,
            bytes.byteOffset + bytes.byteLength
        );

        return new Ctor(copy);
    }

    const out = {};

    for (const [key, item] of Object.entries(value)) {
        out[key] = decodeSaveValue(item);
    }

    return out;
}

function requestToPromise(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(
            request.error || new Error("Storage request failed")
        );
    });
}

function transactionDone(transaction) {
    return new Promise((resolve, reject) => {
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(
            transaction.error || new Error("Storage transaction failed")
        );
        transaction.onabort = () => reject(
            transaction.error || new Error("Storage transaction cancelled")
        );
    });
}

async function flushUnityStorage() {
    const instance = window.unityInstance;
    const module = instance &&
        (instance.Module || instance.module) || window.Module;

    if (module && module.FS &&
        typeof module.FS.syncfs === "function") {
        await new Promise((resolve, reject) => {
            let finished = false;
            const finish = error => {
                if (finished) return;
                finished = true;
                clearTimeout(timer);
                if (error) reject(error); else resolve();
            };
            const timer = setTimeout(() => finish(new Error("Timed out while syncing game save storage.")), 10000);
            try {
                module.FS.syncfs(false, error => finish(error || null));
            } catch (error) {
                finish(error);
            }
        });
    }
}

async function readGameDatabases() {
    if (!indexedDB.databases) {
        throw new Error(
            "This browser cannot list local game storage."
        );
    }

    const infos = await indexedDB.databases();

    const targets = infos.filter(info =>
        info.name &&
        /unity|idbfs|hollow.?knight/i.test(info.name) &&
        info.name !== CONFIG.databaseName
    );

    const databases = [];

    for (const info of targets) {
        const db = await new Promise((resolve, reject) => {
            const request = indexedDB.open(info.name);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        const stores = [];

        for (const storeName of Array.from(db.objectStoreNames)) {
            const tx = db.transaction(storeName, "readonly");
            const done = transactionDone(tx);
            const store = tx.objectStore(storeName);

            const keys = await requestToPromise(store.getAllKeys());
            const values = await requestToPromise(store.getAll());

            const records = [];

            for (let i = 0; i < values.length; i++) {
                records.push({
                    key: await encodeSaveValueAsync(keys[i]),
                    value: await encodeSaveValueAsync(values[i])
                });
            }

            stores.push({
                name: storeName,
                keyPath: store.keyPath,
                autoIncrement: store.autoIncrement,
                records
            });

            await done;
        }

        databases.push({
            name: db.name,
            version: db.version,
            stores
        });

        db.close();
    }

    return databases;
}

async function createSaveSnapshot() {
    await flushUnityStorage();

    const databases = await readGameDatabases();
    const local = {};

    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        local[key] = localStorage.getItem(key);
    }

    if (!databases.length && !Object.keys(local).length) {
        throw new Error(
            "No browser save data was found yet. Play until the game creates a save."
        );
    }

    return {
        format: SAVE_FORMAT,
        createdAt: new Date().toISOString(),
        game: "Hollow Knight",
        databases,
        localStorage: local
    };
}

async function exportSaveFile() {
    const button = $("saveButton");
    button.disabled = true;
    setSaveStatus("Preparing save...");

    try {
        const snapshot = await createSaveSnapshot();

        const blob = new Blob(
            [JSON.stringify(snapshot)],
            { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download =
            "Hollow-Knight-Save-" +
            new Date().toISOString().replace(/[:.]/g, "-") +
            ".hksave";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 30000);
        setSaveStatus("Save file downloaded");

    } catch (error) {
        console.error("Save export failed:", error);
        setSaveStatus("Save failed — see console");
        alert("Could not export the save: " + error.message);

    } finally {
        button.disabled = false;
    }
}

async function writeDatabaseSnapshot(snapshot) {
    if (!snapshot || typeof snapshot.name !== "string" ||
        !Array.isArray(snapshot.stores)) {
        throw new Error("The save contains an invalid database snapshot.");
    }

    let db = await new Promise((resolve, reject) => {
        const request = indexedDB.open(snapshot.name);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });

    const missing = snapshot.stores.filter(store =>
        !db.objectStoreNames.contains(store.name)
    );

    if (missing.length) {
        const nextVersion = db.version + 1;
        db.close();
        db = await new Promise((resolve, reject) => {
            const request = indexedDB.open(snapshot.name, nextVersion);
            request.onupgradeneeded = () => {
                const upgradeDb = request.result;
                for (const storeInfo of missing) {
                    if (upgradeDb.objectStoreNames.contains(storeInfo.name)) continue;
                    const options = { autoIncrement: !!storeInfo.autoIncrement };
                    if (storeInfo.keyPath !== null) options.keyPath = storeInfo.keyPath;
                    upgradeDb.createObjectStore(storeInfo.name, options);
                }
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
            request.onblocked = () => reject(new Error("Database upgrade is blocked by another tab."));
        });
    }

    try {
        for (const storeInfo of snapshot.stores) {
            if (!Array.isArray(storeInfo.records) ||
                !db.objectStoreNames.contains(storeInfo.name)) {
                throw new Error("The saved storage layout is incomplete.");
            }

            // Decode every record before clearing the live store. If a save
            // file is corrupt, the existing store remains untouched.
            const preparedRecords = storeInfo.records.map(record => ({
                key: decodeSaveValue(record.key),
                value: decodeSaveValue(record.value)
            }));

            const tx = db.transaction(storeInfo.name, "readwrite");
            const done = transactionDone(tx);
            const store = tx.objectStore(storeInfo.name);
            store.clear();

            for (const record of preparedRecords) {
                if (store.keyPath === null) {
                    store.put(record.value, record.key);
                } else {
                    store.put(record.value);
                }
            }

            await done;
        }
    } finally {
        db.close();
    }
}
async function importSaveFile(file) {
    if (!file) return;

    setSaveStatus("Restoring save...");

    try {
        const snapshot = JSON.parse(await file.text());

        if (
            !snapshot ||
            snapshot.format !== SAVE_FORMAT ||
            !Array.isArray(snapshot.databases) ||
            !snapshot.localStorage ||
            typeof snapshot.localStorage !== "object" ||
            Array.isArray(snapshot.localStorage)
        ) {
            throw new Error(
                "That file is not a compatible Hollow Knight save."
            );
        }

        for (const db of snapshot.databases) {
            if (!db || typeof db.name !== "string" || !Array.isArray(db.stores)) {
                throw new Error("The save contains an invalid database entry.");
            }
            for (const store of db.stores) {
                if (!store || typeof store.name !== "string" || !Array.isArray(store.records)) {
                    throw new Error("The save contains an invalid object store.");
                }
            }
        }

        if (!confirm(
            "Restore this save and restart the game? Your current browser save data will be replaced."
        )) {
            setSaveStatus("Restore cancelled");
            return;
        }

        await flushUnityStorage();

        if (window.unityInstance && typeof window.unityInstance.Quit === "function") {
            try { await window.unityInstance.Quit(); } catch (error) {
                console.warn("Unity shutdown warning before restore:", error);
            }
            window.unityInstance = null;
        }

        for (const db of snapshot.databases) {
            await writeDatabaseSnapshot(db);
        }

        if (
            snapshot.localStorage &&
            typeof snapshot.localStorage === "object"
        ) {
            for (const [key, value] of Object.entries(snapshot.localStorage)) {
                localStorage.setItem(key, value);
            }
        }

        setSaveStatus("Save restored — restarting...");
        setTimeout(() => location.reload(), 500);

    } catch (error) {
        console.error("Save restore failed:", error);
        setSaveStatus("Restore failed — see console");
        alert("Could not restore the save: " + error.message);

    } finally {
        saveFileInput.value = "";
    }
}

$("saveButton").addEventListener("click", exportSaveFile);
$("loadButton").addEventListener("click", () => saveFileInput.click());
saveFileInput.addEventListener("change", () => {
    importSaveFile(saveFileInput.files[0]);
});

/* START GAME */

async function startGame() {
    if (starting) return;

    starting = true;

    try {
        errorElement.style.display = "none";
        retryButton.style.display = "none";
        unityContainer.style.display = "none";

        completedData = 0;
        completedWasm = 0;
        updateProgress();

        statusText.textContent = "Preparing Hollow Knight...";
        details.textContent = "Initializing storage.";

        const [files, frameworkBlob] = await Promise.all([
            prepareGameFiles(),

            (async () => {
                const response = await fetchAsset(
                    CONFIG.buildURL + CONFIG.framework
                );

                const blob = await response.blob();

                if (!blob.size) {
                    throw new Error("Unity framework download was empty.");
                }

                return blob;
            })(),

            loadUnityLoader()
        ]).then(results => [results[0], results[1]]);

        statusText.textContent = "Preparing Unity engine...";
        details.textContent = "Creating game file URLs.";

        setOverall(70);

        const dataURL = URL.createObjectURL(files.dataFile);

        const wasmBlob = new Blob(
            [files.wasmFile],
            { type: "application/wasm" }
        );

        const wasmURL = URL.createObjectURL(wasmBlob);

        window.hollowKnightBlobURLs = [dataURL, wasmURL];

        frameworkBlobURL = URL.createObjectURL(
            new Blob([frameworkBlob], {
                type: "text/javascript"
            })
        );

        const config = {
            dataUrl: dataURL,
            frameworkUrl: frameworkBlobURL,
            codeUrl: wasmURL,

            streamingAssetsUrl: new URL(
                CONFIG.streamingAssets + "/",
                activeBaseURL
            ).href,

            companyName: CONFIG.companyName,
            productName: CONFIG.productName,
            productVersion: CONFIG.productVersion,

            webglContextAttributes: {
                alpha: false,
                antialias: false,
                depth: true,
                stencil: false,
                premultipliedAlpha: false,
                preserveDrawingBuffer: false,
                powerPreference: "high-performance",
                failIfMajorPerformanceCaveat: false
            },

            devicePixelRatio: Number(resolutionScale.value) * Math.min(window.devicePixelRatio || 1, 1.5),

            matchWebGLToCanvasSize: true
        };

        statusText.textContent = "Starting Hollow Knight...";
        details.textContent = "Initializing game engine.";

        unityContainer.style.display = "flex";
        canvas.style.visibility = "hidden";

        const unityInstance = await createUnityInstance(
            canvas,
            config,
            progress => {
                setOverall(70 + progress * 30);

                statusText.textContent = "Loading Hollow Knight...";
                details.textContent = "Initializing game engine.";
            }
        );

        window.unityInstance = unityInstance;
        canvas.style.visibility = "visible";

        setOverall(100);

        statusText.textContent = "Hollow Knight ready";
        details.textContent = "Enjoy your game.";

        loadingScreen.style.opacity = "0";

        setTimeout(() => {
            loadingScreen.style.display = "none";
        }, 500);

        $("fullscreenButton").onclick = () => {
            unityInstance.SetFullscreen(1);
        };

        console.log("Hollow Knight started successfully.");

    } catch (error) {
        const message = String(
            error && error.message ? error.message : "Unknown loading error"
        ).replace(/https?:\/\/[^\s]+/gi, "[source hidden]");

        console.error("Hollow Knight loading error:", message);

        unityContainer.style.display = "none";

        statusText.textContent = "Unable to load Hollow Knight";

        errorElement.style.display = "block";
        errorElement.textContent = message;

        retryButton.style.display = "inline-block";

        details.textContent =
            "An error occurred. See the error message above.";

    } finally {
        starting = false;
    }
}

/* ERROR HANDLING */

window.addEventListener("beforeunload", () => {
    for (const url of window.hollowKnightBlobURLs || []) {
        try { URL.revokeObjectURL(url); } catch (_) {}
    }

    if (frameworkBlobURL) {
        try { URL.revokeObjectURL(frameworkBlobURL); } catch (_) {}
    }

    if (loaderBlobURL) {
        try { URL.revokeObjectURL(loaderBlobURL); } catch (_) {}
    }
});

window.addEventListener("error", event => {
    const message = String(
        event.message || "Unknown page error"
    ).replace(/https?:\/\/[^\s]+/gi, "[source hidden]");

    console.error("Page error:", message);
});

window.addEventListener("unhandledrejection", event => {
    const reason = event.reason;

    const message = String(
        reason && reason.message
            ? reason.message
            : reason || "Unknown error"
    ).replace(/https?:\/\/[^\s]+/gi, "[source hidden]");

    console.error("Unhandled promise rejection:", message);
});

/* INITIALIZE */

window.addEventListener("load", startGame);

</script>
