<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base id="assetBase" href="https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight</title>
<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:white}
body{display:flex;align-items:center;justify-content:center}

#loadingScreen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    background:radial-gradient(ellipse at 50% 100%,rgba(100,0,0,.24),transparent 65%),#000;
    transition:opacity .5s
}
#loadingScreen::before{
    content:"";position:absolute;inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.8) 100%)
}
.loader-content{
    position:relative;width:min(650px,90%);text-align:center
}
#status{font-size:14px;color:#ddd;margin-bottom:12px}
#overallBar{height:5px;width:100%;background:#222;overflow:hidden;border-radius:5px}
#overallProgress{
    width:0%;height:100%;background:#bd1717;
    box-shadow:0 0 15px #b00000;transition:width .2s ease
}
.progress-row{
    display:flex;justify-content:space-between;
    font-size:11px;color:#888;margin-top:24px;margin-bottom:8px
}
.small-bar{width:100%;height:3px;background:#191919;border-radius:3px;overflow:hidden}
.small-progress{height:100%;width:0%;background:#a51616;transition:width .15s}
#percentage{margin-top:18px;font-size:13px;color:#aaa;letter-spacing:2px}
#details{margin-top:20px;color:#777;font-size:11px;line-height:1.8;overflow-wrap:anywhere}
#downloadConsole{
    width:100%;height:160px;margin-top:16px;padding:10px;overflow-y:auto;
    background:rgba(10,10,10,.95);border:1px solid #292929;border-radius:4px;
    color:#aaa;font-family:Consolas,monospace;font-size:10px;line-height:1.6;
    text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;
    scrollbar-width:thin;scrollbar-color:#555 #111
}
.console-entry{margin-bottom:2px}
.console-success{color:#65c98a}
.console-warning{color:#e8bd62}
.console-error{color:#ff5555}
.console-info{color:#aaa}
#loadingError{
    display:none;margin-top:15px;color:#ff5555;font-size:12px;
    line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;
    max-height:150px;overflow-y:auto
}
#retryButton{
    display:none;margin-top:20px;border:1px solid #941818;
    background:#210707;color:white;padding:12px 28px;
    cursor:pointer;letter-spacing:2px
}
#retryButton:hover{background:#481010}
#unity-container{
    display:none;width:100%;height:100%;flex-direction:column;
    align-items:center;justify-content:center;background:#000
}
#unity-canvas{
    display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);
    max-width:100%;max-height:calc(100% - 45px);
    aspect-ratio:16/10;background:#000
}
#unity-footer{
    width:min(960px,100%);height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;color:#777;font-size:12px
}
#fullscreenButton{
    background:#171717;border:1px solid #333;color:white;
    padding:7px 15px;cursor:pointer
}
#fullscreenButton:hover,.saveButton:hover{background:#333}
.saveButton{
    background:#171717;border:1px solid #333;color:white;
    padding:7px 12px;cursor:pointer;font-size:12px
}
#saveStatus{color:#aaa;font-size:11px;margin-left:8px}
#resolutionScale{
    background:#171717;border:1px solid #333;color:white;
    padding:7px 8px;font-size:12px;max-width:125px
}
@media(max-width:600px){
    #unity-canvas{width:100vw;height:auto;max-height:calc(100vh - 38px)}
    #downloadConsole{height:125px}
}
</style>
</head>

<body>

<div id="loadingScreen">
    <div class="loader-content">
        <div id="status">Preparing game...</div>

        <div id="overallBar">
            <div id="overallProgress"></div>
        </div>

        <div id="percentage">0%</div>

        <div class="progress-row">
            <span>GAME DATA</span>
            <span id="dataCount">0 / 44</span>
        </div>
        <div class="small-bar">
            <div class="small-progress" id="dataProgress"></div>
        </div>

        <div class="progress-row">
            <span>WEBASSEMBLY</span>
            <span id="wasmCount">0 / 3</span>
        </div>

            <div class="small-progress" id="wasmProgress"></div>
        </div>

        <div id="details">Initializing storage...</div>

            <div class="console-entry console-info">
                [SYSTEM] Download console initialized.
            </div>
        </div>

        <div id="loadingError"></div>
        <button id="retryButton" onclick="startGame()">RETRY</button>
    </div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-footer">
        <span>
            Hollow Knight
            <span id="saveStatus" aria-live="polite"></span>
        </span>

        <div style="display:flex;gap:7px;align-items:center">
            <select id="resolutionScale" class="saveButton"
                aria-label="Graphics resolution" title="Graphics resolution">
                <option value="1">Graphics: 1.00x</option>
                <option value="0.85">Graphics: 0.85x</option>
                <option value="0.70">Graphics: 0.70x</option>
                <option value="0.60" selected>Graphics: 0.60x</option>
                <option value="0.50">Graphics: 0.50x</option>
                <option value="0.45">Graphics: 0.45x</option>
            </select>

            <button class="saveButton" id="saveButton" type="button">SAVE FILE</button>
            <button class="saveButton" id="loadButton" type="button">LOAD FILE</button>
            <button id="fullscreenButton">FULLSCREEN</button>
        </div>

        <input id="saveFileInput" type="file"
            accept=".hksave,.json,application/json" hidden>
    </div>
</div>

<script>
"use strict";

/* ============================================================
   CONFIGURATION
============================================================ */

const CONFIG = {
    baseURLs: [
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://github.com/AMoldyWaffle/Hollow-Knight/raw/main/",
        "https://quantil.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://originfastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://github.com/AMoldyWaffle/Hollow-Knight/raw/refs/heads/main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/refs/heads/main/"
    ],

    buildURL: "Build/",
    loader: "hk.loader.js",

    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",

    dataParts: 44,
    wasmParts: 3,

    framework: "hk.framework.js",
    streamingAssets: "StreamingAssets",

    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",

    cacheVersion: "hk-adaptive-global-v15",

    storageDirectory: "HollowKnightCache",
    databaseName: "HollowKnightFileCache",

    chunkRetries: 9,
    requestTimeoutMs: 18000,
    mirrorProbeTimeoutMs: 5000,
    mirrorProbePath: "Build/hk.framework.js",

    downloadConcurrency: {
        initial: 10,
        minimum: 4,
        maximum: 16,
        increaseEvery: 4
    },

    progressUpdateInterval: 100,

    expectedPartSizes: {
        data: [],
        wasm: []
    }
};

/* ============================================================
   ELEMENTS & STATE
============================================================ */

const $ = id => document.getElementById(id);

const loadingScreen = $("loadingScreen");
const unityContainer = $("unity-container");
const canvas = $("unity-canvas");

const statusText = $("status");
const details = $("details");

const overallProgress = $("overallProgress");
const percentage = $("percentage");

const dataProgress = $("dataProgress");
const wasmProgress = $("wasmProgress");

const dataCount = $("dataCount");
const wasmCount = $("wasmCount");

const errorElement = $("loadingError");
const retryButton = $("retryButton");
const downloadConsole = $("downloadConsole");

let completedData = 0;
let completedWasm = 0;

let storageMode = null;
let storageRoot = null;
let database = null;

let starting = false;
let activeBaseURL = CONFIG.baseURLs[0];

let frameworkBlobURL = null;
let loaderBlobURL = null;

let lastProgressUpdate = 0;

/* ============================================================
   DOWNLOAD CONSOLE
============================================================ */

const MAX_CONSOLE_LINES = 300;

function consoleLog(message, type = "info") {
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement("div");

    entry.className = "console-entry console-" + type;
    entry.textContent = `[${time}] ${message}`;

    downloadConsole.appendChild(entry);

    while (downloadConsole.children.length > MAX_CONSOLE_LINES) {
        downloadConsole.removeChild(downloadConsole.firstChild);
    }

    downloadConsole.scrollTop = downloadConsole.scrollHeight;
    console.log("[Hollow Knight]", message);
}

function consoleClear() {
    downloadConsole.innerHTML = "";
    consoleLog("Download console initialized.", "info");
}

/* ============================================================
   GLOBAL ADAPTIVE DOWNLOAD SCHEDULER
============================================================ */

class DownloadScheduler {
    constructor(settings) {
        this.limit = settings.initial;
        this.minimum = settings.minimum;
        this.maximum = settings.maximum;
        this.increaseEvery = settings.increaseEvery;

        this.active = 0;
        this.waiters = [];
        this.successes = 0;
        this.failures = 0;
        this.fastSamples = 0;
        this.slowSamples = 0;
    }

    acquire() {
        if (this.active < this.limit) {
            this.active++;
            return Promise.resolve();
        }

        return new Promise(resolve => {
            this.waiters.push(resolve);
        });
    }

    release() {
        const next = this.waiters.shift();

        if (next) {
            next();
        } else {
            this.active--;
        }
    }

    drain() {
        while (this.waiters.length && this.active < this.limit) {
            this.active++;
            this.waiters.shift()();
        }
    }

    recordSuccess(milliseconds) {
        this.successes++;

        if (milliseconds < 25000) {
            this.fastSamples++;
            this.slowSamples = 0;
        } else if (milliseconds > 45000) {
            this.slowSamples++;
            this.fastSamples = 0;
        } else {
            this.fastSamples = 0;
            this.slowSamples = 0;
        }

        if (
            this.successes % this.increaseEvery === 0 &&
            this.fastSamples >= this.increaseEvery
        ) {
            const old = this.limit;
            this.limit = Math.min(this.maximum, this.limit + 1);
            this.fastSamples = 0;

            if (this.limit !== old) {
                consoleLog(
                    "Download performance is healthy. Global concurrency increased to " + this.limit + ".",
                    "success"
                );
            }
        }

        if (this.slowSamples >= 3 && this.limit > this.minimum) {
            this.limit = Math.max(this.minimum, this.limit - 1);
            this.slowSamples = 0;

            consoleLog(
                "Downloads are taking longer. Global concurrency reduced to " + this.limit + ".",
                "warning"
            );
        }

        this.drain();
    }

    recordFailure() {
        this.failures++;
        this.fastSamples = 0;

        if (this.limit > this.minimum) {
            this.limit = Math.max(this.minimum, this.limit - 1);

            consoleLog(
                "A download failed. Global concurrency reduced to " + this.limit + ".",
                "warning"
            );
        }

        this.drain();
    }

    async run(task) {
        await this.acquire();
        const started = performance.now();

        try {
            const result = await task();
            this.recordSuccess(performance.now() - started);
            return result;
        } catch (error) {
            this.recordFailure();
            throw error;
        } finally {
            this.release();
        }
    }
}

const downloadScheduler = new DownloadScheduler(
    CONFIG.downloadConcurrency
);

/* ============================================================
   MIRROR HEALTH & STARTUP BENCHMARK
============================================================ */

const mirrorHealth = new Map();

function getMirrorHealth(url) {
    if (!mirrorHealth.has(url)) {
        mirrorHealth.set(url, {
            failures: 0,
            successes: 0,
            averageTime: 0,
            throughputMBps: 0,
            blocked: false
        });
    }

    return mirrorHealth.get(url);
}

function getOrderedMirrors(excluded = []) {
    const mirrors = CONFIG.baseURLs.filter(
        (url, index, all) => !excluded.includes(url) && all.indexOf(url) === index
    );

    return mirrors.sort((a, b) => {
        const A = getMirrorHealth(a);
        const B = getMirrorHealth(b);

        if (A.blocked !== B.blocked) return A.blocked ? 1 : -1;

        if (A.throughputMBps > 0 && B.throughputMBps > 0) {
            if (Math.abs(A.throughputMBps - B.throughputMBps) > 0.05) {
                return B.throughputMBps - A.throughputMBps;
            }
        }

        if (A.averageTime === 0 && B.averageTime !== 0) return -1;
        if (B.averageTime === 0 && A.averageTime !== 0) return 1;

        const scoreA = A.averageTime + A.failures * 12000;
        const scoreB = B.averageTime + B.failures * 12000;

        return scoreA - scoreB;
    });
}

function pickFastestHealthyMirror() {
    const ordered = getOrderedMirrors();
    const tested = ordered.filter(url => !getMirrorHealth(url).blocked && getMirrorHealth(url).successes > 0);
    return tested[0] || ordered[0] || CONFIG.baseURLs[0];
}

function recordMirrorSuccess(url, milliseconds, bytes = 0) {
    const health = getMirrorHealth(url);

    health.successes++;
    health.averageTime = health.averageTime === 0
        ? milliseconds
        : health.averageTime * 0.7 + milliseconds * 0.3;

    if (bytes > 0 && milliseconds > 0) {
        const speedMBps = (bytes / 1048576) / (milliseconds / 1000);
        health.throughputMBps = health.throughputMBps === 0
            ? speedMBps
            : health.throughputMBps * 0.65 + speedMBps * 0.35;
    }
}

function recordMirrorFailure(url, error) {
    const health = getMirrorHealth(url);
    health.failures++;

    const message = String(error && error.message ? error.message : error);

    if (/HTTP 403|HTTP 404|HTTP 410/.test(message)) {
        health.blocked = true;
    }
}

async function probeMirror(baseURL, probePath, timeoutMs) {
    const url = new URL(probePath, baseURL).href;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(new Error("Probe timeout")), timeoutMs);
    const start = performance.now();

    try {
        const response = await fetch(url, {
            signal: controller.signal,
            cache: "no-store",
            redirect: "follow"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const buf = await response.arrayBuffer();
        const elapsedMs = Math.max(1, performance.now() - start);
        const speedMBps = (buf.byteLength / 1048576) / (elapsedMs / 1000);

        return {
            baseURL,
            hostname: new URL(baseURL).hostname,
            elapsedMs,
            bytes: buf.byteLength,
            speedMBps
        };
    } finally {
        clearTimeout(timer);
    }
}

async function benchmarkMirrors() {
    statusText.textContent = "Testing mirrors...";
    details.textContent = "Measuring latency and speed across mirrors.";
    consoleLog("Starting startup mirror speed test...", "info");

    const uniqueMirrors = CONFIG.baseURLs.filter(
        (url, index, all) => all.indexOf(url) === index
    );
    const probePath = CONFIG.mirrorProbePath || (CONFIG.buildURL + CONFIG.framework);
    const timeoutMs = CONFIG.mirrorProbeTimeoutMs || 5000;

    const results = await Promise.all(
        uniqueMirrors.map(async baseURL => {
            try {
                const res = await probeMirror(baseURL, probePath, timeoutMs);
                recordMirrorSuccess(baseURL, res.elapsedMs, res.bytes);
                consoleLog(
                    "Probe OK: " + res.hostname + " (" +
                    res.speedMBps.toFixed(2) + " MB/s, " +
                    Math.round(res.elapsedMs) + " ms)",
                    "success"
                );
                return res;
            } catch (err) {
                recordMirrorFailure(baseURL, err);
                consoleLog(
                    "Probe failed: " + new URL(baseURL).hostname +
                    " (" + (err && err.message ? err.message : err) + ")",
                    "warning"
                );
                return null;
            }
        })
    );

    const healthy = results.filter(Boolean);

    if (healthy.length > 0) {
        healthy.sort((a, b) => {
            if (Math.abs(a.speedMBps - b.speedMBps) > 0.05) {
                return b.speedMBps - a.speedMBps;
            }
            return a.elapsedMs - b.elapsedMs;
        });

        const winner = healthy[0];
        activeBaseURL = winner.baseURL;

        const baseElement = $("assetBase");
        if (baseElement) baseElement.href = activeBaseURL;

        const rankedURLs = [
            ...healthy.map(r => r.baseURL),
            ...uniqueMirrors.filter(u => !healthy.some(h => h.baseURL === u))
        ];
        CONFIG.baseURLs = rankedURLs;

        details.textContent =
            "Fastest mirror: " + winner.hostname +
            " (" + winner.speedMBps.toFixed(2) + " MB/s)";

        consoleLog(
            "Selected fastest mirror: " + winner.hostname +
            " (" + winner.speedMBps.toFixed(2) + " MB/s, " +
            Math.round(winner.elapsedMs) + " ms).",
            "success"
        );
    } else {
        activeBaseURL = CONFIG.baseURLs[0];
        consoleLog(
            "All mirror probes timed out or failed; falling back to default mirror order.",
            "warning"
        );
    }
}

/* ============================================================
   MIRROR FETCHING
============================================================ */

async function fetchFromMirror(relativePath, baseURL, options = {}) {
    const url = new URL(relativePath, baseURL).href;
    const timeoutMs = options.timeoutMs || CONFIG.requestTimeoutMs || 18000;
    const timeoutSignal = typeof AbortSignal !== "undefined" && AbortSignal.timeout
        ? AbortSignal.timeout(timeoutMs)
        : null;

    let signal = options.signal || timeoutSignal;
    if (options.signal && timeoutSignal && AbortSignal.any) {
        signal = AbortSignal.any([options.signal, timeoutSignal]);
    }

    const { timeoutMs: _ignored, signal: _origSignal, ...fetchOptions } = options;

    const response = await fetch(url, {
        ...fetchOptions,
        signal,
        cache: "no-store",
        redirect: "follow"
    });

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    if (response.type === "opaque") {
        throw new Error("Opaque response cannot be validated");
    }

    return response;
}

async function fetchAsset(relativePath, options = {}) {
    const failures = [];

    for (const baseURL of getOrderedMirrors()) {
        try {
            const started = performance.now();
            const response = await downloadScheduler.run(
                () => fetchFromMirror(relativePath, baseURL, options)
            );
            const elapsedMs = performance.now() - started;

            recordMirrorSuccess(baseURL, elapsedMs);
            activeBaseURL = pickFastestHealthyMirror();

            const baseElement = $("assetBase");
            if (baseElement) baseElement.href = activeBaseURL;

            consoleLog(
                "Retrieved " + relativePath + " from " + new URL(baseURL).hostname,
                "success"
            );

            return response;

        } catch (error) {
            recordMirrorFailure(baseURL, error);

            failures.push(
                new URL(relativePath, baseURL).hostname + ": " + error.message
            );

            consoleLog(
                "Mirror failed: " + new URL(baseURL).hostname +
                " (" + error.message + ")",
                "warning"
            );
        }
    }

    // Last-resort GitHub API fallback for smaller files.
    try {
        const apiURL =
            "https://api.github.com/repos/AMoldyWaffle/Hollow-Knight/contents/" +
            relativePath.split("/").map(encodeURIComponent).join("/") +
            "?ref=main";

        const response = await downloadScheduler.run(
            () => fetch(apiURL, { cache: "no-store" })
        );

        if (response.ok) {
            const payload = await response.json();

            if (
                payload &&
                payload.encoding === "base64" &&
                payload.content
            ) {
                const binary = atob(payload.content.replace(/\s/g, ""));
                const bytes = new Uint8Array(binary.length);

                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }

                consoleLog(
                    "Retrieved " + relativePath + " through GitHub API.",
                    "success"
                );

                return new Response(bytes, {
                    status: 200,
                    headers: { "Content-Type": "application/octet-stream" }
                });
            }
        }
    } catch (error) {
        failures.push("API fallback: " + error.message);
    }

    throw new Error(
        "Unable to retrieve asset: " + relativePath + "\n" +
        failures.join("\n")
    );
}

/* ============================================================
   VALIDATED CHUNK DOWNLOAD
============================================================ */

async function fetchValidatedPart(prefix, index) {
    const partName = prefix + "." + String(index).padStart(3, "0");
    const relativePath = CONFIG.buildURL + partName;

    const kind = prefix === CONFIG.dataPrefix ? "data" : "wasm";
    const expectedSizes = CONFIG.expectedPartSizes[kind] || [];
    const expectedSize = expectedSizes[index] || null;

    const failures = [];
    const excluded = [];

    consoleLog("Queued " + partName, "info");

    for (let attempt = 0; attempt < CONFIG.chunkRetries + 1; attempt++) {
        const mirrors = getOrderedMirrors(excluded);

        if (!mirrors.length) break;

        const mirror = mirrors[0];
        excluded.push(mirror);

        try {
            statusText.textContent = "Downloading " + prefix + "...";

            details.textContent =
                "Part " + (index + 1) + " of " +
                (prefix === CONFIG.dataPrefix ? CONFIG.dataParts : CONFIG.wasmParts) +
                " · Attempt " + (attempt + 1);

            const result = await downloadScheduler.run(async () => {
                const startTime = performance.now();

                const response = await fetchFromMirror(relativePath, mirror);
                const blob = await response.blob();

                const elapsed = Math.max(0.001, (performance.now() - startTime) / 1000);

                if (!blob.size) {
                    throw new Error("Empty response");
                }

                const contentLength = response.headers.get("content-length");

                if (
                    contentLength &&
                    !response.headers.get("content-encoding") &&
                    Number(contentLength) !== blob.size
                ) {
                    throw new Error(
                        "Content-Length mismatch: expected " +
                        contentLength + ", received " + blob.size
                    );
                }

                if (expectedSize && blob.size !== expectedSize) {
                    throw new Error(
                        "Incorrect chunk size: expected " +
                        expectedSize + ", received " + blob.size
                    );
                }

                return { blob, elapsed };
            });

            recordMirrorSuccess(mirror, result.elapsed * 1000, result.blob.size);
            activeBaseURL = pickFastestHealthyMirror();

            const baseElement = $("assetBase");
            if (baseElement) baseElement.href = activeBaseURL;

            const speed = result.blob.size / result.elapsed / 1048576;

            consoleLog(
                partName + " downloaded (" +
                (result.blob.size / 1048576).toFixed(2) +
                " MB, " + speed.toFixed(2) +
                " MB/s) from " + new URL(mirror).hostname,
                "success"
            );

            return result.blob;

        } catch (error) {
            recordMirrorFailure(mirror, error);

            failures.push(
                new URL(mirror).hostname + ": " + error.message
            );

            consoleLog(
                partName + " failed on " + new URL(mirror).hostname +
                ": " + error.message,
                "warning"
            );
        }
    }

    consoleLog("All mirrors failed for " + partName, "error");

    throw new Error(
        "All mirrors failed for " + partName + "\n" +
        failures.join("\n")
    );
}

/* ============================================================
   PROGRESS
============================================================ */

function setOverall(value) {
    value = Math.max(0, Math.min(100, value));
    overallProgress.style.width = value + "%";
    percentage.textContent = Math.floor(value) + "%";
}

function updateProgress(force = false) {
    const now = performance.now();

    if (!force && now - lastProgressUpdate < CONFIG.progressUpdateInterval) return;

    lastProgressUpdate = now;

    dataProgress.style.width = (completedData / CONFIG.dataParts) * 100 + "%";
    wasmProgress.style.width = (completedWasm / CONFIG.wasmParts) * 100 + "%";

    dataCount.textContent = completedData + " / " + CONFIG.dataParts;
    wasmCount.textContent = completedWasm + " / " + CONFIG.wasmParts;

    const total = CONFIG.dataParts + CONFIG.wasmParts;
    setOverall(((completedData + completedWasm) / total) * 70);
}

function updatePartProgress(prefix, completed) {
    if (prefix === CONFIG.dataPrefix) {
        completedData = completed;
    } else {
        completedWasm = completed;
    }

    updateProgress();
}

function yieldUI() {
    return new Promise(resolve => requestAnimationFrame(resolve));
}

/* ============================================================
   INDEXEDDB
============================================================ */

function openDatabase() {
    return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
            reject(new Error("IndexedDB is unavailable."));
            return;
        }

        const request = indexedDB.open(CONFIG.databaseName, 1);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains("files")) {
                db.createObjectStore("files");
            }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(
            new Error("IndexedDB is blocked by another connection.")
        );
    });
}

function idbGet(key) {
    return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readonly");
        const request = transaction.objectStore("files").get(key);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function idbPut(key, value) {
    return new Promise((resolve, reject) => {
        const transaction = database.transaction("files", "readwrite");
        transaction.objectStore("files").put(value, key);

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}

/* ============================================================
   STORAGE INITIALIZATION
============================================================ */

async function initializeStorage() {
    statusText.textContent = "Initializing storage...";
    details.textContent = "Checking available browser storage.";

    consoleLog("Checking browser storage systems...", "info");

    try {
        if (
            navigator.storage &&
            typeof navigator.storage.getDirectory === "function"
        ) {
            if (navigator.storage.persist) {
                try {
                    await navigator.storage.persist();
                } catch (_) {}
            }

            const root = await navigator.storage.getDirectory();

            storageRoot = await root.getDirectoryHandle(
                CONFIG.storageDirectory,
                { create: true }
            );

            storageMode = "opfs";
            details.textContent = "Using disk-backed storage.";
            consoleLog("OPFS storage initialized.", "success");
            return;
        }
    } catch (error) {
        console.warn("OPFS unavailable:", error);
        consoleLog("OPFS unavailable: " + error.message, "warning");
    }

    try {
        database = await openDatabase();
        storageMode = "indexeddb";
        details.textContent = "Using IndexedDB storage.";
        consoleLog("IndexedDB storage initialized.", "success");
        return;
    } catch (error) {
        consoleLog("IndexedDB initialization failed: " + error.message, "error");
        throw new Error(
            "No usable browser storage system is available.\n\n" +
            "Storage error: " + error.message
        );
    }
}

/* ============================================================
   OPFS & INDEXEDDB CACHES
============================================================ */

async function getOPFSCachedFile(filename) {
    try {
        const fileHandle = await storageRoot.getFileHandle(filename);
        const markerHandle = await storageRoot.getFileHandle(filename + ".complete");

        const file = await fileHandle.getFile();
        const marker = await markerHandle.getFile();
        const markerText = await marker.text();

        if (
            file.size > 0 &&
            markerText === CONFIG.cacheVersion + ":" + file.size
        ) {
            consoleLog(
                "Cache hit: " + filename + " (" +
                (file.size / 1048576).toFixed(2) + " MB)",
                "success"
            );

            return file;
        }
    } catch (_) {}

    consoleLog("Cache miss: " + filename, "info");
    return null;
}

async function markOPFSComplete(filename, size) {
    const handle = await storageRoot.getFileHandle(
        filename + ".complete",
        { create: true }
    );

    const writer = await handle.createWritable();

    try {
        await writer.write(CONFIG.cacheVersion + ":" + size);
        await writer.close();
    } catch (error) {
        try {
            await writer.abort();
        } catch (_) {}
        throw error;
    }
}

async function getIDBCachedFile(filename) {
    try {
        const cached = await idbGet(CONFIG.cacheVersion + ":" + filename);

        if (
            cached &&
            cached.blob instanceof Blob &&
            cached.blob.size > 0 &&
            cached.size === cached.blob.size &&
            cached.version === CONFIG.cacheVersion
        ) {
            consoleLog(
                "Cache hit: " + filename + " (" +
                (cached.blob.size / 1048576).toFixed(2) + " MB)",
                "success"
            );

            return cached.blob;
        }
    } catch (_) {}

    consoleLog("Cache miss: " + filename, "info");
    return null;
}

/* ============================================================
   STREAMING ORDERED MERGERS
============================================================ */

async function mergeOPFS(prefix, partCount, progressCallback) {
    const cached = await getOPFSCachedFile(prefix);

    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    try {
        await storageRoot.removeEntry(prefix + ".complete");
    } catch (_) {}

    const outputHandle = await storageRoot.getFileHandle(
        prefix,
        { create: true }
    );

    const writer = await outputHandle.createWritable({
        keepExistingData: false
    });

    let totalBytes = 0;
    let completed = 0;
    let nextWriteIndex = 0;
    const readyBlobs = new Map();
    let writeChain = Promise.resolve();

    function enqueueOrderedWrites() {
        writeChain = writeChain.then(async () => {
            while (readyBlobs.has(nextWriteIndex)) {
                const blob = readyBlobs.get(nextWriteIndex);
                readyBlobs.delete(nextWriteIndex);

                await writer.write(blob);
                totalBytes += blob.size;
                completed++;
                nextWriteIndex++;

                progressCallback(completed);

                if (completed % 6 === 0 || completed === partCount) {
                    consoleLog(
                        prefix + " assembly progress: " +
                        completed + "/" + partCount + " parts.",
                        "info"
                    );
                }
            }
        });
        return writeChain;
    }

    try {
        consoleLog(
            "Starting " + prefix + " with streaming ordered OPFS writes.",
            "info"
        );

        let nextIndex = 0;
        const workerCount = Math.min(partCount, CONFIG.downloadConcurrency.maximum);

        async function worker() {
            while (true) {
                const index = nextIndex++;
                if (index >= partCount) return;

                const blob = await fetchValidatedPart(prefix, index);
                readyBlobs.set(index, blob);
                await enqueueOrderedWrites();
            }
        }

        await Promise.all(
            Array.from({ length: workerCount }, () => worker())
        );

        await writeChain;
        await writer.close();

        const mergedFile = await outputHandle.getFile();

        if (mergedFile.size === 0 || mergedFile.size !== totalBytes) {
            throw new Error("Merged file size validation failed for " + prefix);
        }

        await markOPFSComplete(prefix, mergedFile.size);

        consoleLog(
            prefix + " assembled successfully (" +
            (mergedFile.size / 1048576).toFixed(2) + " MB).",
            "success"
        );

        return mergedFile;

    } catch (error) {
        try {
            await writer.abort();
        } catch (_) {}

        try {
            await storageRoot.removeEntry(prefix);
        } catch (_) {}

        try {
            await storageRoot.removeEntry(prefix + ".complete");
        } catch (_) {}

        consoleLog("Assembly failed for " + prefix + ": " + error.message, "error");
        throw error;
    }
}

async function mergeIndexedDB(prefix, partCount, progressCallback) {
    const cached = await getIDBCachedFile(prefix);

    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    let completed = 0;
    let nextIndex = 0;
    const parts = new Array(partCount);
    const workerCount = Math.min(partCount, CONFIG.downloadConcurrency.maximum);

    async function worker() {
        while (true) {
            const index = nextIndex++;
            if (index >= partCount) return;

            const partName = prefix + "." + String(index).padStart(3, "0");
            const partKey = CONFIG.cacheVersion + ":part:" + partName;
            let partBlob = null;

            try {
                const saved = await idbGet(partKey);
                if (saved && saved.blob instanceof Blob && saved.blob.size > 0) {
                    partBlob = saved.blob;
                }
            } catch (_) {}

            if (!partBlob) {
                partBlob = await fetchValidatedPart(prefix, index);
                try {
                    await idbPut(partKey, { blob: partBlob, size: partBlob.size });
                } catch (_) {}
            }

            parts[index] = partBlob;
            completed++;
            progressCallback(completed);
        }
    }

    await Promise.all(Array.from({ length: workerCount }, () => worker()));

    const mergedBlob = new Blob(parts, { type: "application/octet-stream" });
    await idbPut(CONFIG.cacheVersion + ":" + prefix, {
        blob: mergedBlob,
        size: mergedBlob.size,
        version: CONFIG.cacheVersion
    });

    return mergedBlob;
}

async function mergeParts(prefix, partCount, progressCallback) {
    if (storageMode === "opfs") {
        return mergeOPFS(prefix, partCount, progressCallback);
    }
    return mergeIndexedDB(prefix, partCount, progressCallback);
}

/* ============================================================
   UNITY LOADER & LIFECYCLE
============================================================ */

function loadScriptBlob(blob, label) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const script = document.createElement("script");
        script.src = url;
        script.onload = () => resolve(url);
        script.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Failed to execute " + label));
        };
        document.body.appendChild(script);
    });
}

async function startGame() {
    if (starting) return;
    starting = true;

    errorElement.style.display = "none";
    errorElement.textContent = "";
    retryButton.style.display = "none";

    completedData = 0;
    completedWasm = 0;
    updateProgress(true);

    try {
        await initializeStorage();
        await benchmarkMirrors();

        statusText.textContent = "Downloading game assets...";
        details.textContent = "Downloading chunks from " + new URL(activeBaseURL).hostname + ".";

        const [dataBlob, wasmBlob, loaderResp, frameworkResp] = await Promise.all([
            mergeParts(CONFIG.dataPrefix, CONFIG.dataParts, c => updatePartProgress(CONFIG.dataPrefix, c)),
            mergeParts(CONFIG.wasmPrefix, CONFIG.wasmParts, c => updatePartProgress(CONFIG.wasmPrefix, c)),
            fetchAsset(CONFIG.buildURL + CONFIG.loader),
            fetchAsset(CONFIG.buildURL + CONFIG.framework)
        ]);

        const [loaderBlob, frameworkBlob] = await Promise.all([
            loaderResp.blob(),
            frameworkResp.blob()
        ]);

        consoleLog("Unity framework downloaded (" + (frameworkBlob.size / 1048576).toFixed(2) + " MB).", "success");

        loaderBlobURL = await loadScriptBlob(loaderBlob, "Unity loader");
        consoleLog("Unity loader initialized.", "success");

        frameworkBlobURL = URL.createObjectURL(frameworkBlob);
        const dataBlobURL = URL.createObjectURL(dataBlob);
        const wasmBlobURL = URL.createObjectURL(wasmBlob);

        if (typeof createUnityInstance !== "function") {
            throw new Error("createUnityInstance is not defined after loading loader.");
        }

        statusText.textContent = "Starting Hollow Knight...";
        details.textContent = "Initializing WebGL engine.";

        const unityInstance = await createUnityInstance(canvas, {
            dataUrl: dataBlobURL,
            wasmCodeUrl: wasmBlobURL,
            frameworkUrl: frameworkBlobURL,
            streamingAssetsUrl: CONFIG.streamingAssets,
            companyName: CONFIG.companyName,
            productName: CONFIG.productName,
            productVersion: CONFIG.productVersion
        }, p => {
            setOverall(70 + p * 30);
        });

        window.unityInstance = unityInstance;
        setOverall(100);

        loadingScreen.style.opacity = "0";
        setTimeout(() => {
            loadingScreen.style.display = "none";
            unityContainer.style.display = "flex";
        }, 500);

        $("fullscreenButton").addEventListener("click", () => {
            unityInstance.SetFullscreen(1);
        });

        $("resolutionScale").addEventListener("change", e => {
            const scale = parseFloat(e.target.value) || 0.6;
            canvas.width = Math.round(960 * scale);
            canvas.height = Math.round(600 * scale);
        });

    } catch (error) {
        consoleLog("Startup error: " + error.message, "error");
        errorElement.textContent = error.message || String(error);
        errorElement.style.display = "block";
        retryButton.style.display = "inline-block";
    } finally {
        starting = false;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    consoleClear();
    startGame();
});
