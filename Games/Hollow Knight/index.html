<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base id="assetBase" href="https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight — Fast Launcher</title>
<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#eee}
body{display:flex;align-items:center;justify-content:center}

#loadingScreen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 100%,rgba(120,0,0,.25),transparent 65%),#000
}
.loader-content{width:min(660px,92%);text-align:center}
#status{font-size:15px;font-weight:bold;margin-bottom:10px}
#metrics{font-size:12px;color:#aaa;margin-bottom:12px;min-height:18px}
#overallBar{height:6px;width:100%;background:#222;border-radius:6px;overflow:hidden}
#overallProgress{height:100%;width:0%;background:#c41919;box-shadow:0 0 14px #a80000;transition:width .15s ease}
#percentage{margin-top:12px;font-size:13px;color:#ccc;letter-spacing:2px}

.row{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:18px;margin-bottom:6px}
.bar{height:4px;width:100%;background:#181818;border-radius:4px;overflow:hidden}
.fill{height:100%;width:0%;background:#a81616;transition:width .15s ease}

#details{margin-top:14px;font-size:11px;color:#888;min-height:16px}
#downloadConsole{
    width:100%;height:155px;margin-top:14px;padding:10px;overflow-y:auto;
    background:rgba(10,10,10,.95);border:1px solid #2b2b2b;border-radius:4px;
    font-family:Consolas,monospace;font-size:10px;line-height:1.55;text-align:left;
    white-space:pre-wrap;overflow-wrap:anywhere
}
.log-info{color:#aaa}.log-ok{color:#66cc8a}.log-warn{color:#e6bc5c}.log-err{color:#ff5c5c}

#loadingError{display:none;margin-top:12px;color:#ff6666;font-size:12px;white-space:pre-wrap}
#retryButton{
    display:none;margin-top:14px;padding:10px 24px;
    background:#240808;color:#fff;border:1px solid #991818;cursor:pointer;letter-spacing:1.5px
}
#retryButton:hover{background:#471010}

#unity-container{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;background:#000}
#unity-canvas{
    display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);
    max-width:100%;max-height:calc(100% - 42px);aspect-ratio:16/10;background:#000
}
#unity-footer{
    width:min(960px,100%);height:38px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;color:#888;font-size:12px
}
.ctrl{background:#171717;border:1px solid #333;color:#fff;padding:6px 12px;cursor:pointer;font-size:12px}
.ctrl:hover{background:#2d2d2d}
</style>
</head>

<body>
<div id="loadingScreen">
    <div class="loader-content">
        <div id="status">Preparing launcher...</div>
        <div id="metrics">Speed: -- MB/s · Active streams: 0</div>
        <div id="overallBar"><div id="overallProgress"></div></div>
        <div id="percentage">0%</div>

        <div class="row"><span>GAME DATA</span><span id="dataCount">0 / 44</span></div>
        <div class="bar"><div class="fill" id="dataProgress"></div></div>

        <div class="row"><span>WEBASSEMBLY</span><span id="wasmCount">0 / 3</span></div>
        <div class="bar"><div class="fill" id="wasmProgress"></div></div>

        <div id="details">Starting up...</div>
        <div id="downloadConsole"></div>
        <div id="loadingError"></div>
        <button id="retryButton" type="button" onclick="startGame()">RETRY</button>
    </div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-footer">
        <span>Hollow Knight</span>
        <div style="display:flex;gap:8px;align-items:center">
            <select id="resolutionScale" class="ctrl" aria-label="Graphics resolution">
                <option value="1">Graphics: 1.00x</option>
                <option value="0.85">Graphics: 0.85x</option>
                <option value="0.70">Graphics: 0.70x</option>
                <option value="0.60" selected>Graphics: 0.60x</option>
                <option value="0.50">Graphics: 0.50x</option>
            </select>
            <button id="fullscreenButton" class="ctrl" type="button">FULLSCREEN</button>
        </div>
    </div>
</div>

<script>
"use strict";

const CFG = {
    // Put fastest/private CDN first if you host Build/ yourself
    mirrors: [
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/"
    ],
    buildURL: "Build/",
    loader: "hk.loader.js",
    framework: "hk.framework.js",
    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",
    dataParts: 44,
    wasmParts: 3,
    streamingAssets: "StreamingAssets",
    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",
    cacheVersion: "hk-fast-v1",
    storageDir: "HollowKnightFastCache",
    dbName: "HollowKnightFastDB",

    // Speed & resilience tuning
    globalConcurrency: 8,
    perHostConcurrency: 3,
    hedgeAfterMs: 7000,       // Start a backup race if a chunk takes > 7s
    requestTimeoutMs: 45000,
    probeTimeoutMs: 3500,
    maxRetriesPerPart: 8
};

const $ = id => document.getElementById(id);
const statusEl = $("status");
const metricsEl = $("metrics");
const detailsEl = $("details");
const overallFillEl = $("overallProgress");
const pctEl = $("percentage");
const dataFillEl = $("dataProgress");
const wasmFillEl = $("wasmProgress");
const dataCountEl = $("dataCount");
const wasmCountEl = $("wasmCount");
const consoleEl = $("downloadConsole");
const errEl = $("loadingError");
const retryEl = $("retryButton");

let totalBytesDownloaded = 0;
let downloadStartTime = 0;
let activeRequests = 0;
let completedData = 0;
let completedWasm = 0;
let storageMode = null;
let opfsDir = null;
let idb = null;
let running = false;

const hostStats = new Map();

function getHostStat(mirror) {
    if (!hostStats.has(mirror)) {
        hostStats.set(mirror, {
            host: new URL(mirror).hostname,
            active: 0,
            maxActive: CFG.perHostConcurrency,
            avgMs: 4000,
            score: 0,
            fails: 0,
            blockedUntil: 0
        });
    }
    return hostStats.get(mirror);
}

function log(msg, type = "info") {
    const line = document.createElement("div");
    line.className = "log-" + type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(line);
    while (consoleEl.children.length > 250) consoleEl.removeChild(consoleEl.firstChild);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

function updateMetrics() {
    const elapsedSec = Math.max(0.2, (performance.now() - downloadStartTime) / 1000);
    const mbps = (totalBytesDownloaded / 1048576) / elapsedSec;
    metricsEl.textContent = `Speed: ${mbps.toFixed(2)} MB/s · Active streams: ${activeRequests}/${CFG.globalConcurrency}`;
}

function updateProgress() {
    dataFillEl.style.width = `${(completedData / CFG.dataParts) * 100}%`;
    wasmFillEl.style.width = `${(completedWasm / CFG.wasmParts) * 100}%`;
    dataCountEl.textContent = `${completedData} / ${CFG.dataParts}`;
    wasmCountEl.textContent = `${completedWasm} / ${CFG.wasmParts}`;
    const overall = ((completedData + completedWasm) / (CFG.dataParts + CFG.wasmParts)) * 75;
    overallFillEl.style.width = `${overall.toFixed(1)}%`;
    pctEl.textContent = `${Math.floor(overall)}%`;
    updateMetrics();
}

function rankedMirrors(exclude = new Set()) {
    const now = performance.now();
    return CFG.mirrors
        .filter(m => !exclude.has(m))
        .sort((a, b) => {
            const A = getHostStat(a);
            const B = getHostStat(b);
            const aPen = A.blockedUntil > now ? 1 : 0;
            const bPen = B.blockedUntil > now ? 1 : 0;
            if (aPen !== bPen) return aPen - bPen;
            if (A.score !== B.score) return B.score - A.score;
            return A.avgMs - B.avgMs;
        });
}

async function probeMirrors() {
    statusEl.textContent = "Probing mirrors...";
    detailsEl.textContent = "Checking reachability and latency.";
    const probeFile = "TemplateData/favicon.ico";

    await Promise.all(CFG.mirrors.map(async mirror => {
        const st = getHostStat(mirror);
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), CFG.probeTimeoutMs);
        const t0 = performance.now();
        try {
            const res = await fetch(new URL(probeFile, mirror).href, {
                signal: ctrl.signal,
                cache: "no-store"
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            await res.arrayBuffer();
            const ms = Math.max(10, performance.now() - t0);
            st.avgMs = ms;
            st.score = Math.max(1, 10000 / ms);
            log(`Probe ${st.host}: ${Math.round(ms)} ms`, "ok");
        } catch (e) {
            st.fails++;
            st.score = -50;
            log(`Probe ${st.host} failed (${e.message || e})`, "warn");
        } finally {
            clearTimeout(timer);
        }
    }));

    const best = rankedMirrors()[0] || CFG.mirrors[0];
    $("assetBase").href = best;
    log(`Primary mirror selected: ${new URL(best).hostname}`, "ok");
}

async function fetchWithHostSlot(mirror, relPath, parentSignal) {
    const st = getHostStat(mirror);
    const url = new URL(relPath, mirror).href;

    while (st.active >= st.maxActive || activeRequests >= CFG.globalConcurrency) {
        if (parentSignal?.aborted) throw new DOMException("Aborted", "AbortError");
        await new Promise(r => setTimeout(r, 40));
    }

    st.active++;
    activeRequests++;
    updateMetrics();

    const timeoutCtrl = new AbortController();
    const timer = setTimeout(() => timeoutCtrl.abort(new Error("Timeout")), CFG.requestTimeoutMs);
    const onAbort = () => timeoutCtrl.abort(parentSignal.reason || new Error("Aborted"));
    parentSignal?.addEventListener("abort", onAbort, { once: true });

    const t0 = performance.now();
    try {
        const res = await fetch(url, {
            signal: timeoutCtrl.signal,
            cache: "no-store",
            redirect: "follow"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const blob = await res.blob();
        if (!blob.size) throw new Error("Empty body");

        const ms = Math.max(1, performance.now() - t0);
        st.avgMs = st.avgMs * 0.7 + ms * 0.3;
        const speedMBps = (blob.size / 1048576) / (ms / 1000);
        st.score = st.score * 0.6 + speedMBps * 25 * 0.4;
        if (speedMBps > 1.5 && st.maxActive < CFG.perHostConcurrency + 1) st.maxActive++;

        totalBytesDownloaded += blob.size;
        updateMetrics();
        return { blob, speedMBps, host: st.host };
    } catch (err) {
        st.fails++;
        st.score -= 10;
        if (/HTTP 403|HTTP 429/.test(String(err.message || err))) {
            st.blockedUntil = performance.now() + 20000;
            st.maxActive = Math.max(1, st.maxActive - 1);
        }
        throw err;
    } finally {
        clearTimeout(timer);
        parentSignal?.removeEventListener("abort", onAbort);
        st.active--;
        activeRequests--;
        updateMetrics();
    }
}

async function fetchHedgedPart(relPath, partName) {
    const tried = new Set();
    let lastErr = null;

    for (let attempt = 0; attempt < CFG.maxRetriesPerPart; attempt++) {
        const candidates = rankedMirrors(tried);
        if (!candidates.length) tried.clear();
        const primaryMirror = rankedMirrors(tried)[0] || CFG.mirrors[0];
        tried.add(primaryMirror);

        const ctrl1 = new AbortController();
        const ctrl2 = new AbortController();
        let backupTimer = null;

        const p1 = fetchWithHostSlot(primaryMirror, relPath, ctrl1.signal)
            .then(r => { clearTimeout(backupTimer); ctrl2.abort(); return r; });

        const p2Promise = new Promise((resolve, reject) => {
            backupTimer = setTimeout(() => {
                const backupMirror = rankedMirrors(tried)[0];
                if (!backupMirror) return reject(new Error("No backup mirror"));
                tried.add(backupMirror);
                log(`Hedging ${partName} onto ${new URL(backupMirror).hostname}`, "info");
                fetchWithHostSlot(backupMirror, relPath, ctrl2.signal).then(resolve, reject);
            }, CFG.hedgeAfterMs);
        });

        try {
            const winner = await Promise.any([p1, p2Promise]);
            log(`${partName} (${(winner.blob.size / 1048576).toFixed(2)} MB, ${winner.speedMBps.toFixed(2)} MB/s) <- ${winner.host}`, "ok");
            return winner.blob;
        } catch (aggErr) {
            clearTimeout(backupTimer);
            ctrl1.abort();
            ctrl2.abort();
            lastErr = aggErr.errors?.[0] || aggErr;
            log(`${partName} attempt ${attempt + 1} failed: ${lastErr.message || lastErr}`, "warn");
        }
    }

    throw new Error(`Failed downloading ${partName}: ${lastErr?.message || lastErr}`);
}

async function initStorage() {
    if (navigator.storage?.getDirectory) {
        try {
            const root = await navigator.storage.getDirectory();
            opfsDir = await root.getDirectoryHandle(CFG.storageDir, { create: true });
            storageMode = "opfs";
            log("Using OPFS disk cache", "ok");
            return;
        } catch (e) {
            log("OPFS unavailable, falling back to IndexedDB: " + e.message, "warn");
        }
    }

    idb = await new Promise((resolve, reject) => {
        const req = indexedDB.open(CFG.dbName, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("parts");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
    storageMode = "indexeddb";
    log("Using IndexedDB cache", "ok");
}

async function readPartCache(key) {
    if (storageMode === "opfs") {
        try {
            const fh = await opfsDir.getFileHandle(key);
            const f = await fh.getFile();
            if (f.size > 0) return f;
        } catch (_) {}
        return null;
    }
    return new Promise(resolve => {
        const tx = idb.transaction("parts", "readonly");
        const r = tx.objectStore("parts").get(key);
        r.onsuccess = () => resolve(r.result instanceof Blob && r.result.size > 0 ? r.result : null);
        r.onerror = () => resolve(null);
    });
}

async function writePartCache(key, blob) {
    if (storageMode === "opfs") {
        const fh = await opfsDir.getFileHandle(key, { create: true });
        const w = await fh.createWritable();
        await w.write(blob);
        await w.close();
        return;
    }
    await new Promise((resolve, reject) => {
        const tx = idb.transaction("parts", "readwrite");
        tx.objectStore("parts").put(blob, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function assembleAsset(prefix, partCount, onStep) {
    const blobs = new Array(partCount);
    let nextIdx = 0;

    async function worker() {
        while (true) {
            const idx = nextIdx++;
            if (idx >= partCount) return;
            const partName = `${prefix}.${String(idx).padStart(3, "0")}`;
            const cacheKey = `${CFG.cacheVersion}_${partName}`;

            let blob = await readPartCache(cacheKey);
            if (!blob) {
                blob = await fetchHedgedPart(CFG.buildURL + partName, partName);
                await writePartCache(cacheKey, blob);
            }
            blobs[idx] = blob;
            onStep();
        }
    }

    const workers = Math.min(partCount, CFG.globalConcurrency);
    await Promise.all(Array.from({ length: workers }, worker));
    return new Blob(blobs, { type: "application/octet-stream" });
}

function loadScriptFromBlob(blob) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => resolve(url);
        s.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Loader execution failed")); };
        document.body.appendChild(s);
    });
}

async function startGame() {
    if (running) return;
    running = true;
    errEl.style.display = "none";
    retryEl.style.display = "none";
    completedData = 0;
    completedWasm = 0;
    totalBytesDownloaded = 0;
    downloadStartTime = performance.now();
    updateProgress();

    try {
        await initStorage();
        await probeMirrors();

        statusEl.textContent = "Downloading game bundle...";
        detailsEl.textContent = "Hedging slow chunks and caching completed parts.";

        const [dataBlob, wasmBlob, loaderRes, fwRes] = await Promise.all([
            assembleAsset(CFG.dataPrefix, CFG.dataParts, () => { completedData++; updateProgress(); }),
            assembleAsset(CFG.wasmPrefix, CFG.wasmParts, () => { completedWasm++; updateProgress(); }),
            fetch(new URL(CFG.buildURL + CFG.loader, $("assetBase").href).href, { cache: "no-store" }),
            fetch(new URL(CFG.buildURL + CFG.framework, $("assetBase").href).href, { cache: "no-store" })
        ]);

        if (!loaderRes.ok || !fwRes.ok) throw new Error("Failed to fetch Unity loader or framework");

        const [loaderBlob, fwBlob] = await Promise.all([loaderRes.blob(), fwRes.blob()]);
        await loadScriptFromBlob(loaderBlob);

        statusEl.textContent = "Launching Hollow Knight...";
        const instance = await createUnityInstance($("unity-canvas"), {
            dataUrl: URL.createObjectURL(dataBlob),
            wasmCodeUrl: URL.createObjectURL(wasmBlob),
            frameworkUrl: URL.createObjectURL(fwBlob),
            streamingAssetsUrl: CFG.streamingAssets,
            companyName: CFG.companyName,
            productName: CFG.productName,
            productVersion: CFG.productVersion
        }, p => {
            const v = 75 + p * 25;
            overallFillEl.style.width = `${v.toFixed(1)}%`;
            pctEl.textContent = `${Math.floor(v)}%`;
        });

        window.unityInstance = instance;
        overallFillEl.style.width = "100%";
        pctEl.textContent = "100%";
        $("loadingScreen").style.display = "none";
        $("unity-container").style.display = "flex";

        $("fullscreenButton").onclick = () => instance.SetFullscreen(1);
        $("resolutionScale").onchange = e => {
            const s = parseFloat(e.target.value) || 0.6;
            $("unity-canvas").width = Math.round(960 * s);
            $("unity-canvas").height = Math.round(600 * s);
        };
    } catch (e) {
        log("Fatal: " + (e.message || e), "err");
        errEl.textContent = e.message || String(e);
        errEl.style.display = "block";
        retryEl.style.display = "inline-block";
    } finally {
        running = false;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    log("Fast launcher initialized.", "info");
    startGame();
});
</script>
</body>
</html>
