
<!DOCTYPE html>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

html, body {
    width: 100%;
    height: 100%;

    background: #000;

    content: "";

</style>

<body>

<div id="loadingScreen">

<script>
"use strict";

/* =========================================
   CONFIGURATION
========================================= */

const CONFIG = {
    // Mirrors are tried automatically; the last successful mirror is preferred.
    baseURLs: [
        "https://raw.githack.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://quantil.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://originfastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/"
    ],
    buildURL: "Build/",
    loader: "hk.loader.js",

    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",

    dataParts: 44,
    wasmParts: 3,

    framework: "hk.framework.js",
    streamingAssets: "StreamingAssets",

    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",

    cacheVersion: "hk-file-v8-high-parallel",
    storageDirectory: "HollowKnightCache",

    databaseName: "HollowKnightFileCache"
};


/* =========================================
   ELEMENTS
========================================= */

const $ = id => document.getElementById(id);

const loadingScreen = $("loadingScreen");
const unityContainer = $("unity-container");
const canvas = $("unity-canvas");

const statusText = $("status");
const details = $("details");

const overallProgress = $("overallProgress");
const percentage = $("percentage");

const dataProgress = $("dataProgress");
const wasmProgress = $("wasmProgress");

const dataCount = $("dataCount");
const wasmCount = $("wasmCount");

const errorElement = $("loadingError");
const retryButton = $("retryButton");

let completedData = 0;
let completedWasm = 0;

let storageMode = null;
let storageRoot = null;
let database = null;

let starting = false;
let activeBaseURL = CONFIG.baseURLs[0];
let frameworkBlobURL = null;

/* =========================================
   MULTI-MIRROR FILE LOADING
========================================= */

async function fetchAsset(relativePath, options = {}) {
    const failures = [];
    const orderedMirrors = [
        activeBaseURL,
        ...CONFIG.baseURLs.filter(url => url !== activeBaseURL)
    ];

    for (let mirrorIndex = 0; mirrorIndex < orderedMirrors.length; mirrorIndex++) {
        const baseURL = orderedMirrors[mirrorIndex];
        const url = new URL(relativePath, baseURL).href;
        try {
            const response = await fetch(url, {
                ...options,
                cache: options.cache || "default"
            });
            if (!response.ok) {
                failures.push("Source " + (mirrorIndex + 1) + ": HTTP " + response.status);
                continue;
            }
            activeBaseURL = baseURL;
            const baseElement = document.getElementById("assetBase");
            if (baseElement) baseElement.href = baseURL;
            console.log("Asset source connected.");
            return response;
        } catch (error) {
            failures.push("Source " + (mirrorIndex + 1) + ": network request failed");
        }
    }

    throw new Error(
        "Unable to retrieve " + relativePath +
        ". Tried " + CONFIG.baseURLs.length + " sources.\n" +
        failures.join("\n")
    );
}

// Run a bounded number of downloads at once to avoid overwhelming memory
// or the browser's connection pool.
async function mapWithConcurrency(items, concurrency, worker) {
    const results = new Array(items.length);
    let nextIndex = 0;
    async function runWorker() {
        while (true) {
            const index = nextIndex++;
            if (index >= items.length) return;
            results[index] = await worker(items[index], index);
        }
    }
    const workers = Array.from(
        { length: Math.min(concurrency, items.length) },
        () => runWorker()
    );
    await Promise.all(workers);
    return results;
}


/* =========================================
   PROGRESS
========================================= */

function setOverall(value) {
    value = Math.max(0, Math.min(100, value));

    overallProgress.style.width = value + "%";
    percentage.textContent = Math.floor(value) + "%";
}

function updateProgress() {
    dataProgress.style.width =
        completedData / CONFIG.dataParts * 100 + "%";

    wasmProgress.style.width =
        completedWasm / CONFIG.wasmParts * 100 + "%";

    dataCount.textContent =
        completedData + " / " + CONFIG.dataParts;

    wasmCount.textContent =
        completedWasm + " / " + CONFIG.wasmParts;

    const total = CONFIG.dataParts + CONFIG.wasmParts;
    const completed = completedData + completedWasm;

    setOverall(completed / total * 70);
}

function updatePartProgress(prefix, completed) {
    if (prefix === CONFIG.dataPrefix) {
        completedData = completed;
    } else {
        completedWasm = completed;
    }

    updateProgress();
}

function yieldUI() {
    return new Promise(resolve => {
        requestAnimationFrame(resolve);
    });
}


/* =========================================
   INDEXEDDB
========================================= */

function openDatabase() {
    return new Promise((resolve, reject) => {

        if (!window.indexedDB) {
            reject(new Error(
                "IndexedDB is unavailable in this browser."
            ));
            return;
        }

        const request = indexedDB.open(
            CONFIG.databaseName,
            1
        );

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains("files")) {
                db.createObjectStore("files");
            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(
                request.error ||
                new Error("Could not open IndexedDB.")
            );
        };

        request.onblocked = () => {
            reject(new Error(
                "IndexedDB is blocked by another browser connection."
            ));
        };
    });
}

function idbGet(key) {
    return new Promise((resolve, reject) => {

        const transaction = database.transaction(
            "files",
            "readonly"
        );

        const request = transaction
            .objectStore("files")
            .get(key);

        request.onsuccess = () => resolve(request.result);

        request.onerror = () => reject(request.error);
    });
}

function idbPut(key, value) {
    return new Promise((resolve, reject) => {

        const transaction = database.transaction(
            "files",
            "readwrite"
        );

        transaction.objectStore("files").put(value, key);

        transaction.oncomplete = resolve;

        transaction.onerror = () => reject(transaction.error);

        transaction.onabort = () => reject(transaction.error);
    });
}

function idbDelete(key) {
    return new Promise((resolve, reject) => {

        const transaction = database.transaction(
            "files",
            "readwrite"
        );

        transaction.objectStore("files").delete(key);

        transaction.oncomplete = resolve;

        transaction.onerror = () => reject(transaction.error);
    });
}


/* =========================================
   STORAGE INITIALIZATION
========================================= */

async function initializeStorage() {

    statusText.textContent = "Initializing storage...";
    details.textContent = "Checking available browser storage.";

    // Try OPFS first.
    try {

        if (
            navigator.storage &&
            typeof navigator.storage.getDirectory === "function"
        ) {

            if (navigator.storage.persist) {
                try {
                    await navigator.storage.persist();
                } catch (e) {
                    console.warn("Persistence request:", e);
                }
            }

            const root = await navigator.storage.getDirectory();

            storageRoot = await root.getDirectoryHandle(
                CONFIG.storageDirectory,
                { create: true }
            );

            storageMode = "opfs";

            console.log("Using OPFS storage.");

            details.textContent =
                "Using disk-backed storage.";

            return;
        }

    } catch (error) {

        console.warn("OPFS unavailable. Trying IndexedDB.", error);

    }

    // Fallback to IndexedDB.
    try {

        database = await openDatabase();

        storageMode = "indexeddb";

        console.log("Using IndexedDB storage.");

        details.textContent =
            "Using IndexedDB storage.";

        return;

    } catch (error) {

        throw new Error(
            "No usable browser storage system is available.\n\n" +
            "Storage error: " + error.message + "\n\n" +
            "Your browser may restrict storage for file:// pages. " +
            "Try a browser that supports local-file IndexedDB."
        );
    }
}


/* =========================================
   OPFS CACHE VALIDATION
========================================= */

async function getOPFSCachedFile(filename) {

    try {

        const fileHandle =
            await storageRoot.getFileHandle(filename);

        const markerHandle =
            await storageRoot.getFileHandle(
                filename + ".complete"
            );

        const file = await fileHandle.getFile();

        const marker = await markerHandle.getFile();

        const markerText = await marker.text();

        if (
            file.size > 0 &&
            markerText ===
                CONFIG.cacheVersion + ":" + file.size
        ) {

            console.log(
                "Valid OPFS cache:",
                filename,
                file.size
            );

            return file;
        }

    } catch (error) {
        console.log("OPFS cache miss:", filename);
    }

    return null;
}


/* =========================================
   INDEXEDDB CACHE VALIDATION
========================================= */

async function getIDBCachedFile(filename) {

    try {

        const cached = await idbGet(
            CONFIG.cacheVersion + ":" + filename
        );

        if (
            cached &&
            cached.blob instanceof Blob &&
            cached.blob.size > 0 &&
            cached.size === cached.blob.size
        ) {

            console.log(
                "Valid IndexedDB cache:",
                filename,
                cached.size
            );

            return cached.blob;
        }

    } catch (error) {

        console.warn("IndexedDB cache read failed:", error);

    }

    return null;
}


/* =========================================
   OPFS CACHE MARKER
========================================= */

async function markOPFSComplete(filename, size) {

    const handle =
        await storageRoot.getFileHandle(
            filename + ".complete",
            { create: true }
        );

    const writer = await handle.createWritable();

    try {

        await writer.write(
            CONFIG.cacheVersion + ":" + size
        );

        await writer.close();

    } catch (error) {

        try {
            await writer.abort();
        } catch {}

        throw error;
    }
}


/* =========================================
   OPFS STREAMING MERGER
========================================= */

async function mergeOPFS(
    prefix,
    partCount,
    progressCallback
) {
    const cached = await getOPFSCachedFile(prefix);
    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    try { await storageRoot.removeEntry(prefix + ".complete"); } catch {}

    const outputHandle = await storageRoot.getFileHandle(
        prefix,
        { create: true }
    );
    const writer = await outputHandle.createWritable({
        keepExistingData: false
    });

    let totalBytes = 0;
    let completed = 0;
    const batchSize = 16;

    try {
        // Fetch each small batch concurrently, then write in numeric order.
        // This keeps memory bounded and preserves the exact original file order.
        for (let batchStart = 0; batchStart < partCount; batchStart += batchSize) {
            const indices = Array.from(
                { length: Math.min(batchSize, partCount - batchStart) },
                (_, offset) => batchStart + offset
            );

            const blobs = await mapWithConcurrency(indices, batchSize, async i => {
                const partName = prefix + "." + String(i).padStart(3, "0");
                statusText.textContent = "Downloading " + prefix + " parts...";
                details.textContent = "Fetching " + (i + 1) + " of " + partCount + " in parallel";
                const response = await fetchAsset(CONFIG.buildURL + partName);
                const blob = await response.blob();
                if (!blob.size) throw new Error("Downloaded part is empty: " + partName);
                return { partName, blob };
            });

            for (const item of blobs) {
                await writer.write(item.blob);
                totalBytes += item.blob.size;
                completed++;
                progressCallback(completed);
                console.log("Game data segment downloaded.");
            }
            await yieldUI();
        }

        await writer.close();
        const mergedFile = await outputHandle.getFile();
        if (mergedFile.size === 0 || mergedFile.size !== totalBytes) {
            throw new Error("Merged file size validation failed: " + prefix);
        }
        await markOPFSComplete(prefix, mergedFile.size);
        return mergedFile;
    } catch (error) {
        try { await writer.abort(); } catch {}
        try { await storageRoot.removeEntry(prefix); } catch {}
        try { await storageRoot.removeEntry(prefix + ".complete"); } catch {}
        throw error;
    }
}


/* =========================================
   INDEXEDDB PART MERGER
========================================= */

async function mergeIndexedDB(
    prefix,
    partCount,
    progressCallback
) {
    const cached = await getIDBCachedFile(prefix);
    if (cached) {
        progressCallback(partCount);
        return cached;
    }

    let completed = 0;
    const indices = Array.from({ length: partCount }, (_, i) => i);
    const parts = await mapWithConcurrency(indices, 16, async i => {
        const partName = prefix + "." + String(i).padStart(3, "0");
        const partKey = CONFIG.cacheVersion + ":part:" + partName;
        statusText.textContent = "Downloading " + prefix + " parts...";
        details.textContent = "Fetching " + (i + 1) + " of " + partCount + " in parallel";

        let partBlob = null;
        try {
            const saved = await idbGet(partKey);
            if (
                saved && saved.blob instanceof Blob &&
                saved.blob.size > 0 && saved.size === saved.blob.size
            ) partBlob = saved.blob;
        } catch (error) {
            console.warn("Part cache read:", error);
        }

        if (!partBlob) {
            const response = await fetchAsset(CONFIG.buildURL + partName);
            partBlob = await response.blob();
            if (!partBlob.size) throw new Error("Downloaded part is empty: " + partName);
            await idbPut(partKey, {
                blob: partBlob,
                size: partBlob.size,
                version: CONFIG.cacheVersion
            });
        }

        completed++;
        progressCallback(completed);
        console.log("Game data segment ready.");
        return partBlob;
    });

    statusText.textContent = "Combining " + prefix + "...";
    details.textContent = "Creating merged file from parallel downloads.";

    const totalBytes = parts.reduce((sum, blob) => sum + blob.size, 0);
    const mergedBlob = new Blob(parts, {
        type: prefix === CONFIG.wasmPrefix
            ? "application/wasm"
            : "application/octet-stream"
    });

    if (mergedBlob.size === 0 || mergedBlob.size !== totalBytes) {
        throw new Error("IndexedDB merge validation failed: " + prefix);
    }

    await idbPut(CONFIG.cacheVersion + ":" + prefix, {
        blob: mergedBlob,
        size: mergedBlob.size,
        version: CONFIG.cacheVersion
    });
    return mergedBlob;
}


/* =========================================
   MERGE SELECTOR
========================================= */

async function mergeFile(
    prefix,
    partCount,
    progressCallback
) {

    if (storageMode === "opfs") {

        return await mergeOPFS(
            prefix,
            partCount,
            progressCallback
        );
    }

    if (storageMode === "indexeddb") {

        return await mergeIndexedDB(
            prefix,
            partCount,
            progressCallback
        );
    }

    throw new Error("Storage has not been initialized.");
}


/* =========================================
   PREPARE GAME FILES
========================================= */

async function prepareGameFiles() {
    await initializeStorage();
    statusText.textContent = "Preparing game files in parallel...";

    const [dataFile, wasmFile] = await Promise.all([
        mergeFile(CONFIG.dataPrefix, CONFIG.dataParts, completed => {
            updatePartProgress(CONFIG.dataPrefix, completed);
        }),
        mergeFile(CONFIG.wasmPrefix, CONFIG.wasmParts, completed => {
            updatePartProgress(CONFIG.wasmPrefix, completed);
        })
    ]);

    return { dataFile, wasmFile };
}


/* =========================================
   UNITY LOADER
========================================= */

async function loadUnityLoader() {

    if (typeof createUnityInstance === "function") {
        return;
    }

    statusText.textContent =
        "Loading Unity engine...";

    const loaderResponse = await fetchAsset(
        CONFIG.buildURL + CONFIG.loader
    );
    const loaderBlob = await loaderResponse.blob();
    const loaderBlobURL = URL.createObjectURL(
        loaderBlob.type === "text/javascript"
            ? loaderBlob
            : new Blob([loaderBlob], { type: "text/javascript" })
    );

    const script = document.createElement("script");
    script.src = loaderBlobURL;
    script.async = true;

    await new Promise((resolve, reject) => {

        script.onload = resolve;

        script.onerror = () => {
            reject(new Error(
                "Could not execute the downloaded Unity loader.\n" +
                "The file may be invalid or blocked by the browser."
            ));
        };

        document.head.appendChild(script);
    });

    if (typeof createUnityInstance !== "function") {
        throw new Error(
            "Unity loader loaded, but createUnityInstance is missing."
        );
    }
}


/* =========================================
   PORTABLE SAVE / RESTORE
========================================= */

const SAVE_FORMAT = "hollow-knight-browser-save-v1";
const saveStatus = $("saveStatus");
const saveFileInput = $("saveFileInput");

function setSaveStatus(message) {
    if (saveStatus) saveStatus.textContent = message;
}

function bytesToBase64(bytes) {
    let binary = "";
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(...bytes.subarray(i, i + step));
    }
    return btoa(binary);
}

function encodeSaveValue(value) {
    if (value instanceof ArrayBuffer) {
        return { __hkType: "ArrayBuffer", data: bytesToBase64(new Uint8Array(value)) };
    }
    if (ArrayBuffer.isView(value)) {
        return {
            __hkType: "TypedArray",
            name: value.constructor.name,
            data: bytesToBase64(new Uint8Array(value.buffer, value.byteOffset, value.byteLength))
        };
    }
    if (value instanceof Blob) {
        return { __hkType: "Blob", type: value.type, data: bytesToBase64(new Uint8Array(awaitBlobBytes(value))) };
    }
    if (value instanceof Date) return { __hkType: "Date", value: value.toISOString() };
    if (Array.isArray(value)) return value.map(encodeSaveValue);
    if (value && typeof value === "object") {
        const out = {};
        for (const [key, item] of Object.entries(value)) out[key] = encodeSaveValue(item);
        return out;
    }
    return value;
}

// Blob conversion is asynchronous; this helper is used by encodeSaveValueAsync below.
function awaitBlobBytes(blob) { return blob; }

async function encodeSaveValueAsync(value) {
    if (value instanceof Blob) {
        return { __hkType: "Blob", type: value.type, data: bytesToBase64(new Uint8Array(await value.arrayBuffer())) };
    }
    if (value instanceof ArrayBuffer || ArrayBuffer.isView(value) || value instanceof Date) return encodeSaveValue(value);
    if (Array.isArray(value)) return Promise.all(value.map(encodeSaveValueAsync));
    if (value && typeof value === "object") {
        const out = {};
        for (const [key, item] of Object.entries(value)) out[key] = await encodeSaveValueAsync(item);
        return out;
    }
    return value;
}

function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
}

function decodeSaveValue(value) {
    if (Array.isArray(value)) return value.map(decodeSaveValue);
    if (!value || typeof value !== "object") return value;
    if (value.__hkType === "ArrayBuffer") return base64ToBytes(value.data).buffer;
    if (value.__hkType === "Blob") return new Blob([base64ToBytes(value.data)], { type: value.type || "" });
    if (value.__hkType === "Date") return new Date(value.value);
    if (value.__hkType === "TypedArray") {
        const bytes = base64ToBytes(value.data);
        const constructors = {
            Int8Array, Uint8Array, Uint8ClampedArray, Int16Array,
            Uint16Array, Int32Array, Uint32Array, Float32Array, Float64Array,
            BigInt64Array, BigUint64Array
        };
        const Ctor = constructors[value.name] || Uint8Array;
        const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        return new Ctor(copy);
    }
    const out = {};
    for (const [key, item] of Object.entries(value)) out[key] = decodeSaveValue(item);
    return out;
}

function requestToPromise(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Storage request failed"));
    });
}

function transactionDone(transaction) {
    return new Promise((resolve, reject) => {
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error || new Error("Storage transaction failed"));
        transaction.onabort = () => reject(transaction.error || new Error("Storage transaction was cancelled"));
    });
}

async function flushUnityStorage() {
    const instance = window.unityInstance;
    const module = instance && (instance.Module || instance.module) || window.Module;
    if (module && module.FS && typeof module.FS.syncfs === "function") {
        await new Promise(resolve => {
            try { module.FS.syncfs(false, () => resolve()); }
            catch (_) { resolve(); }
            setTimeout(resolve, 1800);
        });
    }
    // Give browser-backed writes a brief chance to finish.
    await new Promise(resolve => setTimeout(resolve, 350));
}

async function readGameDatabases() {
    if (!indexedDB.databases) {
        throw new Error("This browser cannot list local game storage. Try a current Chrome-based browser.");
    }
    const infos = await indexedDB.databases();
    const targets = infos.filter(info => info.name && /unity|idbfs|hollow.?knight/i.test(info.name) && info.name !== CONFIG.databaseName);
    const databases = [];
    for (const info of targets) {
        const db = await new Promise((resolve, reject) => {
            const request = indexedDB.open(info.name);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
        const stores = [];
        for (const storeName of Array.from(db.objectStoreNames)) {
            const tx = db.transaction(storeName, "readonly");
            const store = tx.objectStore(storeName);
            const keys = await requestToPromise(store.getAllKeys());
            const values = await requestToPromise(store.getAll());
            const records = [];
            for (let i = 0; i < values.length; i++) {
                records.push({ key: await encodeSaveValueAsync(keys[i]), value: await encodeSaveValueAsync(values[i]) });
            }
            stores.push({
                name: storeName,
                keyPath: store.keyPath,
                autoIncrement: store.autoIncrement,
                records
            });
            await transactionDone(tx);
        }
        databases.push({ name: db.name, version: db.version, stores });
        db.close();
    }
    return databases;
}

async function createSaveSnapshot() {
    await flushUnityStorage();
    const databases = await readGameDatabases();
    const local = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        local[key] = localStorage.getItem(key);
    }
    if (!databases.length && !Object.keys(local).length) {
        throw new Error("No browser save data was found yet. Play until the game creates a save, then try again.");
    }
    return {
        format: SAVE_FORMAT,
        createdAt: new Date().toISOString(),
        game: "Hollow Knight",
        databases,
        localStorage: local
    };
}

async function exportSaveFile() {
    const button = $("saveButton");
    button.disabled = true;
    setSaveStatus("Preparing save...");
    try {
        const snapshot = await createSaveSnapshot();
        const blob = new Blob([JSON.stringify(snapshot)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "Hollow-Knight-Save-" + new Date().toISOString().replace(/[:.]/g, "-") + ".hksave";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        setSaveStatus("Save file downloaded");
    } catch (error) {
        console.error("Save export failed:", error);
        setSaveStatus("Save failed — see console");
        alert("Could not export the save: " + (error.message || error));
    } finally {
        button.disabled = false;
    }
}

async function writeDatabaseSnapshot(databaseSnapshot) {
    let db = await new Promise((resolve, reject) => {
        const request = indexedDB.open(databaseSnapshot.name);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onupgradeneeded = () => {
            const fresh = request.result;
            for (const storeInfo of databaseSnapshot.stores) {
                const options = { autoIncrement: !!storeInfo.autoIncrement };
                if (storeInfo.keyPath !== null) options.keyPath = storeInfo.keyPath;
                fresh.createObjectStore(storeInfo.name, options);
            }
        };
    });
    const known = new Set(Array.from(db.objectStoreNames));
    for (const storeInfo of databaseSnapshot.stores) {
        if (!known.has(storeInfo.name)) {
            db.close();
            throw new Error("The saved storage layout does not match this browser's game data. Restore using the same game version and browser profile.");
        }
    }
    for (const storeInfo of databaseSnapshot.stores) {
        const tx = db.transaction(storeInfo.name, "readwrite");
        const store = tx.objectStore(storeInfo.name);
        store.clear();
        for (const record of storeInfo.records) {
            const value = decodeSaveValue(record.value);
            if (store.keyPath === null) store.put(value, decodeSaveValue(record.key));
            else store.put(value);
        }
        await transactionDone(tx);
    }
    db.close();
}

async function importSaveFile(file) {
    if (!file) return;
    setSaveStatus("Restoring save...");
    try {
        const snapshot = JSON.parse(await file.text());
        if (!snapshot || snapshot.format !== SAVE_FORMAT || !Array.isArray(snapshot.databases)) {
            throw new Error("That file is not a compatible Hollow Knight save file.");
        }
        if (window.unityInstance && !confirm("Restore this save and restart the game? Your current browser save data will be replaced.")) {
            setSaveStatus("Restore cancelled");
            return;
        }
        if (window.unityInstance && typeof window.unityInstance.Quit === "function") {
            try { await window.unityInstance.Quit(); } catch (_) {}
            window.unityInstance = null;
        }
        for (const database of snapshot.databases) await writeDatabaseSnapshot(database);
        if (snapshot.localStorage && typeof snapshot.localStorage === "object") {
            for (const [key, value] of Object.entries(snapshot.localStorage)) localStorage.setItem(key, value);
        }
        setSaveStatus("Save restored — restarting...");
        setTimeout(() => location.reload(), 500);
    } catch (error) {
        console.error("Save restore failed:", error);
        setSaveStatus("Restore failed — see console");
        alert("Could not restore the save: " + (error.message || error));
    } finally {
        saveFileInput.value = "";
    }
}

$("saveButton").addEventListener("click", exportSaveFile);
$("loadButton").addEventListener("click", () => saveFileInput.click());
saveFileInput.addEventListener("change", () => importSaveFile(saveFileInput.files[0]));

/* =========================================
   START GAME
========================================= */

async function startGame() {

    if (starting) return;

    starting = true;

    try {

        errorElement.style.display = "none";
        retryButton.style.display = "none";

        unityContainer.style.display = "none";

        completedData = 0;
        completedWasm = 0;

        updateProgress();

        statusText.textContent =
            "Preparing Hollow Knight...";

        details.textContent =
            "Initializing storage.";

        const [files, frameworkBlob] = await Promise.all([
            prepareGameFiles(),
            (async () => {
                const response = await fetchAsset(CONFIG.buildURL + CONFIG.framework);
                return await response.blob();
            })(),
            loadUnityLoader()
        ]).then(results => [results[0], results[1]]);

        statusText.textContent =
            "Preparing Unity engine...";

        details.textContent =
            "Creating game file URLs.";

        setOverall(70);

        // Blob URLs avoid converting the complete
        // files into JavaScript ArrayBuffers.

        const dataURL = URL.createObjectURL(
            files.dataFile
        );

        const wasmBlob = files.wasmFile.type === "application/wasm"
            ? files.wasmFile
            : new Blob([files.wasmFile], { type: "application/wasm" });

        const wasmURL = URL.createObjectURL(wasmBlob);

        window.hollowKnightBlobURLs = [
            dataURL,
            wasmURL
        ];

        frameworkBlobURL = URL.createObjectURL(
            frameworkBlob.type === "text/javascript"
                ? frameworkBlob
                : new Blob([frameworkBlob], { type: "text/javascript" })
        );

        const config = {

            dataUrl: dataURL,

            frameworkUrl:
                frameworkBlobURL,

            codeUrl: wasmURL,

            streamingAssetsUrl:
                new URL(
                    CONFIG.streamingAssets + "/",
                    activeBaseURL
                ).href,

            companyName:
                CONFIG.companyName,

            productName:
                CONFIG.productName,

            productVersion:
                CONFIG.productVersion,

            // Prefer the dedicated/high-performance GPU when available.
            webglContextAttributes: {
                alpha: false,
                antialias: false,
                depth: true,
                stencil: false,
                premultipliedAlpha: false,
                preserveDrawingBuffer: false,
                powerPreference: "high-performance",
                failIfMajorPerformanceCaveat: false
            },

            // Avoid rendering more pixels than necessary on high-DPI screens.
            devicePixelRatio: Math.min(
                window.devicePixelRatio || 1,
                1.5
            ),

            matchWebGLToCanvasSize: true
        };

        statusText.textContent =
            "Starting Hollow Knight...";

        details.textContent =
            "Initializing game engine.";

        unityContainer.style.display = "flex";

        canvas.style.visibility = "hidden";

        const unityInstance = await createUnityInstance(
            canvas,
            config,
            progress => {

                setOverall(70 + progress * 30);

                statusText.textContent =
                    "Loading Hollow Knight...";

                details.textContent =
                    "Initializing game engine.";
            }
        );

        window.unityInstance = unityInstance;

        canvas.style.visibility = "visible";

        setOverall(100);

        statusText.textContent =
            "Hollow Knight ready";

        details.textContent =
            "Enjoy your game.";

        loadingScreen.style.opacity = "0";

        setTimeout(() => {
            loadingScreen.style.display = "none";
        }, 500);

        $("fullscreenButton").onclick = () => {
            unityInstance.SetFullscreen(1);
        };

        console.log(
            "Hollow Knight started successfully."
        );

    } catch (error) {

        const safeErrorMessage = String(
            error && error.message ? error.message : "Unknown loading error"
        ).replace(/https?:\/\/[^\s]+/gi, "[source hidden]");
        console.error("Hollow Knight loading error:", safeErrorMessage);

        unityContainer.style.display = "none";

        statusText.textContent =
            "Unable to load Hollow Knight";

        errorElement.style.display = "block";

        errorElement.textContent =
            error.stack ||
            error.message ||
            String(error);

        retryButton.style.display =
            "inline-block";

        details.textContent =
            "An error occurred. See the error message above.";

    } finally {

        starting = false;
    }
}


/* =========================================
   GLOBAL ERROR HANDLING
========================================= */

window.addEventListener("beforeunload", () => {
    const urls = window.hollowKnightBlobURLs || [];
    for (const url of urls) {
        try { URL.revokeObjectURL(url); } catch {}
    }
    if (frameworkBlobURL) {
        try { URL.revokeObjectURL(frameworkBlobURL); } catch {}
    }
});

window.addEventListener("error", event => {
    const message = String(event.message || "Unknown page error")
        .replace(/https?:\/\/[^\s]+/gi, "[source hidden]");
    console.error("Page error:", message);
});

window.addEventListener("unhandledrejection", event => {
    const reason = event.reason;
    const message = String(reason && reason.message ? reason.message : reason || "Unknown error")
        .replace(/https?:\/\/[^\s]+/gi, "[source hidden]");
    console.error("Unhandled promise rejection:", message);
});


/* =========================================
   INITIALIZE
========================================= */

window.addEventListener("load", () => {
    startGame();
});

</script>
