<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base id="assetBase" href="https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight</title>
<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Arial,sans-serif;color:#f0f0f0}
body{display:flex;align-items:center;justify-content:center}

#boot{
    position:fixed;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 90%,rgba(140,15,15,.22),transparent 65%),#050505
}
.panel{width:min(640px,92%);text-align:center}
h1{font-size:20px;font-weight:600;letter-spacing:1px;margin-bottom:6px}
#sub{font-size:12px;color:#999;margin-bottom:16px}

.track{width:100%;height:6px;background:#1e1e1e;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0%;background:#c81d1d;transition:width .15s ease}

#pct{margin-top:10px;font-size:13px;color:#ccc;letter-spacing:1.5px}

.meta{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:18px;margin-bottom:6px}
.thin{height:4px;background:#171717}

#log{
    margin-top:16px;height:150px;overflow-y:auto;padding:10px;
    background:#0c0c0c;border:1px solid #262626;border-radius:6px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;line-height:1.55;
    text-align:left;white-space:pre-wrap;overflow-wrap:anywhere
}
.ok{color:#66d18e}.warn{color:#ecc05a}.err{color:#ff6363}.info{color:#a8a8a8}

#errBox{display:none;margin-top:12px;color:#ff6b6b;font-size:12px;white-space:pre-wrap}
.actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn{
    display:none;padding:9px 18px;background:#191919;color:#fff;
    border:1px solid #3a3a3a;border-radius:4px;cursor:pointer;font-size:12px
}
.btn:hover{background:#2a2a2a}
.btn.primary{background:#3a0c0c;border-color:#9e1b1b}
.btn.primary:hover{background:#571212}

#game{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;background:#000}
#canvas{
    display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);
    max-width:100%;max-height:calc(100% - 42px);aspect-ratio:16/10;background:#000
}
#bar{
    width:min(960px,100%);height:38px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;color:#888;font-size:12px
}
.gbtn{background:#161616;border:1px solid #333;color:#eee;padding:6px 12px;cursor:pointer;font-size:12px}
.gbtn:hover{background:#292929}
</style>
</head>
<body>

<div id="boot">
    <div class="panel">
        <h1>HOLLOW KNIGHT</h1>
        <div id="sub">Starting up...</div>

        <div class="track"><div class="fill" id="overallFill"></div></div>
        <div id="pct">0%</div>

        <div class="meta"><span>GAME DATA</span><span id="dataTxt">0 / 44</span></div>
        <div class="track thin"><div class="fill" id="dataFill"></div></div>

        <div class="meta"><span>WEBASSEMBLY</span><span id="wasmTxt">0 / 3</span></div>
        <div class="track thin"><div class="fill" id="wasmFill"></div></div>

        <div id="log"></div>
        <div id="errBox"></div>

        <div class="actions">
            <button id="retryBtn" class="btn primary" type="button">Retry</button>
            <button id="clearBtn" class="btn" type="button">Clear Cache</button>
        </div>
    </div>
</div>

<div id="game">
    <canvas id="canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="bar">
        <span>Hollow Knight</span>
        <div style="display:flex;gap:8px;align-items:center">
            <select id="scaleSel" class="gbtn" aria-label="Resolution scale">
                <option value="1">1.00x</option>
                <option value="0.85">0.85x</option>
                <option value="0.70">0.70x</option>
                <option value="0.60" selected>0.60x</option>
                <option value="0.50">0.50x</option>
            </select>
            <button id="fsBtn" class="gbtn" type="button">Fullscreen</button>
        </div>
    </div>
</div>

<script>
"use strict";

const APP = {
    mirrors: [
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/"
    ],
    buildDir: "Build/",
    loader: "hk.loader.js",
    framework: "hk.framework.js",
    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",
    dataCount: 44,
    wasmCount: 3,
    streamingAssets: "StreamingAssets",
    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",
    cacheKeyPrefix: "hk_v1_",
    opfsFolder: "hk_v1_cache",
    idbName: "hk_v1_db",
    workers: 10,
    timeoutMs: 90000,
    retries: 6
};

const el = id => document.getElementById(id);
const subEl = el("sub");
const overallFill = el("overallFill");
const pctEl = el("pct");
const dataFill = el("dataFill");
const wasmFill = el("wasmFill");
const dataTxt = el("dataTxt");
const wasmTxt = el("wasmTxt");
const logEl = el("log");
const errBox = el("errBox");
const retryBtn = el("retryBtn");
const clearBtn = el("clearBtn");

let doneData = 0;
let doneWasm = 0;
let totalBytes = 0;
let tStart = 0;
let storeMode = null;
let opfsDir = null;
let idb = null;
let busy = false;
let preferredMirror = APP.mirrors[0];

function writeLog(msg, cls = "info") {
    const row = document.createElement("div");
    row.className = cls;
    row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.appendChild(row);
    while (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
}

function refreshProgress() {
    dataFill.style.width = `${(doneData / APP.dataCount) * 100}%`;
    wasmFill.style.width = `${(doneWasm / APP.wasmCount) * 100}%`;
    dataTxt.textContent = `${doneData} / ${APP.dataCount}`;
    wasmTxt.textContent = `${doneWasm} / ${APP.wasmCount}`;

    const ratio = (doneData + doneWasm) / (APP.dataCount + APP.wasmCount);
    const pct = ratio * 75;
    overallFill.style.width = `${pct.toFixed(1)}%`;
    pctEl.textContent = `${Math.floor(pct)}%`;

    const sec = Math.max(0.5, (performance.now() - tStart) / 1000);
    const mbps = (totalBytes / 1048576) / sec;
    subEl.textContent = `Downloading assets · ${mbps.toFixed(2)} MB/s · ${(totalBytes / 1048576).toFixed(0)} MB received`;
}

async function initCache() {
    if (navigator.storage?.getDirectory) {
        try {
            const root = await navigator.storage.getDirectory();
            opfsDir = await root.getDirectoryHandle(APP.opfsFolder, { create: true });
            storeMode = "opfs";
            writeLog("Storage: OPFS", "ok");
            return;
        } catch (_) {}
    }

    idb = await new Promise((resolve, reject) => {
        const req = indexedDB.open(APP.idbName, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("blobs");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
    storeMode = "indexeddb";
    writeLog("Storage: IndexedDB", "ok");
}

async function readCache(name) {
    const key = APP.cacheKeyPrefix + name;
    if (storeMode === "opfs") {
        try {
            const fh = await opfsDir.getFileHandle(key);
            const f = await fh.getFile();
            if (f.size > 0) return f;
        } catch (_) {}
        return null;
    }
    return new Promise(resolve => {
        const tx = idb.transaction("blobs", "readonly");
        const r = tx.objectStore("blobs").get(key);
        r.onsuccess = () => resolve(r.result instanceof Blob && r.result.size > 0 ? r.result : null);
        r.onerror = () => resolve(null);
    });
}

async function writeCache(name, blob) {
    const key = APP.cacheKeyPrefix + name;
    if (storeMode === "opfs") {
        const fh = await opfsDir.getFileHandle(key, { create: true });
        const w = await fh.createWritable();
        await w.write(blob);
        await w.close();
        return;
    }
    await new Promise((resolve, reject) => {
        const tx = idb.transaction("blobs", "readwrite");
        tx.objectStore("blobs").put(blob, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function clearCache() {
    writeLog("Clearing cached files...", "warn");
    if (storeMode === "opfs" && opfsDir) {
        for await (const [entryName] of opfsDir.entries()) {
            try { await opfsDir.removeEntry(entryName); } catch (_) {}
        }
    }
    if (idb) {
        await new Promise(resolve => {
            const tx = idb.transaction("blobs", "readwrite");
            tx.objectStore("blobs").clear();
            tx.oncomplete = resolve;
            tx.onerror = resolve;
        });
    }
    writeLog("Cache cleared.", "ok");
}

function mirrorList(skip = new Set()) {
    const ordered = [preferredMirror, ...APP.mirrors.filter(m => m !== preferredMirror)];
    return ordered.filter((m, idx, arr) => !skip.has(m) && arr.indexOf(m) === idx);
}

async function downloadFile(relPath, label) {
    const skip = new Set();
    let lastErr = null;

    for (let i = 0; i < APP.retries; i++) {
        const candidates = mirrorList(skip);
        if (!candidates.length) skip.clear();
        const base = mirrorList(skip)[0] || APP.mirrors[0];
        skip.add(base);

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(new Error("Timed out")), APP.timeoutMs);
        const t0 = performance.now();

        try {
            const res = await fetch(new URL(relPath, base).href, {
                signal: ctrl.signal,
                cache: "no-store",
                redirect: "follow"
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const blob = await res.blob();
            if (!blob.size) throw new Error("Empty response");

            const sec = Math.max(0.05, (performance.now() - t0) / 1000);
            const mbps = (blob.size / 1048576) / sec;
            totalBytes += blob.size;
            preferredMirror = base;
            el("assetBase").href = base;

            writeLog(`${label} (${(blob.size / 1048576).toFixed(2)} MB, ${mbps.toFixed(2)} MB/s) <- ${new URL(base).hostname}`, "ok");
            refreshProgress();
            return blob;
        } catch (e) {
            lastErr = e;
            writeLog(`${label} failed on ${new URL(base).hostname}: ${e.message || e}`, "warn");
        } finally {
            clearTimeout(timer);
        }
    }

    throw new Error(`Unable to download ${label}: ${lastErr?.message || lastErr}`);
}

async function fetchGroup(prefix, count, onPartDone) {
    const out = new Array(count);
    let idxCursor = 0;

    async function worker() {
        while (true) {
            const i = idxCursor++;
            if (i >= count) return;
            const partName = `${prefix}.${String(i).padStart(3, "0")}`;

            let blob = await readCache(partName);
            if (blob) {
                totalBytes += blob.size;
                writeLog(`${partName} loaded from cache`, "ok");
            } else {
                blob = await downloadFile(APP.buildDir + partName, partName);
                await writeCache(partName, blob);
            }

            out[i] = blob;
            onPartDone();
            refreshProgress();
        }
    }

    await Promise.all(Array.from({ length: Math.min(count, APP.workers) }, worker));
    return new Blob(out, { type: "application/octet-stream" });
}

function runScriptBlob(blob) {
    return new Promise((resolve, reject) => {
        if (!blob || blob.size === 0) {
            reject(new Error("Unity loader script blob is empty."));
            return;
        }
        const url = URL.createObjectURL(blob);
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => resolve(url);
        s.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("Failed to load Unity script"));
        };
        document.body.appendChild(s);
    });
}

async function start() {
    if (busy) return;
    busy = true;
    errBox.style.display = "none";
    retryBtn.style.display = "none";
    clearBtn.style.display = "none";
    doneData = 0;
    doneWasm = 0;
    totalBytes = 0;
    tStart = performance.now();
    refreshProgress();

    try {
        await initCache();

        const [dataBlob, wasmBlob, loaderBlob, fwBlob] = await Promise.all([
            fetchGroup(APP.dataPrefix, APP.dataCount, () => { doneData++; }),
            fetchGroup(APP.wasmPrefix, APP.wasmCount, () => { doneWasm++; }),
            downloadFile(APP.buildDir + APP.loader, APP.loader),
            downloadFile(APP.buildDir + APP.framework, APP.framework)
        ]);

        if (!dataBlob || dataBlob.size === 0) {
            throw new Error("Merged game data blob is empty.");
        }
        if (!wasmBlob || wasmBlob.size === 0) {
            throw new Error("Merged WebAssembly blob is empty.");
        }
        if (!fwBlob || fwBlob.size === 0) {
            throw new Error("Unity framework blob is empty.");
        }

        const wasmBytes = new Uint8Array(await wasmBlob.arrayBuffer());
        const dataUrl = String(URL.createObjectURL(dataBlob));
        const wasmCodeUrl = String(URL.createObjectURL(wasmBlob));
        const frameworkUrl = String(URL.createObjectURL(fwBlob));

        await runScriptBlob(loaderBlob);

        if (typeof createUnityInstance !== "function") {
            throw new Error("Unity loader did not expose createUnityInstance.");
        }

        subEl.textContent = "Starting Hollow Knight...";

        const unityConfig = {
            dataUrl,
            wasmCodeUrl,
            wasmBinary: wasmBytes,
            frameworkUrl,
            streamingAssetsUrl: String(APP.streamingAssets || "StreamingAssets"),
            companyName: String(APP.companyName || "Stratus Dev Team"),
            productName: String(APP.productName || "Hollow Knight"),
            productVersion: String(APP.productVersion || "1.5.12620")
        };

        const instance = await createUnityInstance(el("canvas"), unityConfig, p => {
            const val = 75 + p * 25;
            overallFill.style.width = `${val.toFixed(1)}%`;
            pctEl.textContent = `${Math.floor(val)}%`;
        });

        window.unityInstance = instance;
        overallFill.style.width = "100%";
        pctEl.textContent = "100%";
        el("boot").style.display = "none";
        el("game").style.display = "flex";

        el("fsBtn").onclick = () => instance.SetFullscreen(1);
        el("scaleSel").onchange = e => {
            const s = parseFloat(e.target.value) || 0.6;
            el("canvas").width = Math.round(960 * s);
            el("canvas").height = Math.round(600 * s);
        };
    } catch (e) {
        writeLog(e.message || String(e), "err");
        errBox.textContent = e.message || String(e);
        errBox.style.display = "block";
        retryBtn.style.display = "inline-block";
        clearBtn.style.display = "inline-block";
    } finally {
        busy = false;
    }
}

retryBtn.onclick = start;
clearBtn.onclick = async () => {
    await clearCache();
    start();
};

window.addEventListener("DOMContentLoaded", () => {
    writeLog("Launcher ready.", "info");
    start();
});
</script>
</body>
</html>
