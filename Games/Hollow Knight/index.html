<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base id="assetBase" href="https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollow Knight</title>
<link rel="icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#eee}
body{display:flex;align-items:center;justify-content:center}

#loadingScreen{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 100%,rgba(120,0,0,.25),transparent 65%),#000
}
.loader-content{width:min(660px,92%);text-align:center}
#status{font-size:15px;font-weight:bold;margin-bottom:8px}
#metrics{font-size:12px;color:#aaa;margin-bottom:12px;min-height:18px}
#overallBar{height:6px;width:100%;background:#222;border-radius:6px;overflow:hidden}
#overallProgress{height:100%;width:0%;background:#c41919;box-shadow:0 0 14px #a80000;transition:width .12s linear}
#percentage{margin-top:10px;font-size:13px;color:#ccc;letter-spacing:2px}

.row{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:16px;margin-bottom:5px}
.bar{height:4px;width:100%;background:#181818;border-radius:4px;overflow:hidden}
.fill{height:100%;width:0%;background:#a81616;transition:width .12s linear}

#details{margin-top:12px;font-size:11px;color:#888;min-height:16px}
#downloadConsole{
    width:100%;height:150px;margin-top:12px;padding:10px;overflow-y:auto;
    background:rgba(10,10,10,.95);border:1px solid #2b2b2b;border-radius:4px;
    font-family:Consolas,monospace;font-size:10px;line-height:1.5;text-align:left;
    white-space:pre-wrap;overflow-wrap:anywhere
}
.log-info{color:#aaa}.log-ok{color:#66cc8a}.log-warn{color:#e6bc5c}.log-err{color:#ff5c5c}

#loadingError{display:none;margin-top:12px;color:#ff6666;font-size:12px;white-space:pre-wrap}
#retryButton{
    display:none;margin-top:14px;padding:10px 24px;
    background:#240808;color:#fff;border:1px solid #991818;cursor:pointer;letter-spacing:1.5px
}
#retryButton:hover{background:#471010}

#unity-container{display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;background:#000}
#unity-canvas{
    display:block;width:min(100vw,160vh);height:min(62.5vw,100vh);
    max-width:100%;max-height:calc(100% - 42px);aspect-ratio:16/10;background:#000
}
#unity-footer{
    width:min(960px,100%);height:38px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;color:#888;font-size:12px
}
.ctrl{background:#171717;border:1px solid #333;color:#fff;padding:6px 12px;cursor:pointer;font-size:12px}
.ctrl:hover{background:#2d2d2d}
</style>
</head>

<body>
<div id="loadingScreen">
    <div class="loader-content">
        <div id="status">Preparing launcher...</div>
        <div id="metrics">Speed: -- MB/s · ETA: -- · Streams: 0</div>
        <div id="overallBar"><div id="overallProgress"></div></div>
        <div id="percentage">0%</div>

        <div class="row"><span>GAME DATA (44 PARTS)</span><span id="dataCount">0 / 44</span></div>
        <div class="bar"><div class="fill" id="dataProgress"></div></div>

        <div class="row"><span>WEBASSEMBLY (3 PARTS)</span><span id="wasmCount">0 / 3</span></div>
        <div class="bar"><div class="fill" id="wasmProgress"></div></div>

        <div id="details">Starting up...</div>
        <div id="downloadConsole"></div>
        <div id="loadingError"></div>
        <button id="retryButton" type="button" onclick="startGame()">RETRY</button>
    </div>
</div>

<div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-footer">
        <span>Hollow Knight</span>
        <div style="display:flex;gap:8px;align-items:center">
            <select id="resolutionScale" class="ctrl" aria-label="Graphics resolution">
                <option value="1">Graphics: 1.00x</option>
                <option value="0.85">Graphics: 0.85x</option>
                <option value="0.70">Graphics: 0.70x</option>
                <option value="0.60" selected>Graphics: 0.60x</option>
                <option value="0.50">Graphics: 0.50x</option>
            </select>
            <button id="fullscreenButton" class="ctrl" type="button">FULLSCREEN</button>
        </div>
    </div>
</div>

<script>
"use strict";

const CFG = {
    mirrors: [
        "https://testingcf.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/",
        "https://raw.githubusercontent.com/AMoldyWaffle/Hollow-Knight/main/",
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Hollow-Knight@main/"
    ],
    buildURL: "Build/",
    loader: "hk.loader.js",
    framework: "hk.framework.js",
    dataPrefix: "hk.data",
    wasmPrefix: "hk.wasm",
    dataParts: 44,
    wasmParts: 3,
    estimatedTotalMB: 892,
    streamingAssets: "StreamingAssets",
    companyName: "Stratus Dev Team",
    productName: "Hollow Knight",
    productVersion: "1.5.12620",
    cacheVersion: "hk-turbo-v1",
    storageDir: "HollowKnightTurboCache",
    dbName: "HollowKnightTurboDB",

    // Multi-edge turbo settings
    maxGlobalStreams: 16,
    maxStreamsPerMirror: 4,
    sliceBytes: 4 * 1024 * 1024, // Split 19MB parts into ~4.75MB parallel range slices
    hedgeAfterMs: 3200,          // Race any slice slower than 3.2s on another CDN
    sliceTimeoutMs: 20000,
    maxSliceRetries: 8
};

const $ = id => document.getElementById(id);
const statusEl = $("status");
const metricsEl = $("metrics");
const detailsEl = $("details");
const overallFillEl = $("overallProgress");
const pctEl = $("percentage");
const dataFillEl = $("dataProgress");
const wasmFillEl = $("wasmProgress");
const dataCountEl = $("dataCount");
const wasmCountEl = $("wasmCount");
const consoleEl = $("downloadConsole");
const errEl = $("loadingError");
const retryEl = $("retryButton");

let bytesDownloaded = 0;
let startTimeMs = 0;
let activeStreams = 0;
let completedData = 0;
let completedWasm = 0;
let storageMode = null;
let opfsDir = null;
let idb = null;
let running = false;

const mirrorState = new Map();

function getMirror(url) {
    if (!mirrorState.has(url)) {
        mirrorState.set(url, {
            url,
            host: new URL(url).hostname,
            active: 0,
            maxActive: CFG.maxStreamsPerMirror,
            ewmaMBps: 1.0,
            fails: 0,
            cooldownUntil: 0,
            supportsRange: true
        });
    }
    return mirrorState.get(url);
}

function log(msg, type = "info") {
    const line = document.createElement("div");
    line.className = "log-" + type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(line);
    while (consoleEl.children.length > 220) consoleEl.removeChild(consoleEl.firstChild);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

function updateUI() {
    dataFillEl.style.width = `${(completedData / CFG.dataParts) * 100}%`;
    wasmFillEl.style.width = `${(completedWasm / CFG.wasmParts) * 100}%`;
    dataCountEl.textContent = `${completedData} / ${CFG.dataParts}`;
    wasmCountEl.textContent = `${completedWasm} / ${CFG.wasmParts}`;

    const partRatio = (completedData + completedWasm) / (CFG.dataParts + CFG.wasmParts);
    const overall = partRatio * 75;
    overallFillEl.style.width = `${overall.toFixed(1)}%`;
    pctEl.textContent = `${Math.floor(overall)}%`;

    const sec = Math.max(0.25, (performance.now() - startTimeMs) / 1000);
    const mbDone = bytesDownloaded / 1048576;
    const mbps = mbDone / sec;
    const remMB = Math.max(0, CFG.estimatedTotalMB * (1 - partRatio));
    const etaSec = mbps > 0.05 ? Math.round(remMB / mbps) : 0;
    const etaText = etaSec > 0 ? `${etaSec}s` : "--";

    metricsEl.textContent = `Speed: ${mbps.toFixed(2)} MB/s · ETA: ${etaText} · Streams: ${activeStreams}/${CFG.maxGlobalStreams}`;
}

function getRankedMirrors(exclude = new Set()) {
    const now = performance.now();
    return CFG.mirrors
        .filter(m => !exclude.has(m))
        .sort((a, b) => {
            const A = getMirror(a);
            const B = getMirror(b);
            const aCool = A.cooldownUntil > now ? 1 : 0;
            const bCool = B.cooldownUntil > now ? 1 : 0;
            if (aCool !== bCool) return aCool - bCool;
            const aLoad = A.active / Math.max(1, A.maxActive);
            const bLoad = B.active / Math.max(1, B.maxActive);
            const aScore = A.ewmaMBps * (1 - aLoad * 0.45) - A.fails * 0.15;
            const bScore = B.ewmaMBps * (1 - bLoad * 0.45) - B.fails * 0.15;
            return bScore - aScore;
        });
}

async function acquireSlot(mirror, parentSignal) {
    const m = getMirror(mirror);
    while (m.active >= m.maxActive || activeStreams >= CFG.maxGlobalStreams) {
        if (parentSignal?.aborted) throw new DOMException("Aborted", "AbortError");
        await new Promise(r => setTimeout(r, 25));
    }
    m.active++;
    activeStreams++;
    updateUI();
}

function releaseSlot(mirror) {
    const m = getMirror(mirror);
    m.active = Math.max(0, m.active - 1);
    activeStreams = Math.max(0, activeStreams - 1);
    updateUI();
}

async function fetchRangeOrWhole(mirror, relPath, start, end, parentSignal) {
    await acquireSlot(mirror, parentSignal);
    const m = getMirror(mirror);
    const url = new URL(relPath, mirror).href;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(new Error("Slice timeout")), CFG.sliceTimeoutMs);
    const onParentAbort = () => ctrl.abort(parentSignal.reason || new Error("Aborted"));
    parentSignal?.addEventListener("abort", onParentAbort, { once: true });

    const headers = {};
    const isRange = typeof start === "number" && typeof end === "number";
    if (isRange) headers["Range"] = `bytes=${start}-${end}`;

    const t0 = performance.now();
    try {
        const res = await fetch(url, {
            headers,
            signal: ctrl.signal,
            cache: "no-store",
            redirect: "follow"
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        const buf = await res.arrayBuffer();
        const ms = Math.max(1, performance.now() - t0);
        const speed = (buf.byteLength / 1048576) / (ms / 1000);

        m.ewmaMBps = m.ewmaMBps * 0.65 + speed * 0.35;
        bytesDownloaded += buf.byteLength;
        updateUI();

        // If server ignored Range and returned 200 full file, slice client-side
        if (isRange && res.status === 200) {
            m.supportsRange = false;
            return {
                bytes: new Uint8Array(buf.slice(start, end + 1)),
                fullBuffer: buf,
                host: m.host,
                speed
            };
        }

        return {
            bytes: new Uint8Array(buf),
            fullBuffer: null,
            host: m.host,
            speed
        };
    } catch (err) {
        m.fails++;
        m.ewmaMBps = Math.max(0.15, m.ewmaMBps * 0.7);
        if (/HTTP 403|HTTP 429/.test(String(err.message || err))) {
            m.cooldownUntil = performance.now() + 15000;
            m.maxActive = Math.max(1, m.maxActive - 1);
        }
        throw err;
    } finally {
        clearTimeout(timer);
        parentSignal?.removeEventListener("abort", onParentAbort);
        releaseSlot(mirror);
    }
}

async function fetchHedgedSlice(relPath, start, end, label) {
    const tried = new Set();
    let lastErr = null;

    for (let attempt = 0; attempt < CFG.maxSliceRetries; attempt++) {
        if (tried.size >= CFG.mirrors.length) tried.clear();
        const m1 = getRankedMirrors(tried)[0] || CFG.mirrors[0];
        tried.add(m1);

        const c1 = new AbortController();
        const c2 = new AbortController();
        let hedgeTimer = null;

        const p1 = fetchRangeOrWhole(m1, relPath, start, end, c1.signal)
            .then(r => { clearTimeout(hedgeTimer); c2.abort(); return r; });

        const p2 = new Promise((resolve, reject) => {
            hedgeTimer = setTimeout(() => {
                const m2 = getRankedMirrors(tried)[0];
                if (!m2) return reject(new Error("No alternate mirror"));
                tried.add(m2);
                fetchRangeOrWhole(m2, relPath, start, end, c2.signal).then(resolve, reject);
            }, CFG.hedgeAfterMs);
        });

        try {
            return await Promise.any([p1, p2]);
        } catch (agg) {
            clearTimeout(hedgeTimer);
            c1.abort();
            c2.abort();
            lastErr = agg.errors?.[0] || agg;
        }
    }
    throw new Error(`${label} failed: ${lastErr?.message || lastErr}`);
}

async function probePartSize(relPath) {
    for (const mirror of getRankedMirrors()) {
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 5000);
            const res = await fetch(new URL(relPath, mirror).href, {
                method: "HEAD",
                signal: ctrl.signal,
                cache: "no-store"
            });
            clearTimeout(timer);
            if (res.ok) {
                const len = Number(res.headers.get("content-length"));
                if (len > 0) return len;
            }
        } catch (_) {}
    }
    return 0;
}

async function downloadPartTurbo(prefix, index) {
    const partName = `${prefix}.${String(index).padStart(3, "0")}`;
    const relPath = CFG.buildURL + partName;
    const t0 = performance.now();

    const totalSize = await probePartSize(relPath);

    // If HEAD gave size and > sliceBytes, fetch byte slices concurrently across multiple CDNs
    if (totalSize > CFG.sliceBytes * 1.25) {
        const ranges = [];
        for (let offset = 0; offset < totalSize; offset += CFG.sliceBytes) {
            ranges.push([offset, Math.min(totalSize - 1, offset + CFG.sliceBytes - 1)]);
        }

        const results = await Promise.all(
            ranges.map(([s, e], i) => fetchHedgedSlice(relPath, s, e, `${partName}[${i}]`))
        );

        // If any mirror returned the full buffer on slice 0, use it immediately
        const full = results.find(r => r.fullBuffer && r.fullBuffer.byteLength === totalSize);
        const blob = full
            ? new Blob([full.fullBuffer], { type: "application/octet-stream" })
            : new Blob(results.map(r => r.bytes), { type: "application/octet-stream" });

        const sec = Math.max(0.05, (performance.now() - t0) / 1000);
        const mbps = (blob.size / 1048576) / sec;
        log(`${partName} (${(blob.size / 1048576).toFixed(2)} MB @ ${mbps.toFixed(2)} MB/s via ${ranges.length}x parallel slices)`, "ok");
        return blob;
    }

    // Fallback whole-part hedged download
    const res = await fetchHedgedSlice(relPath, null, null, partName);
    const sec = Math.max(0.05, (performance.now() - t0) / 1000);
    const mbps = (res.bytes.byteLength / 1048576) / sec;
    log(`${partName} (${(res.bytes.byteLength / 1048576).toFixed(2)} MB @ ${mbps.toFixed(2)} MB/s) <- ${res.host}`, "ok");
    return new Blob([res.bytes], { type: "application/octet-stream" });
}

async function initStorage() {
    if (navigator.storage?.getDirectory) {
        try {
            const root = await navigator.storage.getDirectory();
            opfsDir = await root.getDirectoryHandle(CFG.storageDir, { create: true });
            storageMode = "opfs";
            log("OPFS disk cache ready", "ok");
            return;
        } catch (e) {
            log("OPFS unavailable, using IndexedDB", "warn");
        }
    }
    idb = await new Promise((resolve, reject) => {
        const req = indexedDB.open(CFG.dbName, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("parts");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
    storageMode = "indexeddb";
    log("IndexedDB cache ready", "ok");
}

async function getCachedPart(key) {
    if (storageMode === "opfs") {
        try {
            const fh = await opfsDir.getFileHandle(key);
            const f = await fh.getFile();
            if (f.size > 0) return f;
        } catch (_) {}
        return null;
    }
    return new Promise(resolve => {
        const tx = idb.transaction("parts", "readonly");
        const r = tx.objectStore("parts").get(key);
        r.onsuccess = () => resolve(r.result instanceof Blob && r.result.size > 0 ? r.result : null);
        r.onerror = () => resolve(null);
    });
}

async function putCachedPart(key, blob) {
    if (storageMode === "opfs") {
        const fh = await opfsDir.getFileHandle(key, { create: true });
        const w = await fh.createWritable();
        await w.write(blob);
        await w.close();
        return;
    }
    await new Promise((resolve, reject) => {
        const tx = idb.transaction("parts", "readwrite");
        tx.objectStore("parts").put(blob, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}

async function buildBundle(prefix, count, onDone) {
    const blobs = new Array(count);
    let cursor = 0;

    async function worker() {
        while (true) {
            const idx = cursor++;
            if (idx >= count) return;
            const partName = `${prefix}.${String(idx).padStart(3, "0")}`;
            const key = `${CFG.cacheVersion}_${partName}`;

            let blob = await getCachedPart(key);
            if (!blob) {
                blob = await downloadPartTurbo(prefix, idx);
                await putCachedPart(key, blob);
            } else {
                bytesDownloaded += blob.size;
            }
            blobs[idx] = blob;
            onDone();
        }
    }

    // 4 concurrent parts x 4 parallel slices each = 16 active multi-CDN streams
    await Promise.all(Array.from({ length: Math.min(count, 4) }, worker));
    return new Blob(blobs, { type: "application/octet-stream" });
}

function injectScriptBlob(blob) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const s = document.createElement("script");
        s.src = url;
        s.onload = () => resolve(url);
        s.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Loader script failed")); };
        document.body.appendChild(s);
    });
}

async function startGame() {
    if (running) return;
    running = true;
    errEl.style.display = "none";
    retryEl.style.display = "none";
    bytesDownloaded = 0;
    completedData = 0;
    completedWasm = 0;
    startTimeMs = performance.now();
    updateUI();

    try {
        await initStorage();
        statusEl.textContent = "Downloading Hollow Knight (Multi-CDN Turbo)...";
        detailsEl.textContent = "Splitting chunks across multiple edge mirrors simultaneously.";

        const [dataBlob, wasmBlob, loaderRes, fwRes] = await Promise.all([
            buildBundle(CFG.dataPrefix, CFG.dataParts, () => { completedData++; updateUI(); }),
            buildBundle(CFG.wasmPrefix, CFG.wasmParts, () => { completedWasm++; updateUI(); }),
            fetch(new URL(CFG.buildURL + CFG.loader, CFG.mirrors[0]).href, { cache: "no-store" }),
            fetch(new URL(CFG.buildURL + CFG.framework, CFG.mirrors[0]).href, { cache: "no-store" })
        ]);

        if (!loaderRes.ok || !fwRes.ok) throw new Error("Failed to fetch Unity loader/framework");
        const [loaderBlob, fwBlob] = await Promise.all([loaderRes.blob(), fwRes.blob()]);
        await injectScriptBlob(loaderBlob);

        statusEl.textContent = "Launching WebGL engine...";
        const instance = await createUnityInstance($("unity-canvas"), {
            dataUrl: URL.createObjectURL(dataBlob),
            wasmCodeUrl: URL.createObjectURL(wasmBlob),
            frameworkUrl: URL.createObjectURL(fwBlob),
            streamingAssetsUrl: CFG.streamingAssets,
            companyName: CFG.companyName,
            productName: CFG.productName,
            productVersion: CFG.productVersion
        }, p => {
            const pct = 75 + p * 25;
            overallFillEl.style.width = `${pct.toFixed(1)}%`;
            pctEl.textContent = `${Math.floor(pct)}%`;
        });

        window.unityInstance = instance;
        overallFillEl.style.width = "100%";
        pctEl.textContent = "100%";
        $("loadingScreen").style.display = "none";
        $("unity-container").style.display = "flex";

        $("fullscreenButton").onclick = () => instance.SetFullscreen(1);
        $("resolutionScale").onchange = e => {
            const s = parseFloat(e.target.value) || 0.6;
            $("unity-canvas").width = Math.round(960 * s);
            $("unity-canvas").height = Math.round(600 * s);
        };
    } catch (e) {
        log("Error: " + (e.message || e), "err");
        errEl.textContent = e.message || String(e);
        errEl.style.display = "block";
        retryEl.style.display = "inline-block";
    } finally {
        running = false;
    }
}

window.addEventListener("DOMContentLoaded", () => {
    log("Multi-CDN Turbo Launcher ready.", "info");
    startGame();
});
</script>
</body>
</html>
