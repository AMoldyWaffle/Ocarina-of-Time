
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Super Mario Bros. 3</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  position: absolute;
  inset: 0;
  background: #000;
}

#emulator {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#emulator iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #080808;
  text-align: center;
  padding: 20px;
}

#overlay.hidden {
  display: none;
}

#overlay h2 {
  margin: 0;
  font-size: 22px;
}

#overlay p {
  margin: 0;
  color: #aaa;
  font-size: 13px;
}

#spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #333;
  border-top-color: #39bd75;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Floating corner controls */
#controls {
  position: fixed;
  z-index: 20;
  right: 14px;
  bottom: 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

button {
  border: 1px solid #555;
  border-radius: 7px;
  padding: 9px 13px;
  background: rgba(30, 30, 30, 0.88);
  color: white;
  font-size: 12px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}

button:hover {
  background: rgba(60, 60, 60, 0.95);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#saveButton {
  border-color: #258a50;
  background: rgba(23, 107, 59, 0.92);
}

#saveButton:hover {
  background: rgba(32, 134, 75, 0.98);
}

/* Console */
#console {
  position: fixed;
  z-index: 30;
  left: 12px;
  bottom: 14px;
  width: min(500px, calc(100% - 24px));
  max-height: 38vh;
  overflow: auto;
  display: none;
  padding: 10px;
  border: 1px solid #444;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.92);
  color: #ddd;
  font: 11px/1.5 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  backdrop-filter: blur(8px);
}

#console.visible {
  display: block;
}

@media (max-width: 480px) {
  #controls {
    right: 9px;
    bottom: 9px;
    gap: 6px;
  }

  button {
    padding: 8px 11px;
    font-size: 11px;
  }

  #console {
    left: 8px;
    bottom: 9px;
    width: calc(100% - 16px);
  }
}
</style>
</head>

<body>

<main id="screen">
  <div id="emulator"></div>

  <div id="overlay">
    <div id="spinner"></div>
    <h2 id="loadingTitle">Loading Super Mario Bros. 3</h2>
    <p id="loadingMessage">Preparing emulator...</p>
  </div>

  <pre id="console"></pre>

  <div id="controls">
    <button id="saveButton" type="button" disabled>
      Save to PC
    </button>

    <button id="loadButton" type="button" disabled>
      Load from PC
    </button>

    <button id="consoleToggle" type="button">
      Console
    </button>
  </div>

  <input
    id="stateFile"
    type="file"
    accept=".state,.bin,application/octet-stream"
    hidden
  >
</main>

<script>
(() => {
  "use strict";

  const BASE =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Emulator/Waffle/";

  const LOADER_URL = BASE + "loader.js";

  const ROM_URL =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Games/Super%20Mario%20Bros%203/Super%20Mario%20Bros.%203%20%28USA%29%20%28Rev%201%29.nes";

  const ROM_NAME = "Super Mario Bros. 3 (USA) (Rev 1).nes";

  const emulatorContainer = document.getElementById("emulator");
  const overlay = document.getElementById("overlay");
  const loadingTitle = document.getElementById("loadingTitle");
  const loadingMessage = document.getElementById("loadingMessage");
  const spinner = document.getElementById("spinner");
  const consoleBox = document.getElementById("console");

  const saveButton = document.getElementById("saveButton");
  const loadButton = document.getElementById("loadButton");
  const stateFile = document.getElementById("stateFile");

  let emu = null;
  let gameStarted = false;
  let savePending = false;

  function log(message) {
    const time = new Date().toLocaleTimeString();

    consoleBox.textContent +=
      "[" + time + "] " + message + "\n";

    consoleBox.scrollTop = consoleBox.scrollHeight;
    console.log("[SMB3 Launcher] " + message);
  }

  function showLoading(title, message) {
    loadingTitle.textContent = title;
    loadingMessage.textContent = message;
    overlay.classList.remove("hidden");
    spinner.style.display = "block";
  }

  function hideLoading() {
    overlay.classList.add("hidden");
  }

  function fail(message) {
    log("ERROR: " + message);

    showLoading("Unable to start", message);
    spinner.style.display = "none";

    consoleBox.classList.add("visible");
  }

  // Console toggle
  document.getElementById("consoleToggle").addEventListener("click", () => {
    consoleBox.classList.toggle("visible");
  });

  function enableControls() {
    saveButton.disabled = false;
    loadButton.disabled = false;
  }

  // Download save state
  function downloadState(data, name) {
    const blob = new Blob([data], {
      type: "application/octet-stream"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = (name || "Super-Mario-Bros-3") + ".state";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Save state
  saveButton.addEventListener("click", () => {
    if (!emu || !gameStarted || savePending) return;

    try {
      savePending = true;
      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      log("Creating save state...");

      emu.send("saveState");

    } catch (error) {
      savePending = false;
      saveButton.disabled = false;
      saveButton.textContent = "Save to PC";

      log("Save failed: " + error.message);
    }
  });

  // Load state
  loadButton.addEventListener("click", () => {
    if (!gameStarted) return;

    stateFile.click();
  });

  stateFile.addEventListener("change", async () => {
    const file = stateFile.files && stateFile.files[0];

    if (!file || !emu || !gameStarted) {
      stateFile.value = "";
      return;
    }

    try {
      loadButton.disabled = true;
      loadButton.textContent = "Loading...";

      log("Reading save state: " + file.name);

      const data = await file.arrayBuffer();

      emu.send("loadState", { data }, [data]);

      log("Save state sent to emulator.");

      loadButton.textContent = "Loaded!";

      setTimeout(() => {
        loadButton.textContent = "Load from PC";
      }, 2000);

    } catch (error) {
      log("Load failed: " + error.message);
      loadButton.textContent = "Load failed";

    } finally {
      loadButton.disabled = false;
      stateFile.value = "";
    }
  });

  // Check emulator core report
  async function checkCoreReport() {
    log("Checking FCEUMM core report...");

    const response = await fetch(
      BASE + "cores/reports/fceumm.json",
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "FCEUMM core report failed: HTTP " + response.status
      );
    }

    const reportText = await response.text();

    let report;

    try {
      report = JSON.parse(reportText);
    } catch {
      throw new Error(
        "The FCEUMM core report is not valid JSON."
      );
    }

    if (report.core !== "fceumm") {
      throw new Error(
        "Unexpected emulator core: " + report.core
      );
    }

    log("FCEUMM core report validated.");
  }

  // Capture errors from emulator iframe
  function attachFrameDiagnostics(frame) {
    if (!frame) return;

    function attach() {
      try {
        const frameWindow = frame.contentWindow;

        if (!frameWindow) return;

        frameWindow.addEventListener("error", event => {
          log(
            "IFRAME ERROR: " +
            (event.message || "Unknown iframe JavaScript error")
          );

          if (event.filename) {
            log("File: " + event.filename);
          }

          if (event.lineno) {
            log("Line: " + event.lineno);
          }

          if (event.error && event.error.stack) {
            log(event.error.stack);
          }
        });

        frameWindow.addEventListener(
          "unhandledrejection",
          event => {
            const reason = event.reason;

            log(
              "IFRAME PROMISE ERROR: " +
              (reason?.stack ||
               reason?.message ||
               String(reason))
            );
          }
        );

        log("Iframe diagnostics attached.");

      } catch (error) {
        log(
          "Could not attach iframe diagnostics: " +
          error.message
        );
      }
    }

    frame.addEventListener("load", attach);
    attach();
  }

  async function startLauncher() {
    try {
      // Check core files
      showLoading(
        "Loading Super Mario Bros. 3",
        "Checking emulator files..."
      );

      log("Checking FCEUMM core report...");

      await checkCoreReport();

      // Download Waffle loader
      showLoading(
        "Loading Super Mario Bros. 3",
        "Downloading emulator loader..."
      );

      log("Downloading emulator loader...");

      const loaderResponse = await fetch(LOADER_URL, {
        cache: "default"
      });

      if (!loaderResponse.ok) {
        throw new Error(
          "Loader download failed: HTTP " + loaderResponse.status
        );
      }

      const loaderCode = await loaderResponse.text();

      if (!loaderCode.includes("WafflesEmu")) {
        throw new Error("Invalid emulator loader.");
      }

      const script = document.createElement("script");
      script.textContent = loaderCode;
      document.head.appendChild(script);

      if (!window.WafflesEmu) {
        throw new Error(
          "Emulator loader did not initialize."
        );
      }

      log("Emulator loader ready.");

      // Open emulator
      showLoading(
        "Starting emulator",
        "Preparing game screen..."
      );

      emu = await window.WafflesEmu.open(BASE, {
        container: emulatorContainer,
        dataBase: BASE
      });

      attachFrameDiagnostics(emu.frame);

      // Listen for emulator events
      emu.on(message => {
        if (!message || !message.evt) return;

        log("Waffle event: " + message.evt);

        switch (message.evt) {
          case "hello":
            log("Emulator connected.");
            break;

          case "loading":
            log(message.msg || "Emulator is loading...");
            loadingMessage.textContent = "Loading game...";
            break;

          case "started":
            gameStarted = true;

            hideLoading();
            enableControls();

            log("Super Mario Bros. 3 started.");
            break;

          case "state":
            if (message.data) {
              downloadState(
                message.data,
                "Super-Mario-Bros-3"
              );

              log("Save state downloaded.");
            } else {
              log("Save state response contained no data.");
            }

            savePending = false;
            saveButton.disabled = false;
            saveButton.textContent = "Save to PC";
            break;

          case "error":
            log(
              "Emulator error: " +
              (message.msg || "Unknown error")
            );

            if (savePending) {
              savePending = false;
              saveButton.disabled = false;
              saveButton.textContent = "Save to PC";
            }

            if (!gameStarted) {
              fail(
                message.msg ||
                "The emulator reported an error."
              );
            }
            break;

          case "paused":
            log("Game paused.");
            break;

          case "playing":
            log("Game resumed.");
            break;

          case "exit":
            gameStarted = false;

            saveButton.disabled = true;
            loadButton.disabled = true;

            log("Emulator stopped.");
            break;
        }
      });

      // Wait for emulator handshake
      showLoading(
        "Starting emulator",
        "Waiting for emulator connection..."
      );

      await Promise.race([
        emu.ready,

        new Promise((_, reject) => {
          setTimeout(() => {
            reject(
              new Error("Emulator connection timed out.")
            );
          }, 45000);
        })
      ]);

      log("Emulator is ready.");

      // Download ROM
      showLoading(
        "Downloading Super Mario Bros. 3",
        "This may take a moment..."
      );

      log("Downloading Super Mario Bros. 3...");

      const romResponse = await fetch(ROM_URL, {
        cache: "default"
      });

      if (!romResponse.ok) {
        throw new Error(
          "ROM download failed: HTTP " + romResponse.status
        );
      }

      const romBuffer = await romResponse.arrayBuffer();

      if (romBuffer.byteLength < 16) {
        throw new Error(
          "ROM file is too small to be a valid NES ROM: " +
          romBuffer.byteLength +
          " bytes."
        );
      }

      // Validate NES header
      const romHeader = new Uint8Array(romBuffer, 0, 4);

      if (
        romHeader[0] !== 0x4E ||
        romHeader[1] !== 0x45 ||
        romHeader[2] !== 0x53 ||
        romHeader[3] !== 0x1A
      ) {
        throw new Error(
          "Downloaded file does not have a valid NES ROM header."
        );
      }

      log(
        "ROM downloaded: " +
        (romBuffer.byteLength / 1048576).toFixed(2) +
        " MB."
      );

      log("NES ROM header validated.");

      // Launch game
      showLoading(
        "Starting Super Mario Bros. 3",
        "Loading game..."
      );

      const romFile = new File(
        [romBuffer],
        ROM_NAME,
        {
          type: "application/octet-stream"
        }
      );

      await emu.load(romFile, {
        system: "nes",
        core: "fceumm"
      });

      log("ROM sent to emulator.");

      setTimeout(() => {
        if (!gameStarted) {
          log(
            "Still waiting for the emulator to report that the game started."
          );
        }
      }, 30000);

    } catch (error) {
      fail(
        error && error.message
          ? error.message
          : String(error)
      );
    }
  }

  startLauncher();
})();
</script>

</body>
</html>
