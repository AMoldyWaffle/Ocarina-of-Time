<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight: Silksong</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    #download-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #10141d;
      overflow: auto;
    }

    #download-panel {
      width: min(760px, 100%);
      padding: 22px;
      background: #171e29;
      border: 1px solid #344154;
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    #subtitle {
      margin: 0 0 20px;
      color: #aab6c7;
      font-size: 13px;
    }

    #loading-text {
      margin-bottom: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border-radius: 20px;
      background: #303b4b;
    }

    #download-progress {
      width: 0%;
      height: 100%;
      background: #4b91e2;
      transition: width .15s linear;
    }

    #progress-details {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      color: #aab6c7;
      font-size: 12px;
    }

    #download-list {
      display: grid;
      gap: 5px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 16px;
    }

    .download-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 9px;
      background: #10151e;
      border: 1px solid #283444;
      border-radius: 5px;
      font-size: 12px;
    }

    .filename {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state {
      flex-shrink: 0;
      color: #aab6c7;
    }

    .done .state { color: #83d49b; }
    .failed .state { color: #ff8585; }

    #download-console {
      width: 100%;
      max-height: 150px;
      overflow: auto;
      margin-top: 15px;
      padding: 10px;
      background: #080b10;
      border: 1px solid #303b4b;
      border-radius: 6px;
      color: #c7d3e2;
      font: 11px/1.5 Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #unity-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
      outline: none;
    }

    #game-toolbar {
      display: none;
      position: fixed;
      z-index: 20;
      top: 10px;
      right: 10px;
      align-items: center;
      gap: 8px;
      padding: 7px;
      background: rgba(12, 16, 23, .9);
      border: 1px solid #465164;
      border-radius: 8px;
    }

    button {
      padding: 8px 12px;
      color: white;
      background: #26364b;
      border: 1px solid #52647c;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #355477; }

    #save-status {
      max-width: 200px;
      color: #d4deea;
      font-size: 12px;
    }

    #unity-loading-bar {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(300px, 70%);
      transform: translate(-50%, -50%);
    }

    #unity-progress-empty {
      height: 10px;
      overflow: hidden;
      border-radius: 20px;
      background: #303b4b;
    }

    #unity-progress-full {
      width: 0%;
      height: 100%;
      background: #4b91e2;
    }

    #unity-warning {
      position: absolute;
      z-index: 5;
      top: 10px;
      left: 10px;
      right: 10px;
    }
  </style>
</head>

<body>

  <section id="download-screen">
    <div id="download-panel">
      <h1>Hollow Knight: Silksong</h1>
      <p id="subtitle">Preparing game files...</p>

      <div id="loading-text">Checking files...</div>

      <div class="progress-track">
        <div id="download-progress"></div>
      </div>

      <div id="progress-details">
        <span id="progress-count">0 / 0 files</span>
        <span id="progress-size">0 MB</span>
      </div>

      <div id="download-list"></div>
      <div id="download-console">[launcher] Diagnostics will appear here.</div>
    </div>
  </section>

  <div id="unity-container">
    <div id="game-toolbar">
      <button id="save-game">Save</button>
      <button id="load-game">Load</button>
      <button id="fullscreen-game">Fullscreen</button>
      <span id="save-status"></span>
      <input id="save-file" type="file" accept=".silksong-save,.json" hidden>
    </div>

    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-progress-empty">
        <div id="unity-progress-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

<script>
(() => {
  "use strict";

  const BASE_URL =
    "https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/";

  const CACHE_NAME = "silksong-game-cache-v6";

  /*
    IMPORTANT:
    The game repository contains the individual Unity bundles as well as
    the large split ZIP archive.

    This launcher now downloads the individual bundles only when Unity
    actually requests them. It no longer downloads the 2.08 GB ZIP archive.
  */

  const CORE_FILES = [
    "Build/w-pt.data.unityweb",
    "Build/w-pt.framework.js.unityweb",
    "Build/w-pt.loader.js",
    "Build/w-pt.wasm.unityweb",

    "StreamingAssets/aa/AddressablesLink/link.xml",
    "StreamingAssets/aa/catalog.bin",
    "StreamingAssets/aa/catalog.hash",
    "StreamingAssets/aa/settings.json",

    "TemplateData/favicon.ico",
    "TemplateData/icons/unity-logo-dark.png",
    "TemplateData/icons/unity-logo-light.png",
    "TemplateData/progress-bar-empty-dark.png",
    "TemplateData/progress-bar-empty-light.png",
    "TemplateData/progress-bar-full-dark.png",
    "TemplateData/progress-bar-full-light.png",
    "TemplateData/style.css",
    "TemplateData/unity-logo-dark.png",
    "TemplateData/unity-logo-light.png",
    "TemplateData/webmemd-icon.png"
  ];

  const FALLBACK_BASES = [
    BASE_URL,
    "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/",
    "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/"
  ];

  const $ = id => document.getElementById(id);

  const downloadScreen = $("download-screen");
  const loadingText = $("loading-text");
  const progressBar = $("download-progress");
  const progressCount = $("progress-count");
  const progressSize = $("progress-size");
  const downloadList = $("download-list");
  const downloadConsole = $("download-console");

  let completedFiles = 0;
  let downloadedBytes = 0;
  let totalFiles = CORE_FILES.length;

  const logs = [];

  function log(message, detail = "") {
    const line =
      `[${new Date().toLocaleTimeString()}] ${message}` +
      (detail ? ` — ${detail}` : "");

    logs.push(line);

    if (logs.length > 180) logs.shift();

    downloadConsole.textContent = logs.join("\n");
    downloadConsole.scrollTop = downloadConsole.scrollHeight;

    console.log(line);
  }

  window.addEventListener("error", event => {
    log("Browser error", event.message || "Unknown error");
  });

  window.addEventListener("unhandledrejection", event => {
    log(
      "Unhandled rejection",
      event.reason?.message || String(event.reason)
    );
  });

  function bytesText(bytes) {
    return `${(bytes / 1048576).toFixed(1)} MB`;
  }

  function updateProgress() {
    const percent = totalFiles
      ? completedFiles / totalFiles * 100
      : 0;

    progressBar.style.width = `${percent}%`;
    progressCount.textContent = `${completedFiles} / ${totalFiles} files`;
    progressSize.textContent = bytesText(downloadedBytes);
  }

  function createRow(path) {
    const row = document.createElement("div");
    row.className = "download-item";

    const filename = document.createElement("span");
    filename.className = "filename";
    filename.textContent = path;

    const state = document.createElement("span");
    state.className = "state";
    state.textContent = "Waiting";

    row.append(filename, state);
    downloadList.appendChild(row);

    return {
      start() {
        state.textContent = "Downloading";
      },

      retry(message) {
        state.textContent = message;
      },

      done() {
        state.textContent = "Complete";
        row.classList.add("done");
      },

      failed(message) {
        state.textContent = "Failed";
        row.classList.add("failed");
        row.title = message;
      }
    };
  }

  function encodePath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  function getUrl(base, path) {
    return base + encodePath(path);
  }

  async function fetchWithFallback(path) {
    const errors = [];

    for (let attempt = 1; attempt <= 3; attempt++) {
      for (let source = 0; source < FALLBACK_BASES.length; source++) {
        const url = getUrl(FALLBACK_BASES[source], path);

        try {
          const response = await fetch(url, {
            cache: "no-store",
            credentials: "omit",
            mode: "cors"
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          return response;
        } catch (error) {
          const message =
            `${new URL(url).hostname}: ${error.message}`;

          errors.push(message);
          log(`Source failed: ${path}`, message);
        }
      }

      if (attempt < 3) {
        await new Promise(resolve =>
          setTimeout(resolve, attempt * 700)
        );
      }
    }

    throw new Error(errors.slice(-6).join("; "));
  }

  async function downloadCoreFile(path, cache, row) {
    const cacheKey = new Request(getUrl(BASE_URL, path));

    const cached = await cache.match(cacheKey);

    if (cached) {
      row.done();
      completedFiles++;
      updateProgress();
      return;
    }

    row.start();

    const response = await fetchWithFallback(path);

    /*
      Do not compare Content-Length against the received byte count.
      Some CDN responses omit or alter that header. The browser's
      completed response body is used instead.
    */
    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("The server returned an empty file.");
    }

    await cache.put(
      cacheKey,
      new Response(blob, {
        headers: {
          "Content-Type": blob.type || "application/octet-stream"
        }
      })
    );

    downloadedBytes += blob.size;
    completedFiles++;

    row.done();
    updateProgress();

    log(`Downloaded ${path}`, bytesText(blob.size));
  }

  async function downloadCoreFiles() {
    const cache = await caches.open(CACHE_NAME);
    const rows = new Map();

    CORE_FILES.forEach(path => {
      rows.set(path, createRow(path));
    });

    let nextIndex = 0;
    const failed = [];

    /*
      Four concurrent downloads provide a balance between speed and
      memory use. The previous version used only one worker.
    */
    const workerCount = 4;

    async function worker() {
      while (true) {
        const index = nextIndex++;

        if (index >= CORE_FILES.length) return;

        const path = CORE_FILES[index];

        loadingText.textContent = `Downloading ${path}`;

        try {
          await downloadCoreFile(
            path,
            cache,
            rows.get(path)
          );
        } catch (error) {
          rows.get(path).failed(error.message);
          failed.push({ path, error });

          log(`DOWNLOAD FAILED: ${path}`, error.message);
        }
      }
    }

    await Promise.all(
      Array.from({ length: workerCount }, () => worker())
    );

    if (failed.length) {
      throw new Error(
        `${failed.length} core file(s) failed. ` +
        `First failure: ${failed[0].path}: ${failed[0].error.message}`
      );
    }

    log("Core downloads complete.");
  }

  /*
    Lazy asset loader:
    Unity asks for bundles as it needs them. The launcher fetches each
    requested bundle directly from the raw repository, then caches it.

    This replaces the old ZIP download and extraction process.
  */

  const originalFetch = window.fetch.bind(window);

  function isGameAssetUrl(url) {
    return (
      url.startsWith(BASE_URL) ||
      url.startsWith(
        "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/"
      ) ||
      url.startsWith(
        "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/"
      )
    );
  }

  function getRelativePath(url) {
    const parsed = new URL(url);
    const path = parsed.pathname;

    const marker = "/Silk-Song/main/";
    const index = path.indexOf(marker);

    if (index === -1) return null;

    return decodeURIComponent(path.slice(index + marker.length));
  }

  const activeAssetRequests = new Map();

  async function fetchGameAsset(url, options) {
    const relativePath = getRelativePath(url);

    if (!relativePath) {
      return originalFetch(url, options);
    }

    const cache = await caches.open(CACHE_NAME);
    const cacheKey = new Request(getUrl(BASE_URL, relativePath));

    const cached = await cache.match(cacheKey);

    if (cached) {
      return cached;
    }

    /*
      Prevent duplicate requests for the same bundle if Unity requests
      it more than once before the first download finishes.
    */
    if (activeAssetRequests.has(relativePath)) {
      const response = await activeAssetRequests.get(relativePath);
      return response.clone();
    }

    const requestPromise = (async () => {
      const response = await fetchWithFallback(relativePath);
      const blob = await response.blob();

      if (!blob.size) {
        throw new Error("Empty asset response.");
      }

      const result = new Response(blob, {
        headers: {
          "Content-Type": blob.type || "application/octet-stream"
        }
      });

      /*
        Cache writes are best-effort. A full browser cache should not
        prevent Unity from receiving the downloaded asset.
      */
      try {
        await cache.put(cacheKey, result.clone());
      } catch (error) {
        log("Could not cache asset", `${relativePath}: ${error.message}`);
      }

      log("Loaded Unity asset", `${relativePath} (${bytesText(blob.size)})`);

      return result;
    })();

    activeAssetRequests.set(relativePath, requestPromise);

    try {
      const response = await requestPromise;
      return response.clone();
    } finally {
      activeAssetRequests.delete(relativePath);
    }
  }

  window.fetch = function(resource, options) {
    const url =
      typeof resource === "string"
        ? new URL(resource, document.baseURI).href
        : resource.url;

    if (isGameAssetUrl(url)) {
      return fetchGameAsset(url, options);
    }

    return originalFetch(resource, options);
  };

  // Save / Load support

  const SAVE_FORMAT = "silksong-browser-save";
  const SAVE_VERSION = 1;

  const saveStatus = $("save-status");
  const saveInput = $("save-file");

  function isGameDatabase(name) {
    return /unity|em_fs_|idbfs/i.test(name || "");
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;

    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode(
        ...bytes.subarray(i, i + chunk)
      );
    }

    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
  }

  async function packValue(value) {
    if (value instanceof ArrayBuffer) {
      return {
        __type: "ArrayBuffer",
        data: bytesToBase64(new Uint8Array(value))
      };
    }

    if (ArrayBuffer.isView(value)) {
      return {
        __type: "TypedArray",
        name: value.constructor.name,
        data: bytesToBase64(
          new Uint8Array(
            value.buffer,
            value.byteOffset,
            value.byteLength
          )
        )
      };
    }

    if (value instanceof Blob) {
      return {
        __type: "Blob",
        mime: value.type,
        data: bytesToBase64(
          new Uint8Array(await value.arrayBuffer())
        )
      };
    }

    if (value instanceof Date) {
      return {
        __type: "Date",
        data: value.toISOString()
      };
    }

    if (Array.isArray(value)) {
      return Promise.all(value.map(packValue));
    }

    if (value && typeof value === "object") {
      const result = {};

      for (const [key, item] of Object.entries(value)) {
        result[key] = await packValue(item);
      }

      return result;
    }

    return value;
  }

  function unpackValue(value) {
    if (Array.isArray(value)) {
      return value.map(unpackValue);
    }

    if (value && typeof value === "object") {
      if (value.__type === "ArrayBuffer") {
        return base64ToBytes(value.data).buffer;
      }

      if (value.__type === "TypedArray") {
        const bytes = base64ToBytes(value.data);
        const copy = bytes.buffer.slice(
          bytes.byteOffset,
          bytes.byteOffset + bytes.byteLength
        );

        const constructors = {
          Uint8Array,
          Uint8ClampedArray,
          Int8Array,
          Uint16Array,
          Int16Array,
          Uint32Array,
          Int32Array,
          Float32Array,
          Float64Array,
          BigInt64Array,
          BigUint64Array,
          DataView
        };

        const Ctor = constructors[value.name];

        if (!Ctor) {
          throw new Error("Unsupported saved data type: " + value.name);
        }

        return value.name === "DataView"
          ? new DataView(copy)
          : new Ctor(copy);
      }

      if (value.__type === "Blob") {
        return new Blob(
          [base64ToBytes(value.data)],
          { type: value.mime || "" }
        );
      }

      if (value.__type === "Date") {
        return new Date(value.data);
      }

      const result = {};

      for (const [key, item] of Object.entries(value)) {
        result[key] = unpackValue(item);
      }

      return result;
    }

    return value;
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("IndexedDB request failed")
      );
    });
  }

  function openDatabase(name) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(name);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("Could not open database")
      );
      request.onblocked = () => reject(
        new Error("Database is busy. Close other game tabs.")
      );
    });
  }

  async function readStore(db, storeName) {
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);

    const [keys, values] = await Promise.all([
      requestResult(store.getAllKeys()),
      requestResult(store.getAll())
    ]);

    const rows = [];

    for (let i = 0; i < values.length; i++) {
      rows.push({
        key: await packValue(keys[i]),
        value: await packValue(values[i])
      });
    }

    return rows;
  }

  async function exportGameSave() {
    if (!indexedDB.databases) {
      throw new Error("This browser does not support database backups.");
    }

    saveStatus.textContent = "Preparing save...";

    const listed = (await indexedDB.databases()).filter(
      info => info.name && isGameDatabase(info.name)
    );

    if (!listed.length) {
      throw new Error(
        "No Unity save database found. Try saving in-game first."
      );
    }

    const databases = [];

    for (const info of listed) {
      saveStatus.textContent = "Reading " + info.name;

      const db = await openDatabase(info.name);
      const stores = [];

      for (const storeName of Array.from(db.objectStoreNames)) {
        const store = db.transaction(
          storeName,
          "readonly"
        ).objectStore(storeName);

        const indexes = Array.from(store.indexNames).map(name => {
          const index = store.index(name);

          return {
            name: index.name,
            keyPath: index.keyPath,
            unique: index.unique,
            multiEntry: index.multiEntry
          };
        });

        stores.push({
          name: store.name,
          keyPath: store.keyPath,
          autoIncrement: store.autoIncrement,
          indexes,
          rows: await readStore(db, storeName)
        });
      }

      databases.push({
        name: db.name,
        version: db.version,
        stores
      });

      db.close();
    }

    const save = {
      format: SAVE_FORMAT,
      version: SAVE_VERSION,
      game: "Hollow Knight: Silksong",
      createdAt: new Date().toISOString(),
      databases
    };

    const blob = new Blob(
      [JSON.stringify(save)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download =
      "silksong-save-" +
      new Date().toISOString().replace(/[:.]/g, "-") +
      ".silksong-save";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

    saveStatus.textContent = "Save downloaded.";
  }

  function createDatabaseFromSave(definition) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(
        definition.name,
        definition.version || 1
      );

      request.onupgradeneeded = () => {
        const db = request.result;

        for (const storeDef of definition.stores) {
          if (db.objectStoreNames.contains(storeDef.name)) continue;

          const store = db.createObjectStore(storeDef.name, {
            keyPath: storeDef.keyPath,
            autoIncrement: storeDef.autoIncrement
          });

          for (const index of storeDef.indexes || []) {
            store.createIndex(
              index.name,
              index.keyPath,
              {
                unique: index.unique,
                multiEntry: index.multiEntry
              }
            );
          }
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("Could not create database")
      );
      request.onblocked = () => reject(
        new Error("Close other game tabs before loading.")
      );
    });
  }

  async function importGameSave(file) {
    if (!file) return;

    saveStatus.textContent = "Reading save file...";

    const save = JSON.parse(await file.text());

    if (
      save.format !== SAVE_FORMAT ||
      save.version !== SAVE_VERSION ||
      !Array.isArray(save.databases)
    ) {
      throw new Error("This is not a supported Silksong save file.");
    }

    for (const definition of save.databases) {
      if (!isGameDatabase(definition.name)) {
        throw new Error("Unexpected database in save file.");
      }

      saveStatus.textContent = "Restoring " + definition.name;

      const db = await createDatabaseFromSave(definition);

      for (const storeDef of definition.stores) {
        if (!db.objectStoreNames.contains(storeDef.name)) {
          db.close();

          throw new Error(
            "Save database layout does not match this game version."
          );
        }

        const tx = db.transaction(storeDef.name, "readwrite");
        const store = tx.objectStore(storeDef.name);

        store.clear();

        for (const row of storeDef.rows) {
          const value = unpackValue(row.value);

          if (store.keyPath === null) {
            store.put(value, unpackValue(row.key));
          } else {
            store.put(value);
          }
        }

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(
            tx.error || new Error("Could not restore save data")
          );
          tx.onabort = () => reject(
            tx.error || new Error("Save restore was cancelled")
          );
        });
      }

      db.close();
    }

    saveStatus.textContent = "Save restored. Reloading...";
    setTimeout(() => location.reload(), 700);
  }

  $("save-game").addEventListener("click", () => {
    exportGameSave().catch(error => {
      console.error(error);
      saveStatus.textContent = "Save failed: " + error.message;
    });
  });

  $("load-game").addEventListener("click", () => {
    saveInput.click();
  });

  saveInput.addEventListener("change", () => {
    const file = saveInput.files?.[0];

    importGameSave(file)
      .catch(error => {
        console.error(error);
        saveStatus.textContent = "Load failed: " + error.message;
      })
      .finally(() => {
        saveInput.value = "";
      });
  });

  $("fullscreen-game").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await $("unity-container").requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      saveStatus.textContent = error.message;
    }
  });

  document.addEventListener("fullscreenchange", () => {
    $("fullscreen-game").textContent =
      document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

  // Start Unity

  function startUnity() {
    downloadScreen.style.display = "none";

    const container = $("unity-container");
    const canvas = $("unity-canvas");
    const loadingBar = $("unity-loading-bar");
    const unityProgress = $("unity-progress-full");
    const warning = $("unity-warning");

    function showWarning(message, type) {
      const div = document.createElement("div");
      div.textContent = message;
      div.style.cssText = "padding:10px;margin:4px 0;";

      div.style.background =
        type === "error" ? "#a51d2d" : "#80651d";

      warning.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    const config = {
      dataUrl: "Build/w-pt.data.unityweb",
      frameworkUrl: "Build/w-pt.framework.js.unityweb",
      codeUrl: "Build/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: showWarning
    };

    container.style.display = "block";
    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = BASE_URL + "Build/w-pt.loader.js";

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        warning.textContent = "Unity loader failed to initialize.";
        return;
      }

      createUnityInstance(canvas, config, progress => {
        unityProgress.style.width = `${progress * 100}%`;
      }).then(() => {
        loadingBar.remove();
        $("game-toolbar").style.display = "flex";
      }).catch(error => {
        console.error(error);
        warning.textContent =
          "UNITY ERROR: " + (error.message || error);
      });
    };

    script.onerror = () => {
      warning.textContent = "Could not load the Unity loader.";
    };

    document.body.appendChild(script);
  }

  // Initial startup

  (async () => {
    try {
      loadingText.textContent = "Checking game files...";

      await downloadCoreFiles();

      loadingText.textContent =
        "Core files ready. Starting Hollow Knight: Silksong...";

      log("Starting Unity. Additional assets will load when needed.");

      startUnity();
    } catch (error) {
      console.error(error);

      log("LAUNCHER ERROR", error.message || error);

      loadingText.textContent =
        "ERROR: " + (error.message || error);
    }
  })();

})();
</script>

</body>
