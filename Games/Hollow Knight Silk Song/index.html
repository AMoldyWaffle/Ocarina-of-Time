<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight: Silksong</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    :root {
      color-scheme: dark;
      --panel: #151922;
      --border: #303846;
      --text: #f1f4f8;
      --muted: #aab4c2;
      --accent: #4b91e2;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    #download-screen {
      position: relative;
      z-index: 30;
      width: min(760px, calc(100% - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-sizing: border-box;
      margin: 28px auto;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    #download-title {
      margin: 0 0 7px;
      font-size: 25px;
    }

    #download-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    #loading-text {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      background: #303846;
      border-radius: 99px;
    }

    #download-progress,
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    #progress-details {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #download-list {
      display: grid;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
      margin-top: 18px;
      padding-right: 5px;
    }

    .download-item {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 7px 9px;
      background: #0e131b;
      border: 1px solid #252e3a;
      border-radius: 6px;
      font-size: 12px;
    }

    .download-item .state {
      flex: 0 0 72px;
      color: var(--muted);
    }

    .download-item.done .state { color: #80c99a; }
    .download-item.failed .state { color: #ff8585; }

    .download-item .filename {
      overflow: hidden;
      color: #dce4ee;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #download-console {
      margin-top: 16px;
      padding: 10px;
      background: #080b10;
      border: 1px solid #303846;
      border-radius: 7px;
      color: #c7d3e2;
      font: 11px/1.45 Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 150px;
      overflow: auto;
    }

    #unity-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
      outline: none;
    }

    #unity-container:fullscreen,
    #unity-container:fullscreen #unity-canvas {
      width: 100vw;
      height: 100vh;
    }

    #game-toolbar {
      display: none;
      position: fixed;
      z-index: 20;
      top: 10px;
      right: 10px;
      gap: 8px;
      align-items: center;
      padding: 7px;
      background: rgba(12, 16, 23, .88);
      border: 1px solid #465164;
      border-radius: 9px;
    }

    #game-toolbar button {
      appearance: none;
      border: 1px solid #52647c;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      background: #26364b;
      font: 600 13px Arial, sans-serif;
      cursor: pointer;
    }

    #game-toolbar button:hover { background: #355477; }
    #save-status { color: #d4deea; font-size: 12px; max-width: 210px; }

    #unity-loading-bar {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(300px, 70%);
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      height: 45px;
      margin-bottom: 12px;
      background: url("TemplateData/unity-logo-light.png") center / contain no-repeat;
    }

    #unity-progress-bar-empty {
      height: 10px;
      overflow: hidden;
      background: #303846;
      border-radius: 99px;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      #download-screen { margin: 12px auto; padding: 16px; }
      #download-title { font-size: 21px; }
    }
  </style>
</head>

<body>
  <section id="download-screen">
    <h1 id="download-title">Hollow Knight: Silksong</h1>
    <p id="download-subtitle">Preparing game files...</p>

    <div id="loading-text">Preparing download list...</div>

    <div class="progress-track">
      <div id="download-progress"></div>
    </div>

    <div id="progress-details">
      <span id="progress-count">0 / 0 files</span>
      <span id="progress-size">0 MB</span>
    </div>

    <div id="download-list"></div>
    <div id="download-console" role="log" aria-live="polite">[launcher] Download diagnostics will appear here.</div>
  </section>

  <div id="unity-container">
    <div id="game-toolbar">
      <button id="save-game" type="button">Save</button>
      <button id="load-game" type="button">Load</button>
      <button id="fullscreen-game" type="button">Fullscreen</button>
      <span id="save-status" aria-live="polite"></span>
      <input id="save-file" type="file" accept=".silksong-save,.json,application/json" hidden>
    </div>

    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>
  </div>

<script>
(() => {
  "use strict";

  const BASE_URL = "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/";
  const CACHE_NAME = "silksong-game-cache-v5";

  // Only the support files are downloaded individually.
  // The WebGL asset bundles are contained in the split ZIP archive.
  const GAME_FILES = [
    "Build/w-pt.data.unityweb",
    "Build/w-pt.framework.js.unityweb",
    "Build/w-pt.loader.js",
    "Build/w-pt.wasm.unityweb",
    "StreamingAssets/VideoClip/Act_03_Intro.webm",
    "StreamingAssets/VideoClip/Bellbeast_Travel_Children.webm",
    "StreamingAssets/VideoClip/Bellbeast_Travel_Children_30.webm",
    "StreamingAssets/VideoClip/Bellbeast_Travel_Normal.webm",
    "StreamingAssets/VideoClip/Bellbeast_Travel_Normal_30.webm",
    "StreamingAssets/VideoClip/Bellhart_Intro.webm",
    "StreamingAssets/VideoClip/City_Reveal.webm",
    "StreamingAssets/VideoClip/City_Reveal_Inner.webm",
    "StreamingAssets/VideoClip/Diving_Bell.webm",
    "StreamingAssets/VideoClip/Doctor_Cure.webm",
    "StreamingAssets/VideoClip/Ending_A.webm",
    "StreamingAssets/VideoClip/Ending_B.webm",
    "StreamingAssets/VideoClip/Ending_C.webm",
    "StreamingAssets/VideoClip/Ending_D.webm",
    "StreamingAssets/VideoClip/Ending_E.webm",
    "StreamingAssets/VideoClip/Farsight.webm",
    "StreamingAssets/VideoClip/Intro_Cinematic.webm",
    "StreamingAssets/VideoClip/Lace_Battle.webm",
    "StreamingAssets/VideoClip/Last_Dive.webm",
    "StreamingAssets/VideoClip/Mr_Mushroom.webm",
    "StreamingAssets/VideoClip/Pinstress_Battle.webm",
    "StreamingAssets/VideoClip/Plinney_Sharpen.webm",
    "StreamingAssets/VideoClip/Plinney_Sharpen_Oil.webm",
    "StreamingAssets/VideoClip/Red_Memory_Ritual.webm",
    "StreamingAssets/VideoClip/Seamstress_Flash.webm",
    "StreamingAssets/VideoClip/Slab_Cinematic.webm",
    "StreamingAssets/aa/AddressablesLink/link.xml",
    "StreamingAssets/aa/catalog.bin",
    "StreamingAssets/aa/catalog.hash",
    "StreamingAssets/aa/settings.json",
    "TemplateData/favicon.ico",
    "TemplateData/icons/unity-logo-dark.png",
    "TemplateData/icons/unity-logo-light.png",
    "TemplateData/progress-bar-empty-dark.png",
    "TemplateData/progress-bar-empty-light.png",
    "TemplateData/progress-bar-full-dark.png",
    "TemplateData/progress-bar-full-light.png",
    "TemplateData/style.css",
    "TemplateData/unity-logo-dark.png",
    "TemplateData/unity-logo-light.png",
    "TemplateData/webmemd-icon.png"
  ];

  const ZIP_PARTS = Array.from(
    { length: 100 },
    (_, index) => `StreamingAssets/aa/WebGL.zip.part${index + 1}`
  );

  const loadingText = document.getElementById("loading-text");
  const progressBar = document.getElementById("download-progress");
  const progressCount = document.getElementById("progress-count");
  const progressSize = document.getElementById("progress-size");
  const downloadList = document.getElementById("download-list");
  const downloadScreen = document.getElementById("download-screen");
  const downloadConsole = document.getElementById("download-console");

  const consoleLines = [];
  const originalConsole = {
    log: console.log.bind(console),
    warn: console.warn.bind(console),
    error: console.error.bind(console)
  };

  function logDownload(message, detail) {
    const line =
      `[${new Date().toLocaleTimeString()}] ${message}` +
      (detail ? " — " + detail : "");

    consoleLines.push(line);

    if (consoleLines.length > 180) {
      consoleLines.shift();
    }

    downloadConsole.textContent = consoleLines.join("\n");
    downloadConsole.scrollTop = downloadConsole.scrollHeight;

    originalConsole.log(line);
  }

  window.addEventListener("error", event => {
    logDownload("Browser error", event.message || event.error || "Unknown error");
  });

  window.addEventListener("unhandledrejection", event => {
    logDownload(
      "Unhandled promise rejection",
      event.reason?.message || event.reason || "Unknown rejection"
    );
  });

  const originalFetch = window.fetch.bind(window);

  function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 MB";
    return `${(bytes / 1048576).toFixed(1)} MB`;
  }

  function updateOverall(done, total, bytes) {
    const percent = total ? (done / total) * 100 : 0;
    progressBar.style.width = `${percent}%`;
    progressCount.textContent = `${done} / ${total} files`;
    progressSize.textContent = formatBytes(bytes);
  }

  function makeFileRow(path) {
    const row = document.createElement("div");
    row.className = "download-item";

    const state = document.createElement("span");
    state.className = "state";
    state.textContent = "Waiting";

    const name = document.createElement("span");
    name.className = "filename";
    name.textContent = path;

    row.append(state, name);
    downloadList.appendChild(row);

    return {
      start() {
        state.textContent = "Downloading";
        row.classList.remove("done", "failed");
      },

      done() {
        state.textContent = "Complete";
        row.classList.add("done");
      },

      retry(message) {
        state.textContent = message;
        row.classList.remove("done", "failed");
      },

      failed(message) {
        state.textContent = "Failed";
        row.classList.add("failed");
        row.title = message || "Download failed";
      }
    };
  }

  function encodedPath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  function sourceCandidates(path) {
    const file = encodedPath(path);

    return [
      BASE_URL + file,
      "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/" + file,
      "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/" + file,
      "https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/" + file
    ];
  }

  async function fetchWithFallback(path, row) {
    const candidates = sourceCandidates(path);
    const errors = [];

    for (let attempt = 1; attempt <= 3; attempt++) {
      for (let i = 0; i < candidates.length; i++) {
        if (attempt > 1 || i > 0) {
          row.retry(`Retry ${attempt}/3, source ${i + 1}/${candidates.length}`);
        }

        try {
          const response = await originalFetch(candidates[i], {
            cache: "no-store",
            credentials: "omit",
            mode: "cors"
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          return response;
        } catch (error) {
          const message = `${new URL(candidates[i]).hostname}: ${error.message}`;
          errors.push(message);
          logDownload(`Source failed for ${path}`, message);
        }
      }

      if (attempt < 3) {
        await new Promise(resolve => setTimeout(resolve, attempt * 1200));
      }
    }

    throw new Error(
      `All sources failed after 3 attempts (${errors.slice(-8).join("; ")})`
    );
  }

  async function downloadOne(path, cache, row, progress) {
    const url = BASE_URL + encodedPath(path);
    const cacheKey = new Request(url);

    const cached = await cache.match(cacheKey);

    if (cached) {
      row.done();
      progress.complete();
      return;
    }

    row.start();

    const response = await fetchWithFallback(path, row);
    const expectedLength = Number(response.headers.get("content-length")) || 0;

    // Let the browser manage the response buffer instead of keeping
    // a separate JavaScript array of every streamed chunk.
    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("The server returned an empty file.");
    }

    if (expectedLength && blob.size !== expectedLength) {
      throw new Error(
        `Incomplete download: received ${blob.size.toLocaleString()} of ` +
        `${expectedLength.toLocaleString()} bytes.`
      );
    }

    progress.add(blob.size);

    logDownload(
      `Downloaded ${path}`,
      `${formatBytes(blob.size)}${expectedLength ? ` / ${formatBytes(expectedLength)}` : ""}`
    );

    await cache.put(cacheKey, new Response(blob, {
      headers: {
        "Content-Type": blob.type || "application/octet-stream"
      }
    }));

    row.done();
    progress.complete();
  }

  async function loadJSZip() {
    if (window.JSZip) return window.JSZip;

    const sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
      "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
    ];

    for (const src of sources) {
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(
            new Error("Could not load ZIP extractor: " + src)
          );
          document.head.appendChild(script);
        });

        if (window.JSZip) return window.JSZip;
      } catch (error) {
        logDownload("ZIP library source failed", error.message);
      }
    }

    throw new Error(
      "Could not load the ZIP extractor. Check whether the script host is blocked."
    );
  }

  async function extractWebGLArchive() {
    const cache = await caches.open(CACHE_NAME);
    const partBlobs = [];
    let totalPartBytes = 0;

    loadingText.textContent = "Checking downloaded ZIP parts...";
    logDownload("Checking downloaded ZIP parts", `${ZIP_PARTS.length} parts expected`);

    for (let i = 0; i < ZIP_PARTS.length; i++) {
      const url = BASE_URL + encodedPath(ZIP_PARTS[i]);
      const response = await cache.match(new Request(url));

      if (!response) {
        throw new Error(
          `Missing ZIP part ${i + 1} of ${ZIP_PARTS.length}. ` +
          "Reload the page to retry the download."
        );
      }

      const partBlob = await response.blob();

      if (!partBlob.size) {
        throw new Error(`ZIP part ${i + 1} is empty.`);
      }

      totalPartBytes += partBlob.size;
      partBlobs.push(partBlob);

      if ((i + 1) % 5 === 0 || i + 1 === ZIP_PARTS.length) {
        loadingText.textContent =
          `Preparing archive... (${i + 1}/${ZIP_PARTS.length} parts)`;

        logDownload(
          `ZIP parts checked: ${i + 1}/${ZIP_PARTS.length}`,
          formatBytes(totalPartBytes)
        );
      }
    }

    loadingText.textContent = "Loading ZIP extractor...";
    const JSZip = await loadJSZip();

    logDownload("Combining ZIP parts", `Total ${formatBytes(totalPartBytes)}`);

    // Blob concatenation references the downloaded blobs rather than
    // copying every part into another large JavaScript byte array.
    const archiveBlob = new Blob(partBlobs, { type: "application/zip" });
    partBlobs.length = 0;

    loadingText.textContent = "Opening game archive...";
    logDownload("Opening combined ZIP", "ZIP processing can temporarily use substantial memory.");

    let zip;

    try {
      zip = await JSZip.loadAsync(archiveBlob, {
        checkCRC32: false,
        createFolders: false
      });
    } catch (error) {
      logDownload("ZIP extraction failed", error.message);

      throw new Error(
        `ZIP is incomplete or corrupt: ${error.message}. ` +
        "The downloaded parts may have been truncated; reload to retry."
      );
    }

    const files = Object.values(zip.files).filter(file => !file.dir);

    if (!files.length) {
      throw new Error("The downloaded archive contains no game files.");
    }

    let processed = 0;

    // Extract one file at a time to limit simultaneous decompression memory.
    const batchSize = 1;

    for (let i = 0; i < files.length; i += batchSize) {
      const batch = files.slice(i, i + batchSize);

      await Promise.all(batch.map(async file => {
        const blob = await file.async("blob");
        const cleanName = file.name.replace(/^\.\//, "");
        const basename = cleanName.split("/").pop();

        const response = new Response(blob, {
          headers: {
            "Content-Type": blob.type || "application/octet-stream"
          }
        });

        // Keep a single cache copy for each bundle.
        await cache.put(
          new Request(BASE_URL + encodeURIComponent(basename)),
          response
        );

        processed++;

        if (processed % 10 === 0 || processed === files.length) {
          logDownload(
            `Extracted ${processed}/${files.length} assets`,
            file.name
          );
        }
      }));

      loadingText.textContent =
        `Extracting game assets... (${processed}/${files.length})`;

      // Yield to the browser between files so the page can update.
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    // Release references to the ZIP object and its file index.
    zip = null;

    loadingText.textContent = `Extracted ${files.length} game assets.`;
    logDownload(`ZIP extraction complete: ${files.length} assets`);
  }

  async function downloadFiles(files) {
    const cache = await caches.open(CACHE_NAME);
    const rows = new Map();

    files.forEach(path => {
      rows.set(path, makeFileRow(path));
    });

    let completed = 0;
    let downloadedBytes = 0;
    let nextIndex = 0;
    const failed = [];

    updateOverall(0, files.length, 0);

    function progressFor() {
      let fileBytes = 0;

      return {
        add(amount) {
          fileBytes += amount;
          downloadedBytes += amount;
          progressSize.textContent = formatBytes(downloadedBytes);
        },

        complete() {
          completed++;
          updateOverall(completed, files.length, downloadedBytes);
        }
      };
    }

    loadingText.textContent =
      `Downloading ${files.length} game files...`;

    // Only one large file downloads at once to reduce peak memory use
    // and lower the chance of interrupted CDN transfers.
    const workerCount = Math.min(1, files.length);

    async function worker() {
      while (true) {
        const index = nextIndex++;

        if (index >= files.length) return;

        const path = files[index];

        loadingText.textContent = `Downloading ${path}`;

        try {
          await downloadOne(
            path,
            cache,
            rows.get(path),
            progressFor()
          );
        } catch (error) {
          logDownload(`DOWNLOAD FAILED: ${path}`, error.message);
          originalConsole.error("Download failed:", path, error);

          rows.get(path).failed(error.message);
          failed.push({ path, error });
        }
      }
    }

    await Promise.all(
      Array.from({ length: workerCount }, () => worker())
    );

    if (failed.length) {
      throw new Error(
        `${failed.length} file(s) failed to download. ` +
        `First failure: ${failed[0].path} — ${failed[0].error.message}`
      );
    }

    loadingText.textContent = "Downloads complete. Extracting game archive...";
    await extractWebGLArchive();

    await cache.put(
      "SILKSONG_CACHE_COMPLETE",
      new Response("ok")
    );

    loadingText.textContent =
      "All game files downloaded and extracted. Starting Unity...";

    logDownload("Download and extraction completed successfully.");
  }

  // Unity's asset requests are served from Cache Storage.
  window.fetch = async function(resource, options) {
    const url = typeof resource === "string" ? resource : resource.url;
    const resolved = new URL(url, document.baseURI);

    if (resolved.origin === new URL(BASE_URL).origin) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const cached = await cache.match(new Request(resolved.href));

        if (cached) return cached;

        const basename = resolved.pathname.split("/").pop();

        const rawName = await cache.match(
          new Request(BASE_URL + basename)
        );

        if (rawName) return rawName;

        const encodedName = await cache.match(
          new Request(BASE_URL + encodeURIComponent(basename))
        );

        if (encodedName) return encodedName;
      } catch (error) {
        originalConsole.warn("Cache lookup failed; using network:", error);
      }
    }

    return originalFetch(resource, options);
  };

  // Save and load support.
  const SAVE_FORMAT = "silksong-browser-save";
  const SAVE_VERSION = 1;

  const saveStatus = document.getElementById("save-status");
  const saveInput = document.getElementById("save-file");
  const toolbar = document.getElementById("game-toolbar");

  function isGameDatabase(name) {
    return /unity|em_fs_|idbfs/i.test(name || "");
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;

    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode(
        ...bytes.subarray(i, i + chunk)
      );
    }

    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
  }

  async function packValue(value) {
    if (value instanceof ArrayBuffer) {
      return {
        __type: "ArrayBuffer",
        data: bytesToBase64(new Uint8Array(value))
      };
    }

    if (ArrayBuffer.isView(value)) {
      return {
        __type: "TypedArray",
        name: value.constructor.name,
        data: bytesToBase64(
          new Uint8Array(
            value.buffer,
            value.byteOffset,
            value.byteLength
          )
        )
      };
    }

    if (value instanceof Blob) {
      return {
        __type: "Blob",
        mime: value.type,
        data: bytesToBase64(
          new Uint8Array(await value.arrayBuffer())
        )
      };
    }

    if (value instanceof Date) {
      return {
        __type: "Date",
        data: value.toISOString()
      };
    }

    if (Array.isArray(value)) {
      return Promise.all(value.map(packValue));
    }

    if (value && typeof value === "object") {
      const out = {};

      for (const [key, item] of Object.entries(value)) {
        out[key] = await packValue(item);
      }

      return out;
    }

    return value;
  }

  function unpackValue(value) {
    if (Array.isArray(value)) {
      return value.map(unpackValue);
    }

    if (value && typeof value === "object") {
      if (value.__type === "ArrayBuffer") {
        return base64ToBytes(value.data).buffer;
      }

      if (value.__type === "TypedArray") {
        const bytes = base64ToBytes(value.data);

        const constructors = {
          Uint8Array,
          Uint8ClampedArray,
          Int8Array,
          Uint16Array,
          Int16Array,
          Uint32Array,
          Int32Array,
          Float32Array,
          Float64Array,
          BigInt64Array,
          BigUint64Array,
          DataView
        };

        const Ctor = constructors[value.name];

        if (!Ctor) {
          throw new Error("Unsupported saved data type: " + value.name);
        }

        const copy = bytes.buffer.slice(
          bytes.byteOffset,
          bytes.byteOffset + bytes.byteLength
        );

        return value.name === "DataView"
          ? new DataView(copy)
          : new Ctor(copy);
      }

      if (value.__type === "Blob") {
        return new Blob(
          [base64ToBytes(value.data)],
          { type: value.mime || "" }
        );
      }

      if (value.__type === "Date") {
        return new Date(value.data);
      }

      const out = {};

      for (const [key, item] of Object.entries(value)) {
        out[key] = unpackValue(item);
      }

      return out;
    }

    return value;
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("IndexedDB request failed")
      );
    });
  }

  function openDatabase(name) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(name);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("Could not open " + name)
      );
      request.onblocked = () => reject(
        new Error("Database is busy: " + name)
      );
    });
  }

  async function readStore(db, storeName) {
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);

    const [keys, values] = await Promise.all([
      requestResult(store.getAllKeys()),
      requestResult(store.getAll())
    ]);

    const rows = [];

    for (let i = 0; i < values.length; i++) {
      rows.push({
        key: await packValue(keys[i]),
        value: await packValue(values[i])
      });
    }

    return rows;
  }

  async function exportGameSave() {
    if (!indexedDB.databases) {
      throw new Error("This browser does not support IndexedDB backup.");
    }

    saveStatus.textContent = "Preparing save...";

    await new Promise(resolve => setTimeout(resolve, 1500));

    const listed = (await indexedDB.databases()).filter(
      info => info.name && isGameDatabase(info.name)
    );

    if (!listed.length) {
      throw new Error(
        "No Unity save database was found yet. " +
        "Reach an in-game save point, then try again."
      );
    }

    const databases = [];

    for (const info of listed) {
      saveStatus.textContent = "Reading " + info.name + "...";

      const db = await openDatabase(info.name);
      const stores = [];

      for (const storeName of Array.from(db.objectStoreNames)) {
        const store = db.transaction(
          storeName,
          "readonly"
        ).objectStore(storeName);

        const indexes = Array.from(store.indexNames).map(indexName => {
          const index = store.index(indexName);

          return {
            name: index.name,
            keyPath: index.keyPath,
            unique: index.unique,
            multiEntry: index.multiEntry
          };
        });

        stores.push({
          name: store.name,
          keyPath: store.keyPath,
          autoIncrement: store.autoIncrement,
          indexes,
          rows: await readStore(db, storeName)
        });
      }

      databases.push({
        name: db.name,
        version: db.version,
        stores
      });

      db.close();
    }

    const save = {
      format: SAVE_FORMAT,
      version: SAVE_VERSION,
      game: "Hollow Knight: Silksong",
      createdAt: new Date().toISOString(),
      databases
    };

    const blob = new Blob(
      [JSON.stringify(save)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download =
      "silksong-save-" +
      new Date().toISOString().replace(/[:.]/g, "-") +
      ".silksong-save";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 30000);

    saveStatus.textContent = "Save file downloaded.";
  }

  function createDatabaseFromSave(definition) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(
        definition.name,
        definition.version || 1
      );

      request.onupgradeneeded = () => {
        const db = request.result;

        for (const storeDef of definition.stores) {
          if (db.objectStoreNames.contains(storeDef.name)) continue;

          const store = db.createObjectStore(storeDef.name, {
            keyPath: storeDef.keyPath,
            autoIncrement: storeDef.autoIncrement
          });

          for (const index of storeDef.indexes || []) {
            store.createIndex(
              index.name,
              index.keyPath,
              {
                unique: index.unique,
                multiEntry: index.multiEntry
              }
            );
          }
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(
        request.error || new Error("Could not create save database")
      );
      request.onblocked = () => reject(
        new Error("Close other game tabs before loading a save.")
      );
    });
  }

  async function importGameSave(file) {
    if (!file) return;

    saveStatus.textContent = "Reading save file...";

    const save = JSON.parse(await file.text());

    if (
      !save ||
      save.format !== SAVE_FORMAT ||
      save.version !== SAVE_VERSION ||
      !Array.isArray(save.databases)
    ) {
      throw new Error("That file is not a supported Silksong save.");
    }

    for (const definition of save.databases) {
      if (!isGameDatabase(definition.name)) {
        throw new Error("The save contains an unexpected database.");
      }

      saveStatus.textContent = "Restoring " + definition.name + "...";

      const db = await createDatabaseFromSave(definition);

      const missing = definition.stores.filter(
        store => !db.objectStoreNames.contains(store.name)
      );

      if (missing.length) {
        db.close();

        throw new Error(
          "Save database layout does not match this game version. " +
          "Load the same game build used to create the save."
        );
      }

      for (const storeDef of definition.stores) {
        const tx = db.transaction(storeDef.name, "readwrite");
        const store = tx.objectStore(storeDef.name);

        store.clear();

        for (const row of storeDef.rows) {
          const value = unpackValue(row.value);

          if (store.keyPath === null) {
            store.put(value, unpackValue(row.key));
          } else {
            store.put(value);
          }
        }

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(
            tx.error || new Error("Could not write restored save data")
          );
          tx.onabort = () => reject(
            tx.error || new Error("Save restore was cancelled")
          );
        });
      }

      db.close();
    }

    saveStatus.textContent = "Save restored. Reloading game...";
    setTimeout(() => location.reload(), 700);
  }

  document.getElementById("save-game").addEventListener("click", () => {
    exportGameSave().catch(error => {
      originalConsole.error("Save export failed:", error);
      saveStatus.textContent = "Save failed: " + error.message;
    });
  });

  document.getElementById("load-game").addEventListener("click", () => {
    saveInput.click();
  });

  saveInput.addEventListener("change", () => {
    const file = saveInput.files && saveInput.files[0];

    importGameSave(file)
      .catch(error => {
        originalConsole.error("Save import failed:", error);
        saveStatus.textContent = "Load failed: " + error.message;
      })
      .finally(() => {
        saveInput.value = "";
      });
  });

  document.getElementById("fullscreen-game").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await document.getElementById("unity-container").requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      saveStatus.textContent = "Fullscreen unavailable: " + error.message;
    }
  });

  document.addEventListener("fullscreenchange", () => {
    document.getElementById("fullscreen-game").textContent =
      document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

  function startUnity() {
    // The download interface and its diagnostic console disappear
    // before the game starts.
    downloadScreen.style.display = "none";

    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const unityProgress = document.getElementById("unity-progress-bar-full");
    const warningBanner = document.getElementById("unity-warning");
    const unityContainer = document.getElementById("unity-container");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.textContent = message;
      div.style.cssText = "padding:10px;margin:4px 0;";

      if (type === "error") {
        div.style.background = "#a51d2d";
      } else if (type === "warning") {
        div.style.background = "#8a6818";
      }

      warningBanner.appendChild(div);

      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    const config = {
      dataUrl: "Build/w-pt.data.unityweb",
      frameworkUrl: "Build/w-pt.framework.js.unityweb",
      codeUrl: "Build/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    unityContainer.style.display = "block";
    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = BASE_URL + "Build/w-pt.loader.js";

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        warningBanner.textContent = "ERROR: Unity loader did not initialize.";
        return;
      }

      createUnityInstance(canvas, config, progress => {
        unityProgress.style.width = `${progress * 100}%`;
      }).then(() => {
        loadingBar.remove();
        toolbar.style.display = "flex";
      }).catch(error => {
        originalConsole.error(error);
        warningBanner.textContent =
          `UNITY ERROR: ${error.message || error}`;
      });
    };

    script.onerror = () => {
      script.onerror = () => {
        warningBanner.textContent =
          "ERROR: Could not load the Unity loader from either source.";
      };

      script.src =
        "https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/Build/w-pt.loader.js";

      document.body.appendChild(script);
    };

    document.body.appendChild(script);
  }

  (async () => {
    try {
      loadingText.textContent = "Checking saved game files...";

      const cache = await caches.open(CACHE_NAME);
      const complete = await cache.match("SILKSONG_CACHE_COMPLETE");

      if (!complete) {
        await downloadFiles([...GAME_FILES, ...ZIP_PARTS]);
      } else {
        loadingText.textContent =
          "Game files already downloaded. Starting Unity...";

        // Remove unnecessary old full-path bundle entries, if present.
        const keys = await cache.keys();

        for (const key of keys) {
          const path = new URL(key.url).pathname;

          if (
            path.includes("/StreamingAssets/aa/WebGL/") &&
            !path.includes("WebGL.zip.part")
          ) {
            await cache.delete(key);
          }
        }
      }

      startUnity();
    } catch (error) {
      originalConsole.error(error);
      logDownload("LAUNCHER ERROR", error.message || error);
      loadingText.textContent =
        `ERROR: ${error.message || error}`;
    }
  })();
})();
</script>
