
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight: Silksong</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a0e;
      color: #e6edf3;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #080a0e;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #080a0e;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #252b35;
      border-top-color: #65d6c8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      color: #aab4c0;
      font-size: 13px;
    }

    #toolbar {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      opacity: 0.15;
      transition: opacity 0.2s;
    }

    #toolbar:hover {
      opacity: 1;
    }

    button {
      padding: 9px 13px;
      border: 1px solid #343d49;
      border-radius: 5px;
      background: #151a22;
      color: #e6edf3;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover {
      background: #252d39;
      border-color: #65d6c8;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>HOLLOW KNIGHT: SILKSONG</div>
    <div id="status">Connecting to optimized port...</div>
  </div>

  <div id="toolbar">
    <button id="fullscreen">Fullscreen</button>
    <button id="open">Open Separately</button>
  </div>

  <iframe
    id="game"
    src="https://30nnguyen.github.io/silksong-webport/"
    title="Hollow Knight: Silksong"
    allow="fullscreen; gamepad; autoplay; clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>

  <script>
    const game = document.getElementById("game");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    // The iframe load event confirms navigation, not that
    // the game itself has finished loading.
    game.addEventListener("load", () => {
      status.textContent = "Port connected. Loading game...";
      setTimeout(() => {
        loading.classList.add("hidden");
      }, 1500);
    });

    document.getElementById("fullscreen").addEventListener("click", async () => {
      try {
        await game.requestFullscreen();
      } catch (error) {
        status.textContent = "Fullscreen request failed.";
        loading.classList.remove("hidden");
      }
    });

    document.getElementById("open").addEventListener("click", () => {
      window.open(
        "https://30nnguyen.github.io/silksong-webport/",
        "_blank",
        "noopener"
      );
    });

    // Give the user a fallback if the embedded page
    // doesn't become usable.
    setTimeout(() => {
      if (!loading.classList.contains("hidden")) {
        status.textContent =
          "Still loading? Try Open Separately.";
      }
    }, 20000);
  </script>
</body>
</html>
