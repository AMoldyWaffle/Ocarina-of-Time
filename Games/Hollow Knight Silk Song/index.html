  <title>Hollow Knight: Silksong</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    :root {
      color-scheme: dark;
      --panel: #151922;
      --panel-border: #303846;
      --text: #f1f4f8;
      --muted: #aab4c2;
      --accent: #4b91e2;
      --track: #303846;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { min-height: 100vh; }

    #game-toolbar {
      display: none;
      position: fixed;
      z-index: 20;
      top: 10px;
      right: 10px;
      gap: 8px;
      align-items: center;
      padding: 7px;
      background: rgba(12, 16, 23, .88);
      border: 1px solid #465164;
      border-radius: 9px;
      backdrop-filter: blur(8px);
    }

    #game-toolbar button {
      appearance: none;
      border: 1px solid #52647c;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      background: #26364b;
      font: 600 13px Arial, sans-serif;
      cursor: pointer;
    }

    #game-toolbar button:hover { background: #355477; }
    #save-status { color: #d4deea; font-size: 12px; max-width: 210px; }

    #unity-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      margin: 0;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
      outline: none;
    }

    #unity-container:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #unity-container:fullscreen #unity-canvas {
      width: 100vw;
      height: 100vh;
    }

    #download-screen {
      position: relative;
      z-index: 30;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }

    #download-screen {
      width: min(760px, calc(100% - 32px));
      margin: 28px auto;
      padding: 22px;
      box-sizing: border-box;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
    }

    #download-title {
      margin: 0 0 7px;
      font-size: 25px;
      font-weight: 700;
    }

    #download-subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    #loading-text {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      overflow: hidden;
      background: var(--track);
      border-radius: 99px;
    }

    #download-progress,
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    #progress-details {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    #download-list {
      display: grid;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
      margin-top: 18px;
      padding-right: 5px;
    }

    .download-item {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 7px 9px;
      background: #0e131b;
      border: 1px solid #252e3a;
      border-radius: 6px;
      font-size: 12px;
    }

    .download-item .state {
      flex: 0 0 72px;
      color: var(--muted);
    }

    .download-item.done .state {
      color: #80c99a;
    }

    .download-item.failed .state {
      color: #ff8585;
    }

    .download-item .filename {
      overflow: hidden;
      color: #dce4ee;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #unity-container {
      display: none;
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    #unity-loading-bar {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(300px, 70%);
      transform: translate(-50%, -50%);
    }

    #unity-logo {
      height: 45px;
      margin-bottom: 12px;
      background: url("TemplateData/unity-logo-light.png") center / contain no-repeat;
    }

    #unity-progress-bar-empty {
      height: 10px;
      overflow: hidden;
      background: #303846;
      border-radius: 99px;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 5;
    }

    @media (max-width: 600px) {
      #download-screen { margin: 12px auto; padding: 16px; }
      #download-title { font-size: 21px; }
    }
  </style>
</head>

  const loadingText = document.getElementById("loading-text");
  const progressBar = document.getElementById("download-progress");
  const progressCount = document.getElementById("progress-count");
  const progressSize = document.getElementById("progress-size");
  const downloadList = document.getElementById("download-list");
  const downloadScreen = document.getElementById("download-screen");

  const originalFetch = window.fetch.bind(window);

  function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 MB";
    return `${(bytes / 1048576).toFixed(1)} MB`;
  }

  function updateOverall(done, total, bytes) {
    const percent = total ? (done / total) * 100 : 0;
    progressBar.style.width = `${percent}%`;
    progressCount.textContent = `${done} / ${total} files`;
    progressSize.textContent = formatBytes(bytes);
  }

  function makeFileRow(path) {
    const row = document.createElement("div");
    row.className = "download-item";

    const state = document.createElement("span");
    state.className = "state";
    state.textContent = "Waiting";

    const name = document.createElement("span");
    name.className = "filename";
    name.textContent = path;

    row.append(state, name);
    downloadList.appendChild(row);

    return {
      start() {
        state.textContent = "Downloading";
        row.classList.remove("done", "failed");
      },
      done() {
        state.textContent = "Complete";
        row.classList.add("done");
      },
      retry(message) {
        state.textContent = message;
        row.classList.remove("done", "failed");
      },
      failed(message) {
        state.textContent = "Failed";
        row.classList.add("failed");
        row.title = message || "Download failed";
      }
    };
  }

  // The repository stores the WebGL asset bundles inside a 100-part ZIP.
  // The individual bundle URLs are not separate repository files.
  const ZIP_PARTS = Array.from(
    { length: 100 },
    (_, index) => `StreamingAssets/aa/WebGL.zip.part${index + 1}`
  );

  async function getFileList() {
    const supportFiles = GAME_FILES.filter(path =>
      !path.startsWith("StreamingAssets/aa/WebGL/")
    );

    if (!supportFiles.includes("Build/w-pt.loader.js") ||
        !supportFiles.includes("StreamingAssets/aa/catalog.bin") ||
        ZIP_PARTS.length !== 100) {
      throw new Error("The game file list is incomplete.");
    }
    return [...supportFiles, ...ZIP_PARTS];
  }

  function encodedPath(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }

  function sourceCandidates(path) {
    const file = encodedPath(path);
    return [
      BASE_URL + file,
      "https://fastly.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/" + file,
      "https://gcore.jsdelivr.net/gh/AMoldyWaffle/Silk-Song@main/" + file,
      "https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/" + file
    ];
  }

  async function fetchWithFallback(path, row) {
    const candidates = sourceCandidates(path);
    const errors = [];

    for (let i = 0; i < candidates.length; i++) {
      if (i > 0) row.retry(`Retrying source ${i + 1}/${candidates.length}`);
      try {
        const response = await originalFetch(candidates[i], {
          cache: "no-store",
          credentials: "omit",
          mode: "cors"
        });
        if (response.ok) return response;
        errors.push(`${new URL(candidates[i]).hostname}: HTTP ${response.status}`);
      } catch (error) {
        errors.push(`${new URL(candidates[i]).hostname}: ${error.message}`);
      }
    }

    throw new Error(`All download sources failed (${errors.join("; ")})`);
  }

  async function downloadOne(path, cache, row, progress) {
    const url = BASE_URL + encodedPath(path);
    const cacheKey = new Request(url);

    const cached = await cache.match(cacheKey);
    if (cached) {
      row.done();
      progress.complete(0);
      return;
    }

    row.start();

    const response = await fetchWithFallback(path, row);
    const reader = response.body && response.body.getReader
      ? response.body.getReader()
      : null;

    let blob;
    if (reader) {
      const chunks = [];
      let fileBytes = 0;

      while (true) {
        const result = await reader.read();
        if (result.done) break;
        chunks.push(result.value);
        fileBytes += result.value.byteLength;
        progress.add(fileBytes - (progress.lastFileBytes || 0));
        progress.lastFileBytes = fileBytes;
      }

      progress.lastFileBytes = 0;
      blob = new Blob(chunks, {
        type: response.headers.get("content-type") || "application/octet-stream"
      });
    } else {
      blob = await response.blob();
      progress.add(blob.size);
    }

    await cache.put(cacheKey, new Response(blob, {
      headers: {
        "Content-Type": blob.type || "application/octet-stream"
      }
    }));

    row.done();
    progress.complete(0);
  }

  async function loadJSZip() {
    if (window.JSZip) return window.JSZip;

    const sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
      "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
    ];

    for (const src of sources) {
      try {
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Could not load ZIP extractor: " + src));
          document.head.appendChild(script);
        });
        if (window.JSZip) return window.JSZip;
      } catch (error) {
        console.warn(error);
      }
    }
    throw new Error("Could not load the ZIP extractor. Check whether the script host is blocked.");
  }

  async function extractWebGLArchive() {
    const cache = await caches.open(CACHE_NAME);
    const partPaths = ZIP_PARTS;
    const partBlobs = [];

    loadingText.textContent = "Preparing the game archive...";
    for (let i = 0; i < partPaths.length; i++) {
      const url = BASE_URL + encodedPath(partPaths[i]);
      const response = await cache.match(new Request(url));
      if (!response) {
        throw new Error("Missing archive part " + (i + 1) + " of " + partPaths.length +
          ". Clear the incomplete cache and reload.");
      }
      partBlobs.push(await response.blob());
      if ((i + 1) % 10 === 0 || i + 1 === partPaths.length) {
        loadingText.textContent = `Preparing archive... (${i + 1}/${partPaths.length} parts)`;
      }
    }

    loadingText.textContent = "Loading ZIP extractor...";
    const JSZip = await loadJSZip();

    loadingText.textContent = "Extracting game assets...";
    const archiveBlob = new Blob(partBlobs, { type: "application/zip" });
    const zip = await JSZip.loadAsync(archiveBlob);
    const files = Object.values(zip.files).filter(file => !file.dir);
    if (!files.length) throw new Error("The downloaded archive contains no game files.");

    let processed = 0;
    const batchSize = 8;

    for (let i = 0; i < files.length; i += batchSize) {
      const batch = files.slice(i, i + batchSize);
      await Promise.all(batch.map(async file => {
        const blob = await file.async("blob");
        const cleanName = file.name.replace(/^\.\//, "");
        const basename = cleanName.split("/").pop();
        const response = new Response(blob, {
          headers: { "Content-Type": blob.type || "application/octet-stream" }
        });

        // Store the archive path and basename. Unity requests full URLs, while
        // some builds request only the final bundle filename.
        await cache.put(new Request(BASE_URL + cleanName), response.clone());
        await cache.put(new Request(BASE_URL + basename), response);
        processed++;
      }));
      loadingText.textContent = `Extracting game assets... (${processed}/${files.length})`;
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    loadingText.textContent = `Extracted ${files.length} game assets.`;
  }

  async function downloadFiles(files) {
    const cache = await caches.open(CACHE_NAME);
    const rows = new Map();
    files.forEach(path => rows.set(path, makeFileRow(path)));

    let completed = 0;
    let downloadedBytes = 0;
    let active = 0;
    let nextIndex = 0;
    let failed = [];

    updateOverall(0, files.length, 0);

    function progressFor(path) {
      let fileBytes = 0;
      return {
        add(amount) {
          fileBytes += amount;
          downloadedBytes += amount;
          progressSize.textContent = formatBytes(downloadedBytes);
        },
        complete() {
          completed++;
          updateOverall(completed, files.length, downloadedBytes);
        },
        get lastFileBytes() { return fileBytes; },
        set lastFileBytes(value) { fileBytes = value; }
      };
    }

    loadingText.textContent = `Downloading ${files.length} game files in parallel...`;

    const workerCount = Math.min(8, files.length);
    async function worker() {
      while (true) {
        const index = nextIndex++;
        if (index >= files.length) return;

        const path = files[index];
        active++;
        loadingText.textContent =
          `Downloading ${path} (${active} active downloads)`;

        try {
          await downloadOne(path, cache, rows.get(path), progressFor(path));
        } catch (error) {
          console.error("Download failed:", path, error);
          rows.get(path).failed(error.message);
          failed.push({ path, error });
        } finally {
          active--;
        }
      }
    }

    await Promise.all(Array.from({ length: workerCount }, () => worker()));

    if (failed.length) {
      throw new Error(
        `${failed.length} file(s) failed to download. First failure: ${failed[0].path} — ${failed[0].error.message}`
      );
    }

    loadingText.textContent = "Downloads complete. Extracting game archive...";
    await extractWebGLArchive();

    await cache.put("SILKSONG_CACHE_COMPLETE", new Response("ok"));
    loadingText.textContent = "All game files downloaded and extracted. Starting Unity...";
  }

  // Unity's requests are served from Cache Storage after the initial download.
  window.fetch = async function(resource, options) {
    const url = typeof resource === "string" ? resource : resource.url;
    const resolved = new URL(url, document.baseURI);

    if (resolved.origin === new URL(BASE_URL).origin) {
      try {
        const cache = await caches.open(CACHE_NAME);
        const cached = await cache.match(new Request(resolved.href));
        if (cached) return cached;

        const basename = resolved.pathname.split("/").pop();
        const rawName = await cache.match(new Request(BASE_URL + basename));
        if (rawName) return rawName;
        const encodedName = await cache.match(new Request(BASE_URL + encodeURIComponent(basename)));
        if (encodedName) return encodedName;
      } catch (error) {
        console.warn("Cache lookup failed; using network:", error);
      }
    }

    return originalFetch(resource, options);
  };

  // Export/import Unity's IndexedDB-backed persistent data as a portable file.
  // Unity WebGL commonly stores IDBFS data in databases named EM_FS_* or idbfs.
  const SAVE_FORMAT = "silksong-browser-save";
  const SAVE_VERSION = 1;
  const saveStatus = document.getElementById("save-status");
  const saveInput = document.getElementById("save-file");
  const toolbar = document.getElementById("game-toolbar");

  function isGameDatabase(name) {
    return /unity|em_fs_|idbfs/i.test(name || "");
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function packValue(value) {
    if (value instanceof ArrayBuffer) return { __type: "ArrayBuffer", data: bytesToBase64(new Uint8Array(value)) };
    if (ArrayBuffer.isView(value)) {
      return { __type: "TypedArray", name: value.constructor.name, data: bytesToBase64(new Uint8Array(value.buffer, value.byteOffset, value.byteLength)) };
    }
    if (value instanceof Blob) return { __type: "Blob", mime: value.type, data: bytesToBase64(new Uint8Array(await value.arrayBuffer())) };
    if (value instanceof Date) return { __type: "Date", data: value.toISOString() };
    if (Array.isArray(value)) return Promise.all(value.map(packValue));
    if (value && typeof value === "object") {
      const out = {};
      for (const [key, item] of Object.entries(value)) out[key] = await packValue(item);
      return out;
    }
    return value;
  }

  function unpackValue(value) {
    if (Array.isArray(value)) return value.map(unpackValue);
    if (value && typeof value === "object") {
      if (value.__type === "ArrayBuffer") return base64ToBytes(value.data).buffer;
      if (value.__type === "TypedArray") {
        const bytes = base64ToBytes(value.data);
        const constructors = { Uint8Array, Uint8ClampedArray, Int8Array, Uint16Array, Int16Array, Uint32Array, Int32Array, Float32Array, Float64Array, BigInt64Array, BigUint64Array, DataView };
        const Ctor = constructors[value.name];
        if (!Ctor) throw new Error("Unsupported saved data type: " + value.name);
        const copy = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        return value.name === "DataView" ? new DataView(copy) : new Ctor(copy);
      }
      if (value.__type === "Blob") return new Blob([base64ToBytes(value.data)], { type: value.mime || "" });
      if (value.__type === "Date") return new Date(value.data);
      const out = {};
      for (const [key, item] of Object.entries(value)) out[key] = unpackValue(item);
      return out;
    }
    return value;
  }

  function requestResult(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("IndexedDB request failed"));
    });
  }

  function openDatabase(name) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(name);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Could not open " + name));
      request.onblocked = () => reject(new Error("Database is busy: " + name));
    });
  }

  async function readStore(db, storeName) {
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);
    const [keys, values] = await Promise.all([
      requestResult(store.getAllKeys()),
      requestResult(store.getAll())
    ]);
    const rows = [];
    for (let i = 0; i < values.length; i++) {
      rows.push({ key: await packValue(keys[i]), value: await packValue(values[i]) });
    }
    return rows;
  }

  async function exportGameSave() {
    if (!indexedDB.databases) throw new Error("This browser does not support IndexedDB backup.");
    saveStatus.textContent = "Preparing save...";
    // Give the game a moment to finish any recent save-point writes.
    await new Promise(resolve => setTimeout(resolve, 1500));
    const listed = (await indexedDB.databases()).filter(info => info.name && isGameDatabase(info.name));
    if (!listed.length) throw new Error("No Unity save database was found yet. Reach an in-game save point, then try again.");

    const databases = [];
    for (const info of listed) {
      saveStatus.textContent = "Reading " + info.name + "...";
      const db = await openDatabase(info.name);
      const stores = [];
      for (const storeName of Array.from(db.objectStoreNames)) {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const indexes = Array.from(store.indexNames).map(indexName => {
          const index = store.index(indexName);
          return { name: index.name, keyPath: index.keyPath, unique: index.unique, multiEntry: index.multiEntry };
        });
        const schema = {
          name: store.name,
          keyPath: store.keyPath,
          autoIncrement: store.autoIncrement,
          indexes,
          rows: await readStore(db, storeName)
        };
        stores.push(schema);
      }
      databases.push({ name: db.name, version: db.version, stores });
      db.close();
    }

    const save = {
      format: SAVE_FORMAT,
      version: SAVE_VERSION,
      game: "Hollow Knight: Silksong",
      createdAt: new Date().toISOString(),
      databases
    };
    const blob = new Blob([JSON.stringify(save)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "silksong-save-" + new Date().toISOString().replace(/[:.]/g, "-") + ".silksong-save";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    saveStatus.textContent = "Save file downloaded.";
  }

  function createDatabaseFromSave(definition) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(definition.name, definition.version || 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        for (const storeDef of definition.stores) {
          if (db.objectStoreNames.contains(storeDef.name)) continue;
          const store = db.createObjectStore(storeDef.name, {
            keyPath: storeDef.keyPath,
            autoIncrement: storeDef.autoIncrement
          });
          for (const index of storeDef.indexes || []) {
            store.createIndex(index.name, index.keyPath, { unique: index.unique, multiEntry: index.multiEntry });
          }
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Could not create save database"));
      request.onblocked = () => reject(new Error("Close other game tabs before loading a save."));
    });
  }

  async function importGameSave(file) {
    if (!file) return;
    saveStatus.textContent = "Reading save file...";
    const save = JSON.parse(await file.text());
    if (!save || save.format !== SAVE_FORMAT || save.version !== SAVE_VERSION || !Array.isArray(save.databases)) {
      throw new Error("That file is not a supported Silksong save.");
    }
    for (const definition of save.databases) {
      if (!isGameDatabase(definition.name)) throw new Error("The save contains an unexpected database.");
      saveStatus.textContent = "Restoring " + definition.name + "...";
      const db = await createDatabaseFromSave(definition);
      const missing = definition.stores.filter(store => !db.objectStoreNames.contains(store.name));
      if (missing.length) {
        db.close();
        throw new Error("Save database layout does not match this game version. Load the same game build used to create the save.");
      }
      for (const storeDef of definition.stores) {
        const tx = db.transaction(storeDef.name, "readwrite");
        const store = tx.objectStore(storeDef.name);
        store.clear();
        for (const row of storeDef.rows) {
          const value = unpackValue(row.value);
          if (store.keyPath === null) store.put(value, unpackValue(row.key));
          else store.put(value);
        }
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error || new Error("Could not write restored save data"));
          tx.onabort = () => reject(tx.error || new Error("Save restore was cancelled"));
        });
      }
      db.close();
    }
    saveStatus.textContent = "Save restored. Reloading game...";
    setTimeout(() => location.reload(), 700);
  }

  document.getElementById("save-game").addEventListener("click", () => {
    exportGameSave().catch(error => {
      console.error("Save export failed:", error);
      saveStatus.textContent = "Save failed: " + error.message;
    });
  });

  document.getElementById("load-game").addEventListener("click", () => saveInput.click());
  saveInput.addEventListener("change", () => {
    const file = saveInput.files && saveInput.files[0];
    importGameSave(file).catch(error => {
      console.error("Save import failed:", error);
      saveStatus.textContent = "Load failed: " + error.message;
    }).finally(() => { saveInput.value = ""; });
  });

  document.getElementById("fullscreen-game").addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) await document.getElementById("unity-container").requestFullscreen();
      else await document.exitFullscreen();
    } catch (error) {
      saveStatus.textContent = "Fullscreen unavailable: " + error.message;
    }
  });

  document.addEventListener("fullscreenchange", () => {
    document.getElementById("fullscreen-game").textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

  function startUnity() {
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const unityProgress = document.getElementById("unity-progress-bar-full");
    const warningBanner = document.getElementById("unity-warning");
    const unityContainer = document.getElementById("unity-container");

    function unityShowBanner(message, type) {
      const div = document.createElement("div");
      div.textContent = message;
      div.style.cssText = "padding:10px;margin:4px 0;";
      if (type === "error") {
        div.style.background = "#a51d2d";
      } else if (type === "warning") {
        div.style.background = "#8a6818";
      }
      warningBanner.appendChild(div);
      if (type !== "error") {
        setTimeout(() => div.remove(), 5000);
      }
    }

    const config = {
      dataUrl: "Build/w-pt.data.unityweb",
      frameworkUrl: "Build/w-pt.framework.js.unityweb",
      codeUrl: "Build/w-pt.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "EDUrocks Group, Truffled, GN-Math",
      productName: "Hollow Knight SilkSong",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    unityContainer.style.display = "block";
    loadingBar.style.display = "block";

    const script = document.createElement("script");
    script.src = BASE_URL + "Build/w-pt.loader.js";

    script.onload = () => {
      if (typeof createUnityInstance !== "function") {
        loadingText.textContent = "ERROR: Unity loader did not initialize.";
        return;
      }

      createUnityInstance(canvas, config, progress => {
        unityProgress.style.width = `${progress * 100}%`;
        loadingText.textContent = `Starting Unity... ${Math.round(progress * 100)}%`;
      }).then(() => {
        downloadScreen.remove();
        loadingBar.remove();
        toolbar.style.display = "flex";
      }).catch(error => {
        console.error(error);
        loadingText.textContent = `UNITY ERROR: ${error.message || error}`;
      });
    };

    script.onerror = () => {
      // If the primary CDN is unavailable, load the small Unity bootstrap from
      // the alternate static-file host. Game assets are still served from cache.
      script.onerror = () => {
        loadingText.textContent = "ERROR: Could not load the Unity loader from either source.";
      };
      script.src = "https://raw.githubusercontent.com/AMoldyWaffle/Silk-Song/main/Build/w-pt.loader.js";
      document.body.appendChild(script);
    };

    document.body.appendChild(script);
  }

  (async () => {
    try {
      loadingText.textContent = "Checking saved game files...";
      const cache = await caches.open(CACHE_NAME);
      const complete = await cache.match("SILKSONG_CACHE_COMPLETE");

      if (!complete) {
        const files = await getFileList();
        await downloadFiles(files);
      } else {
        loadingText.textContent = "Game files already downloaded. Starting Unity...";
      }

      startUnity();
    } catch (error) {
      console.error(error);
      loadingText.textContent = `ERROR: ${error.message || error}`;
    }
  })();
})();
</script>
