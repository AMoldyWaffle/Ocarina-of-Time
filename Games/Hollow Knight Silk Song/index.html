
<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollow Knight: Silksong</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a10;
      color: white;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #151923;
      z-index: 10;
    }

    button {
      background: #30394b;
      color: white;
      border: 1px solid #56627a;
      border-radius: 5px;
      padding: 7px 13px;
      cursor: pointer;
    }

    button:hover { background: #46536b; }

    #unity-container {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: black;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
    }

    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #080a10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #loading-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    #status {
      margin: 12px 0;
      color: #cbd3e2;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #progress-outer {
      width: min(650px, 90vw);
      height: 17px;
      border-radius: 10px;
      background: #252b38;
      overflow: hidden;
      border: 1px solid #46516a;
    }

    #progress-inner {
      width: 0%;
      height: 100%;
      background: #4d83d8;
      transition: width 0.12s linear;
    }

    #progress-detail {
      margin-top: 8px;
      color: #9ca9bd;
      font-size: 13px;
      text-align: center;
    }

    #diagnostics {
      width: min(850px, 90vw);
      height: 170px;
      overflow: auto;
      margin-top: 18px;
      padding: 10px;
      background: #10141d;
      border: 1px solid #30394b;
      border-radius: 5px;
      color: #aebbd0;
      font: 12px monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(400px, 80%);
      display: none;
    }

    #unity-progress-outer {
      height: 12px;
      background: #222;
      border-radius: 8px;
      overflow: hidden;
    }

    #unity-progress-inner {
      height: 100%;
      width: 0%;
      background: #4d83d8;
    }

    #unity-warning {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 30;
    }

    #error-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.92);
      padding: 30px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div id="game">
    <div id="toolbar">
      <button id="save-button">Save</button>
      <button id="load-button">Load</button>
      <button id="fullscreen-button">Fullscreen</button>
      <input id="save-file" type="file"
        accept=".silksong-save,.json" hidden>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-progress-outer">
          <div id="unity-progress-inner"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
      <div id="error-overlay"></div>

      <div id="loading-screen">
        <div id="loading-title">HOLLOW KNIGHT: SILKSONG</div>
        <div id="status">Preparing downloader...</div>

        <div id="progress-outer">
          <div id="progress-inner"></div>
        </div>

        <div id="progress-detail">Waiting...</div>
        <div id="diagnostics"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

  <script>
  (() => {
    "use strict";

    /* =========================================================
       CONFIGURATION
    ========================================================= */

    const BASE_URL =
      "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/";

    const CACHE_NAME = "hksilksongcache-v9";
    const CACHE_ORIGIN = "https://silksong-cache.invalid/";
    const CACHE_MARKER = CACHE_ORIGIN + "__CACHE_COMPLETE__";

    const TOTAL_PARTS = 100;
    const WORKER_COUNT = 6;
    const PREFETCH_WINDOW = 8;
    const ZIP_FEED_CHUNK_SIZE = 4 * 1024 * 1024;

    const EXPECTED_PART_BYTES = partNumber =>
      partNumber === 100 ? 17340100 : 20866662;

    const TOTAL_ARCHIVE_BYTES =
      EXPECTED_PART_BYTES(1) * 99 +
      EXPECTED_PART_BYTES(100);

    const FALLBACK_BASES = [
      "https://cdn.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
      "https://fastly.jsdelivr.net/gh/web-ports/hollow-knight-silksong@master/",
      "https://raw.githubusercontent.com/web-ports/hollow-knight-silksong/master/",
      "https://raw.githack.com/web-ports/hollow-knight-silksong/master/"
    ];

    let BUILD_BASE_URL = BASE_URL;

    /* =========================================================
       ELEMENTS AND LOGGING
    ========================================================= */

    const statusElement = document.getElementById("status");
    const progressElement = document.getElementById("progress-inner");
    const progressDetail = document.getElementById("progress-detail");
    const diagnostics = document.getElementById("diagnostics");
    const loadingScreen = document.getElementById("loading-screen");

    const canvas = document.getElementById("unity-canvas");
    const unityLoadingBar = document.getElementById("unity-loading-bar");
    const unityProgress = document.getElementById("unity-progress-inner");
    const errorOverlay = document.getElementById("error-overlay");

    function log(message) {
      const line =
        "[" + new Date().toLocaleTimeString() + "] " + message;

      console.log(line);
      diagnostics.textContent += line + "\n";
      diagnostics.scrollTop = diagnostics.scrollHeight;
    }

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function setProgress(percent, detail) {
      progressElement.style.width =
        Math.max(0, Math.min(100, percent)) + "%";

      if (detail) progressDetail.textContent = detail;
    }

    function showFatalError(error) {
      const message = error && error.stack
        ? error.stack
        : String(error);

      log("FATAL ERROR: " + message);
      setStatus("DOWNLOAD OR STARTUP FAILED");
      progressDetail.textContent = "See diagnostics below.";

      errorOverlay.style.display = "block";
      errorOverlay.textContent = message;
    }

    function yieldToBrowser() {
      return new Promise(resolve => setTimeout(resolve, 0));
    }

    /* =========================================================
       URL HELPERS
    ========================================================= */

    function partUrl(partNumber, sourceIndex) {
      return FALLBACK_BASES[sourceIndex] +
        "StreamingAssets/aa/WebGL.zip.part" + partNumber;
    }

    function assetCacheKey(path) {
      let clean = path.replace(/^\/+/, "");

      clean = clean.replace(
        /^StreamingAssets\/aa\/WebGL\//,
        ""
      );

      clean = clean.replace(/^WebGL\//, "");

      return CACHE_ORIGIN + encodeURI(clean);
    }

    /* =========================================================
       DOWNLOAD A SINGLE ZIP PART
    ========================================================= */

    async function fetchWithTimeout(url, timeoutMs, controller) {
      const timer = setTimeout(
        () => controller.abort(),
        timeoutMs
      );

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });

        return { response, timer };

      } catch (error) {
        clearTimeout(timer);
        throw error;
      }
    }

    async function downloadPart(partNumber) {
      const expectedBytes = EXPECTED_PART_BYTES(partNumber);

      const controllers = FALLBACK_BASES.map(
        () => new AbortController()
      );

      const timers = new Array(FALLBACK_BASES.length).fill(null);

      log("Part " + partNumber + ": checking mirrors...");

      const attempts = FALLBACK_BASES.map(
        async (base, sourceIndex) => {
          const result = await fetchWithTimeout(
            partUrl(partNumber, sourceIndex),
            120000,
            controllers[sourceIndex]
          );

          timers[sourceIndex] = result.timer;

          if (!result.response.ok) {
            clearTimeout(result.timer);

            throw new Error(
              "Mirror " + (sourceIndex + 1) +
              " returned HTTP " + result.response.status
            );
          }

          return {
            ...result,
            sourceIndex
          };
        }
      );

      let winner;

      try {
        winner = await Promise.any(attempts);

      } catch (error) {
        const messages = error.errors
          ? error.errors.map(
              item => item.message || String(item)
            ).join("; ")
          : String(error);

        throw new Error(
          "All mirrors failed for part " +
          partNumber + ": " + messages
        );

      } finally {
        if (winner) {
          controllers.forEach((controller, index) => {
            if (index !== winner.sourceIndex) {
              controller.abort();
            }
          });
        }

        timers.forEach(timer => {
          if (timer) clearTimeout(timer);
        });
      }

      try {
        const blob = await winner.response.blob();

        if (blob.size !== expectedBytes) {
          throw new Error(
            "Expected " + expectedBytes +
            " bytes, received " + blob.size
          );
        }

        log(
          "Part " + partNumber +
          " downloaded from mirror " +
          (winner.sourceIndex + 1) +
          " (" + (blob.size / 1048576).toFixed(2) + " MB)"
        );

        return blob;

      } catch (error) {
        log(
          "Part " + partNumber +
          " failed validation: " + error.message
        );

        for (let i = 0; i < FALLBACK_BASES.length; i++) {
          if (i === winner.sourceIndex) continue;

          try {
            log(
              "Retrying part " + partNumber +
              " from mirror " + (i + 1)
            );

            const controller = new AbortController();

            const result = await fetchWithTimeout(
              partUrl(partNumber, i),
              120000,
              controller
            );

            if (!result.response.ok) {
              clearTimeout(result.timer);
              throw new Error("HTTP " + result.response.status);
            }

            const blob = await result.response.blob();
            clearTimeout(result.timer);

            if (blob.size !== expectedBytes) {
              throw new Error(
                "Expected " + expectedBytes +
                " bytes, received " + blob.size
              );
            }

            log(
              "Part " + partNumber +
              " recovered from mirror " + (i + 1)
            );

            return blob;

          } catch (retryError) {
            log(
              "Retry failed for part " + partNumber +
              ": " + retryError.message
            );
          }
        }

        throw new Error(
          "Could not download a complete copy of part " +
          partNumber
        );
      }
    }

    /* =========================================================
       STREAMING ZIP EXTRACTION
    ========================================================= */

    async function streamDownloadAndExtract() {
      setStatus("Preparing streaming extractor...");
      setProgress(1, "Initializing ZIP stream...");

      if (!window.fflate || !window.fflate.Unzip) {
        throw new Error(
          "fflate failed to load. Check the connection to jsDelivr."
        );
      }

      const cache = await caches.open(CACHE_NAME);

      let extractedFiles = 0;
      let extractedBytes = 0;
      let streamError = null;

      const pendingWrites = [];

      const unzip = new fflate.Unzip(file => {
        if (file.name.endsWith("/")) return;

        const fileChunks = [];
        const originalName = file.name;

        log("Archive entry found: " + originalName);

        file.ondata = (error, data, final) => {
          if (error) {
            streamError = error;
            log(
              "Extraction error in " + originalName +
              ": " + error.message
            );
            return;
          }

          if (data && data.length) {
            fileChunks.push(data);
            extractedBytes += data.length;
          }

          if (final) {
            try {
              let path = originalName.replace(/^\/+/, "");

              path = path.replace(
                /^StreamingAssets\/aa\/WebGL\//,
                ""
              );

              path = path.replace(/^WebGL\//, "");

              const key = assetCacheKey(path);
              const blob = new Blob(fileChunks);

              const writePromise = cache.put(
                key,
                new Response(blob)
              ).then(() => {
                extractedFiles++;

                if (
                  extractedFiles % 10 === 0 ||
                  extractedFiles === 1
                ) {
                  log(
                    "Cached " + extractedFiles +
                    " files (" +
                    (extractedBytes / 1048576).toFixed(1) +
                    " MB extracted)"
                  );
                }

              }).catch(error => {
                streamError = error;

                log(
                  "Cache write failed for " +
                  originalName + ": " + error.message
                );

                throw error;
              });

              pendingWrites.push(writePromise);

            } catch (error) {
              streamError = error;

              log(
                "Could not cache " +
                originalName + ": " + error.message
              );
            }
          }
        };

        file.start();
      });

      // Do not use AsyncUnzipInflate here.
      // It creates a SharedWorker that the runner may block.
      unzip.register(fflate.UnzipInflate);

      const readyParts = new Map();

      let nextPartToDownload = 1;
      let nextPartToConsume = 1;

      let completedDownloads = 0;
      let downloadedBytes = 0;
      let workerError = null;

      const consumerWaiters = [];
      const capacityWaiters = [];

      function notifyConsumer() {
        while (consumerWaiters.length) {
          consumerWaiters.shift()();
        }
      }

      function notifyCapacity() {
        while (capacityWaiters.length) {
          capacityWaiters.shift()();
        }
      }

      async function waitForCapacity() {
        while (
          nextPartToDownload >=
          nextPartToConsume + PREFETCH_WINDOW
        ) {
          if (workerError) throw workerError;

          await new Promise(resolve => {
            capacityWaiters.push(resolve);
          });
        }
      }

      async function waitForPart(partNumber) {
        while (!readyParts.has(partNumber)) {
          if (workerError) throw workerError;

          await new Promise(resolve => {
            consumerWaiters.push(resolve);
          });
        }

        const part = readyParts.get(partNumber);
        readyParts.delete(partNumber);

        nextPartToConsume++;
        notifyCapacity();

        return part;
      }

      async function downloadWorker() {
        while (true) {
          if (workerError) return;

          await waitForCapacity();

          if (workerError) return;

          const partNumber = nextPartToDownload++;

          if (partNumber > TOTAL_PARTS) return;

          try {
            setStatus(
              "Downloading and extracting game files..."
            );

            const blob = await downloadPart(partNumber);

            if (workerError) return;

            readyParts.set(partNumber, blob);

            completedDownloads++;
            downloadedBytes += blob.size;

            setProgress(
              (downloadedBytes / TOTAL_ARCHIVE_BYTES) * 35,
              "Downloaded parts: " +
              completedDownloads + "/" + TOTAL_PARTS +
              " | " +
              (downloadedBytes / 1048576).toFixed(1) +
              " MB"
            );

            notifyConsumer();

          } catch (error) {
            workerError = error;
            notifyConsumer();
            notifyCapacity();
            throw error;
          }
        }
      }

      async function consumeParts() {
        let bytesFed = 0;

        for (let i = 1; i <= TOTAL_PARTS; i++) {
          if (streamError) throw streamError;

          const blob = await waitForPart(i);
          const buffer = await blob.arrayBuffer();
          const bytes = new Uint8Array(buffer);

          log(
            "Feeding part " + i + "/" + TOTAL_PARTS +
            " into ZIP extractor..."
          );

          for (
            let offset = 0;
            offset < bytes.length;
            offset += ZIP_FEED_CHUNK_SIZE
          ) {
            const end = Math.min(
              offset + ZIP_FEED_CHUNK_SIZE,
              bytes.length
            );

            const chunk = bytes.subarray(offset, end);

            const isFinalChunk =
              i === TOTAL_PARTS &&
              end === bytes.length;

            unzip.push(chunk, isFinalChunk);

            bytesFed += chunk.length;

            setProgress(
              35 + (bytesFed / TOTAL_ARCHIVE_BYTES) * 45,
              "Extracting archive: part " +
              i + "/" + TOTAL_PARTS +
              " | " +
              (bytesFed / 1048576).toFixed(1) +
              " / " +
              (TOTAL_ARCHIVE_BYTES / 1048576).toFixed(1) +
              " MB processed"
            );

            if (streamError) throw streamError;

            await yieldToBrowser();
          }
        }

        log(
          "All ZIP parts fed to extractor (" +
          (bytesFed / 1048576).toFixed(1) +
          " MB)."
        );
      }

      const workers = [];

      for (let i = 0; i < WORKER_COUNT; i++) {
        workers.push(downloadWorker());
      }

      const workerPromise = Promise.all(workers);
      const consumerPromise = consumeParts();

      try {
        await Promise.all([
          workerPromise,
          consumerPromise
        ]);

      } catch (error) {
        workerError = error;
        notifyConsumer();
        notifyCapacity();
        throw error;
      }

      setStatus("Finishing extracted files...");
      setProgress(90, "Finishing cache writes...");

      await Promise.all(pendingWrites);

      if (streamError) throw streamError;

      if (extractedFiles === 0) {
        throw new Error(
          "The streaming extractor did not find any files. " +
          "The archive may use an unsupported ZIP feature."
        );
      }

      log(
        "Streaming extraction complete. " +
        extractedFiles + " files cached."
      );

      await cache.put(
        CACHE_MARKER,
        new Response("complete")
      );

      setProgress(
        95,
        "Cached " + extractedFiles + " extracted files."
      );
    }

    /* =========================================================
       CACHE CHECK
    ========================================================= */

    async function cacheIsComplete() {
      try {
        const cache = await caches.open(CACHE_NAME);
        return !!(await cache.match(CACHE_MARKER));

      } catch (error) {
        log("Cache check failed: " + error.message);
        return false;
      }
    }

    /* =========================================================
       FETCH INTERCEPTION
    ========================================================= */

    const originalFetch = window.fetch.bind(window);

    window.fetch = async function(resource, options) {
      try {
        const requestUrl = typeof resource === "string"
          ? resource
          : resource.url;

        const parsed = new URL(
          requestUrl,
          document.baseURI
        );

        if (
          parsed.pathname.endsWith(
            "/Build/w-pt.framework.js.unityweb"
          )
        ) {
          const cache = await caches.open(CACHE_NAME);
          const cachedFramework = await cache.match(parsed.href);

          if (cachedFramework) {
            log("Serving prechecked Unity framework from cache.");
            return cachedFramework;
          }
        }

        const marker = "/StreamingAssets/aa/WebGL/";
        const markerIndex = parsed.pathname.indexOf(marker);

        if (markerIndex !== -1) {
          const relativePath = parsed.pathname.substring(
            markerIndex + marker.length
          );

          const cache = await caches.open(CACHE_NAME);
          const key = assetCacheKey(relativePath);
          const cached = await cache.match(key);

          if (cached) return cached;

          log(
            "Asset not in cache; trying network: " +
            relativePath
          );
        }

      } catch (error) {
        log("Cache lookup warning: " + error.message);
      }

      return originalFetch(resource, options);
    };

    /* =========================================================
       UNITY FRAMEWORK VALIDATION

       Important:
       - Verify the actual GZIP stream, not just its first bytes.
       - Cache the original compressed bytes.
       - Remove HTTP Content-Encoding from the cached response.
       - Unity will receive the compressed bytes and our patched
         loader will decompress this one file with fflate.
    ========================================================= */

    async function selectBuildMirror() {
      const cache = await caches.open(CACHE_NAME);

      const frameworkPath =
        "Build/w-pt.framework.js.unityweb";

      const failures = [];

      setStatus("Diagnosing Unity framework...");
      setProgress(95, "Inspecting framework responses...");

      function bytesToHex(bytes, count = 32) {
        return Array.from(bytes.slice(0, count))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join(" ");
      }

      function bytesToText(bytes, count = 100) {
        return Array.from(bytes.slice(0, count))
          .map(byte => {
            if (byte >= 32 && byte <= 126) {
              return String.fromCharCode(byte);
            }
            return ".";
          })
          .join("");
      }

      for (let i = 0; i < FALLBACK_BASES.length; i++) {
        const base = FALLBACK_BASES[i];
        const url = base + frameworkPath;

        try {
          log("----------------------------------------");
          log("Testing framework mirror " + (i + 1));
          log(url);

          const response = await originalFetch(url, {
            method: "GET",
            cache: "no-store"
          });

          log("HTTP STATUS: " + response.status);
          log("CONTENT-TYPE: " +
            (response.headers.get("content-type") || "missing"));

          log("CONTENT-ENCODING: " +
            (response.headers.get("content-encoding") || "missing"));

          log("CONTENT-LENGTH: " +
            (response.headers.get("content-length") || "missing"));

          log("ACCEPT-RANGES: " +
            (response.headers.get("accept-ranges") || "missing"));

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const buffer = await response.arrayBuffer();
          const bytes = new Uint8Array(buffer);

          log("RECEIVED SIZE: " + buffer.byteLength + " bytes");
          log("FIRST 32 BYTES: " + bytesToHex(bytes));

          if (
            bytes[0] !== 0x1f ||
            bytes[1] !== 0x8b
          ) {
            throw new Error(
              "The framework does not have a GZIP header."
            );
          }

          // This is a real decompression test.
          // A matching 1f 8b prefix alone is not enough.
          let decompressed;

          try {
            decompressed = window.fflate.gunzipSync(bytes);
          } catch (error) {
            throw new Error(
              "GZIP decompression test failed: " +
              error.message
            );
          }

          if (!decompressed || decompressed.length < 1024) {
            throw new Error(
              "Decompressed framework is empty or too small."
            );
          }

          const decodedStart = new TextDecoder().decode(
            decompressed.subarray(0, 160)
          );

          log(
            "GZIP VALIDATION: SUCCESS (" +
            decompressed.length + " decompressed bytes)"
          );

          log(
            "DECOMPRESSED PREVIEW: " +
            decodedStart.substring(0, 120).replace(/\n/g, " ")
          );

          if (
            !decodedStart.includes("function") &&
            !decodedStart.includes("var ") &&
            !decodedStart.includes("Unity") &&
            !decodedStart.includes("(()=>")
          ) {
            log(
              "WARNING: Framework preview does not look like " +
              "ordinary JavaScript. Continuing because Unity " +
              "framework bundles can begin with other syntax."
            );
          }

          /*
            The downloaded body is already the original GZIP file.
            Do not set Content-Encoding: gzip here. Unity needs to
            receive these compressed bytes for its own processing.
          */

          const headers = new Headers(response.headers);

          headers.delete("content-encoding");
          headers.delete("content-length");
          headers.delete("transfer-encoding");
          headers.delete("content-range");

          headers.set(
            "content-type",
            "application/octet-stream"
          );

          const cachedResponse = new Response(buffer, {
            status: 200,
            statusText: "OK",
            headers
          });

          await cache.put(url, cachedResponse);

          BUILD_BASE_URL = base;

          log("FRAMEWORK RESPONSE SAVED.");
          log("SELECTED MIRROR: " + (i + 1));

          return BUILD_BASE_URL;

        } catch (error) {
          failures.push(
            "Mirror " + (i + 1) + ": " + error.message
          );

          log("MIRROR FAILED: " + error.message);
        }
      }

      throw new Error(
        "Every Unity framework mirror failed:\n" +
        failures.join("\n")
      );
    }

    /* =========================================================
       PATCH UNITY LOADER

       The upstream loader creates a Blob-based Worker to
       decompress .unityweb files.

       The runner has restrictions around dynamically created
       workers. The framework is only about 104 KB compressed,
       so we decompress that specific file with fflate directly.

       The large WASM and data files still use Unity's original
       decompression path.
    ========================================================= */

    function patchUnityLoaderSource(source) {
      const pattern =
        /return i = e\.parsedBody,\s*s = b\[t\],\s*new Promise\(function\(e, t\) \{/;

      if (!pattern.test(source)) {
        throw new Error(
          "Could not locate the expected Unity decompression " +
          "section in w-pt.loader.js. The upstream loader may " +
          "have changed."
        );
      }

      const replacement = `
        return i = e.parsedBody,
        s = b[t],
        s && /framework\\\\.js\\\\.unityweb(?:[?#]|$)/.test(s)
          ? Promise.resolve(
              window.fflate.gunzipSync(i)
            )
          : new Promise(function(e, t) {
      `;

      const patched = source.replace(
        pattern,
        replacement
      );

      if (patched === source) {
        throw new Error(
          "Unity loader patch did not modify the source."
        );
      }

      log(
        "Unity loader patched: framework decompression " +
        "will use fflate instead of a Worker."
      );

      return patched;
    }

    /* =========================================================
       UNITY BANNER
    ========================================================= */

    function unityShowBanner(message, type) {
      const div = document.createElement("div");

      div.textContent = message;
      div.style.padding = "10px";
      div.style.marginBottom = "5px";

      if (type === "error") {
        div.style.background = "#a00000";
      } else {
        div.style.background = "#8a6900";

        setTimeout(() => {
          div.remove();
        }, 5000);
      }

      document.getElementById("unity-warning").appendChild(div);
    }

    /* =========================================================
       START UNITY
    ========================================================= */

    async function startUnity() {
      setStatus("Checking Unity framework...");
      setProgress(96, "Validating game engine files...");

      unityLoadingBar.style.display = "block";

      await selectBuildMirror();

      const config = {
        dataUrl:
          BUILD_BASE_URL + "Build/w-pt.data.unityweb",

        frameworkUrl:
          BUILD_BASE_URL + "Build/w-pt.framework.js.unityweb",

        codeUrl:
          BUILD_BASE_URL + "Build/w-pt.wasm.unityweb",

        streamingAssetsUrl: "StreamingAssets",

        companyName: "EDUrocks Group, Truffled, GN-Math",
        productName: "Hollow Knight SilkSong",
        productVersion: "1.0",

        showBanner: unityShowBanner
      };

      const loaderUrl =
        BUILD_BASE_URL + "Build/w-pt.loader.js";

      log("Downloading Unity loader: " + loaderUrl);

      const loaderResponse = await originalFetch(loaderUrl, {
        method: "GET",
        cache: "no-store"
      });

      if (!loaderResponse.ok) {
        throw new Error(
          "Could not download Unity loader. HTTP " +
          loaderResponse.status
        );
      }

      let loaderSource = await loaderResponse.text();

      log(
        "Unity loader downloaded (" +
        loaderSource.length + " characters)."
      );

      loaderSource = patchUnityLoaderSource(loaderSource);

      const loaderBlob = new Blob(
        [loaderSource],
        { type: "text/javascript" }
      );

      const loaderObjectUrl =
        URL.createObjectURL(loaderBlob);

      const script = document.createElement("script");
      script.src = loaderObjectUrl;

      script.onload = async () => {
        URL.revokeObjectURL(loaderObjectUrl);

        try {
          log("Patched Unity loader executed.");

          if (typeof createUnityInstance !== "function") {
            throw new Error(
              "Unity loader loaded, but createUnityInstance is missing."
            );
          }

          const instance = await createUnityInstance(
            canvas,
            config,
            progress => {
              unityProgress.style.width =
                (progress * 100) + "%";

              progressDetail.textContent =
                "Unity is loading: " +
                Math.round(progress * 100) + "%";
            }
          );

          window.unityInstance = instance;

          log("Unity started successfully.");

          loadingScreen.style.display = "none";
          unityLoadingBar.style.display = "none";

        } catch (error) {
          showFatalError(error);
        }
      };

      script.onerror = () => {
        URL.revokeObjectURL(loaderObjectUrl);

        showFatalError(
          new Error(
            "Could not execute patched Unity loader: " +
            loaderUrl
          )
        );
      };

      document.body.appendChild(script);
    }

    /* =========================================================
       SAVE SYSTEM
    ========================================================= */

    function encodeValue(value) {
      if (value instanceof ArrayBuffer) {
        return {
          __type: "ArrayBuffer",
          data: arrayBufferToBase64(value)
        };
      }

      if (ArrayBuffer.isView(value)) {
        return {
          __type: "TypedArray",
          name: value.constructor.name,
          data: arrayBufferToBase64(
            value.buffer.slice(
              value.byteOffset,
              value.byteOffset + value.byteLength
            )
          )
        };
      }

      if (value instanceof Blob) {
        return {
          __type: "Blob",
          type: value.type,
          data: arrayBufferToBase64(value)
        };
      }

      if (value instanceof Date) {
        return {
          __type: "Date",
          data: value.toISOString()
        };
      }

      if (Array.isArray(value)) {
        return value.map(encodeValue);
      }

      if (value && typeof value === "object") {
        const output = {};

        for (const key of Object.keys(value)) {
          output[key] = encodeValue(value[key]);
        }

        return output;
      }

      return value;
    }

    function decodeValue(value) {
      if (!value || typeof value !== "object") {
        return value;
      }

      if (value.__type === "ArrayBuffer") {
        return base64ToArrayBuffer(value.data);
      }

      if (value.__type === "TypedArray") {
        const buffer = base64ToArrayBuffer(value.data);
        const constructor = window[value.name];

        if (typeof constructor !== "function") {
          throw new Error(
            "Unsupported typed array: " + value.name
          );
        }

        return new constructor(buffer);
      }

      if (value.__type === "Blob") {
        return new Blob(
          [base64ToArrayBuffer(value.data)],
          { type: value.type }
        );
      }

      if (value.__type === "Date") {
        return new Date(value.data);
      }

      if (Array.isArray(value)) {
        return value.map(decodeValue);
      }

      const output = {};

      for (const key of Object.keys(value)) {
        output[key] = decodeValue(value[key]);
      }

      return output;
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      let binary = "";

      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + chunkSize)
        );
      }

      return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes.buffer;
    }

    function requestResult(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function exportDatabase(dbName) {
      const db = await requestResult(indexedDB.open(dbName));

      const result = {
        name: db.name,
        version: db.version,
        stores: []
      };

      for (const storeName of Array.from(db.objectStoreNames)) {
        const transaction = db.transaction(
          storeName,
          "readonly"
        );

        const store = transaction.objectStore(storeName);

        const keys = await requestResult(store.getAllKeys());
        const values = await requestResult(store.getAll());

        result.stores.push({
          name: storeName,
          keyPath: store.keyPath,
          autoIncrement: store.autoIncrement,
          records: keys.map((key, index) => ({
            key: encodeValue(key),
            value: encodeValue(values[index])
          }))
        });
      }

      db.close();
      return result;
    }

    async function saveGame() {
      try {
        if (!indexedDB.databases) {
          throw new Error(
            "This browser does not support listing IndexedDB databases."
          );
        }

        const databases = await indexedDB.databases();

        const saveData = {
          format: "silksong-save",
          version: 1,
          created: new Date().toISOString(),
          databases: []
        };

        for (const info of databases) {
          if (!info.name) continue;

          const name = info.name.toLowerCase();

          if (
            !name.includes("unity") &&
            !name.includes("em_fs") &&
            !name.includes("idbfs")
          ) {
            continue;
          }

          log("Saving database: " + info.name);

          saveData.databases.push(
            await exportDatabase(info.name)
          );
        }

        if (!saveData.databases.length) {
          throw new Error(
            "No Unity save databases were found yet. " +
            "Play the game first, then save."
          );
        }

        const blob = new Blob(
          [JSON.stringify(saveData)],
          { type: "application/json" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = "Silksong-Game-Save.silksong-save";
        link.click();

        setTimeout(() => URL.revokeObjectURL(url), 3000);

        log("Save file exported successfully.");

      } catch (error) {
        alert("Save failed:\n" + error.message);
        log("SAVE ERROR: " + error.message);
      }
    }

    async function importDatabase(data) {
      const existing = await requestResult(
        indexedDB.open(data.name)
      );

      let version = existing.version;

      const missingStores = data.stores.filter(
        store => !existing.objectStoreNames.contains(store.name)
      );

      existing.close();

      if (missingStores.length) {
        version++;

        await new Promise((resolve, reject) => {
          const request = indexedDB.open(data.name, version);

          request.onupgradeneeded = () => {
            const db = request.result;

            for (const store of missingStores) {
              if (!db.objectStoreNames.contains(store.name)) {
                db.createObjectStore(store.name, {
                  keyPath: store.keyPath || undefined,
                  autoIncrement: !!store.autoIncrement
                });
              }
            }
          };

          request.onsuccess = () => {
            request.result.close();
            resolve();
          };

          request.onerror = () => reject(request.error);
        });
      }

      const db = await requestResult(indexedDB.open(data.name));

      for (const storeData of data.stores) {
        if (!db.objectStoreNames.contains(storeData.name)) {
          continue;
        }

        await new Promise((resolve, reject) => {
          const transaction = db.transaction(
            storeData.name,
            "readwrite"
          );

          const store = transaction.objectStore(storeData.name);

          store.clear();

          for (const record of storeData.records) {
            const key = decodeValue(record.key);
            const value = decodeValue(record.value);

            if (store.keyPath !== null) {
              store.put(value);
            } else {
              store.put(value, key);
            }
          }

          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error);
          transaction.onabort = () => reject(transaction.error);
        });
      }

      db.close();
    }

    async function loadGameFile(file) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);

        if (data.format !== "silksong-save") {
          throw new Error(
            "This is not a valid Silksong save file."
          );
        }

        if (!Array.isArray(data.databases)) {
          throw new Error(
            "The save file contains no database data."
          );
        }

        for (const database of data.databases) {
          log("Restoring database: " + database.name);
          await importDatabase(database);
        }

        alert(
          "Save imported. The page will reload to apply the restored progress."
        );

        location.reload();

      } catch (error) {
        alert("Load failed:\n" + error.message);
        log("LOAD ERROR: " + error.message);
      }
    }

    document.getElementById("save-button").addEventListener(
      "click",
      saveGame
    );

    document.getElementById("load-button").addEventListener(
      "click",
      () => document.getElementById("save-file").click()
    );

    document.getElementById("save-file").addEventListener(
      "change",
      event => {
        const file = event.target.files[0];

        if (file) loadGameFile(file);

        event.target.value = "";
      }
    );

    /* =========================================================
       FULLSCREEN
    ========================================================= */

    document.getElementById("fullscreen-button").addEventListener(
      "click",
      async () => {
        try {
          const target = document.getElementById("game");

          if (!document.fullscreenElement) {
            await target.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }

        } catch (error) {
          log("Fullscreen error: " + error.message);
        }
      }
    );

    /* =========================================================
       MAIN
    ========================================================= */

    async function main() {
      try {
        if (!window.fflate) {
          throw new Error("fflate failed to load.");
        }

        if (!("caches" in window)) {
          throw new Error(
            "Cache Storage is unavailable in this browser or HTML runner."
          );
        }

        setStatus("Checking saved game files...");
        log("Checking asset cache...");

        const cached = await cacheIsComplete();

        if (cached) {
          log("Complete asset cache found.");

          setStatus("Using previously downloaded game files.");
          setProgress(95, "Assets already cached.");

        } else {
          log(
            "No complete cache found. Starting parallel ZIP download."
          );

          const oldCacheNames = await caches.keys();

          for (const name of oldCacheNames) {
            if (
              name.startsWith("hksilksongcache-") &&
              name !== CACHE_NAME
            ) {
              await caches.delete(name);
            }
          }

          await streamDownloadAndExtract();
        }

        await startUnity();

      } catch (error) {
        showFatalError(error);
      }
    }

    main();

  })();
  </script>
</body>
