<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>The Simpsons: Hit &amp; Run</title>

<!-- CSS will be injected by the fallback loader below -->
<link id="dynamic-css" rel="stylesheet" href="">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/user.png">

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

body {
  position: relative;
  display: block;
  min-height: 100vh;
  min-height: 100dvh;
}

#game {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #000;
}

#game canvas {
  position: absolute !important;
  inset: 0 !important;
  display: block !important;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  transform: none !important;
  object-fit: contain;
}

#loading {
  position: fixed !important;
  inset: 0 !important;
  z-index: 99999 !important;
  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  padding: 20px;
  margin: 0;
  overflow: hidden;
  background: #000 !important;
  color: #fff;
  text-align: center;
}

#loading[hidden] {
  display: none !important;
}

#loading img {
  display: block;
  width: min(520px, 82vw);
  max-width: 82vw;
  max-height: 55vh;
  height: auto;
  object-fit: contain;
  margin: 0 auto 25px;
}

.loading-track {
  display: block !important;
  position: relative;
  width: min(340px, 78vw) !important;
  height: 10px !important;
  min-height: 10px;
  margin: 0 auto;
  padding: 0;
  overflow: hidden;
  border: 1px solid #777;
  border-radius: 20px;
  background: #292929 !important;
  flex: none;
}

#load-progress {
  display: block !important;
  position: absolute;
  top: 0;
  left: 0;
  width: 0%;
  height: 100% !important;
  max-width: 100%;
  border: 0;
  border-radius: 20px;
  background: #55d34a !important;
  transition: width .2s ease;
}

#load-message {
  display: block !important;
  max-width: 90vw;
  margin: 15px auto 0 !important;
  color: #fff !important;
  font-family: Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  overflow-wrap: anywhere;
}

#hud, #menu {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

#hud[hidden], #menu[hidden] {
  display: none !important;
}

/* Diagnostic console */

#error-console {
  position: fixed;
  z-index: 100000;
  left: 10px;
  right: 10px;
  bottom: 10px;
  max-height: 42vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(8, 8, 12, .96);
  color: #eee;
  border: 1px solid #777;
  border-radius: 9px;
  font: 12px/1.45 monospace;
  box-shadow: 0 4px 24px #000;
}

#error-console[hidden] {
  display: none !important;
}

#error-console header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  background: #24242b;
  border-bottom: 1px solid #555;
}

#error-console header strong {
  color: #ffcf55;
}

#error-console header div {
  display: flex;
  gap: 5px;
}

#error-console button {
  padding: 5px 9px;
  color: white;
  background: #444;
  border: 1px solid #777;
  border-radius: 4px;
  font: inherit;
}

#error-log {
  padding: 9px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 65px;
  max-height: 30vh;
}

.error-entry {
  padding: 3px 0;
  border-bottom: 1px solid #333;
}

.error-entry.error {
  color: #ff7777;
}

.error-entry.warn {
  color: #ffd36a;
}

.error-entry.info {
  color: #8ed5ff;
}

#error-console.collapsed #error-log {
  display: none;
}

@media(max-width:600px) {
  #loading {
    padding: 12px;
  }

  #loading img {
    width: min(78vw, 58vh);
    max-height: 48vh;
    margin-bottom: 18px;
  }

  .loading-track {
    width: min(290px, 76vw) !important;
    height: 8px !important;
    min-height: 8px;
  }

  #load-message {
    font-size: 13px;
  }

  #error-console {
    left: 5px;
    right: 5px;
    bottom: 5px;
    max-height: 38vh;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<main id="game" aria-label="Hit and Run driving game"></main>

<div id="loading" role="status">
  <img
    id="game-logo"
    src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/gamelogo.png"
    alt="The Simpsons Hit and Run"
  >
  <div class="loading-track">
    <i id="load-progress"></i>
  </div>
  <p id="load-message">Starting game...</p>
</div>

<div id="hud" hidden>
  <div class="state-bridge" hidden aria-hidden="true">
    <span id="district"></span>
    <span id="place-name"></span>
    <span id="mode-badge">FREE DRIVE</span>
    <span id="coin-count">0 / 0</span>
    <div id="challenge-hud">
      <span id="objective"></span>
      <span id="checkpoint"></span>
      <span id="timer"></span>
      <i id="challenge-progress"></i>
    </div>
    <div id="toast"></div>
    <canvas id="minimap" width="360" height="360"></canvas>
    <span id="map-caption"></span>
    <div id="drive-hints"></div>
    <span id="car-label">FAMILY SEDAN</span>
    <span id="gear">N</span>
    <span id="speed">0</span>
    <i id="speed-progress"></i>
    <span id="condition">100%</span>
    <i id="condition-progress"></i>
  </div>

  <button id="pause" class="touch-pause" aria-label="Pause game">START</button>

  <div id="touch-controls">
    <div>
      <button data-key="KeyA" aria-label="Steer left">←</button>
      <button data-key="KeyD" aria-label="Steer right">→</button>
    </div>
    <div>
      <button data-key="KeyE" aria-label="Enter or exit car">
        <img
          src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/but_actn.png"
          alt=""
          data-fallback-asset="but_actn.png"
        >
      </button>
      <button data-key="Space" aria-label="Handbrake or jump">
        <img
          src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/but_hand.png"
          alt=""
          data-fallback-asset="but_hand.png"
        >
      </button>
      <button data-key="KeyS" aria-label="Brake or reverse">
        <img
          src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/but_brak.png"
          alt=""
          data-fallback-asset="but_brak.png"
        >
      </button>
      <button data-key="KeyW" aria-label="Accelerate">
        <img
          src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Hit-and-Run@184c4231f02a984aa2d783affdaed843af4631d0/public/assets/ui/but_gas.png"
          alt=""
          data-fallback-asset="but_gas.png"
        >
      </button>
    </div>
  </div>
</div>

<section id="menu" hidden aria-label="Game menu">
  <div class="state-bridge" hidden aria-hidden="true">
    <button id="play"><span>Continue</span></button>
    <button id="challenge">Springfield Run</button>
    <span id="menu-place"></span>
    <span id="scene-info"></span>
  </div>

  <div class="settings-grid" hidden>
    <label>
      LEVEL
      <select id="level">
        <option value="1">1 · Homer</option>
        <option value="2">2 · Bart</option>
        <option value="3">3 · Lisa</option>
        <option value="4">4 · Marge</option>
        <option value="5">5 · Apu</option>
        <option value="6">6 · Bart</option>
        <option value="7">7 · Homer</option>
      </select>
    </label>
    <label>VEHICLE<select id="car"></select></label>
    <label>
      LIGHTING
      <select id="lighting">
        <option value="golden">Golden hour</option>
        <option value="day">Afternoon</option>
        <option value="night">Blue hour</option>
      </select>
    </label>
    <label>START AT<select id="location"></select></label>
  </div>

  <div class="menu-footer" hidden>
    <button id="sound" aria-pressed="false">SOUND OFF</button>
    <button id="quality">HIGH QUALITY</button>
    <button id="fullscreen">FULLSCREEN</button>
  </div>
</section>

<div id="debug" hidden></div>

<div id="error-console">
  <header>
    <strong>GAME DIAGNOSTICS</strong>
    <div>
      <button id="copy-log">Copy Log</button>
      <button id="clear-log">Clear</button>
      <button id="toggle-log">Hide</button>
    </div>
  </header>
  <div id="error-log">
    <div class="error-entry info">Diagnostic console started. Waiting for game...</div>
  </div>
</div>

<script>
(function () {
  const panel = document.getElementById("error-console");
  const output = document.getElementById("error-log");
  const toggle = document.getElementById("toggle-log");

  function log(message, type = "info") {
    const entry = document.createElement("div");
    entry.className = "error-entry " + type;
    entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + message;
    output.appendChild(entry);
    output.scrollTop = output.scrollHeight;

    while (output.children.length > 250) {
      output.removeChild(output.firstChild);
    }

    if (type === "error") {
      panel.hidden = false;
      panel.classList.remove("collapsed");
      toggle.textContent = "Hide";
    }
  }

  window.addEventListener("error", function (event) {
    if (event.target && event.target !== window) {
      const target = event.target;
      log(
        "RESOURCE FAILED: " +
        (target.src || target.href || target.tagName || "Unknown resource"),
        "error"
      );
      return;
    }

    log(
      "JAVASCRIPT ERROR: " + (event.message || "Unknown error") +
      (event.filename ? "\nFile: " + event.filename : "") +
      (event.lineno ? "\nLine: " + event.lineno : "") +
      (event.colno ? "\nColumn: " + event.colno : "") +
      (event.error && event.error.stack ? "\n" + event.error.stack : ""),
      "error"
    );
  }, true);

  window.addEventListener("unhandledrejection", function (event) {
    const reason = event.reason;
    log(
      "UNHANDLED PROMISE: " +
      (reason && reason.stack ? reason.stack :
       reason && reason.message ? reason.message : String(reason)),
      "error"
    );
  });

  window.addEventListener("load", function () {
    log("Page load event completed.", "info");
  });

  document.addEventListener("DOMContentLoaded", function () {
    log("HTML document initialized.", "info");
  });

  const originalFetch = window.fetch;

  window.fetch = async function (...args) {
    const url = String(
      args[0] && args[0].url ? args[0].url : args[0]
    );

    try {
      const response = await originalFetch.apply(this, args);

      if (!response.ok) {
        log(
          "HTTP " + response.status + " " + response.statusText +
          "\n" + url,
          "error"
        );
      }

      return response;
    } catch (error) {
      log("FETCH FAILED: " + url + "\n" + error, "error");
      throw error;
    }
  };

  document.getElementById("clear-log").onclick = function () {
    output.replaceChildren();
    log("Log cleared.", "info");
  };

  document.getElementById("copy-log").onclick = async function () {
    const content = Array.from(output.children)
      .map(entry => entry.textContent)
      .join("\n");

    try {
      await navigator.clipboard.writeText(content);
      log("Log copied to clipboard.", "info");
    } catch (error) {
      log("Clipboard unavailable: " + error, "warn");
    }
  };

  toggle.onclick = function () {
    panel.classList.toggle("collapsed");
    toggle.textContent = panel.classList.contains("collapsed")
      ? "Show"
      : "Hide";
  };

  log("Error and resource monitoring enabled.", "info");
})();
</script>

<script>
/**
 * Multi-CDN fallback engine.
 *
 * For each logical asset we define an ordered list of candidate URLs.
 * The loader tries them one-by-one. If a candidate fails (404, 403,
 * rate-limit, MIME mismatch, network error), it automatically moves
 * to the next one. Only when every candidate has failed does it
 * report an error and stop.
 *
 * The chain for JS/CSS is:
 *   1. jsDelivr (primary)
 *   2. jsDelivr fastly mirror
 *   3. jsDelivr gcore mirror
 *   4. Statically
 *   5. raw.githack (production / CDN)
 *   6. raw.githack (development)
 *   7. GitHub API (raw media type) – last resort before giving up
 *
 * Images use a shorter chain (CDNs → GitHub API) and are handled
 * individually via data-fallback-asset attributes.
 */
(function () {
  "use strict";

  /* ------------------------------------------------------------------
   *  Shared constants
   * ------------------------------------------------------------------ */
  var REPO_OWNER  = "AMoldyWaffle";
  var REPO_NAME   = "Hit-and-Run";
  var COMMIT_CSS  = "f1fc1e8b6b2d9be5f6578edf31923decf6bf1692";
  var COMMIT_JS   = "4b7e794c2b9271bac69f421ce08572a33aed3004";
  var COMMIT_UI   = "184c4231f02a984aa2d783affdaed843af4631d0";

  /* ------------------------------------------------------------------
   *  Asset candidate lists
   * ------------------------------------------------------------------ */
  var CSS_CANDIDATES = [
    // jsDelivr – primary
    "https://cdn.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_CSS + "/offline/app.css",
    // jsDelivr – Fastly edge
    "https://fastly.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_CSS + "/offline/app.css",
    // jsDelivr – Gcore edge
    "https://gcore.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_CSS + "/offline/app.css",
    // Statically
    "https://cdn.statically.io/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_CSS + "/offline/app.css",
    // raw.githack – production CDN
    "https://rawcdn.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_CSS + "/offline/app.css",
    // raw.githack – development
    "https://raw.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_CSS + "/offline/app.css",
    // GitHub API – raw media type (last resort)
    {
      type: "api",
      url: "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/offline/app.css?ref=" + COMMIT_CSS,
      accept: "application/vnd.github.raw+json"
    }
  ];

  var JS_CANDIDATES = [
    // jsDelivr – primary
    "https://cdn.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_JS + "/offline/app.js",
    // jsDelivr – Fastly edge
    "https://fastly.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_JS + "/offline/app.js",
    // jsDelivr – Gcore edge
    "https://gcore.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_JS + "/offline/app.js",
    // Statically
    "https://cdn.statically.io/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_JS + "/offline/app.js",
    // raw.githack – production CDN
    "https://rawcdn.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_JS + "/offline/app.js",
    // raw.githack – development
    "https://raw.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_JS + "/offline/app.js",
    // GitHub API – raw media type (last resort)
    {
      type: "api",
      url: "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/offline/app.js?ref=" + COMMIT_JS,
      accept: "application/vnd.github.raw+json"
    }
  ];

  /* ------------------------------------------------------------------
   *  Generic loader
   * ------------------------------------------------------------------ */
  function loadAsset(candidates, tagName, injectFn, onAllFailed) {
    var index = 0;

    function tryNext() {
      if (index >= candidates.length) {
        if (onAllFailed) onAllFailed();
        return;
      }

      var candidate = candidates[index++];
      var isApi = typeof candidate === "object" && candidate.type === "api";
      var url   = isApi ? candidate.url : candidate;

      console.log("[Fallback] Trying " + tagName + ": " + url);

      if (isApi) {
        // GitHub API path: fetch raw content with the correct Accept header
        fetch(url, {
          headers: { Accept: candidate.accept || "application/vnd.github.raw+json" }
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return response.text();
          })
          .then(function (content) {
            injectFn(content, url);
          })
          .catch(function (err) {
            console.warn("[Fallback] GitHub API failed for " + tagName + ": " + err);
            tryNext();
          });
        return;
      }

      // Normal URL path: use a <script>/<link> element with onerror
      var el;
      if (tagName === "script") {
        el = document.createElement("script");
        el.src = url;
      } else if (tagName === "link") {
        el = document.createElement("link");
        el.rel = "stylesheet";
        el.href = url;
      } else {
        return tryNext();
      }

      el.onload = function () {
        console.log("[Fallback] Successfully loaded " + tagName + " from: " + url);
      };

      el.onerror = function () {
        console.warn("[Fallback] Failed to load " + tagName + " from: " + url);
        el.remove();
        tryNext();
      };

      if (tagName === "link") {
        // <link> does not fire onload/onerror reliably in all browsers,
        // so we also set a timeout to advance the chain.
        var timeout = setTimeout(function () {
          console.warn("[Fallback] Timeout for " + tagName + ": " + url);
          el.remove();
          tryNext();
        }, 8000);
        el.onload = function () {
          clearTimeout(timeout);
          console.log("[Fallback] Successfully loaded " + tagName + " from: " + url);
        };
        el.onerror = function () {
          clearTimeout(timeout);
          el.remove();
          tryNext();
        };
      }

      document.head.appendChild(el);
    }

    tryNext();
  }

  /* ------------------------------------------------------------------
   *  Inject helpers for API-loaded content
   * ------------------------------------------------------------------ */
  function injectScript(content, sourceUrl) {
    var script = document.createElement("script");
    script.textContent = content;
    document.head.appendChild(script);
    console.log("[Fallback] Executed script from GitHub API: " + sourceUrl);
  }

  function injectCss(content, sourceUrl) {
    var style = document.createElement("style");
    style.textContent = content;
    document.head.appendChild(style);
    console.log("[Fallback] Injected CSS from GitHub API: " + sourceUrl);
  }

  /* ------------------------------------------------------------------
   *  Kick off CSS and JS loading
   * ------------------------------------------------------------------ */
  var loadMessage = document.getElementById("load-message");

  loadAsset(
    CSS_CANDIDATES,
    "link",
    injectCss,
    function () {
      console.error("[Fallback] All CSS sources failed.");
      loadMessage.textContent = "Warning: stylesheet could not be loaded from any source. The game may look broken.";
    }
  );

  loadAsset(
    JS_CANDIDATES,
    "script",
    injectScript,
    function () {
      console.error("[Fallback] All JavaScript sources failed.");
      loadMessage.textContent = "Error: game script could not be loaded from any source (CDN + GitHub API). Check the diagnostics console.";
    }
  );

  /* ------------------------------------------------------------------
   *  Image fallback chain
   *
   *  Every <img> that carries a data-fallback-asset attribute gets its
   *  own retry chain. The original src is already the first jsDelivr
   *  URL in the HTML, so we start from the next candidate.
   * ------------------------------------------------------------------ */
  var IMAGE_CANDIDATES = [
    // jsDelivr – Fastly edge
    "https://fastly.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_UI + "/public/assets/ui/",
    // jsDelivr – Gcore edge
    "https://gcore.jsdelivr.net/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_UI + "/public/assets/ui/",
    // Statically
    "https://cdn.statically.io/gh/" + REPO_OWNER + "/" + REPO_NAME + "@" + COMMIT_UI + "/public/assets/ui/",
    // raw.githack – production
    "https://rawcdn.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_UI + "/public/assets/ui/",
    // raw.githack – development
    "https://raw.githack.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + COMMIT_UI + "/public/assets/ui/"
  ];

  function setupImageFallbacks() {
    var images = document.querySelectorAll("img[data-fallback-asset]");
    images.forEach(function (img) {
      var filename = img.getAttribute("data-fallback-asset");
      var attempt  = 0;

      img.addEventListener("error", function onImageError() {
        if (attempt >= IMAGE_CANDIDATES.length) {
          console.warn("[Fallback] All image sources failed for: " + filename);
          img.removeEventListener("error", onImageError);
          // Optionally show a placeholder or hide the image
          img.alt = "Image unavailable";
          return;
        }
        var base = IMAGE_CANDIDATES[attempt++];
        var newUrl = base + filename;
        console.log("[Fallback] Trying image fallback for " + filename + ": " + newUrl);
        img.src = newUrl;
      });
    });
  }

  // Run image fallbacks after DOM is ready
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupImageFallbacks);
  } else {
    setupImageFallbacks();
  }

  /* ------------------------------------------------------------------
   *  Also fallback for the main logo (no data attribute needed)
   * ------------------------------------------------------------------ */
  var logo = document.getElementById("game-logo");
  if (logo) {
    var logoAttempt = 0;
    logo.addEventListener("error", function onLogoError() {
      if (logoAttempt >= IMAGE_CANDIDATES.length) {
        logo.removeEventListener("error", onLogoError);
        console.warn("[Fallback] All logo sources failed.");
        return;
      }
      var base = IMAGE_CANDIDATES[logoAttempt++];
      var newUrl = base + "gamelogo.png";
      console.log("[Fallback] Trying logo fallback: " + newUrl);
      logo.src = newUrl;
    });
  }
})();
</script>

</body>
</html>
