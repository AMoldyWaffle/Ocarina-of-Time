
<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Run emulator pages on their own GitHub Pages origin, outside proxy rewriting. */
if (location.origin !== "https://amoldywaffle.github.io") {
  location.replace("https://amoldywaffle.github.io/Ocarina-of-Time/Games/Super%20Mario%20World/");
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario World</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  position: absolute;
  inset: 0;
  background: #000;
}

#emulator {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#emulator iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  background: #000;
  color: white;
  font-size: 16px;
  white-space: pre-line;
  pointer-events: none;
}

#overlay.hidden {
  display: none;
}

#consoleButton {
  position: fixed;
  z-index: 1000;
  right: 14px;
  bottom: 14px;
  padding: 9px 14px;
  border: 1px solid #555;
  border-radius: 7px;
  background: #202126;
  color: white;
  font-size: 13px;
  cursor: pointer;
  opacity: 0.75;
}

#consoleButton:hover {
  opacity: 1;
  background: #34363d;
}

#consolePanel {
  display: none;
  position: fixed;
  z-index: 999;
  left: 12px;
  right: 12px;
  bottom: 58px;
  max-height: 38vh;
  overflow: auto;
  padding: 12px;
  border: 1px solid #444;
  border-radius: 8px;
  background: rgba(12, 13, 17, 0.96);
  color: #ccc;
  font: 12px/1.5 Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#consolePanel.visible {
  display: block;
}
</style>
</head>

<body>

<div id="screen">
  <div id="emulator"></div>
  <div id="overlay">Starting Super Mario World...</div>
</div>

<div id="consolePanel"></div>
<button id="consoleButton" type="button">Console</button>

<script>
(async function () {
  "use strict";

  const BASE =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Emulator/Waffle/";

  const ROM_URL =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Games/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";

  const ROM_NAME = "Super Mario World (USA).sfc";

  const overlay = document.getElementById("overlay");
  const consolePanel = document.getElementById("consolePanel");
  const consoleButton = document.getElementById("consoleButton");
  const container = document.getElementById("emulator");

  let emulatorStarted = false;
  let emulator;

  consoleButton.addEventListener("click", () => {
    const visible = consolePanel.classList.toggle("visible");
    consoleButton.textContent = visible ? "Hide Console" : "Console";
  });

  function log(message) {
    const line = "[SMW Launcher] " + message;

    console.log(line);
    consolePanel.textContent += line + "\n";
    consolePanel.scrollTop = consolePanel.scrollHeight;
  }

  function status(message) {
    log(message);
    overlay.textContent = message;
    overlay.classList.remove("hidden");
  }

  function fail(error) {
    const message = error?.message || String(error);

    overlay.textContent = "Unable to start game:\n" + message;
    overlay.classList.remove("hidden");

    log("ERROR: " + message);

    if (error?.stack) {
      log(error.stack);
    }

    console.error("[SMW Launcher]", error);

    consolePanel.classList.add("visible");
    consoleButton.textContent = "Hide Console";
  }

  function timeout(promise, milliseconds, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error(message));
        }, milliseconds);
      })
    ]);
  }

  async function checkFile(url, description) {
    log("Checking " + description + "...");

    const response = await fetch(url, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        description + " returned HTTP " + response.status
      );
    }

    log(description + " is accessible.");
    return response;
  }

  try {
    // Download ROM
    status("Downloading Super Mario World...");

    const romResponse = await fetch(ROM_URL, {
      cache: "default"
    });

    if (!romResponse.ok) {
      throw new Error(
        "ROM download failed: HTTP " + romResponse.status
      );
    }

    const romBuffer = await romResponse.arrayBuffer();

    if (romBuffer.byteLength !== 524288) {
      throw new Error(
        "Unexpected ROM size: " + romBuffer.byteLength + " bytes"
      );
    }

    log("ROM downloaded: " + romBuffer.byteLength + " bytes");

    // Verify the SNES core report exists
    status("Checking emulator files...");

    const reportResponse = await checkFile(
      BASE + "cores/reports/snes9x.json",
      "SNES core report"
    );

    const reportText = await reportResponse.text();

    let report;

    try {
      report = JSON.parse(reportText);
    } catch {
      throw new Error("The SNES core report is not valid JSON.");
    }

    if (report.core !== "snes9x") {
      throw new Error(
        "Unexpected core report: " + JSON.stringify(report)
      );
    }

    log("SNES core report validated.");

    // Download Waffle loader
    status("Loading emulator...");

    const loaderResponse = await fetch(BASE + "loader.js", {
      cache: "default"
    });

    if (!loaderResponse.ok) {
      throw new Error(
        "Loader download failed: HTTP " + loaderResponse.status
      );
    }

    const loaderCode = await loaderResponse.text();

    if (!loaderCode.includes("WafflesEmu")) {
      throw new Error("Downloaded loader.js is invalid.");
    }

    const script = document.createElement("script");
    script.textContent = loaderCode;
    document.head.appendChild(script);

    if (!window.WafflesEmu) {
      throw new Error("Waffle loader failed to initialize.");
    }

    // Open emulator
    status("Opening emulator...");

    emulator = await WafflesEmu.open(BASE, {
      container: container,

      // Explicitly point EmulatorJS at the repository root.
      // Core files are located inside BASE + "cores/".
      dataBase: BASE
    });

    // Capture errors from inside the emulator iframe
    if (emulator.frame) {
      emulator.frame.addEventListener("load", () => {
        log("Emulator iframe loaded.");

        try {
          const frameWindow = emulator.frame.contentWindow;

          frameWindow.addEventListener("error", event => {
            log(
              "IFRAME JAVASCRIPT ERROR: " +
              (event.message || "Unknown error")
            );

            if (event.filename) {
              log("File: " + event.filename);
            }

            if (event.lineno) {
              log("Line: " + event.lineno);
            }

            if (event.error?.stack) {
              log(event.error.stack);
            }
          });

          frameWindow.addEventListener(
            "unhandledrejection",
            event => {
              log(
                "IFRAME PROMISE ERROR: " +
                (event.reason?.stack ||
                 event.reason?.message ||
                 String(event.reason))
              );
            }
          );
        } catch (error) {
          log(
            "Could not attach iframe error listeners: " +
            error.message
          );
        }
      });
    }

    // Listen for Waffle events
    emulator.on(message => {
      if (!message || !message.evt) return;

      log("Waffle event: " + message.evt);

      switch (message.evt) {
        case "hello":
          log("Emulator handshake received.");
          break;

        case "loading":
          status("Loading game...");
          break;

        case "started":
          emulatorStarted = true;
          overlay.classList.add("hidden");
          log("Super Mario World started!");
          break;

        case "error":
          fail(
            new Error(
              message.msg || "The emulator reported an error."
            )
          );
          break;
      }
    });

    // Wait for emulator handshake
    status("Initializing emulator...");

    await timeout(
      emulator.ready,
      45000,
      "Waffle initialization timed out."
    );

    log("Waffle is ready.");

    // Send ROM
    status("Launching Super Mario World...");

    const romFile = new File(
      [romBuffer],
      ROM_NAME,
      {
        type: "application/octet-stream"
      }
    );

    await emulator.load(romFile, {
      system: "snes",
      core: "snes9x"
    });

    log("ROM sent to emulator.");

    // Detect a game that never finishes starting
    setTimeout(() => {
      if (!emulatorStarted) {
        log(
          "The emulator has not reported that the game started."
        );

        log(
          "Check the iframe error messages above for the actual core-loading failure."
        );
      }
    }, 30000);

  } catch (error) {
    fail(error);
  }
})();
</script>

</body>
</html>
