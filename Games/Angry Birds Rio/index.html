    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
        #stage { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
        #canvas.playing { cursor: none; }
        #canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #000; outline: none; image-rendering: auto; }
        #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 15px; color: #9ab; text-align: center; pointer-events: none; max-width: 80vw; line-height: 1.5; }
        #bar { position: fixed; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); width: min(360px, 70vw); height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        #bar > div { height: 100%; width: 0; background: #6aa7ff; transition: width .15s; }
        #fps { display: none; position: fixed; top: 8px; right: 10px; font: 12px ui-monospace, monospace; color: #7f7; background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 3px; pointer-events: none; }
        #log-container { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; background: rgba(16,16,16,0.92); border-top: 1px solid #333; overflow-y: scroll; padding: 6px 10px; font: 11px ui-monospace, monospace; display: none; pointer-events: none; }
        #resbtn { position: fixed; right: 8px; bottom: 8px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: rgba(20,20,24,0.55); color: #cde; font: 15px/26px system-ui, sans-serif; text-align: center; cursor: pointer; opacity: 0.28; transition: opacity .15s; z-index: 5; display: none; }
        #resbtn:hover, #resbtn:focus-visible, body.respanel #resbtn { opacity: 0.95; outline: none; }
        #respanel { position: fixed; right: 8px; bottom: 40px; min-width: 210px; padding: 10px 12px; background: rgba(18,18,22,0.94); border: 1px solid #3a3f4a; border-radius: 8px; font: 12px system-ui, sans-serif; color: #cfd6e0; display: none; z-index: 6; }
        body.respanel #respanel { display: block; }
        #respanel label { display: block; margin-bottom: 5px; font-weight: 600; }
        #respanel select { width: 100%; padding: 4px; background: #23262d; color: #e6ebf2; border: 1px solid #454b57; border-radius: 4px; font: inherit; }
        #respanel .hint { margin-top: 7px; color: #8d97a6; line-height: 1.35; }
        body.dev #log-container { display: block; }
        body.dev #fps { display: block; }
        .log-line { margin: 1px 0; white-space: pre-wrap; }
        .log-err { color: #f66; }
        .log-info { color: #8bf; }
    </style>

        const n = evq.length;
        if (t === 9 && n >= 4 && evq[n - 4] === 9) { evq[n - 3] = a | 0; evq[n - 2] = b | 0; }           // coalesce pointer moves
        else if (t === 8 && n >= 4 && evq[n - 4] === 8) { evq[n - 3] += a | 0; evq[n - 2] += b | 0; }
        else evq.push(t, a | 0, b | 0, c | 0);
        if (t === 9 || t === 8) { if (!flushQueued) { flushQueued = true; requestAnimationFrame(flushIn); setTimeout(flushIn, 40); } }
        else flushIn();
    }

    // Audio: the worker sends interleaved stereo float chunks (48 kHz); they are queued on the audio clock.
    const AUD_RATE = 48000;
    async function ensureAudio() {
        if (audioCtx) { if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); return; }
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: AUD_RATE, latencyHint: 'interactive' });
            audioCtx.onstatechange = () => { window.yuki_audio = { state: audioCtx.state }; };
            await audioCtx.resume();
            window.yuki_audio = { state: audioCtx.state };
        } catch (err) { window.yuki_audio = { state: 'error: ' + err }; audioCtx = null; }
    }
    for (const t of ['pointerdown', 'keydown', 'touchstart']) window.addEventListener(t, ensureAudio, { capture: true });
    function playChunk(buf) {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const f = new Float32Array(buf), n = f.length >> 1;
        if (!n) return;
        const now = audioCtx.currentTime;
        if (audNext < now + 0.03) audNext = now + 0.08;          // (re)start with a little head-room
        if (audNext > now + 0.6) return;                         // far behind real time: drop instead of growing latency
        const ab = audioCtx.createBuffer(2, n, AUD_RATE), L = ab.getChannelData(0), R = ab.getChannelData(1);
        for (let i = 0, j = 0; i < n; i++, j += 2) { L[i] = f[j]; R[i] = f[j + 1]; }
        const src = audioCtx.createBufferSource();
        src.buffer = ab; src.connect(audioCtx.destination); src.start(audNext);
        audNext += n / AUD_RATE;
    }

    // Saves (IndexedDB; the worker posts changed files)
    const SAVEDB = 'yuki-saves:angrybirds-offline';
    const saveDb = () => new Promise((res, rej) => { const q = indexedDB.open(SAVEDB, 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    const loadSaves = async () => {
        let db;
        try {
            db = await saveDb();
            return await new Promise((resolve, reject) => {
                const output = [];
                const transaction = db.transaction('f', 'readonly');
                const request = transaction.objectStore('f').openCursor();
                request.onsuccess = () => {
                    const cursor = request.result;
                    if (cursor) {
                        output.push({ path: cursor.key, data: cursor.value });
                        cursor.continue();
                    } else {
                        resolve(output);
                    }
                };
                request.onerror = () => reject(request.error || new Error('Could not read saved game files.'));
                transaction.onerror = () => reject(transaction.error || new Error('Save database read failed.'));
                transaction.onabort = () => reject(transaction.error || new Error('Save database read was cancelled.'));
            });
        } catch (error) {
            addLog('[save] Could not load saved files: ' + error.message, true);
            return [];
        } finally {
            if (db) db.close();
        }
    };
    const storeSaves = async (files) => {
        if (!Array.isArray(files) || !files.length) return;
        let db;
        try {
            db = await saveDb();
            await new Promise((resolve, reject) => {
                const transaction = db.transaction('f', 'readwrite');
                const store = transaction.objectStore('f');
                for (const file of files) {
                    if (file && typeof file.path === 'string') {
                        store.put(file.data, file.path);
                    }
                }
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error || new Error('Save database write failed.'));
                transaction.onabort = () => reject(transaction.error || new Error('Save database write was cancelled.'));
            });
        } catch (error) {
            addLog('[save] Could not persist game files: ' + error.message, true);
        } finally {
            if (db) db.close();
        }
    };

    if (dev) setInterval(() => addLog('[main] frames=' + window.yuki_frames + ' status=' + window.yuki_status + ' idle=' + Math.round(performance.now() - lastAlive) + 'ms', false), 5000);
    let lastAlive = performance.now(), hungShown = false;
    function alive() { lastAlive = performance.now(); if (hungShown) { hungShown = false; if (window.yuki_frames > 0) statusEl.style.display = 'none'; } }
    setInterval(() => {
        if (document.hidden || !worker) return;
        if (!window.yuki_boot_done && window.yuki_status !== 'booting') return;
        const idle = performance.now() - lastAlive;
        if (idle > 20000 && !hungShown) {
            hungShown = true; statusEl.style.display = ''; statusEl.style.color = '#fc6';
            statusEl.textContent = 'The game has not responded for ' + Math.round(idle / 1000) + 's (busy or hung).';
        }
    }, 2000);

    function onWorkerMessage(e) {
        const data = e.data;
        alive();
        switch (data.type) {
            case 'save': storeSaves(data.files); break;
            case 'audio': playChunk(data.data); break;
            case 'credit': creditRect = data.rect; break;
            case 'heartbeat': break;
            case 'fatal': showFatal(data.text); break;
            case 'bitmap': {
                const b = data.bmp;
                worker.postMessage({ type: 'ack' });
                if (document.hidden) { b.close(); break; }
                if (canvas.width !== b.width) canvas.width = b.width;
                if (canvas.height !== b.height) canvas.height = b.height;
                fitCanvas(); ctx.drawImage(b, 0, 0); b.close(); frameDone();
                break;
            }
            case 'frame': {
                if (canvas.width !== data.w) canvas.width = data.w;
                if (canvas.height !== data.h) canvas.height = data.h;
                fitCanvas(); ctx.putImageData(new ImageData(new Uint8ClampedArray(data.rgba), data.w, data.h), 0, 0); frameDone();
                break;
            }
            case 'log': addLog(data.text, data.isErr); break;
            case 'status': if (window.yuki_frames === 0) { statusEl.textContent = data.text; barEl.style.display = 'none'; } window.yuki_status = data.text; break;
            case 'boot_started': window.yuki_status = 'booting'; break;
            case 'boot_completed': window.yuki_status = 'running'; window.yuki_boot_done = true; break;
        }
    }

    // ---------------------------------------------------------------- keyboard / mouse
    const keyTimers = {};
    function setKey(vk, down) {
        if (vk < 0 || vk > 255) return;
        clearTimeout(keyTimers[vk]);
        if (down) { pushEv(100, vk, 1, 0); return; }
        keyTimers[vk] = setTimeout(() => pushEv(100, vk, 0, 0), 90);   // brief hold for polled input
    }
    function key(e, down) {
        if (e.target && e.target.closest && e.target.closest('#respanel, #resbtn')) return;
        if (e.repeat && down) { pushEv(1, e.keyCode, 0, 0); return; }
        setKey(e.keyCode, down);
        pushEv(down ? 1 : 2, e.keyCode, 0, 0);
        if (down && e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey) pushEv(3, e.key.charCodeAt(0), 0, 0);
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab', 'Backspace'].includes(e.key)) e.preventDefault();
    }
    window.addEventListener('keydown', (e) => key(e, true));
    window.addEventListener('keyup', (e) => key(e, false));
    window.addEventListener('blur', () => { for (let vk = 0; vk < 256; vk++) pushEv(100, vk, 0, 0); });

    function normXY(e) {
        const r = canvas.getBoundingClientRect();
        const f = (v, lo, sz) => Math.max(0, Math.min(65535, Math.round((v - lo) / sz * 65536 - 0.5)));
        return [f(e.clientX, r.left, r.width), f(e.clientY, r.top, r.height)];
    }
    const creditUrl = () => { const u = PAGE.credit && PAGE.credit.url; return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null; };
    function inCredit(e) {
        if (!creditRect || !creditUrl()) return false;
        const [x0, y0, w, h, fw, fh] = creditRect;
        if (w <= 0 || h <= 0 || fw <= 0 || fh <= 0) return false;
        const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * fw, y = (e.clientY - r.top) / r.height * fh;
        return x >= x0 - 2 && x <= x0 + w + 2 && y >= y0 - 2 && y <= y0 + h + 2;
    }
    let swallow = false;
    window.addEventListener('mousemove', (e) => {
        const [x, y] = normXY(e); pushEv(9, x, y, 0);
        if (e.target === canvas) canvas.style.cursor = inCredit(e) ? 'pointer' : '';
    });
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && inCredit(e)) { swallow = true; e.preventDefault(); return; }
        canvas.focus();
        const [x, y] = normXY(e); pushEv(9, x, y, 0);
        pushEv(5, e.button === 2 ? 1 : e.button === 1 ? 2 : 0, 0, 0); e.preventDefault();
    });
    window.addEventListener('mouseup', (e) => {
        if (swallow && e.button === 0) { swallow = false; if (inCredit(e)) window.open(creditUrl(), '_blank', 'noopener,noreferrer'); return; }
        pushEv(6, e.button === 2 ? 1 : e.button === 1 ? 2 : 0, 0, 0);
    });
    canvas.addEventListener('wheel', (e) => { pushEv(7, e.deltaY < 0 ? 120 : -120, 0, 0); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('click', () => canvas.focus());

    // Touch -> left mouse button (so it is playable on touch screens too)
    let touchId = null;
    const tXY = (t) => normXY({ clientX: t.clientX, clientY: t.clientY });
    canvas.addEventListener('touchstart', (e) => { if (touchId !== null) return; const t = e.changedTouches[0]; touchId = t.identifier; const [x, y] = tXY(t); pushEv(9, x, y, 0); pushEv(5, 0, 0, 0); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { for (const t of e.changedTouches) if (t.identifier === touchId) { const [x, y] = tXY(t); pushEv(9, x, y, 0); } e.preventDefault(); }, { passive: false });
    const tEnd = (e) => { for (const t of e.changedTouches) if (t.identifier === touchId) { const [x, y] = tXY(t); pushEv(9, x, y, 0); pushEv(6, 0, 0, 0); touchId = null; } e.preventDefault(); };
    canvas.addEventListener('touchend', tEnd, { passive: false });
    canvas.addEventListener('touchcancel', tEnd, { passive: false });

    // ---------------------------------------------------------------- resolution (restarts the game)
    const env = Object.fromEntries(params);
    delete env.dev; delete env.debug; delete env.res;
    const RES = { key: '', size: null, cfg: null };
    const DEFAULT_PRESETS = ['800x600', '1024x768', '1280x960', '1440x1080'];
    function parseRes(v) {
        const m = /^(\d{3,4})x(\d{3,4})$/i.exec(String(v == null ? '' : v).trim());
        if (!m) return null;
        const w = +m[1], h = +m[2];
        return (w < 800 || h < 450 || w > 3840 || h > 2160) ? null : [w & ~1, h & ~1];
    }
    function chooseRes() {
        const cfg = PAGE.resolution;
        if (!cfg || !cfg.patch) return;
        RES.cfg = cfg;
        let stored = null;
        try { stored = localStorage.getItem('yuki_res'); } catch (e) {}
        for (const v of [params.get('res'), stored, cfg.default]) {
            if (v == null) continue;
            const p = parseRes(v);
            if (p) { RES.key = p[0] + 'x' + p[1]; RES.size = p; return; }
        }
    }
    function buildResUI() {
        const btn = document.getElementById('resbtn'), panel = document.getElementById('respanel'), sel = document.getElementById('ressel');
        if (!RES.cfg || !RES.size) return;
        btn.style.display = 'block';
        const opts = (Array.isArray(RES.cfg.presets) && RES.cfg.presets.length ? RES.cfg.presets : DEFAULT_PRESETS).filter((v) => parseRes(v));
        if (!opts.includes(RES.key)) opts.push(RES.key);
        for (const v of opts) { const o = document.createElement('option'); o.value = v; o.textContent = v + (v === String(RES.cfg.default) ? ' (default)' : ''); sel.appendChild(o); }
        sel.value = RES.key;
        const toggle = (onv) => { document.body.classList.toggle('respanel', onv === undefined ? !document.body.classList.contains('respanel') : onv); if (document.body.classList.contains('respanel')) sel.focus(); else canvas.focus(); };
        btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F8') { e.preventDefault(); e.stopImmediatePropagation(); toggle(); }
            else if (e.key === 'Escape' && document.body.classList.contains('respanel')) { e.preventDefault(); e.stopImmediatePropagation(); toggle(false); }
        }, true);
        sel.addEventListener('change', () => {
            let saved = false;
            try { localStorage.setItem('yuki_res', sel.value); saved = localStorage.getItem('yuki_res') === sel.value; } catch (e) {}
            const u = new URL(location.href);
            if (saved) u.searchParams.delete('res'); else u.searchParams.set('res', sel.value);
            if (u.href === location.href) location.reload(); else location.href = u.toString();
        });
    }

    // ---------------------------------------------------------------- boot
    (async function main() {
        try {
            chooseRes();
            if (RES.size) { canvas.width = RES.size[0]; canvas.height = RES.size[1]; fitCanvas(); window.yuki_res = { key: RES.key, w: RES.size[0], h: RES.size[1] }; }
            buildResUI();

            const files = DATA.files, total = files.reduce((n, f) => n + f.bytes, 0);
            let done = 0;
            const PARALLEL_DOWNLOADS = 4;
            for (let i = 0; i < files.length; i += PARALLEL_DOWNLOADS) {
                const batch = files.slice(i, i + PARALLEL_DOWNLOADS);
                setProgress('Downloading game data… ' + Math.round(done / total * 100) + '%', done / total);
                // Fetch a small batch concurrently to speed up startup without holding
                // every multi-megabyte file in memory at once.
                const downloaded = await Promise.all(batch.map(async (f) => ({ file: f, code: await fetchScript(f.f) })));
                for (const item of downloaded) {
                    await executeScript(item.file.f, item.code);
                    done += item.file.bytes;
                    setProgress('Loading game data… ' + Math.round(done / total * 100) + '%', done / total);
                }
            }
            setProgress('Preparing engine…', 1);
            const wasmBinary = await gunzip(joinParts('wasm'));
            const exe = await gunzip(joinParts('exe'));
            const modules = [];
            for (const m of DATA.modules) modules.push({ file: m.file, data: await gunzip(joinParts(m.key)) });
            const packBufs = DATA.packs.packs.map((p) => {
                const parts = joinParts('pack' + p.id);
                const u = parts[0];
                if (u.length !== p.size) throw new Error('Corrupt data for pack ' + p.name);
                return u.buffer;
            });
            const saves = await loadSaves();

            const c = PAGE.credit;
            if (c) {
                if (c.text && !('YUKI_CREDIT_TEXT' in env)) env.YUKI_CREDIT_TEXT = String(c.text);
                if (c.link_text && !('YUKI_CREDIT_LINK' in env)) env.YUKI_CREDIT_LINK = String(c.link_text);
                if (c.corner && !('YUKI_CREDIT_CORNER' in env)) env.YUKI_CREDIT_CORNER = String(c.corner);
            }

            const url = URL.createObjectURL(new Blob([YK.workerSrc], { type: 'text/javascript' }));
            YK.workerSrc = null;
            worker = new Worker(url);
            worker.onmessage = onWorkerMessage;
            worker.onerror = (err) => showFatal('Worker error: ' + (err.message || 'failed to start'));
            worker.onmessageerror = () => addLog('[main] worker message could not be deserialized', true);
            statusEl.textContent = 'Starting engine…'; barEl.style.display = 'none';
            const xfer = [wasmBinary, exe, ...modules.map((m) => m.data), ...packBufs];
            worker.postMessage({
                type: 'start', saves, dev, env, res: RES.size, resPatch: RES.size ? RES.cfg.patch : null,
                wasmBinary, exe, modules, configs: DATA.configs,
                packs: { index: DATA.packs, bufs: packBufs },
            }, xfer);
        } catch (err) {
            showFatal((err && err.message) || String(err));
        }
    })();
    </script>
</body>
</html>
