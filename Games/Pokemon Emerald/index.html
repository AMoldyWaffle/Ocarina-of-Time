
<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Run emulator pages on their own GitHub Pages origin, outside proxy rewriting. */
if (location.origin !== "https://amoldywaffle.github.io") {
  location.replace("https://amoldywaffle.github.io/Ocarina-of-Time/Games/Pokemon%20Emerald/");
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Pokémon Emerald</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  position: absolute;
  inset: 0;
  background: #000;
}

#emulator {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#emulator iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: #080808;
  text-align: center;
  padding: 20px;
}

#overlay.hidden {
  display: none;
}

#overlay h2 {
  margin: 0;
  font-size: 22px;
}

#overlay p {
  margin: 0;
  color: #aaa;
  font-size: 13px;
}

#spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #333;
  border-top-color: #39bd75;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

#controls {
  position: fixed;
  z-index: 20;
  right: 14px;
  bottom: 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

button {
  border: 1px solid #555;
  border-radius: 7px;
  padding: 9px 13px;
  background: rgba(30, 30, 30, 0.88);
  color: white;
  font-size: 12px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}

button:hover {
  background: rgba(60, 60, 60, 0.95);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#saveButton {
  border-color: #258a50;
  background: rgba(23, 107, 59, 0.92);
}

#saveButton:hover {
  background: rgba(32, 134, 75, 0.98);
}

#console {
  position: fixed;
  z-index: 30;
  left: 12px;
  bottom: 14px;
  width: min(500px, calc(100% - 24px));
  max-height: 38vh;
  overflow: auto;
  display: none;
  padding: 10px;
  border: 1px solid #444;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.92);
  color: #ddd;
  font: 11px/1.5 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  backdrop-filter: blur(8px);
}

#console.visible {
  display: block;
}

#consoleToggle {
  order: 3;
}

@media (max-width: 480px) {
  #controls {
    right: 9px;
    bottom: 9px;
    gap: 6px;
  }

  button {
    padding: 8px 11px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<main id="screen">
  <div id="emulator"></div>

  <div id="overlay">
    <div id="spinner"></div>
    <h2 id="loadingTitle">Loading Pokémon Emerald</h2>
    <p id="loadingMessage">Preparing emulator...</p>
  </div>

  <pre id="console"></pre>

  <div id="controls">
    <button id="saveButton" type="button" disabled>
      Save to PC
    </button>

    <button id="loadButton" type="button" disabled>
      Load from PC
    </button>

    <button id="consoleToggle" type="button">
      Console
    </button>
  </div>

  <input
    id="stateFile"
    type="file"
    accept=".state,.bin,application/octet-stream"
    hidden
  >
</main>

<script>
(() => {
  "use strict";

  const BASE =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Emulator/Waffle/";

  const LOADER_URL = BASE + "loader.js";

  const ROM_URL =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Games/Pokemon%20Emerald/Pokemon%20-%20Emerald%20Version%20%28USA%2C%20Europe%29.gba";

  const ROM_NAME = "Pokemon - Emerald Version (USA, Europe).gba";

  const emulatorContainer = document.getElementById("emulator");
  const overlay = document.getElementById("overlay");
  const loadingTitle = document.getElementById("loadingTitle");
  const loadingMessage = document.getElementById("loadingMessage");
  const spinner = document.getElementById("spinner");
  const consoleBox = document.getElementById("console");

  const saveButton = document.getElementById("saveButton");
  const loadButton = document.getElementById("loadButton");
  const stateFile = document.getElementById("stateFile");

  let emu = null;
  let gameStarted = false;
  let savePending = false;

  function log(message) {
    const time = new Date().toLocaleTimeString();

    consoleBox.textContent +=
      "[" + time + "] " + message + "\n";

    consoleBox.scrollTop = consoleBox.scrollHeight;

    console.log("[Pokemon Emerald Launcher] " + message);
  }

  function showLoading(title, message) {
    loadingTitle.textContent = title;
    loadingMessage.textContent = message;
    overlay.classList.remove("hidden");
    spinner.style.display = "block";
  }

  function hideLoading() {
    overlay.classList.add("hidden");
  }

  function fail(message) {
    log("ERROR: " + message);

    showLoading("Unable to start", message);
    spinner.style.display = "none";

    consoleBox.classList.add("visible");
  }

  document.getElementById("consoleToggle").addEventListener("click", () => {
    consoleBox.classList.toggle("visible");
  });

  function enableControls() {
    saveButton.disabled = false;
    loadButton.disabled = false;
  }

  function downloadState(data, name) {
    const blob = new Blob([data], {
      type: "application/octet-stream"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = (name || "Pokemon-Emerald") + ".state";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  saveButton.addEventListener("click", () => {
    if (!emu || !gameStarted || savePending) return;

    try {
      savePending = true;
      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      log("Creating save state...");

      emu.send("saveState");

    } catch (error) {
      savePending = false;
      saveButton.disabled = false;
      saveButton.textContent = "Save to PC";

      log("Save failed: " + error.message);
    }
  });

  loadButton.addEventListener("click", () => {
    if (!gameStarted) return;

    stateFile.click();
  });

  stateFile.addEventListener("change", async () => {
    const file = stateFile.files && stateFile.files[0];

    if (!file || !emu || !gameStarted) {
      stateFile.value = "";
      return;
    }

    try {
      loadButton.disabled = true;
      loadButton.textContent = "Loading...";

      log("Reading save state: " + file.name);

      const data = await file.arrayBuffer();

      emu.send("loadState", { data }, [data]);

      log("Save state sent to emulator.");

      loadButton.textContent = "Loaded!";

      setTimeout(() => {
        loadButton.textContent = "Load from PC";
      }, 2000);

    } catch (error) {
      log("Load failed: " + error.message);
      loadButton.textContent = "Load failed";

    } finally {
      loadButton.disabled = false;
      stateFile.value = "";
    }
  });

  async function checkCoreReport() {
    log("Checking mGBA core report...");

    const response = await fetch(
      BASE + "cores/reports/mgba.json",
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "mGBA core report failed: HTTP " + response.status
      );
    }

    const reportText = await response.text();

    let report;

    try {
      report = JSON.parse(reportText);
    } catch {
      throw new Error(
        "The mGBA core report is not valid JSON."
      );
    }

    if (report.core !== "mgba") {
      throw new Error(
        "Unexpected emulator core: " + report.core
      );
    }

    log("mGBA core report validated.");
  }

  function attachFrameDiagnostics(frame) {
    if (!frame) return;

    function attach() {
      try {
        const frameWindow = frame.contentWindow;

        if (!frameWindow) return;

        frameWindow.addEventListener("error", event => {
          log(
            "IFRAME ERROR: " +
            (event.message || "Unknown JavaScript error")
          );

          if (event.filename) {
            log("File: " + event.filename);
          }

          if (event.lineno) {
            log("Line: " + event.lineno);
          }

          if (event.error?.stack) {
            log(event.error.stack);
          }
        });

        frameWindow.addEventListener(
          "unhandledrejection",
          event => {
            const reason = event.reason;

            log(
              "IFRAME PROMISE ERROR: " +
              (reason?.stack ||
               reason?.message ||
               String(reason))
            );
          }
        );

        log("Iframe diagnostics attached.");

      } catch (error) {
        log(
          "Could not attach iframe diagnostics: " +
          error.message
        );
      }
    }

    frame.addEventListener("load", attach);
    attach();
  }

  async function startLauncher() {
    try {
      showLoading(
        "Loading Pokémon Emerald",
        "Checking emulator files..."
      );

      log("Checking emulator files...");

      await checkCoreReport();

      showLoading(
        "Loading Pokémon Emerald",
        "Downloading emulator loader..."
      );

      log("Downloading emulator loader...");

      const loaderResponse = await fetch(LOADER_URL, {
        cache: "default"
      });

      if (!loaderResponse.ok) {
        throw new Error(
          "Loader download failed: HTTP " +
          loaderResponse.status
        );
      }

      const loaderCode = await loaderResponse.text();

      if (!loaderCode.includes("WafflesEmu")) {
        throw new Error("Invalid emulator loader.");
      }

      const script = document.createElement("script");
      script.textContent = loaderCode;
      document.head.appendChild(script);

      if (!window.WafflesEmu) {
        throw new Error(
          "Emulator loader did not initialize."
        );
      }

      log("Emulator loader ready.");

      showLoading(
        "Starting emulator",
        "Preparing game screen..."
      );

      emu = await window.WafflesEmu.open(BASE, {
        container: emulatorContainer,
        dataBase: BASE
      });

      attachFrameDiagnostics(emu.frame);

      emu.on(message => {
        if (!message || !message.evt) return;

        log("Waffle event: " + message.evt);

        switch (message.evt) {
          case "hello":
            log("Emulator connected.");
            break;

          case "loading":
            log(message.msg || "Emulator is loading...");
            loadingMessage.textContent = "Loading game...";
            break;

          case "started":
            gameStarted = true;

            hideLoading();
            enableControls();

            log("Pokémon Emerald started.");
            break;

          case "state":
            if (message.data) {
              downloadState(
                message.data,
                "Pokemon-Emerald"
              );

              log("Save state downloaded.");
            } else {
              log("Save state response contained no data.");
            }

            savePending = false;
            saveButton.disabled = false;
            saveButton.textContent = "Save to PC";
            break;

          case "error":
            log(
              "Emulator error: " +
              (message.msg || "Unknown error")
            );

            if (savePending) {
              savePending = false;
              saveButton.disabled = false;
              saveButton.textContent = "Save to PC";
            }

            if (!gameStarted) {
              fail(
                message.msg ||
                "The emulator reported an error."
              );
            }
            break;

          case "paused":
            log("Game paused.");
            break;

          case "playing":
            log("Game resumed.");
            break;

          case "exit":
            gameStarted = false;

            saveButton.disabled = true;
            loadButton.disabled = true;

            log("Emulator stopped.");
            break;
        }
      });

      showLoading(
        "Starting emulator",
        "Waiting for emulator connection..."
      );

      await Promise.race([
        emu.ready,

        new Promise((_, reject) => {
          setTimeout(() => {
            reject(
              new Error("Emulator connection timed out.")
            );
          }, 45000);
        })
      ]);

      log("Emulator is ready.");

      showLoading(
        "Downloading Pokémon Emerald",
        "This may take a moment..."
      );

      log("Downloading ROM...");

      const romResponse = await fetch(ROM_URL, {
        cache: "default"
      });

      if (!romResponse.ok) {
        throw new Error(
          "ROM download failed: HTTP " +
          romResponse.status
        );
      }

      const romBuffer = await romResponse.arrayBuffer();

      if (romBuffer.byteLength !== 16777216) {
        throw new Error(
          "Unexpected ROM size: " +
          romBuffer.byteLength +
          " bytes."
        );
      }

      log(
        "ROM downloaded: " +
        (romBuffer.byteLength / 1048576).toFixed(2) +
        " MB."
      );

      // Correct Pokémon Emerald game code: BPEE
      const romBytes = new Uint8Array(romBuffer);

      if (romBytes.length < 0xB0) {
        throw new Error(
          "The downloaded file is too small to be a valid GBA ROM."
        );
      }

      const gameCode = String.fromCharCode(
        romBytes[0xAC],
        romBytes[0xAD],
        romBytes[0xAE],
        romBytes[0xAF]
      );

      log("GBA game code: " + gameCode);

      if (gameCode !== "BPEE") {
        throw new Error(
          "Unexpected GBA game code: " +
          gameCode +
          ". Expected BPEE for Pokémon Emerald."
        );
      }

      log("Pokémon Emerald ROM verified.");

      showLoading(
        "Starting Pokémon Emerald",
        "Loading game..."
      );

      const romFile = new File(
        [romBuffer],
        ROM_NAME,
        {
          type: "application/octet-stream"
        }
      );

      await emu.load(romFile, {
        system: "gba",
        core: "mgba"
      });

      log("ROM sent to emulator.");

      setTimeout(() => {
        if (!gameStarted) {
          log(
            "Still waiting for the emulator to report that the game started."
          );
        }
      }, 30000);

    } catch (error) {
      fail(
        error && error.message
          ? error.message
          : String(error)
      );
    }
  }

  startLauncher();
})();
</script>

</body>
</html>
