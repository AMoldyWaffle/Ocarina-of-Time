
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mario Kart 64</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#screen {
  position: absolute;
  inset: 0;
  background: #000;
}

#emulator {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#emulator iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  background: #000;
  color: white;
  font-size: 16px;
  white-space: pre-line;
  pointer-events: none;
}

#overlay.hidden {
  display: none;
}

#consoleButton {
  position: fixed;
  z-index: 1000;
  right: 14px;
  bottom: 14px;
  padding: 9px 14px;
  border: 1px solid #555;
  border-radius: 7px;
  background: #202126;
  color: white;
  font-size: 13px;
  cursor: pointer;
  opacity: 0.75;
}

#consoleButton:hover {
  opacity: 1;
  background: #34363d;
}

#consolePanel {
  display: none;
  position: fixed;
  z-index: 999;
  left: 12px;
  right: 12px;
  bottom: 58px;
  max-height: 38vh;
  overflow: auto;
  padding: 12px;
  border: 1px solid #444;
  border-radius: 8px;
  background: rgba(12, 13, 17, 0.96);
  color: #ccc;
  font: 12px/1.5 Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#consolePanel.visible {
  display: block;
}
</style>
</head>

<body>

<div id="screen">
  <div id="emulator"></div>
  <div id="overlay">Starting Mario Kart 64...</div>
</div>

<div id="consolePanel"></div>
<button id="consoleButton" type="button">Console</button>

<script>
(async function () {
  "use strict";

  const BASE =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Emulator/Waffle/";

  const ROM_URL =
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Games/Mario%20Kart%2064/Mario%20Kart%2064%20(USA).z64";

  const ROM_NAME = "Mario Kart 64 (USA).z64";

  const overlay = document.getElementById("overlay");
  const consolePanel = document.getElementById("consolePanel");
  const consoleButton = document.getElementById("consoleButton");
  const container = document.getElementById("emulator");

  let emulatorStarted = false;

  consoleButton.addEventListener("click", () => {
    const isVisible = consolePanel.classList.toggle("visible");
    consoleButton.textContent = isVisible ? "Hide Console" : "Console";
  });

  function log(message) {
    const line = "[Mario Kart 64 Launcher] " + message;
    console.log(line);
    consolePanel.textContent += line + "\n";
    consolePanel.scrollTop = consolePanel.scrollHeight;
  }

  function status(message) {
    log(message);
    overlay.textContent = message;
  }

  function fail(error) {
    const message = error?.message || String(error);

    overlay.textContent = "Unable to start game:\n" + message;
    overlay.classList.remove("hidden");

    log("ERROR: " + message);
    console.error("[Mario Kart 64 Launcher]", error);

    consolePanel.classList.add("visible");
    consoleButton.textContent = "Hide Console";
  }

  function timeout(promise, milliseconds, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => {
        setTimeout(
          () => reject(new Error(message)),
          milliseconds
        );
      })
    ]);
  }

  try {
    // Download ROM
    status("Downloading Mario Kart 64...");

    const romResponse = await fetch(ROM_URL, {
      cache: "default"
    });

    if (!romResponse.ok) {
      throw new Error(
        "ROM download failed: HTTP " + romResponse.status
      );
    }

    const romBuffer = await romResponse.arrayBuffer();

    if (romBuffer.byteLength === 0) {
      throw new Error("Downloaded ROM is empty.");
    }

    log("ROM downloaded: " + romBuffer.byteLength + " bytes");

    // Download Waffle loader
    status("Loading emulator...");

    const loaderResponse = await fetch(BASE + "loader.js", {
      cache: "default"
    });

    if (!loaderResponse.ok) {
      throw new Error(
        "Loader download failed: HTTP " + loaderResponse.status
      );
    }

    const loaderCode = await loaderResponse.text();

    if (!loaderCode.includes("WafflesEmu")) {
      throw new Error("Downloaded loader.js is invalid.");
    }

    const script = document.createElement("script");
    script.textContent = loaderCode;
    document.head.appendChild(script);

    if (!window.WafflesEmu) {
      throw new Error("Waffle loader failed to initialize.");
    }

    // Open emulator in this page
    status("Opening emulator...");

    const emu = await WafflesEmu.open(BASE, {
      container: container
    });

    // Listen for emulator events
    emu.on(message => {
      if (!message || !message.evt) return;

      log("Waffle event: " + message.evt);

      switch (message.evt) {
        case "hello":
          log("Emulator handshake received.");
          break;

        case "loading":
          status("Loading Mario Kart 64...");
          break;

        case "started":
          emulatorStarted = true;
          overlay.classList.add("hidden");
          log("Mario Kart 64 started!");
          break;

        case "error":
          fail(
            new Error(
              message.msg || "The emulator reported an error."
            )
          );
          break;
      }
    });

    // Wait for emulator initialization
    status("Initializing emulator...");

    await timeout(
      emu.ready,
      45000,
      "Waffle initialization timed out."
    );

    log("Waffle is ready.");

    // Send ROM to emulator
    status("Launching Mario Kart 64...");

    const romFile = new File(
      [romBuffer],
      ROM_NAME,
      {
        type: "application/octet-stream"
      }
    );

    await emu.load(romFile, {
      system: "n64",
      core: "mupen64plus_next"
    });

    log("ROM sent to emulator.");

    setTimeout(() => {
      if (!emulatorStarted) {
        log("Still waiting for the emulator to report that the game started.");
      }
    }, 30000);

  } catch (error) {
    fail(error);
  }
})();
</script>

</body>
</html>
