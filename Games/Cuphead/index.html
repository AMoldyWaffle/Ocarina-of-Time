<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Cuphead</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#000;color:white;font-family:Arial,sans-serif}
#gameContainer{position:absolute;inset:0;width:100%;height:100%}
#gameContainer canvas{width:100%!important;height:100%!important;display:block}

#loadingTitle{font-family:cursive;font-size:48px;font-weight:bold;background:linear-gradient(270deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#8f00ff);background-size:400% 400%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbow 3s ease infinite}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#loadingStatus{margin-top:20px;font-size:16px;color:#ddd}
#progressOuter{width:min(600px,90vw);height:12px;margin-top:18px;border-radius:20px;overflow:hidden;background:#292929}
#progressInner{width:0%;height:100%;background:linear-gradient(90deg,#ff3333,#ffcc33);transition:width .15s linear}
#diagnostics{width:min(700px,90vw);max-height:180px;overflow-y:auto;margin-top:20px;padding:10px;border:1px solid #333;background:#101010;color:#aaa;font-family:monospace;font-size:11px;text-align:left;white-space:pre-wrap}
#saveControls{position:fixed;top:12px;right:12px;z-index:1000;display:flex;gap:8px}

#saveControls button:hover{background:#49351b}
#saveControls button:disabled{opacity:.5;cursor:wait}
#saveFileInput{display:none}
</style>
</head>
<body>

<div id="loadingScreen">
  <div id="loadingTitle">CUPHEAD</div>
  <div id="loadingStatus">Preparing game...</div>
  <div id="progressOuter"><div id="progressInner"></div></div>
  <div id="diagnostics"></div>
</div>

<div id="gameContainer"></div>

<div id="saveControls">
  <button id="saveButton" type="button">Save</button>
  <button id="loadButton" type="button">Load</button>
  <input id="saveFileInput" type="file" accept=".json,application/json">
</div>

<script src="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Cuphead@main/Build/UnityLoader.js"></script>

<script>
(() => {
"use strict";

/* ============================================================
   CONFIGURATION
============================================================ */

const REPOSITORY = "AMoldyWaffle/Cuphead";
const BRANCH = "main";

const CDN_BASE =
  `https://cdn.jsdelivr.net/gh/${REPOSITORY}@${BRANCH}/Build/`;

const RAW_BASE =
  `https://raw.githubusercontent.com/${REPOSITORY}/${BRANCH}/Build/`;

const CACHE_NAME = "cuphead-cache-v2";

/*
  The scheduler is shared by every split asset and single asset.
  It starts conservatively and adjusts based on real request results.
*/
const DOWNLOAD_SETTINGS = {
  initial: 6,
  minimum: 3,
  maximum: 8,
  increaseEvery: 6
};

const ASSETS = [
  {name:"CupheadPort.data.unityweb",parts:103,size:2134335501,partSize:20866662},
  {name:"CupheadPort.wasm.code.unityweb",parts:2,size:26100243,partSize:20866662},
  {name:"CupheadPort.asm.code.unityweb",parts:3,size:42954393,partSize:20866662}
];

const SINGLE_ASSETS = [
  {name:"CupheadPort.json",size:539},
  {name:"CupheadPort.asm.framework.unityweb",size:537176},
  {name:"CupheadPort.asm.memory.unityweb",size:3637047},
  {name:"CupheadPort.wasm.framework.unityweb",size:601597}
];

const ASM_FRAMEWORK_SHA =
  "07a9d2aef6919ee72f1d940a0879a2afe702dd43";

/* ============================================================
   ELEMENTS AND STATE
============================================================ */

const loadingScreen = document.getElementById("loadingScreen");
const loadingStatus = document.getElementById("loadingStatus");
const progressInner = document.getElementById("progressInner");
const diagnostics = document.getElementById("diagnostics");

const saveButton = document.getElementById("saveButton");
const loadButton = document.getElementById("loadButton");
const saveFileInput = document.getElementById("saveFileInput");

const objectURLs = {};

let loadedBytes = 0;
const totalBytes =
  ASSETS.reduce((n,a)=>n+a.size,0) +
  SINGLE_ASSETS.reduce((n,a)=>n+a.size,0);

let cache = null;
let partCacheWriteQueue = Promise.resolve();
let unityInstance = null;

/* ============================================================
   LOGGING AND PROGRESS
============================================================ */

function log(message) {
  const time = new Date().toLocaleTimeString();
  diagnostics.textContent += `[${time}] ${message}\n`;
  diagnostics.scrollTop = diagnostics.scrollHeight;
  console.log("[Cuphead]",message);
}

function setStatus(message) {
  loadingStatus.textContent = message;
  log(message);
}

let progressTimer = null;

function updateProgress(bytes=0) {
  loadedBytes = Math.max(0,loadedBytes+bytes);

  if(progressTimer!==null)return;

  progressTimer=setTimeout(()=>{
    progressTimer=null;

    const percentage=Math.min(100,loadedBytes/totalBytes*100);
    progressInner.style.width=percentage.toFixed(2)+"%";

    loadingStatus.textContent=
      `Downloading assets: ${(loadedBytes/1048576).toFixed(1)} MB / ${(totalBytes/1048576).toFixed(1)} MB`;
  },100);
}

/* ============================================================
   ADAPTIVE GLOBAL DOWNLOAD SCHEDULER
============================================================ */

class DownloadScheduler {
  constructor(settings) {
    this.limit=settings.initial;
    this.minimum=settings.minimum;
    this.maximum=settings.maximum;
    this.increaseEvery=settings.increaseEvery;

    this.active=0;
    this.waiters=[];
    this.successes=0;
    this.failures=0;
    this.fastSamples=0;
    this.slowSamples=0;
  }

  acquire() {
    if(this.active<this.limit) {
      this.active++;
      return Promise.resolve();
    }

    return new Promise(resolve=>{
      this.waiters.push(resolve);
    });
  }

  release() {
    const next=this.waiters.shift();

    if(next) {
      next();
    } else {
      this.active--;
    }
  }

  recordSuccess(milliseconds) {
    this.successes++;

    if(milliseconds<8000) {
      this.fastSamples++;
      this.slowSamples=0;
    } else if(milliseconds>25000) {
      this.slowSamples++;
      this.fastSamples=0;
    } else {
      this.fastSamples=0;
      this.slowSamples=0;
    }

    if(this.slowSamples>=3 && this.limit>this.minimum) {
      this.limit=Math.max(this.minimum,this.limit-1);
      this.slowSamples=0;
      log(`Large/slow responses detected. Concurrency reduced to ${this.limit}.`);
    }

    if(this.fastSamples>=this.increaseEvery &&
       this.limit<this.maximum) {
      this.limit=Math.min(this.maximum,this.limit+1);
      this.fastSamples=0;
      this.slowSamples=0;
      log(`Download speed looks healthy. Concurrency increased to ${this.limit}.`);
    }

    this.drain();
  }

  recordFailure(error) {
    this.failures++;
    this.fastSamples=0;

    if(this.limit>this.minimum) {
      this.limit=Math.max(this.minimum,this.limit-1);
      this.slowSamples=0;
      log(`Download failure detected. Concurrency reduced to ${this.limit}.`);
    }

    this.drain();
  }

  drain() {
    while(this.waiters.length && this.active<this.limit) {
      this.active++;
      this.waiters.shift()();
    }
  }

  async run(task) {
    await this.acquire();
    const start=performance.now();

    try {
      const result=await task();
      this.recordSuccess(performance.now()-start);
      return result;
    } catch(error) {
      this.recordFailure(error);
      throw error;
    } finally {
      this.release();
    }
  }
}

const scheduler=new DownloadScheduler(DOWNLOAD_SETTINGS);

/* ============================================================
   MIRROR HEALTH AND ORDERING
============================================================ */

const mirrorHealth=new Map();

function getMirrorHealth(url) {
  if(!mirrorHealth.has(url)) {
    mirrorHealth.set(url,{
      failures:0,
      successes:0,
      averageTime:0,
      blocked:false
    });
  }
  return mirrorHealth.get(url);
}

function orderedSources(url) {
  const sources=[...new Set([
    url,
    url.replace(CDN_BASE,RAW_BASE)
  ])];

  return sources.sort((a,b)=>{
    const A=getMirrorHealth(a);
    const B=getMirrorHealth(b);

    if(A.blocked!==B.blocked)return A.blocked?1:-1;

    const scoreA=A.averageTime+(A.failures*12000);
    const scoreB=B.averageTime+(B.failures*12000);

    return scoreA-scoreB;
  });
}

function recordMirrorSuccess(url,milliseconds) {
  const health=getMirrorHealth(url);
  health.successes++;

  health.averageTime=health.averageTime===0
    ? milliseconds
    : health.averageTime*.7+milliseconds*.3;
}

function recordMirrorFailure(url,error) {
  const health=getMirrorHealth(url);
  health.failures++;

  const message=String(error.message||error);

  if(/HTTP 403|HTTP 404|HTTP 410/.test(message)) {
    health.blocked=true;
  }
}

/* ============================================================
   CACHE
============================================================ */

function cacheKey(filename) {
  return new URL(
    "/__cuphead_cache__/"+encodeURIComponent(filename),
    location.href
  ).href;
}

async function initializeCache() {
  try {
    if(!("caches" in window)) {
      log("Cache Storage unavailable.");
      return;
    }

    cache=await caches.open(CACHE_NAME);
    log("Persistent asset cache initialized.");
  } catch(error) {
    cache=null;
    log("Cache initialization failed: "+error.message);
  }
}

async function getCachedAsset(filename,expectedSize) {
  if(!cache)return null;

  try {
    const response=await cache.match(cacheKey(filename));
    if(!response)return null;

    const blob=await response.blob();

    if(blob.size!==expectedSize) {
      log(`Invalid cached asset: ${filename} (${blob.size} bytes)`);
      await cache.delete(cacheKey(filename));
      return null;
    }

    updateProgress(blob.size);
    log(`Using cached asset: ${filename}`);
    return blob;
  } catch(error) {
    log(`Cache read failed for ${filename}: ${error.message}`);
    return null;
  }
}

async function saveCachedAsset(filename,blob) {
  if(!cache)return;

  try {
    await cache.put(cacheKey(filename),new Response(blob));
    log(`Cached asset: ${filename}`);
  } catch(error) {
    log(`Could not cache ${filename}: ${error.message}`);
  }
}

/* ============================================================
   FETCH HELPERS
============================================================ */

async function fetchResponse(url) {
  const response=await fetch(url,{cache:"no-store"});

  if(!response.ok) {
    throw new Error(`HTTP ${response.status}: ${url}`);
  }

  return response;
}

async function fetchBlobWithFallback(filename) {
  const urls=[CDN_BASE+filename,RAW_BASE+filename];
  let lastError=null;

  for(const url of urls) {
    try {
      const blob=await scheduler.run(async()=>{
        const start=performance.now();
        const response=await fetchResponse(url);
        const result=await response.blob();
        recordMirrorSuccess(url,performance.now()-start);
        return result;
      });

      if(!blob.size)throw new Error("Downloaded file was empty.");
      return blob;
    } catch(error) {
      lastError=error;
      recordMirrorFailure(url,error);
      log(`Download fallback: ${error.message}`);
    }
  }

  if(filename==="CupheadPort.asm.framework.unityweb") {
    try {
      log("Trying GitHub Blob API fallback.");

      const apiURL=
        `https://api.github.com/repos/${REPOSITORY}/git/blobs/${ASM_FRAMEWORK_SHA}`;

      const response=await fetchResponse(apiURL);
      const json=await response.json();

      if(!json.content)throw new Error("GitHub Blob API returned no content.");

      const binary=atob(json.content.replace(/\s/g,""));
      const bytes=new Uint8Array(binary.length);

      for(let i=0;i<binary.length;i++) {
        bytes[i]=binary.charCodeAt(i);
      }

      return new Blob([bytes],{type:"application/octet-stream"});
    } catch(error) {
      lastError=error;
      log("GitHub Blob API fallback failed: "+error.message);
    }
  }

  throw lastError||new Error(`Unable to download ${filename}`);
}

/* ============================================================
   PART DOWNLOAD
============================================================ */

async function fetchPart(url,partKey,expectedSize) {
  if(cache&&partKey) {
    try {
      const cachedResponse=await cache.match(partKey);

      if(cachedResponse) {
        const cachedBlob=await cachedResponse.blob();

        if(cachedBlob.size>0 &&
           (!expectedSize || cachedBlob.size===expectedSize)) {
          updateProgress(cachedBlob.size);
          log("Using cached part: "+partKey);
          return cachedBlob;
        }

        log("Discarding incomplete cached part: "+partKey);
        await cache.delete(partKey);
      }
    } catch(error) {
      log("Part cache read failed: "+error.message);
    }
  }

  let lastError=null;

  for(const source of orderedSources(url)) {
    try {
      const blob=await scheduler.run(async()=>{
        const start=performance.now();
        const response=await fetchResponse(source);

        let result;

        if(!response.body) {
          result=await response.blob();
          updateProgress(result.size);
        } else {
          const reader=response.body.getReader();
          const chunks=[];

          while(true) {
            const item=await reader.read();
            if(item.done)break;

            chunks.push(item.value);
            updateProgress(item.value.byteLength);
          }

          result=new Blob(chunks,{
            type:"application/octet-stream"
          });
        }

        if(!result.size)throw new Error("Downloaded part was empty.");

        if(expectedSize && result.size!==expectedSize) {
          throw new Error(
            `Part size mismatch. Expected ${expectedSize}, received ${result.size}.`
          );
        }

        recordMirrorSuccess(source,performance.now()-start);
        return result;
      });

      if(cache&&partKey) {
        // Serialize disk writes so dozens of 20 MB chunks do not compete
        // with the active network transfers for storage bandwidth.
        partCacheWriteQueue=partCacheWriteQueue
          .then(()=>cache.put(partKey,new Response(blob)))
          .catch(error=>{
            log("Could not cache part: "+error.message);
          });
      }

      return blob;

    } catch(error) {
      lastError=error;
      recordMirrorFailure(source,error);
      log(`Part source failed (${new URL(source).hostname}): ${error.message}`);
    }
  }

  throw lastError||new Error("All part sources failed.");
}

/* ============================================================
   SPLIT ASSET ASSEMBLY
============================================================ */

async function downloadParts(asset) {
  const parts=new Array(asset.parts);
  let nextIndex=0;

  async function worker() {
    while(true) {
      const index=nextIndex++;
      if(index>=asset.parts)return;

      const partNumber=index+1;
      const filename=`${asset.name}.part${partNumber}`;
      const url=CDN_BASE+filename;
      const expectedSize=index===asset.parts-1
        ? asset.size-asset.partSize*(asset.parts-1)
        : asset.partSize;

      log(`Queued ${filename} (${partNumber}/${asset.parts})`);

      parts[index]=await fetchPart(url,cacheKey(filename),expectedSize);
    }
  }

  /*
    These workers may exist for every asset at once, but the shared
    scheduler controls the actual number of active network requests.
  */
  const workerCount=Math.min(12,asset.parts);

  await Promise.all(
    Array.from({length:workerCount},()=>worker())
  );

  const mergedBlob=new Blob(parts,{
    type:"application/octet-stream"
  });

  if(mergedBlob.size!==asset.size) {
    throw new Error(
      `${asset.name} size mismatch. Expected ${asset.size}, got ${mergedBlob.size}.`
    );
  }

  return mergedBlob;
}

async function loadSplitAsset(asset) {
  setStatus(`Preparing ${asset.name}...`);

  let blob=await getCachedAsset(asset.name,asset.size);

  if(!blob) {
    log(`Downloading ${asset.parts} parts for ${asset.name}`);
    blob=await downloadParts(asset);

    // The 2.13 GB data file is already represented by individually cached
    // parts. Writing a second full-size copy to Cache Storage only adds
    // heavy disk I/O and can exhaust the browser's storage quota.
    if(asset.size<=256*1024*1024) {
      await saveCachedAsset(asset.name,blob);
    } else {
      log(`Skipping duplicate assembled-file cache for large asset: ${asset.name}`);
    }
  }

  if(blob.size!==asset.size) {
    throw new Error(`Incorrect assembled size for ${asset.name}.`);
  }

  objectURLs[asset.name]=URL.createObjectURL(blob);
  log(`Assembled ${asset.name}`);

  return objectURLs[asset.name];
}

async function loadSingleAsset(asset) {
  setStatus(`Preparing ${asset.name}...`);

  let blob=await getCachedAsset(asset.name,asset.size);

  if(!blob) {
    blob=await fetchBlobWithFallback(asset.name);

    if(blob.size!==asset.size) {
      throw new Error(
        `${asset.name} size mismatch. Expected ${asset.size}, got ${blob.size}.`
      );
    }

    updateProgress(blob.size);
    await saveCachedAsset(asset.name,blob);
  }

  objectURLs[asset.name]=URL.createObjectURL(blob);
  log(`Loaded ${asset.name}`);

  return objectURLs[asset.name];
}

/* ============================================================
   UNITY REQUEST REDIRECTION
============================================================ */

function redirectAssetURL(url) {
  if(url==null)return url;

  const original=String(url);

  for(const [filename,blobURL] of Object.entries(objectURLs)) {
    if(original.includes(filename))return blobURL;
  }

  return original;
}

function installRequestRedirects() {
  log("Installing local asset request redirects.");

  const originalOpen=XMLHttpRequest.prototype.open;

  XMLHttpRequest.prototype.open=function(method,url,...rest) {
    const redirected=redirectAssetURL(url);

    if(redirected!==String(url)) {
      log(`XHR redirected: ${url} -> local Blob`);
    }

    return originalOpen.call(this,method,redirected,...rest);
  };

  const originalFetch=window.fetch.bind(window);

  window.fetch=function(input,init) {
    const originalURL=input instanceof Request?input.url:String(input);
    const redirectedURL=redirectAssetURL(originalURL);

    if(redirectedURL!==originalURL) {
      log(`Fetch redirected: ${originalURL} -> local Blob`);

      if(input instanceof Request) {
        return originalFetch(new Request(redirectedURL,input),init);
      }

      return originalFetch(redirectedURL,init);
    }

    return originalFetch(input,init);
  };

  log("XHR and Fetch redirects installed.");
}

/* ============================================================
   SAVE / LOAD SYSTEM
============================================================ */

const SAVE_DIRECTORY="/idbfs";

function getUnityFS() {
  const candidates=[
    unityInstance?.Module?.FS,
    unityInstance?.module?.FS,
    unityInstance?.Module?.module?.FS,
    window.Module?.FS,
    window.FS
  ];

  return candidates.find(fs=>
    fs&&
    typeof fs.readdir==="function"&&
    typeof fs.readFile==="function"&&
    typeof fs.writeFile==="function"&&
    typeof fs.syncfs==="function"&&
    typeof fs.stat==="function"
  );
}

function syncUnityFilesystem(fs,populate) {
  return new Promise((resolve,reject)=>{
    fs.syncfs(populate,error=>error?reject(error):resolve());
  });
}

function bytesToBase64(bytes) {
  let binary="";
  const chunkSize=0x8000;

  for(let i=0;i<bytes.length;i+=chunkSize) {
    binary+=String.fromCharCode(
      ...bytes.subarray(i,Math.min(i+chunkSize,bytes.length))
    );
  }

  return btoa(binary);
}

function base64ToBytes(base64) {
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++) {
    bytes[i]=binary.charCodeAt(i);
  }

  return bytes;
}

function collectSaveFiles(fs,directory,files,directories) {
  for(const entry of fs.readdir(directory)) {
    if(entry==="."||entry==="..")continue;

    const path=directory==="/"?"/"+entry:directory+"/"+entry;
    const stat=fs.stat(path);

    if(fs.isDir(stat.mode)) {
      directories.push(path);
      collectSaveFiles(fs,path,files,directories);
    } else if(fs.isFile(stat.mode)) {
      files.push({
        path,
        data:bytesToBase64(fs.readFile(path))
      });
    }
  }
}

async function exportCupheadSave() {
  const fs=getUnityFS();

  if(!fs) {
    throw new Error(
      "Unity's filesystem is not exposed by this loader. The save cannot be exported through /idbfs."
    );
  }

  log("Synchronizing Cuphead save filesystem...");
  await syncUnityFilesystem(fs,false);

  if(!fs.analyzePath(SAVE_DIRECTORY).exists) {
    throw new Error(
      "Cuphead's /idbfs directory was not found. This build may store saves somewhere else."
    );
  }

  const files=[];
  const directories=[];

  collectSaveFiles(fs,SAVE_DIRECTORY,files,directories);

  if(files.length===0) {
    throw new Error("No save files were found in /idbfs. No backup was created.");
  }

  const backup={
    format:"cuphead-save-backup",
    version:1,
    created:new Date().toISOString(),
    directories,
    files
  };

  const blob=new Blob([JSON.stringify(backup)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="Cuphead-Save-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);

  log(`Save exported successfully. ${files.length} file(s).`);
}

function ensureDirectory(fs,path) {
  const parts=path.split("/").filter(Boolean);
  let current="";

  for(const part of parts) {
    current+="/"+part;
    if(!fs.analyzePath(current).exists)fs.mkdir(current);
  }
}

function removeDirectoryContents(fs,directory) {
  for(const entry of fs.readdir(directory)) {
    if(entry==="."||entry==="..")continue;

    const path=directory+"/"+entry;
    const stat=fs.stat(path);

    if(fs.isDir(stat.mode)) {
      removeDirectoryContents(fs,path);
      fs.rmdir(path);
    } else {
      fs.unlink(path);
    }
  }
}

async function importCupheadSave(backup) {
  const fs=getUnityFS();

  if(!fs) {
    throw new Error("Unity's filesystem is not exposed by this loader.");
  }

  if(
    !backup||
    backup.format!=="cuphead-save-backup"||
    backup.version!==1||
    !Array.isArray(backup.files)||
    !Array.isArray(backup.directories)
  ) {
    throw new Error("This is not a valid Cuphead save backup.");
  }

  if(backup.files.length===0) {
    throw new Error("The selected backup contains no save files.");
  }

  for(const item of backup.files) {
    if(
      typeof item.path!=="string"||
      !item.path.startsWith(SAVE_DIRECTORY+"/")||
      item.path.split("/").includes("..")||
      typeof item.data!=="string"
    ) {
      throw new Error("The backup contains an invalid file path.");
    }
  }

  for(const directory of backup.directories) {
    if(
      typeof directory!=="string"||
      (directory!==SAVE_DIRECTORY&&!directory.startsWith(SAVE_DIRECTORY+"/"))||
      directory.split("/").includes("..")
    ) {
      throw new Error("The backup contains an invalid directory.");
    }
  }

  log("Preparing to restore Cuphead save...");

  if(!fs.analyzePath(SAVE_DIRECTORY).exists)fs.mkdir(SAVE_DIRECTORY);

  removeDirectoryContents(fs,SAVE_DIRECTORY);

  for(const directory of backup.directories) {
    ensureDirectory(fs,directory);
  }

  for(const item of backup.files) {
    const parent=item.path.substring(0,item.path.lastIndexOf("/"));
    ensureDirectory(fs,parent);
    fs.writeFile(item.path,base64ToBytes(item.data));
  }

  await syncUnityFilesystem(fs,false);

  log(`Save restored successfully. ${backup.files.length} file(s).`);

  alert(
    "Cuphead save restored successfully!\n\n"+
    "The game will now reload to apply the restored progress."
  );

  location.reload();
}

saveButton.addEventListener("click",async()=>{
  saveButton.disabled=true;

  try {
    await exportCupheadSave();
    alert("Cuphead save backup downloaded successfully!");
  } catch(error) {
    console.error(error);
    log("Save failed: "+error.message);
    alert("Save failed:\n\n"+error.message);
  } finally {
    saveButton.disabled=false;
  }
});

loadButton.addEventListener("click",()=>saveFileInput.click());

saveFileInput.addEventListener("change",async()=>{
  const file=saveFileInput.files?.[0];
  if(!file)return;

  loadButton.disabled=true;

  try {
    const backup=JSON.parse(await file.text());

    if(!confirm(
      "Restore this Cuphead save?\n\nYour current saved progress will be replaced."
    ))return;

    await importCupheadSave(backup);
  } catch(error) {
    console.error(error);
    log("Load failed: "+error.message);
    alert("Load failed:\n\n"+error.message);
  } finally {
    loadButton.disabled=false;
    saveFileInput.value="";
  }
});

/* ============================================================
   START UNITY
============================================================ */

async function startUnity() {
  setStatus("Initializing Unity...");

  if(
    typeof UnityLoader==="undefined"||
    typeof UnityLoader.instantiate!=="function"
  ) {
    throw new Error("UnityLoader.js did not load correctly.");
  }

  installRequestRedirects();

  log("Starting Unity with preloaded assets.");

  unityInstance=UnityLoader.instantiate(
    "gameContainer",
    "Build/CupheadPort.json"
  );

  log("Unity instantiate() called.");
  loadingScreen.style.display="none";

  return unityInstance;
}

/* ============================================================
   MAIN
============================================================ */

async function main() {
  try {
    setStatus("Initializing asset cache...");
    await initializeCache();

    log(
      `Adaptive downloader initialized. Starting concurrency: ${scheduler.limit}, maximum: ${scheduler.maximum}.`
    );

    /*
      All split assets now begin together. Their workers share
      the same scheduler, so they cannot each create 32 requests.
    */
    const splitResults=await Promise.all(
      ASSETS.map(asset=>loadSplitAsset(asset))
    );

    /*
      Small Unity assets are also prepared concurrently.
    */
    await Promise.all(
      SINGLE_ASSETS.map(asset=>loadSingleAsset(asset))
    );

    setStatus("All assets downloaded and assembled.");

    if(loadedBytes<totalBytes) {
      loadedBytes=totalBytes;
      progressInner.style.width="100%";
    }

    await new Promise(resolve=>requestAnimationFrame(resolve));
    await startUnity();

  } catch(error) {
    console.error(error);
    setStatus("Failed to start Cuphead: "+error.message);
    log(error.stack||error.message);
    loadingScreen.style.display="flex";
  }
}

/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener("beforeunload",()=>{
  for(const url of Object.values(objectURLs)) {
    URL.revokeObjectURL(url);
  }
});

main();

})();
</script>
