
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuphead Launcher</title>

<base href="https://cdn.jsdelivr.net/gh/AMoldyWaffle/Cuphead@main/">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

#gameContainer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
}

#gameContainer canvas {
    width: 100% !important;
    height: 100% !important;
}

#loadingScreen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #080808;
    text-align: center;
}

#loadingTitle {
    font-size: 34px;
    font-weight: bold;
    margin-bottom: 20px;
}

#progressOuter {
    width: min(500px, 90vw);
    height: 15px;
    background: #292929;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

#progressInner {
    width: 0%;
    height: 100%;
    background: #d7a33d;
    transition: width .2s;
}

#status {
    color: #ccc;
    font-size: 14px;
    margin-top: 8px;
    max-width: 90vw;
    overflow-wrap: anywhere;
}

#percent {
    color: #d7a33d;
    font-size: 13px;
    margin-top: 8px;
}

#diagnostics {
    position: absolute;
    z-index: 20;
    left: 12px;
    right: 12px;
    bottom: 12px;
    max-height: 32%;
    overflow: auto;
    padding: 12px;
    background: rgba(0,0,0,.88);
    border: 1px solid #555;
    border-radius: 8px;
    color: #ddd;
    font: 11px monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

#errorScreen {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 30;
    background: #100707;
    color: white;
    padding: 25px;
    overflow: auto;
}

#errorScreen h2 {
    color: #ff6464;
}

#errorText {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 12px monospace;
    line-height: 1.5;
}

button {
    margin-top: 16px;
    padding: 11px 20px;
    border: 0;
    border-radius: 6px;
    background: #d7a33d;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="gameContainer"></div>

<div id="loadingScreen">
    <div id="loadingTitle">CUPHEAD</div>

    <div id="progressOuter">
        <div id="progressInner"></div>
    </div>

    <div id="status">Preparing launcher...</div>
    <div id="percent">0%</div>
</div>

<div id="diagnostics">Starting diagnostics...</div>

<div id="errorScreen">
    <h2>CUPHEAD</h2>
    <p>Startup failed. Diagnostic information:</p>
    <div id="errorText"></div>
    <button onclick="location.reload()">Retry</button>
</div>

<script>
"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const CDN_ROOT =
    "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Cuphead@main/";

const RAW_ROOT =
    "https://raw.githubusercontent.com/AMoldyWaffle/Cuphead/main/";

const BUILD = "Build/";

const PART_CONCURRENCY = 8;

const UNITY_STARTUP_TIMEOUT = 600000;

/*
    Persistent cache for assembled Unity assets.

    Change the version suffix if the underlying game assets
    are replaced with different files.
*/

const CUPHEAD_CACHE_NAME = "cuphead-cache-v1";

/*
    Actual part counts from the GitHub Build folder.
*/

const ASSET_PARTS = [
    {
        name: "CupheadPort.data.unityweb",
        count: 103,
        lastPartSize: 5935977
    },
    {
        name: "CupheadPort.wasm.code.unityweb",
        count: 2,
        lastPartSize: 5233581
    },
    {
        name: "CupheadPort.asm.code.unityweb",
        count: 3,
        lastPartSize: 1221069
    }
];

const NORMAL_PART_SIZE = 20866662;

/*
    These files are already complete and are not split.
*/

const NORMAL_ASSETS = [
    "CupheadPort.wasm.framework.unityweb",
    "CupheadPort.asm.framework.unityweb",
    "CupheadPort.asm.memory.unityweb"
];

/* =========================================================
   ELEMENTS
========================================================= */

const statusElement = document.getElementById("status");
const progressElement = document.getElementById("progressInner");
const percentElement = document.getElementById("percent");
const diagnosticsElement = document.getElementById("diagnostics");

let diagnosticLines = [];
let startupFailed = false;
let unityReady = false;
let unityStarted = false;
let unityStartupTimer = null;

let totalParts = 108;
let completedParts = 0;

const blobUrls = {};

/* =========================================================
   DIAGNOSTICS
========================================================= */

function log(message) {
    const timestamp = new Date().toLocaleTimeString();

    diagnosticLines.push(
        "[" + timestamp + "] " + message
    );

    if (diagnosticLines.length > 120) {
        diagnosticLines.shift();
    }

    diagnosticsElement.textContent =
        diagnosticLines.join("\n");

    diagnosticsElement.scrollTop =
        diagnosticsElement.scrollHeight;
}

function setStatus(message) {
    statusElement.textContent = message;
    log(message);
}

function setProgress(value) {
    value = Math.max(0, Math.min(100, value));

    progressElement.style.width = value + "%";
    percentElement.textContent = Math.floor(value) + "%";
}

function fail(message) {
    if (startupFailed) return;

    startupFailed = true;

    log("FATAL ERROR: " + message);

    document.getElementById("errorText").textContent =
        diagnosticLines.join("\n");

    document.getElementById("errorScreen").style.display =
        "block";

    document.getElementById("loadingScreen").style.display =
        "none";
}

/* =========================================================
   ENVIRONMENT CHECKS
========================================================= */

function checkEnvironment() {
    log("Browser: " + navigator.userAgent);
    log("Platform: " + navigator.platform);

    log(
        "WebAssembly: " +
        (typeof WebAssembly !== "undefined")
    );

    log(
        "Fetch: " +
        (typeof fetch !== "undefined")
    );

    const canvas = document.createElement("canvas");

    log(
        "WebGL: " +
        (!!canvas.getContext("webgl"))
    );

    log(
        "WebGL2: " +
        (!!canvas.getContext("webgl2"))
    );

    log(
        "Device memory: " +
        (navigator.deviceMemory || "unknown") + " GB"
    );

    if (typeof WebAssembly === "undefined") {
        throw new Error("WebAssembly is unavailable.");
    }

    if (!canvas.getContext("webgl")) {
        throw new Error("WebGL is unavailable.");
    }
}

/* =========================================================
   CACHE HELPERS
========================================================= */

function getCacheKey(filename) {
    /*
        Use a same-origin cache key rather than a CDN URL.
        This also keeps the cache independent of CDN routing.
    */

    return new URL(
        "/__cuphead_cache__/" + encodeURIComponent(filename),
        location.href
    ).href;
}

async function cleanupCupheadCache() {
    setStatus("Checking existing Cuphead cache...");

    if (!("caches" in window)) {
        log(
            "Cache Storage unavailable; browser HTTP cache will be used."
        );
        return;
    }

    try {
        const cache = await caches.open(CUPHEAD_CACHE_NAME);
        const keys = await cache.keys();

        log(
            "Cuphead cache ready. Cached assembled assets: " +
            keys.length
        );

    } catch (error) {
        log(
            "Cache unavailable: " +
            error.message
        );
    }
}

/* =========================================================
   DOWNLOAD HELPERS
========================================================= */

function getPartURL(filename, partNumber, source) {
    const path =
        BUILD +
        filename +
        ".part" +
        partNumber;

    if (source === "raw") {
        return RAW_ROOT + path;
    }

    return CDN_ROOT + path;
}

function getNormalURL(filename, source) {
    const path = BUILD + filename;

    if (source === "raw") {
        return RAW_ROOT + path;
    }

    return CDN_ROOT + path;
}

async function downloadBlob(url, expectedSize) {
    const response = await fetch(url, {
        cache: "default",
        mode: "cors"
    });

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    const blob = await response.blob();

    if (blob.size === 0) {
        throw new Error("Downloaded file is empty.");
    }

    if (
        expectedSize &&
        blob.size !== expectedSize
    ) {
        throw new Error(
            "Incorrect file size. Expected " +
            expectedSize +
            " bytes, received " +
            blob.size +
            " bytes."
        );
    }

    return blob;
}

async function fetchWithFallback(urls, expectedSize) {
    const errors = [];

    for (const url of urls) {
        try {
            log("Fetching: " + url);

            const blob = await downloadBlob(
                url,
                expectedSize
            );

            log(
                "Downloaded successfully: " +
                blob.size +
                " bytes"
            );

            return blob;

        } catch (error) {
            errors.push(
                url + " -> " + error.message
            );

            log(
                "Download source failed: " +
                error.message
            );
        }
    }

    throw new Error(
        "All download sources failed:\n" +
        errors.join("\n")
    );
}

/* =========================================================
   SPLIT PART DOWNLOAD
========================================================= */

async function downloadPart(asset, partNumber) {
    const expectedSize =
        partNumber === asset.count
            ? asset.lastPartSize
            : NORMAL_PART_SIZE;

    /*
        Try the CDN edge first.
        Fall back to GitHub Raw if it fails.
    */

    const urls = [
        getPartURL(asset.name, partNumber, "cdn"),
        getPartURL(asset.name, partNumber, "raw")
    ];

    const blob = await fetchWithFallback(
        urls,
        expectedSize
    );

    completedParts++;

    const overall =
        (completedParts / totalParts) * 75;

    setProgress(overall);

    setStatus(
        "Downloading game assets: " +
        completedParts +
        "/" +
        totalParts
    );

    return blob;
}

/* =========================================================
   ASSET ASSEMBLY WITH PERSISTENT CACHE
========================================================= */

async function assembleAsset(asset) {
    let cache = null;

    const cacheKey = getCacheKey(asset.name);

    /*
        First check whether the complete assembled asset
        already exists in Cache Storage.
    */

    if ("caches" in window) {
        try {
            cache = await caches.open(
                CUPHEAD_CACHE_NAME
            );

            const cachedResponse = await cache.match(
                cacheKey
            );

            if (cachedResponse) {
                const cachedBlob =
                    await cachedResponse.blob();

                if (cachedBlob.size > 0) {
                    log(
                        "Using cached asset: " +
                        asset.name +
                        " (" +
                        cachedBlob.size +
                        " bytes)"
                    );

                    blobUrls[asset.name] =
                        URL.createObjectURL(cachedBlob);

                    completedParts += asset.count;

                    setProgress(
                        (completedParts / totalParts) * 75
                    );

                    setStatus(
                        "Using cached asset: " +
                        asset.name
                    );

                    return;
                }

                log(
                    "Cached asset was empty; downloading again."
                );
            }

        } catch (error) {
            log(
                "Cache read failed for " +
                asset.name +
                ": " +
                error.message
            );
        }
    }

    /*
        Cache miss: download the individual parts.
    */

    setStatus(
        "Downloading " +
        asset.name +
        "..."
    );

    log(
        "Beginning " +
        asset.count +
        " parts for " +
        asset.name
    );

    const parts = new Array(asset.count);

    let nextPart = 1;

    async function worker() {
        while (true) {
            const partNumber = nextPart++;

            if (partNumber > asset.count) {
                return;
            }

            const blob = await downloadPart(
                asset,
                partNumber
            );

            parts[partNumber - 1] = blob;

            log(
                asset.name +
                ": received part " +
                partNumber +
                "/" +
                asset.count
            );
        }
    }

    const workerCount = Math.min(
        PART_CONCURRENCY,
        asset.count
    );

    log(
        "Downloading with " +
        workerCount +
        " parallel part requests."
    );

    const workers = [];

    for (let i = 0; i < workerCount; i++) {
        workers.push(worker());
    }

    await Promise.all(workers);

    /*
        Verify that every part was received.
    */

    for (let i = 0; i < parts.length; i++) {
        if (!parts[i]) {
            throw new Error(
                "Missing part " +
                (i + 1) +
                " of " +
                asset.name
            );
        }
    }

    /*
        Calculate the final assembled size.
    */

    let totalSize = 0;

    for (const part of parts) {
        totalSize += part.size;
    }

    log(
        "Combining " +
        asset.name +
        ": " +
        totalSize +
        " bytes"
    );

    /*
        Blob concatenation avoids manually copying the
        entire asset into a giant JavaScript Uint8Array.
    */

    const combinedBlob = new Blob(parts, {
        type: "application/octet-stream"
    });

    if (combinedBlob.size !== totalSize) {
        throw new Error(
            "Assembly size mismatch for " +
            asset.name
        );
    }

    /*
        Create the URL Unity will use.
    */

    const blobURL = URL.createObjectURL(
        combinedBlob
    );

    blobUrls[asset.name] = blobURL;

    /*
        Store the assembled asset for future launches.

        Cache failures are non-fatal. The game can still
        launch using the in-memory Blob URL.
    */

    if (cache) {
        try {
            await cache.put(
                cacheKey,
                new Response(combinedBlob, {
                    headers: {
                        "Content-Type":
                            "application/octet-stream"
                    }
                })
            );

            log(
                "Cached assembled asset: " +
                asset.name
            );

        } catch (error) {
            log(
                "Could not cache " +
                asset.name +
                ": " +
                error.message
            );
        }
    }

    /*
        Release the array of individual part references.
    */

    parts.length = 0;

    log(
        "Assembly complete: " +
        asset.name +
        " (" +
        combinedBlob.size +
        " bytes)"
    );
}

/* =========================================================
   DOWNLOAD COMPLETE UNITY ASSETS
========================================================= */

/*
    GitHub Blob API fallback for files that fail through both
    jsDelivr and GitHub Raw.

    This SHA identifies Build/CupheadPort.asm.framework.unityweb
    on the repository's main branch.
*/

const GITHUB_BLOB_FALLBACKS = {
    "CupheadPort.asm.framework.unityweb":
        "07a9d2aef6919ee72f1d940a0879a2afe702dd43"
};

async function downloadFromGitHubBlobAPI(filename) {
    const blobSha =
        GITHUB_BLOB_FALLBACKS[filename];

    if (!blobSha) {
        throw new Error(
            "No GitHub Blob API fallback is configured for " +
            filename
        );
    }

    const apiURL =
        "https://api.github.com/repos/AMoldyWaffle/Cuphead/git/blobs/" +
        blobSha;

    log(
        "Trying GitHub Blob API: " +
        apiURL
    );

    const response = await fetch(apiURL, {
        method: "GET",
        mode: "cors",
        cache: "no-store",
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error(
            "GitHub Blob API returned HTTP " +
            response.status
        );
    }

    const result = await response.json();

    if (
        result.encoding !== "base64" ||
        !result.content
    ) {
        throw new Error(
            "GitHub Blob API returned an unexpected response format."
        );
    }

    const base64 = result.content.replace(/\s/g, "");
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    if (
        result.size &&
        bytes.byteLength !== result.size
    ) {
        throw new Error(
            "GitHub Blob API size mismatch. Expected " +
            result.size +
            " bytes, received " +
            bytes.byteLength +
            " bytes."
        );
    }

    const blob = new Blob([bytes], {
        type: "application/octet-stream"
    });

    log(
        "GitHub Blob API download successful: " +
        blob.size +
        " bytes"
    );

    return blob;
}

async function downloadNormalAssets() {
    for (const filename of NORMAL_ASSETS) {
        setStatus(
            "Checking " +
            filename +
            "..."
        );

        const urls = [
            getNormalURL(filename, "cdn"),
            getNormalURL(filename, "raw")
        ];

        let blob;

        try {
            /*
                Keep the existing CDN -> GitHub Raw order.
            */

            blob = await fetchWithFallback(
                urls,
                null
            );

        } catch (primaryError) {
            log(
                "CDN and Raw downloads failed for " +
                filename +
                ". Trying GitHub Blob API fallback..."
            );

            try {
                blob = await downloadFromGitHubBlobAPI(
                    filename
                );

            } catch (apiError) {
                throw new Error(
                    "All download sources failed for " +
                    filename +
                    ":\n" +
                    primaryError.message +
                    "\nGitHub Blob API -> " +
                    apiError.message
                );
            }
        }

        blobUrls[filename] =
            URL.createObjectURL(blob);

        log(
            "Ready: " +
            filename +
            " (" +
            blob.size +
            " bytes)"
        );
    }
}

/* =========================================================
   UNITY ASSET REQUEST INTERCEPTION
========================================================= */

function installAssetInterceptor() {
    const originalOpen =
        XMLHttpRequest.prototype.open;

    XMLHttpRequest.prototype.open = function(
        method,
        url
    ) {
        let finalURL = String(url);

        for (const filename of Object.keys(blobUrls)) {
            if (finalURL.includes(filename)) {
                finalURL = blobUrls[filename];

                log(
                    "Redirected Unity request to assembled asset: " +
                    filename
                );

                break;
            }
        }

        this.__cupheadURL = finalURL;

        return originalOpen.call(
            this,
            method,
            finalURL,
            ...Array.prototype.slice.call(arguments, 2)
        );
    };

    const originalSend =
        XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.send = function() {
        const xhr = this;

        xhr.addEventListener("loadend", function() {
            if (xhr.status === 0) {
                log(
                    "XHR NETWORK ERROR: " +
                    (xhr.__cupheadURL || "unknown URL")
                );

            } else if (xhr.status >= 400) {
                log(
                    "XHR HTTP " +
                    xhr.status +
                    ": " +
                    (xhr.__cupheadURL || "unknown URL")
                );
            }
        });

        return originalSend.apply(
            this,
            arguments
        );
    };

    log("Unity asset interception installed.");
}

/* =========================================================
   UNITY CONFIGURATION
========================================================= */

async function loadUnityConfig() {
    setStatus("Loading Unity configuration...");

    const urls = [
        CDN_ROOT + BUILD + "CupheadPort.json",
        RAW_ROOT + BUILD + "CupheadPort.json"
    ];

    const configBlob = await fetchWithFallback(
        urls,
        539
    );

    const configText = await configBlob.text();

    const config = JSON.parse(configText);

    /*
        Explicitly set all asset URLs.

        The three assembled assets are redirected to Blob URLs
        by the XHR interceptor.

        The framework and memory files are downloaded normally.
    */

    config.dataUrl =
        CDN_ROOT + BUILD + "CupheadPort.data.unityweb";

    config.wasmCodeUrl =
        CDN_ROOT + BUILD + "CupheadPort.wasm.code.unityweb";

    config.asmCodeUrl =
        CDN_ROOT + BUILD + "CupheadPort.asm.code.unityweb";

    config.wasmFrameworkUrl =
        CDN_ROOT + BUILD + "CupheadPort.wasm.framework.unityweb";

    config.asmFrameworkUrl =
        CDN_ROOT + BUILD + "CupheadPort.asm.framework.unityweb";

    config.asmMemoryUrl =
        CDN_ROOT + BUILD + "CupheadPort.asm.memory.unityweb";

    const rewrittenConfig = new Blob(
        [JSON.stringify(config)],
        {
            type: "application/json"
        }
    );

    const configURL =
        URL.createObjectURL(rewrittenConfig);

    blobUrls["__config"] = configURL;

    log("Unity configuration prepared.");

    return configURL;
}

/* =========================================================
   UNITY LOADER
========================================================= */

async function loadUnityLoader() {
    setStatus("Loading Unity engine...");

    const urls = [
        CDN_ROOT + BUILD + "UnityLoader.js",
        RAW_ROOT + BUILD + "UnityLoader.js"
    ];

    const loaderBlob = await fetchWithFallback(
        urls,
        157168
    );

    const scriptText = await loaderBlob.text();

    if (scriptText.length < 10000) {
        throw new Error(
            "UnityLoader.js is incomplete."
        );
    }

    const script = document.createElement("script");

    script.textContent = scriptText;

    document.head.appendChild(script);

    if (typeof window.UnityLoader === "undefined") {
        throw new Error(
            "UnityLoader.js loaded, but UnityLoader is undefined."
        );
    }

    log("UnityLoader initialized.");
}

/* =========================================================
   START UNITY
========================================================= */

function startUnity(configURL) {
    setStatus("Starting Cuphead...");

    installAssetInterceptor();

    if (typeof UnityLoader === "undefined") {
        throw new Error(
            "UnityLoader is unavailable."
        );
    }

    unityStarted = true;

    log("Calling UnityLoader.instantiate...");

    log(
        "Unity startup watchdog begins now; asset downloading is not covered by this timer."
    );

    unityStartupTimer = setTimeout(function() {
        if (!unityReady && !startupFailed) {
            fail(
                "No Unity completion callback after " +
                (UNITY_STARTUP_TIMEOUT / 1000) +
                " seconds of Unity startup.\n\n" +
                "Last progress: " +
                percentElement.textContent +
                "\nUnity started: " +
                unityStarted
            );
        }
    }, UNITY_STARTUP_TIMEOUT);

    const instance = UnityLoader.instantiate(
        "gameContainer",
        configURL,
        {
            onProgress: function(
                unityInstance,
                progress
            ) {
                if (startupFailed) return;

                const percent = Math.floor(
                    progress * 100
                );

                /*
                    Asset downloads occupy 0-75%.
                    Unity loading occupies 75-100%.
                */

                setProgress(
                    75 + (percent * 0.25)
                );

                setStatus(
                    "Unity initializing: " +
                    percent +
                    "%"
                );

                log(
                    "Unity progress: " +
                    percent +
                    "%"
                );

                if (percent >= 100) {
                    unityReady = true;

                    if (unityStartupTimer !== null) {
                        clearTimeout(unityStartupTimer);
                        unityStartupTimer = null;
                    }

                    setProgress(100);

                    setStatus("Cuphead loaded.");

                    document.getElementById(
                        "loadingScreen"
                    ).style.display = "none";

                    diagnosticsElement.style.display =
                        "none";
                }
            }
        }
    );

    window.cupheadInstance = instance;

    log("Unity instance created.");
}

/* =========================================================
   ERROR HANDLERS
========================================================= */

window.addEventListener("error", function(event) {
    const message =
        event.message ||
        (
            event.error &&
            event.error.message
        ) ||
        "Unknown JavaScript error";

    log(
        "JavaScript error: " +
        message
    );

    if (
        message.includes("WebAssembly") ||
        message.includes("DataView") ||
        message.includes("memory access")
    ) {
        fail(
            "Unity JavaScript/WebAssembly error:\n" +
            message
        );
    }
});

window.addEventListener(
    "unhandledrejection",
    function(event) {
        const reason = event.reason;

        const message =
            reason && reason.message
                ? reason.message
                : String(reason);

        log(
            "Unhandled promise rejection: " +
            message
        );
    }
);

/* =========================================================
   MAIN
========================================================= */

async function main() {
    try {
        checkEnvironment();

        await cleanupCupheadCache();

        setProgress(0);

        /*
            Load the small Unity loader first.
        */

        await loadUnityLoader();

        /*
            Assemble the three split assets.

            Cached complete assets are reused when available.
            Otherwise, the numbered parts are downloaded.
        */

        for (const asset of ASSET_PARTS) {
            await assembleAsset(asset);
        }

        /*
            Download the three complete framework/memory files.
        */

        await downloadNormalAssets();

        /*
            Retrieve and rewrite the Unity JSON configuration.
        */

        const configURL = await loadUnityConfig();

        /*
            Launch the game.
        */

        startUnity(configURL);

    } catch (error) {
        fail(
            error && error.stack
                ? error.stack
                : String(error)
        );
    }
}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener("beforeunload", function() {
    for (const key of Object.keys(blobUrls)) {
        try {
            URL.revokeObjectURL(blobUrls[key]);

        } catch (error) {
            // Ignore cleanup errors during page exit.
        }
    }
});

/* =========================================================
   RUN
========================================================= */

main();

</script>
</body>
</html>
