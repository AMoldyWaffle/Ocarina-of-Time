<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>GTA: Vice City — Optimized Loader</title>
<style>
html,body{margin:0;min-height:100%;background:#05060a;color:#eef0ff;font:14px system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:520px;text-align:center}
h1{font-size:20px;letter-spacing:.08em}
p{color:#9aa4bd;line-height:1.6}
#status{color:#00d2ff}
</style>
</head>
<body>
<main>
<h1>GRAND THEFT AUTO: VICE CITY</h1>
<p id="status">Preparing the optimized game loader…</p>
<p id="detail">Loading the original game runtime without changing its engine, saves, or controls.</p>
</main>
<script>
(async function(){
  const status=document.getElementById("status");
  const detail=document.getElementById("detail");
  try{
    status.textContent="Loading game runtime…";
    const response=await fetch("./index-source.txt",{cache:"force-cache"});
    if(!response.ok)throw new Error("Could not load the game runtime (HTTP "+response.status+")");
    let html=await response.text();

    const original='const files=(tree.tree||[]).filter(item=>item.type==="blob"&&';
    const optimized='const files=(tree.tree||[]).filter(item=>item.type==="blob"&&\n      !item.path.startsWith("art work/")&&';
    if(!html.includes(original))throw new Error("The downloader code did not match the expected version; refusing to start an unoptimized build.");
    html=html.replace(original,optimized);

    const marker='const total=files.reduce((sum,file)=>sum+(file.size||0),0);';
    if(!html.includes(marker))throw new Error("Could not verify the optimized download list.");
    html=html.replace(marker,marker+'\n    console.info("[performance] Skipping 51 non-game artwork files (about 107 MiB); all runtime folders remain enabled.");');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.textContent="Unable to start the optimized loader";
    status.style.color="#ff657a";
    detail.textContent=error&&error.message?error.message:String(error);
    console.error("[VC optimized wrapper]",error);
  }
})();
</script>
</body>
</html>
