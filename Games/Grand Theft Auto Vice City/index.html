 }
 return {
  paths:[...info.values()].map(item=>item.path),
  size:path=>info.get(key(path))?.size||0,
  read:async path=>new Uint8Array(await (await get(path)).arrayBuffer()),
  readRange:async(path,offset,size)=>new Uint8Array(await (await get(path)).slice(offset,offset+size).arrayBuffer()),

    html=html.slice(0,blockStart)+replacement+html.slice(blockEnd+blockEndMarker.length);
