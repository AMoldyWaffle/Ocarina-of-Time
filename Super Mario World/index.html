
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Mario World</title>

<style>
* { box-sizing:border-box; }

html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

#game {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

#loading {
    position:absolute;
    inset:0;
    z-index:99999;
    background:#080808;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    text-align:center;
}

#barOuter {
    width:min(400px,85vw);
    height:9px;
    background:#292929;
    border-radius:10px;
    overflow:hidden;
}

#bar {
    height:100%;
    width:0%;
    background:#e63946;
    transition:width .2s;
}

#status {
    color:#aaa;
    font-size:14px;
    margin:15px;
}

#error {
    color:#ff6666;
    white-space:pre-wrap;
    max-width:600px;
    font-size:12px;
}

button {
    background:#e63946;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <h2>SUPER MARIO WORLD</h2>
    <div id="status">Initializing...</div>
    <div id="barOuter"><div id="bar"></div></div>
    <p id="error"></p>
    <button id="retry" onclick="start()" hidden>Retry</button>
</div>

<script>
"use strict";

/* ======================================
   REPOSITORY CONFIGURATION
====================================== */

const EMULATOR_ROOT =
"https://raw.githubusercontent.com/AMoldyWaffle/RetroEmulator/main/";

const ROM_URL =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20%28USA%29.sfc";

/* ======================================
   INTERFACE
====================================== */

const loading = document.getElementById("loading");
const statusBox = document.getElementById("status");
const bar = document.getElementById("bar");
const errorBox = document.getElementById("error");
const retryButton = document.getElementById("retry");

let running = false;
let started = false;
let romObjectURL = null;
let attempt = 0;

function status(message) {
    statusBox.textContent = message;
}

function progress(value) {
    bar.style.width = value + "%";
}

function fail(message) {
    running = false;
    status("Unable to start game");
    errorBox.textContent = message;
    retryButton.hidden = false;
}

/* ======================================
   DOWNLOAD ROM
====================================== */

async function downloadROM() {

    status("Downloading Super Mario World...");

    const response = await fetch(ROM_URL, {
        cache:"no-store"
    });

    if (!response.ok) {
        throw new Error("ROM download failed: HTTP " +
            response.status);
    }

    const total = Number(
        response.headers.get("content-length")
    ) || 0;

    if (!response.body) {
        const data = await response.arrayBuffer();
        progress(30);
        return new Blob([data]);
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while (true) {
        const result = await reader.read();

        if (result.done) break;

        chunks.push(result.value);
        received += result.value.length;

        if (total) {
            progress(30 * received / total);
        }
    }

    const blob = new Blob(chunks, {
        type:"application/octet-stream"
    });

    if (!blob.size) {
        throw new Error("Downloaded ROM is empty.");
    }

    return blob;
}

/* ======================================
   LOAD EMULATOR
====================================== */

function loadScript(url) {

    return new Promise((resolve,reject) => {

        const script = document.createElement("script");

        script.src = url;
        script.async = true;

        script.onload = resolve;

        script.onerror = () => {
            reject(new Error(
                "Failed to load emulator file:\n" + url
            ));
        };

        document.head.appendChild(script);
    });
}

/* ======================================
   START GAME
====================================== */

async function start() {

    if (running) return;

    running = true;
    started = false;
    attempt++;

    const thisAttempt = attempt;

    errorBox.textContent = "";
    retryButton.hidden = true;
    progress(0);

    loading.style.display = "flex";
    document.getElementById("game").innerHTML = "";

    if (romObjectURL) {
        URL.revokeObjectURL(romObjectURL);
        romObjectURL = null;
    }

    try {

        /* Download ROM */

        const rom = await downloadROM();

        if (thisAttempt !== attempt) return;

        romObjectURL = URL.createObjectURL(rom);

        progress(35);

        /* Configure EmulatorJS */

        status("Configuring SNES emulator...");

        window.EJS_player = "#game";
        window.EJS_core = "snes";
        window.EJS_gameName = "Super Mario World";
        window.EJS_gameUrl = romObjectURL;

        /*
          IMPORTANT:
          This points to YOUR repository root.
          Do not append /data/ or /src/.
        */

        window.EJS_pathtodata = EMULATOR_ROOT;

        window.EJS_biosUrl = "";
        window.EJS_startOnLoaded = true;
        window.EJS_fullscreenOnLoaded = false;
        window.EJS_threads = false;
        window.EJS_disableDatabases = true;
        window.EJS_DEBUG_XX = false;

        window.EJS_ready = function() {
            status("Emulator initialized...");
            progress(85);
        };

        window.EJS_onGameStart = function() {
            started = true;
            running = false;
            progress(100);
            loading.style.display = "none";
        };

        /* Load your repository's loader */

        status("Loading emulator from RetroEmulator...");

        await loadScript(EMULATOR_ROOT + "loader.js");

        if (thisAttempt !== attempt) return;

        progress(65);
        status("Loading SNES core and initializing game...");

        /*
          The loader loads emulator.min.js, emulator.min.css,
          and the supporting files from the repository root.
        */

        setTimeout(() => {

            if (thisAttempt !== attempt || started) return;

            if (!started) {
                fail(
                    "The emulator loader loaded, but the game " +
                    "did not report that it started.\n\n" +
                    "Check that the SNES core files exist in " +
                    "RetroEmulator/cores/ and that the src " +
                    "directory is accessible."
                );
            }

        }, 60000);

    } catch (error) {

        console.error(error);
        fail(error.message);

    }
}

/* ======================================
   AUTOMATIC START
====================================== */

window.addEventListener("load", start);

</script>
</body>
</html>
