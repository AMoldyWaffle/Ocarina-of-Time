
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<style>
html,body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
#emulator {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}
</style>
</head>
<body>

<div id="emulator"></div>

<script src="https://binbashbanana.github.io/webretro/embed/embed.js"></script>

<script>
const rom =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";

webretroEmbed(
    document.getElementById("emulator"),
    "https://binbashbanana.github.io/webretro/",
    {
        core: "autodetect",
        rom: rom
    }
);
</script>

</body>
</html>
