<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Super Mario World</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // Your ROM (confirmed reachable on your Chromebook)
        EJS_gameUrl = "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Ocarina-of-Time@main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";
        EJS_core   = "snes";
        EJS_player = "#game";

        // Mirror paths on jsDelivr to try in order
        const DATA_PATHS = [
            // 1. Official EmulatorJS GitHub repo via jsDelivr
            "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@4.3.0-pre/data/",
            // 2. The original ethanaobrien fork (often used as a fallback)
            "https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/",
            // 3. The joethun mirror (in case it was a temporary glitch)
            "https://cdn.jsdelivr.net/gh/joethun/emulatorjs-cdn-mirror@main/stable/"
        ];

        let pathIndex = 0;

        function tryNextPath() {
            if (pathIndex >= DATA_PATHS.length) {
                console.error("All EmulatorJS data sources failed.");
                document.getElementById("game").innerHTML =
                    '<p style="color:white;padding:20px;font-family:sans-serif;">' +
                    'Could not load EmulatorJS from any mirror. ' +
                    'The only remaining option is to self‑host the EmulatorJS data folder ' +
                    'on a server your Chromebook can access.' +
                    '</p>';
                return;
            }

            const path = DATA_PATHS[pathIndex];
            pathIndex++;

            console.log("Trying EmulatorJS data path: " + path);
            EJS_pathtodata = path;

            // Remove any previously injected loader script
            const oldScript = document.getElementById("ejs-loader");
            if (oldScript) oldScript.remove();

            // Inject the loader from this path
            const script = document.createElement("script");
            script.id = "ejs-loader";
            script.src = path + "loader.js";
            script.onerror = function() {
                console.warn("Failed to load loader.js from " + path);
                tryNextPath();
            };
            document.body.appendChild(script);

            // If nothing initialises within 8 seconds, try the next path
            setTimeout(function() {
                if (typeof EJS_emulator === "undefined") {
                    console.warn("EmulatorJS did not initialise from " + path);
                    tryNextPath();
                }
            }, 8000);
        }

        // Start the first attempt
        tryNextPath();
    </script>
</body>
</html>
