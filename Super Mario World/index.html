
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario World</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body, #game {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: fixed;
    inset: 0;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #000;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    text-align: center;
}

#loading-bar-bg {
    width: 280px;
    height: 10px;
    background: #333;
    border-radius: 10px;
    margin-top: 15px;
}

#loading-bar {
    height: 100%;
    width: 0%;
    background: #1685ff;
    border-radius: 10px;
    transition: width .2s;
}

#loading-text {
    color: #aaa;
    font-size: 13px;
    margin-top: 12px;
}

#consoleToggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999999;
    padding: 9px 14px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
}

#consolePanel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    z-index: 999998;
    background: rgba(10,10,10,.97);
    color: white;
    font-family: monospace;
    border-top: 2px solid #444;
}

#consoleHeader {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: #222;
}

#consoleHeader button {
    padding: 5px 10px;
    margin-left: 5px;
    cursor: pointer;
}

#consoleOutput {
    height: calc(100% - 40px);
    overflow-y: auto;
    padding: 10px;
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.log-info { color: #65b5ff; }
.log-warn { color: #ffcc55; }
.log-error { color: #ff6666; }
.log-success { color: #65dd85; }
.log-fatal { color: #ff3333; font-weight: bold; }
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div id="loading-title">Loading Super Mario World...</div>
    <div id="loading-bar-bg">
        <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Preparing emulator...</div>
</div>

<button id="consoleToggle">Show Console</button>

<div id="consolePanel">
    <div id="consoleHeader">
        <strong>EmulatorJS Console</strong>
        <div>
            <button onclick="clearConsole()">Clear</button>
            <button onclick="hideConsole()">Hide</button>
        </div>
    </div>
    <div id="consoleOutput"></div>
</div>

<script>
/* =================================
   CONSOLE
================================= */

const output = document.getElementById("consoleOutput");
const panel = document.getElementById("consolePanel");
const toggle = document.getElementById("consoleToggle");

function log(type, message) {
    const entry = document.createElement("div");
    const time = new Date().toLocaleTimeString();

    entry.className =
        "log-" + type.toLowerCase().replace(" ", "-");

    entry.textContent =
        "[" + time + "] [" + type.toUpperCase() + "] " + message;

    output.appendChild(entry);
    output.scrollTop = output.scrollHeight;
}

function clearConsole() {
    output.innerHTML = "";
}

function hideConsole() {
    panel.style.display = "none";
    toggle.textContent = "Show Console";
}

toggle.onclick = function() {
    const visible = panel.style.display === "block";
    panel.style.display = visible ? "none" : "block";
    toggle.textContent = visible ? "Show Console" : "Hide Console";
};

/* Capture internal console errors and warnings */

const originalError = console.error.bind(console);
const originalWarn = console.warn.bind(console);

console.error = function(...args) {
    originalError(...args);
    log("ERROR", args.map(String).join(" "));
};

console.warn = function(...args) {
    originalWarn(...args);
    log("WARN", args.map(String).join(" "));
};

/* Capture JavaScript errors */

window.addEventListener("error", function(event) {
    if (event.target && event.target !== window) {
        log("ERROR", "Failed resource: " +
            (event.target.src || event.target.href || "Unknown"));
        return;
    }

    log("ERROR", event.message +
        " | File: " + event.filename +
        " | Line: " + event.lineno);
});

window.addEventListener("unhandledrejection", function(event) {
    log("ERROR", "Promise rejection: " + event.reason);
});

/* =================================
   GAME CONFIGURATION
================================= */

const ROM_URL =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";

const GAME_NAME = "Super Mario World";

const DATA_URL =
"https://cdn.jsdelivr.net/gh/AMoldyWaffle/Ocarina-of-Time@main/Emulator/data/";

/* =================================
   LOADING DISPLAY
================================= */

function loadingText(message) {
    document.getElementById("loading-text").textContent = message;
}

function loadingProgress(percent) {
    document.getElementById("loading-bar").style.width =
        Math.min(100, percent) + "%";
}

function hideLoading() {
    document.getElementById("loading").style.display = "none";
}

/* =================================
   EMULATORJS CONFIGURATION
================================= */

window.EJS_player = "#game";
window.EJS_core = "snes9x";
window.EJS_gameName = GAME_NAME;
window.EJS_gameUrl = ROM_URL;
window.EJS_pathtodata = DATA_URL;

window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_volume = 0.5;
window.EJS_color = "#1685ff";

/* =================================
   REAL EMULATORJS CALLBACKS
================================= */

/* EmulatorJS has completed its ready event */

window.EJS_ready = function() {
    log("SUCCESS", "EmulatorJS READY event received.");
    loadingProgress(75);
    loadingText("Emulator initialized. Loading game...");
};

/* Game has actually started */

window.EJS_onGameStart = function() {
    log("SUCCESS", "GAME STARTED!");
    loadingProgress(100);
    loadingText("Game started!");

    setTimeout(hideLoading, 500);
};

/* Save/load callbacks */

window.EJS_onLoadSave = function() {
    log("INFO", "Save data loaded.");
};

window.EJS_onExit = function() {
    log("WARN", "Emulator exited.");
};

/* =================================
   EMULATORJS BUTTONS
================================= */

window.EJS_Buttons = {
    playPause: false,
    restart: false,
    mute: false,
    settings: false,
    fullscreen: false,
    saveState: false,
    loadState: false,
    screenRecord: false,
    gamepad: false,
    cheat: false,
    volume: false,
    saveSavFiles: false,
    loadSavFiles: false,
    quickSave: false,
    quickLoad: false,
    screenshot: false,
    cacheManager: false,
    exitEmulation: false
};

/* =================================
   RESOURCE DIAGNOSTICS
================================= */

const observedResources = new Set();

const resourceObserver = new PerformanceObserver(function(list) {
    for (const item of list.getEntries()) {
        if (!item.name.includes("githubusercontent") &&
            !item.name.includes("jsdelivr")) {
            continue;
        }

        if (observedResources.has(item.name)) continue;
        observedResources.add(item.name);

        log("INFO", "Resource loaded: " + item.name);
    }
});

try {
    resourceObserver.observe({ type: "resource", buffered: true });
} catch(e) {
    log("WARN", "Resource monitoring unavailable.");
}

/* =================================
   LOAD EMULATORJS
================================= */

function loadEmulator() {
    log("INFO", "Game: " + GAME_NAME);
    log("INFO", "ROM: " + ROM_URL);
    log("INFO", "Core: " + window.EJS_core);
    log("INFO", "Emulator data: " + DATA_URL);
    log("INFO", "Browser: " + navigator.userAgent);
    log("INFO", "WebAssembly: " +
        (typeof WebAssembly !== "undefined"));

    loadingText("Loading EmulatorJS loader...");

    log("INFO", "Loading loader.js...");

    const script = document.createElement("script");

    script.src = DATA_URL + "loader.js";
    script.async = true;

    script.onload = function() {
        log("SUCCESS", "loader.js executed.");
        log("INFO", "Waiting for EmulatorJS ready event...");
        loadingProgress(20);
        loadingText("Initializing EmulatorJS...");
    };

    script.onerror = function() {
        log("FATAL ERROR", "Failed to load loader.js.");
        loadingText("Failed to load EmulatorJS.");
    };

    document.body.appendChild(script);
}

/* =================================
   INITIALIZATION TIMEOUT
================================= */

setTimeout(function() {
    if (document.getElementById("loading").style.display === "none") {
        return;
    }

    if (window.EJS_emulator) {
        log("WARN", "Emulator object exists but game has not started.");
        loadingText("Emulator loaded. Waiting for game...");
    } else {
        log("FATAL ERROR",
            "EmulatorJS did not create its emulator object within 30 seconds.");
        loadingText("Initialization timed out. Open console for details.");
    }
}, 30000);

/* =================================
   START
================================= */

loadEmulator();

</script>
</body>
</html>
