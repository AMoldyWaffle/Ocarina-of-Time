
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Mario World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:Arial}
#game{position:absolute;inset:0;width:100%;height:100%}
#loading{position:absolute;inset:0;z-index:99999;background:#080808;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;text-align:center}
#barOuter{width:min(400px,85vw);height:9px;background:#292929;border-radius:10px;overflow:hidden}
#bar{height:100%;width:0;background:#e63946;transition:width .2s}
#status{color:#aaa;font-size:14px;margin:15px}
#error{color:#ff6666;white-space:pre-wrap;max-width:650px;font-size:12px}
button{background:#e63946;color:white;border:0;padding:12px 25px;border-radius:5px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<div id="game"></div>

<div id="loading">
<h2>SUPER MARIO WORLD</h2>
<div id="status">Initializing...</div>
<div id="barOuter"><div id="bar"></div></div>
<p id="error"></p>
<button id="retry" onclick="start()" hidden>Retry</button>
</div>

<script>
"use strict";

/* =====================================
   SOURCES
===================================== */

const ROOT =
"https://raw.githubusercontent.com/AMoldyWaffle/RetroEmulator/main/";

const ROM =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20%28USA%29.sfc";

/* =====================================
   UI
===================================== */

const loading = document.getElementById("loading");
const statusBox = document.getElementById("status");
const bar = document.getElementById("bar");
const errorBox = document.getElementById("error");
const retry = document.getElementById("retry");

let blobURLs = [];
let scriptElements = [];
let running = false;
let attempt = 0;

function status(message) {
    statusBox.textContent = message;
}

function progress(value) {
    bar.style.width = value + "%";
}

function fail(error) {
    running = false;
    status("Loading failed");
    errorBox.textContent = String(error);
    retry.hidden = false;
}

function makeBlobURL(blob) {
    const url = URL.createObjectURL(blob);
    blobURLs.push(url);
    return url;
}

/* =====================================
   FETCH FILES
===================================== */

async function getFile(url, name) {
    status("Downloading " + name + "...");

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            name + " failed: HTTP " + response.status +
            "\nURL: " + url
        );
    }

    const blob = await response.blob();

    if (!blob.size) {
        throw new Error(name + " is empty.");
    }

    return blob;
}

/* =====================================
   LOAD A BLOB SCRIPT
===================================== */

function executeBlobScript(url, name) {
    return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = url;
        script.async = false;

        script.onload = () => resolve();

        script.onerror = () => {
            reject(new Error(
                "Could not execute " + name
            ));
        };

        scriptElements.push(script);
        document.head.appendChild(script);
    });
}

/* =====================================
   CLEANUP
===================================== */

function cleanup() {
    for (const script of scriptElements) {
        script.remove();
    }

    scriptElements = [];

    for (const url of blobURLs) {
        URL.revokeObjectURL(url);
    }

    blobURLs = [];

    document.getElementById("game").innerHTML = "";

    window.EJS_emulator = undefined;
}

/* =====================================
   START
===================================== */

async function start() {
    if (running) return;

    running = true;
    const id = ++attempt;

    cleanup();

    errorBox.textContent = "";
    retry.hidden = true;
    progress(0);
    loading.style.display = "flex";

    try {

        /* 1. Download ROM */

        const romBlob = await getFile(ROM, "game ROM");

        if (id !== attempt) return;

        const romURL = makeBlobURL(romBlob);

        progress(20);

        /* 2. Download actual minified engine */

        const engineBlob = await getFile(
            ROOT + "emulator.min.js",
            "emulator.min.js"
        );

        if (id !== attempt) return;

        const engineURL = makeBlobURL(engineBlob);

        progress(40);

        /* 3. Download emulator CSS */

        const cssBlob = await getFile(
            ROOT + "emulator.min.css",
            "emulator.min.css"
        );

        if (id !== attempt) return;

        const cssURL = makeBlobURL(cssBlob);

        progress(55);

        /* 4. Download loader */

        const loaderBlob = await getFile(
            ROOT + "loader.js",
            "loader.js"
        );

        if (id !== attempt) return;

        const loaderURL = makeBlobURL(
            new Blob([loaderBlob], {
                type: "text/javascript"
            })
        );

        progress(65);

        /* 5. Configure EmulatorJS */

        status("Configuring emulator...");

        window.EJS_player = "#game";
        window.EJS_core = "snes";
        window.EJS_gameName = "Super Mario World";
        window.EJS_gameUrl = romURL;

        // Supporting folders remain hosted in your repository.
        window.EJS_pathtodata = ROOT;

        /*
          Explicitly override the two minified files.
          This prevents loader.js from falling back
          to emulator.js and other non-minified files.
        */

        window.EJS_paths = {
            "emulator.min.js": engineURL,
            "emulator.min.css": cssURL
        };

        window.EJS_biosUrl = "";
        window.EJS_startOnLoaded = true;
        window.EJS_fullscreenOnLoaded = false;
        window.EJS_threads = false;
        window.EJS_disableDatabases = true;
        window.EJS_DEBUG_XX = false;

        window.EJS_ready = function() {
            if (id !== attempt) return;

            status("Emulator initialized. Starting game...");
            progress(90);
        };

        window.EJS_onGameStart = function() {
            if (id !== attempt) return;

            status("Game started!");
            progress(100);
            loading.style.display = "none";
            running = false;
        };

        /* 6. Execute loader */

        status("Starting EmulatorJS...");

        await executeBlobScript(loaderURL, "loader.js");

        if (id !== attempt) return;

        status("Loading SNES core...");

        /*
          Wait for actual game startup.
          A timeout reports missing supporting files.
        */

        setTimeout(() => {
            if (id !== attempt || !running) return;

            fail(
                "Emulator did not finish starting.\n\n" +
                "The minified engine loaded, but a supporting " +
                "file or SNES core may be missing.\n\n" +
                "Check the cores/ and src/ directories."
            );
        }, 60000);

    } catch (error) {
        console.error(error);

        if (id === attempt) {
            fail(error.message);
        }
    }
}

window.addEventListener("load", start);

</script>
</body>
</html>
