
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body, #game {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: fixed;
    inset: 0;
}
</style>
</head>

<body>

<div id="game"></div>

<script>
/* ==============================
   GAME CONFIGURATION
============================== */

const ROM_URL =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";

const GAME_NAME = "Super Mario World";

/* Automatically select a core by file extension */

const extension = ROM_URL.split("?")[0].split(".").pop().toLowerCase();

const CORE_MAP = {
    nes: "nes",
    sfc: "snes",
    smc: "snes",
    gb: "gb",
    gbc: "gb",
    gba: "gba",
    nds: "nds",
    n64: "n64",
    z64: "n64",
    v64: "n64",
    iso: "psx",
    pbp: "psx",
    bin: "psx",
    gen: "segaMD",
    md: "segaMD"
};

const CORE = CORE_MAP[extension];

if (!CORE) {
    throw new Error("Unsupported game extension: " + extension);
}

/* ==============================
   SELF-HOSTED EMULATORJS
============================== */


const DATA =
"https://cdn.jsdelivr.net/gh/AMoldyWaffle/Ocarina-of-Time@main/Emulator/data/";
window.EJS_player = "#game";
window.EJS_core = CORE;
window.EJS_gameName = GAME_NAME;
window.EJS_gameUrl = ROM_URL;
window.EJS_pathtodata = DATA;

window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_volume = 0.5;
window.EJS_color = "#1685ff";

/* Hide emulator toolbar buttons */

window.EJS_Buttons = {
    playPause: false,
    restart: false,
    mute: false,
    settings: false,
    fullscreen: false,
    saveState: false,
    loadState: false,
    screenRecord: false,
    gamepad: false,
    cheat: false,
    volume: false,
    saveSavFiles: false,
    loadSavFiles: false,
    quickSave: false,
    quickLoad: false,
    screenshot: false,
    cacheManager: false,
    exitEmulation: false
};

/* Load the locally hosted engine */

const loader = document.createElement("script");
loader.src = DATA + "loader.js";
document.body.appendChild(loader);

</script>

</body>
</html>
