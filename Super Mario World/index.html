
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Mario World</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body, #game {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: fixed;
    inset: 0;
}

/* Console toggle */
#consoleToggle {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 999999;
    padding: 10px 15px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
}

/* Console panel */
#consolePanel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    background: rgba(10,10,10,.97);
    color: white;
    z-index: 999998;
    font-family: monospace;
    border-top: 2px solid #444;
}

#consoleHeader {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: #222;
}

#consoleHeader button {
    padding: 5px 10px;
    margin-left: 5px;
    cursor: pointer;
}

#consoleOutput {
    height: calc(100% - 40px);
    overflow-y: auto;
    padding: 10px;
    font-size: 12px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.log-info { color: #65b5ff; }
.log-warn { color: #ffcc55; }
.log-error { color: #ff6666; }
.log-success { color: #65dd85; }
.log-fatal { color: #ff3333; font-weight: bold; }
</style>
</head>

<body>

<div id="game"></div>

<button id="consoleToggle">Show Console</button>

<div id="consolePanel">
    <div id="consoleHeader">
        <strong>EmulatorJS Console</strong>
        <div>
            <button onclick="clearConsole()">Clear</button>
            <button onclick="hideConsole()">Hide</button>
        </div>
    </div>
    <div id="consoleOutput"></div>
</div>

<script>
/* ==============================
   CONSOLE SYSTEM
============================== */

const consoleOutput = document.getElementById("consoleOutput");
const consolePanel = document.getElementById("consolePanel");
const consoleToggle = document.getElementById("consoleToggle");

function log(type, message) {
    const time = new Date().toLocaleTimeString();

    const entry = document.createElement("div");
    entry.className = "log-" + type.toLowerCase().replace(" ", "-");
    entry.textContent = "[" + time + "] [" + type.toUpperCase() + "] " + message;

    consoleOutput.appendChild(entry);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;

    console.log("[" + type + "]", message);
}

function clearConsole() {
    consoleOutput.innerHTML = "";
}

function hideConsole() {
    consolePanel.style.display = "none";
    consoleToggle.textContent = "Show Console";
}

consoleToggle.onclick = function() {
    const visible = consolePanel.style.display === "block";

    consolePanel.style.display = visible ? "none" : "block";
    consoleToggle.textContent = visible ? "Show Console" : "Hide Console";
};

/* Capture JavaScript errors */
window.addEventListener("error", function(event) {
    if (event.target && event.target !== window) {
        log("RESOURCE ERROR",
            "Failed resource: " + (event.target.src || event.target.href || "Unknown"));
        return;
    }

    log("ERROR",
        "JavaScript error: " + event.message +
        " | File: " + event.filename +
        " | Line: " + event.lineno);
});

/* Capture rejected promises */
window.addEventListener("unhandledrejection", function(event) {
    log("ERROR", "Unhandled promise rejection: " + event.reason);
});

/* ==============================
   GAME CONFIGURATION
============================== */

const ROM_URL =
"https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc";

const GAME_NAME = "Super Mario World";

const extension = ROM_URL.split("?")[0].split(".").pop().toLowerCase();

const CORE_MAP = {
    nes: "nes",
    sfc: "snes",
    smc: "snes",
    gb: "gb",
    gbc: "gb",
    gba: "gba",
    nds: "nds",
    n64: "n64",
    z64: "n64",
    v64: "n64",
    iso: "psx",
    pbp: "psx",
    bin: "psx",
    gen: "segaMD",
    md: "segaMD"
};

const CORE = CORE_MAP[extension];

if (!CORE) {
    log("FATAL ERROR", "Unsupported game extension: " + extension);
    throw new Error("Unsupported game extension: " + extension);
}

/* ==============================
   EMULATORJS CONFIGURATION
============================== */

/* Primary and backup CDN locations */

const DATA_SOURCES = [
    "https://raw.githubusercontent.com/AMoldyWaffle/Ocarina-of-Time/main/Emulator/data/",
    "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Ocarina-of-Time@main/Emulator/data/"
];

window.EJS_player = "#game";
window.EJS_core = CORE;
window.EJS_gameName = GAME_NAME;
window.EJS_gameUrl = ROM_URL;

window.EJS_startOnLoaded = true;
window.EJS_fullscreenOnLoaded = false;
window.EJS_volume = 0.5;
window.EJS_color = "#1685ff";

/* Hide emulator toolbar buttons */

window.EJS_Buttons = {
    playPause: false,
    restart: false,
    mute: false,
    settings: false,
    fullscreen: false,
    saveState: false,
    loadState: false,
    screenRecord: false,
    gamepad: false,
    cheat: false,
    volume: false,
    saveSavFiles: false,
    loadSavFiles: false,
    quickSave: false,
    quickLoad: false,
    screenshot: false,
    cacheManager: false,
    exitEmulation: false
};

/* ==============================
   LOAD EMULATORJS
============================== */

function loadEmulator(index) {

    if (index >= DATA_SOURCES.length) {
        log("FATAL ERROR", "All EmulatorJS sources failed.");
        log("FATAL ERROR", "Check that Emulator/data/loader.js exists in your repository.");
        return;
    }

    const DATA = DATA_SOURCES[index];

    window.EJS_pathtodata = DATA;

    log("INFO", "Trying emulator source: " + DATA);

    const loader = document.createElement("script");

    loader.src = DATA + "loader.js";

    loader.onload = function() {
        log("SUCCESS", "EmulatorJS loader downloaded successfully.");
        log("INFO", "Waiting for emulator initialization...");
    };

    loader.onerror = function() {
        log("ERROR", "Failed to load loader.js from: " + DATA);

        log("WARN", "Trying the next available source...");

        loader.remove();
        loadEmulator(index + 1);
    };

    document.body.appendChild(loader);
}

/* ==============================
   STARTUP INFORMATION
============================== */

log("INFO", "Game: " + GAME_NAME);
log("INFO", "ROM: " + ROM_URL);
log("INFO", "Core: " + CORE);
log("INFO", "Browser: " + navigator.userAgent);
log("INFO", "WebAssembly: " + (typeof WebAssembly !== "undefined"));

log("INFO", "Loading EmulatorJS...");

loadEmulator(0);

</script>

</body>
</html>
