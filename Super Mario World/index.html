<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Super Mario World (Nostalgist.js)</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; }
        #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        canvas { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="game"></div>

    <!-- Load Nostalgist.js from jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/nostalgist"></script>

    <script>
        async function startGame() {
            try {
                await Nostalgist.launch({
                    // Your ROM, served from jsDelivr (confirmed reachable)
                    rom: "https://cdn.jsdelivr.net/gh/AMoldyWaffle/Ocarina-of-Time@main/Super%20Mario%20World/Super%20Mario%20World%20(USA).sfc",
                    // The core to use. Nostalgist will fetch this from jsDelivr.
                    core: "snes9x",
                    // The element where the game canvas will be placed
                    element: document.getElementById("game"),
                });
            } catch (error) {
                console.error("Nostalgist launch failed:", error);
                document.getElementById("game").innerHTML =
                    '<p style="color:white;padding:20px;font-family:sans-serif;">' +
                    'Failed to launch emulator. Check the console for details. Error: ' + error.message +
                    '</p>';
            }
        }

        startGame();
    </script>
</body>
</html>
