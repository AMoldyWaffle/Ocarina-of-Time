<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Game Library</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#eee;font:14px Arial,sans-serif}
header{padding:22px 16px;text-align:center;background:#191920}
h1{margin:0;letter-spacing:3px;font-size:25px}
header p{color:#999;margin:8px 0 0}
button{border:1px solid #454553;border-radius:7px;background:#292936;color:#fff;padding:9px 12px;cursor:pointer}
button:hover{background:#41415b}
button:disabled{opacity:.5;cursor:wait}
#toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px}
#status{padding:8px 14px;text-align:center;color:#aaa;overflow-wrap:anywhere}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,210px));justify-content:center;gap:16px;padding:16px}
.game{background:#1b1b24;border:1px solid #30303c;border-radius:10px;overflow:hidden}
.cover{width:100%;aspect-ratio:3/4;object-fit:cover;background:#252530;display:block}
.name{text-align:center;font-weight:bold;padding:10px 6px}
.play{display:block;width:calc(100% - 16px);margin:0 8px 8px;background:#41417a;font-weight:bold}
.hosts{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 8px 10px}
.hosts button{font-size:11px;padding:7px 3px}
#player{display:none;padding:8px}
#playerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0}
#playing{font-weight:bold;flex:1;min-width:100px}
#gameframe{width:100%;height:72vh;min-height:360px;border:1px solid #444;background:#000;display:block}
#consolebox{margin-top:8px;border:1px solid #393943;background:#09090d;border-radius:7px}
#consolehead{display:flex;align-items:center;gap:8px;padding:7px}
#consolehead strong{flex:1}
#consolelog{height:150px;overflow:auto;padding:8px;color:#b9e5b9;font:12px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.log-error{color:#ff8888}.log-warn{color:#ffd27d}
footer{text-align:center;padding:24px;color:#555;font-size:12px}
.empty{text-align:center;color:#999;padding:40px}
</style>
</head>
<body>
<header><h1>GAME LIBRARY</h1><p>Choose a game and a source</p></header>
<div id="library">
  <div id="toolbar"><button id="rescan">Rescan games</button></div>
  <div id="status">Finding games...</div>
  <main id="games"><div class="empty">Loading library...</div></main>
</div>
<section id="player">
  <div id="playerbar">
    <button id="back">← Back to games</button>
    <div id="playing">No game selected</div>
    <button id="clearlog">Clear console</button>
  </div>
  <iframe id="gameframe" title="Game" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe>
  <div id="consolebox">
    <div id="consolehead"><strong>Game console</strong><button id="toggleconsole">Hide console</button></div>
    <div id="consolelog"></div>
  </div>
</section>
<footer>OCARINA OF TIME</footer>
<script>
"use strict";

const OWNER="AMoldyWaffle", REPO="Ocarina-of-Time", BRANCH="main", GAME_DIR="Games";
const API="https://api.github.com/repos/"+OWNER+"/"+REPO;
const HOSTS=[
 {name:"GitHub Pages",base:"https://amoldywaffle.github.io/Ocarina-of-Time/"},
 {name:"jsDelivr",base:"https://cdn.jsdelivr.net/gh/"+OWNER+"/"+REPO+"@"+BRANCH+"/"},
 {name:"Fastly CDN",base:"https://fastly.jsdelivr.net/gh/"+OWNER+"/"+REPO+"@"+BRANCH+"/"},
 {name:"Gcore CDN",base:"https://gcore.jsdelivr.net/gh/"+OWNER+"/"+REPO+"@"+BRANCH+"/"},
 {name:"GitHub Raw",base:"https://raw.githubusercontent.com/"+OWNER+"/"+REPO+"/"+BRANCH+"/"}
];
const $=id=>document.getElementById(id);
const gamesNode=$("games"),statusNode=$("status"),frame=$("gameframe"),consoleNode=$("consolelog");
let games=[],scanning=false,consoleVisible=true;

function enc(path){return path.split("/").map(encodeURIComponent).join("/")}
function url(host,path){return host.base+enc(path)}
async function get(url,ms=20000){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
 try{const r=await fetch(url,{mode:"cors",cache:"no-store",signal:controller.signal});if(!r.ok)throw Error("HTTP "+r.status);return r}
 finally{clearTimeout(timer)}
}
async function directory(path){
 const r=await get(API+"/contents/"+enc(path)+"?ref="+BRANCH);
 const data=await r.json();if(!Array.isArray(data))throw Error("Invalid GitHub directory response");return data;
}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pickHTML(files){
 const a=files.filter(x=>x.type==="file"&&/\.html?$/i.test(x.name));
 return a.find(x=>x.name.toLowerCase()==="index.html")||a.find(x=>/launcher/i.test(x.name))||a[0]||null;
}
async function scan(){
 if(scanning)return;scanning=true;gamesNode.innerHTML="";statusNode.textContent="Scanning repository...";
 try{
  const folders=(await directory(GAME_DIR)).filter(x=>x.type==="dir");
  const found=await Promise.all(folders.map(async folder=>{
   try{
    const files=await directory(folder.path),html=pickHTML(files);
    if(!html)return null;
    const coverDir=files.find(x=>x.type==="dir"&&x.name.toLowerCase()==="cover");
    let cover=null;
    if(coverDir){const imgs=(await directory(coverDir.path)).filter(x=>x.type==="file"&&/\.(png|jpe?g|webp|gif|avif)$/i.test(x.name));cover=imgs.find(x=>x.name.toLowerCase()==="cover.png")||imgs[0]||null}
    return {name:folder.name,html:html.path,cover:cover&&cover.path};
   }catch(e){console.warn("Skipped "+folder.name,e);return null}
  }));
  games=found.filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name));render();
 }catch(e){statusNode.textContent="Could not scan games: "+e.message;gamesNode.innerHTML='<div class="empty">Repository scan failed. Check the console or try again.</div>';console.error(e)}
 finally{scanning=false}
}
function render(){
 gamesNode.innerHTML="";
 if(!games.length){gamesNode.innerHTML='<div class="empty">No game launchers found.</div>';statusNode.textContent="0 games found.";return}
 for(const game of games){
  const card=document.createElement("article");card.className="game";
  if(game.cover){const img=document.createElement("img");img.className="cover";img.alt=game.name;img.loading="lazy";let n=0;img.onerror=()=>{if(n<HOSTS.length)img.src=url(HOSTS[n++],game.cover);else img.remove()};img.src=url(HOSTS[n++],game.cover);card.appendChild(img)}
  const name=document.createElement("div");name.className="name";name.textContent=game.name;card.appendChild(name);
  const play=document.createElement("button");play.className="play";play.textContent="PLAY (AUTO SOURCE)";play.onclick=()=>launch(game);card.appendChild(play);
  const choices=document.createElement("div");choices.className="hosts";
  HOSTS.forEach(host=>{const b=document.createElement("button");b.textContent=host.name;b.title="Load from "+host.name;b.onclick=()=>launch(game,host);choices.appendChild(b)});
  card.appendChild(choices);gamesNode.appendChild(card);
 }
 statusNode.textContent=games.length+" games found. Choose PLAY or a specific source.";
}

/* Runs inside the game iframe. Worker entry points are redirected to same-origin
   blob URLs; classic worker imports are resolved against the original URL. */
function workerBridge(){
 function wrap(Native,kind){
  if(typeof Native!=="function")return Native;
  return new Proxy(Native,{construct(target,args){
   let u;try{u=new URL(String(args[0]),document.baseURI)}catch(_){return Reflect.construct(target,args,target)}
   if(u.protocol==="blob:"||u.protocol==="data:"||u.origin===location.origin)return Reflect.construct(target,args,target);
   const original=u.href,opts=args[1],isModule=opts&&opts.type==="module";
   const code=isModule
    ?'import '+JSON.stringify(original)+';'
    :'const __u='+JSON.stringify(original)+';const __i=self.importScripts.bind(self);self.importScripts=(...a)=>__i(...a.map(x=>new URL(x,__u).href));self.importScripts(__u);';
   const blob=URL.createObjectURL(new Blob([code],{type:"text/javascript"})),next=args.slice();next[0]=blob;
   try{const w=Reflect.construct(target,next,target);console.info("[Launcher] bridged "+kind,original);return w}
   catch(e){URL.revokeObjectURL(blob);throw e}
  }});
 }
 if(window.Worker)window.Worker=wrap(window.Worker,"Worker");
 if(window.SharedWorker)window.SharedWorker=wrap(window.SharedWorker,"SharedWorker");
 const send=(level,args)=>{try{parent.postMessage({__gameConsole:true,level,args:Array.from(args).map(x=>{try{return typeof x==="string"?x:JSON.stringify(x)}catch(_){return String(x)}})},"*")}catch(_){}};
 ["log","info","warn","error"].forEach(level=>{const old=console[level].bind(console);console[level]=(...args)=>{old(...args);send(level,args)}});
 addEventListener("error",e=>send("error",[e.message||"Script error",e.filename||"",e.lineno||""]));
 addEventListener("unhandledrejection",e=>send("error",["Unhandled promise rejection",e.reason]));
 if(!window.__launcherFetchPatch){
  window.__launcherFetchPatch=true;const native=fetch.bind(window);
  window.fetch=async function(input,init){
   let request="";try{request=typeof input==="string"?input:input.url}catch(_){}
   let response;
   try{response=await native(input,init)}catch(e){if(/ejs\.offline|\/cores\/|\/compression\//i.test(request))console.error("[Network] Request failed",request,e);throw e}
   if(/ejs\.offline|\/cores\/|\/compression\//i.test(request))console.info("[Network]",response.status,response.headers.get("content-type"),response.headers.get("content-length"),request);
   if(!response.ok||!/\/emulator\.html(?:[?#]|$)/i.test(request))return response;
   const source=await response.text(),tag="<script>("+workerBridge.toString()+")();<\\/script>";
   const patched=/<head\\b[^>]*>/i.test(source)?source.replace(/<head\\b[^>]*>/i,m=>m+tag):tag+source;
   const headers=new Headers(response.headers);headers.delete("content-length");headers.delete("content-encoding");
   return new Response(patched,{status:response.status,statusText:response.statusText,headers});
  }
 }
}
function addLog(level,args){
 const line=document.createElement("div");line.className=level==="error"?"log-error":level==="warn"?"log-warn":"";
 line.textContent="["+new Date().toLocaleTimeString()+"] ["+level.toUpperCase()+"] "+args.join(" ");
 consoleNode.appendChild(line);consoleNode.scrollTop=consoleNode.scrollHeight;
}
window.addEventListener("message",e=>{if(e.data&&e.data.__gameConsole)addLog(e.data.level||"log",e.data.args||[])});
function inject(html,base){
 html=html.replace(/<base\b[^>]*>/i,"");
 const safe=base.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
 const bridge="<script>("+workerBridge.toString()+")();<\\/script>";
 const head='<base href="'+safe+'">'+bridge;
 return /<head\b[^>]*>/i.test(html)?html.replace(/<head\b[^>]*>/i,m=>m+head):head+html;
}
async function launch(game,preferred){
 $("library").style.display="none";$("player").style.display="block";$("playing").textContent=game.name;
 consoleNode.innerHTML="";addLog("info",["Starting "+game.name]);
 frame.srcdoc="<p style='color:white;background:black;font:16px Arial;padding:20px'>Loading "+escapeHTML(game.name)+"...</p>";
 const order=preferred?[preferred,...HOSTS.filter(x=>x!==preferred)]:HOSTS;
 for(const host of order){
  try{
   addLog("info",["Downloading HTML from "+host.name]);
   const response=await get(url(host,game.html),30000),html=await response.text();
   if(!/<html[\s>]/i.test(html))throw Error("The source did not return an HTML page");
   const base=host.base+enc(game.html.slice(0,game.html.lastIndexOf("/")+1));
   frame.srcdoc=inject(html,base);
   addLog("info",["Loaded HTML from "+host.name,"Game is running inside the launcher frame."]);
   return;
  }catch(e){addLog("warn",[host.name+" failed:",e.message])}
 }
 addLog("error",["Could not load this game from any source."]);
}
function back(){frame.srcdoc="";$("player").style.display="none";$("library").style.display="block";statusNode.textContent="Choose another game."}
$("back").onclick=back;
$("rescan").onclick=scan;
$("clearlog").onclick=()=>consoleNode.innerHTML="";
$("toggleconsole").onclick=()=>{consoleVisible=!consoleVisible;consoleNode.style.display=consoleVisible?"block":"none";$("toggleconsole").textContent=consoleVisible?"Hide console":"Show console"};
scan();
</script>
</body>
</html>
