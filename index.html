
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: #191920;
    border-bottom: 1px solid #30303a;
}

header h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 3px;
}

header p {
    color: #999;
}

.toolbar {
    display: flex;
    justify-content: center;
    padding: 20px;
    gap: 12px;
}

button {
    padding: 11px 20px;
    background: #292936;
    color: white;
    border: 1px solid #444455;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #41415a;
}

#status {
    text-align: center;
    color: #999;
    padding: 10px;
}

#games {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(180px, 220px)
    );
    justify-content: center;
    gap: 25px;
    padding: 25px;
}

.game {
    background: #1b1b24;
    border: 1px solid #30303c;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.game:hover {
    transform: translateY(-6px);
    border-color: #8585d5;
}

.game img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    background: #252530;
}

.game-name {
    padding: 15px;
    text-align: center;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #888;
    padding: 60px 15px;
}

footer {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>GAME LIBRARY</h1>
    <p>Your personal game collection</p>
</header>

<div class="toolbar">
    <button onclick="scanGames()">Refresh Library</button>
</div>

<div id="status">Connecting to game repository...</div>

<div id="games">
    <div class="empty">Loading games...</div>
</div>

<footer>OCARINA OF TIME GAME LIBRARY</footer>

<script>

// ==========================================
// CONFIGURATION
// ==========================================

const OWNER = "AMoldyWaffle";
const REPOSITORY = "Ocarina-of-Time";
const BRANCH = "main";

const GAME_DIRECTORY = "Games";

// GitHub API
const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;

// Base URL of this GitHub Pages installation.
// Assumes GameLauncher.html is in the repository root.
const SITE_BASE = new URL("./", window.location.href);


// ==========================================
// ELEMENTS
// ==========================================

const gamesContainer = document.getElementById("games");
const statusText = document.getElementById("status");


// ==========================================
// SCAN REPOSITORY
// ==========================================

async function scanGames() {

    gamesContainer.innerHTML = "";
    statusText.textContent = "Scanning repository...";

    try {

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                `GitHub API returned ${response.status}`
            );
        }

        const data = await response.json();

        if (!data.tree) {
            throw new Error("Invalid repository tree.");
        }

        if (data.truncated) {
            throw new Error(
                "Repository tree was truncated by GitHub."
            );
        }

        const files = data.tree.filter(item =>
            item.type === "blob"
        );

        const prefix = GAME_DIRECTORY + "/";

        const gameFolders = new Map();

        // ======================================
        // FIND GAME FOLDERS
        // ======================================

        for (const file of files) {

            if (!file.path.startsWith(prefix)) {
                continue;
            }

            const remaining = file.path.slice(prefix.length);

            const parts = remaining.split("/");

            if (parts.length < 2) {
                continue;
            }

            const folderName = parts[0];

            if (!gameFolders.has(folderName)) {
                gameFolders.set(folderName, []);
            }

            gameFolders.get(folderName).push(file);

        }


        // ======================================
        // INSPECT EACH GAME
        // ======================================

        const discoveredGames = [];

        for (const [folderName, folderFiles] of gameFolders) {

            let cover = null;
            let html = null;

            // Find Cover folder image.

            const coverFiles = folderFiles.filter(file => {

                const parts = file.path.split("/");

                return (
                    parts.length >= 4 &&
                    parts[2].toLowerCase() === "cover" &&
                    /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(
                        parts[parts.length - 1]
                    )
                );

            });

            if (coverFiles.length > 0) {

                // Prefer cover.png, otherwise first available image.

                cover = coverFiles.find(file =>
                    file.path.split("/").pop().toLowerCase() === "cover.png"
                ) || coverFiles[0];

            }

            // Find HTML files anywhere inside the game folder.

            const htmlFiles = folderFiles.filter(file =>
                /\.html?$/i.test(file.path)
            );

            if (htmlFiles.length > 0) {

                // Prefer index.html, then other root HTML files.

                html = htmlFiles.find(file =>
                    file.path.toLowerCase() ===
                    `${prefix}${folderName}/index.html`.toLowerCase()
                );

                if (!html) {
                    html = htmlFiles.find(file =>
                        file.path.split("/").length === 3
                    );
                }

                if (!html) {
                    html = htmlFiles[0];
                }

            }

            // Both cover and HTML are required.

            if (cover && html) {

                discoveredGames.push({
                    name: folderName,
                    cover: cover.path,
                    html: html.path
                });

            }

        }


        // ======================================
        // SORT AND DISPLAY
        // ======================================

        discoveredGames.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        displayGames(discoveredGames);

    } catch (error) {

        console.error(error);

        gamesContainer.innerHTML = `
            <div class="empty">
                Failed to load games.<br><br>
                ${escapeHTML(error.message)}<br><br>
                Check the browser console for details.
            </div>
        `;

        statusText.textContent = "Repository scan failed.";

    }

}


// ==========================================
// DISPLAY GAMES
// ==========================================

function displayGames(games) {

    gamesContainer.innerHTML = "";

    if (games.length === 0) {

        gamesContainer.innerHTML = `
            <div class="empty">
                No compatible games found.
            </div>
        `;

        statusText.textContent = "0 games found.";

        return;
    }

    for (const game of games) {

        const card = document.createElement("div");
        card.className = "game";

        const image = document.createElement("img");

        image.src = getPageURL(game.cover);
        image.alt = game.name;
        image.loading = "lazy";

        image.onerror = function() {
            this.alt = "Cover image unavailable";
        };

        const name = document.createElement("div");
        name.className = "game-name";
        name.textContent = game.name;

        card.appendChild(image);
        card.appendChild(name);

        card.addEventListener("click", () => {

            window.location.href = getPageURL(game.html);

        });

        gamesContainer.appendChild(card);

    }

    statusText.textContent =
        `${games.length} games discovered.`;

}


// ==========================================
// GENERATE GITHUB PAGES URL
// ==========================================

function getPageURL(repositoryPath) {

    const encodedPath = repositoryPath
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return new URL(encodedPath, SITE_BASE).href;

}


// ==========================================
// HTML ESCAPING
// ==========================================

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}


// ==========================================
// AUTOMATIC INITIAL SCAN
// ==========================================

scanGames();

</script>

</body>
</html>
