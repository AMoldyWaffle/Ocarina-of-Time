<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>Game Library</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:30px;background:#191920}
header h1{margin:0;letter-spacing:3px}
header p{color:#999}
.toolbar{display:flex;justify-content:center;gap:10px;padding:20px}
button{padding:10px 15px;background:#292936;color:#fff;border:1px solid #444455;border-radius:7px;cursor:pointer}
button:hover{background:#454566}
#status{text-align:center;padding:12px;color:#aaa;overflow-wrap:anywhere}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,220px));justify-content:center;gap:22px;padding:20px}
.game{background:#1b1b24;border:1px solid #30303c;border-radius:12px;overflow:hidden}
.game img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#252530;cursor:pointer}
.game-name{text-align:center;padding:12px;font-weight:bold}
.game .play{width:calc(100% - 16px);margin:4px 8px;background:#41417a;font-size:14px;font-weight:bold}
.game .alternates{padding:5px 8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.game .alternates button{width:100%;margin:0;font-size:11px}
.empty{grid-column:1/-1;text-align:center;color:#888;padding:50px}
footer{text-align:center;padding:30px;color:#555;font-size:12px}
</style>
</head>
<body>
<header>
<h1>GAME LIBRARY</h1>
<p>Automatic Repository Game Launcher</p>
</header>
<div class="toolbar"><button id="rescan" type="button">Rescan Repository</button></div>
<div id="status">Initializing...</div>
<div id="games"><div class="empty">Searching for games...</div></div>
<footer>OCARINA OF TIME</footer>
<script>
"use strict";

const OWNER = "AMoldyWaffle";
const REPO = "Ocarina-of-Time";
const BRANCH = "main";
const GAME_DIR = "Games";
const PAGES = "https://amoldywaffle.github.io/Ocarina-of-Time/";
const API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
const RAW = "https://raw.githubusercontent.com/" + OWNER + "/" + REPO + "/" + BRANCH + "/";
const HOSTS = [
  {name:"GitHub Pages",base:PAGES},
  {name:"jsDelivr",base:"https://cdn.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@" + BRANCH + "/"},
  {name:"Fastly CDN",base:"https://fastly.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@" + BRANCH + "/"},
  {name:"Gcore CDN",base:"https://gcore.jsdelivr.net/gh/" + OWNER + "/" + REPO + "@" + BRANCH + "/"},
  {name:"GitHub Raw",base:RAW}
];

const gamesNode = document.getElementById("games");
const statusNode = document.getElementById("status");
let games = [];
let scanning = false;

function encodedPath(path) {
  return path.split("/").map(encodeURIComponent).join("/");
}

function fileURL(host, path) {
  return host.base + encodedPath(path);
}

async function fetchWithTimeout(url, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 18000);
  try {
    const response = await fetch(url, {
      method:"GET",
      mode:"cors",
      cache:"no-store",
      signal:controller.signal
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response;
  } finally {
    clearTimeout(timer);
  }
}

async function apiDirectory(path) {
  const url = API + "/contents/" + encodedPath(path) + "?ref=" + encodeURIComponent(BRANCH);
  const response = await fetchWithTimeout(url, 20000);
  const data = await response.json();
  if (!Array.isArray(data)) throw new Error("GitHub returned an invalid directory listing.");
  return data;
}

function isImage(path) {
  return /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(path);
}

function chooseHTML(files, folder) {
  const html = files.filter(file =>
    file.type === "file" && /\.html?$/i.test(file.name)
  );
  return html.find(file => file.name.toLowerCase() === "index.html")
    || html.find(file => file.name.toLowerCase().includes("launcher"))
    || html[0]
    || null;
}

async function scanGames() {
  if (scanning) return;
  scanning = true;
  gamesNode.innerHTML = "";
  statusNode.textContent = "Reading the Games directory...";
  try {
    const folders = await apiDirectory(GAME_DIR);
    const gameFolders = folders.filter(item => item.type === "dir");
    if (!gameFolders.length) throw new Error("No game folders were found.");

    const discovered = await Promise.all(gameFolders.map(async folder => {
      const rootFiles = await apiDirectory(folder.path);
      const htmlFile = chooseHTML(rootFiles, folder.name);
      const coverFolder = rootFiles.find(item =>
        item.type === "dir" && item.name.toLowerCase() === "cover"
      );
      if (!htmlFile || !coverFolder) return null;

      let coverFile = null;
      try {
        const coverFiles = await apiDirectory(coverFolder.path);
        const images = coverFiles.filter(item =>
          item.type === "file" && isImage(item.name)
        );
        coverFile = images.find(item => item.name.toLowerCase() === "cover.png")
          || images[0]
          || null;
      } catch (error) {
        console.warn("Cover listing failed for " + folder.name, error);
      }

      if (!coverFile) return null;
      return {
        name:folder.name,
        html:htmlFile.path,
        cover:coverFile.path
      };
    }));

    games = discovered.filter(Boolean).sort((a,b) => a.name.localeCompare(b.name));
    renderGames();
  } catch (error) {
    console.error("Repository scan failed:", error);
    statusNode.textContent = "Repository scan failed: " + error.message;
    gamesNode.innerHTML =
      '<div class="empty"><h3>Could not retrieve the game list</h3>' +
      '<p>' + escapeHTML(error.message) + '</p>' +
      '<button type="button" onclick="scanGames()">Try Again</button></div>';
  } finally {
    scanning = false;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

function loadCover(image, path) {
  let index = 0;
  function tryNext() {
    if (index >= HOSTS.length) {
      image.removeAttribute("src");
      image.alt = "Cover unavailable";
      return;
    }
    image.src = fileURL(HOSTS[index++], path);
  }
  image.onerror = tryNext;
  tryNext();
}

/*
 * This shim is inserted into each game document before its own scripts.
 * It converts cross-origin classic/module Worker URLs into same-origin blob
 * worker entry points. The blob worker then imports the original remote script.
 * Relative importScripts() calls are resolved against the original worker URL.
 */
function installWorkerBridge() {
  function bridgeConstructor(NativeConstructor, kind) {
    if (typeof NativeConstructor !== "function") return NativeConstructor;
    return new Proxy(NativeConstructor, {
      construct(target, args) {
        let remoteURL;
        try {
          remoteURL = new URL(String(args[0]), document.baseURI);
        } catch (_) {
          return Reflect.construct(target, args, target);
        }

        if (
          remoteURL.protocol === "blob:" ||
          remoteURL.protocol === "data:" ||
          remoteURL.origin === location.origin
        ) {
          return Reflect.construct(target, args, target);
        }

        const options = args[1];
        const moduleWorker = !!(options && typeof options === "object" && options.type === "module");
        const originalURL = remoteURL.href;
        let bootstrap;

        if (moduleWorker) {
          bootstrap = 'import ' + JSON.stringify(originalURL) + ';';
        } else {
          bootstrap =
            'const __remoteWorkerURL=' + JSON.stringify(originalURL) + ';' +
            'const __nativeImportScripts=self.importScripts.bind(self);' +
            'self.importScripts=(...urls)=>__nativeImportScripts(...urls.map(url=>new URL(url,__remoteWorkerURL).href));' +
            'self.importScripts(__remoteWorkerURL);';
        }

        const blobURL = URL.createObjectURL(new Blob([bootstrap], {
          type:"text/javascript"
        }));
        const patchedArgs = args.slice();
        patchedArgs[0] = blobURL;

        try {
          const worker = Reflect.construct(target, patchedArgs, target);
          setTimeout(() => URL.revokeObjectURL(blobURL), 120000);
          console.info("[Worker bridge] " + kind + " redirected through a same-origin blob:", originalURL);
          return worker;
        } catch (error) {
          URL.revokeObjectURL(blobURL);
          throw error;
        }
      }
    });
  }

  if (window.Worker) window.Worker = bridgeConstructor(window.Worker, "Worker");
  if (window.SharedWorker) window.SharedWorker = bridgeConstructor(window.SharedWorker, "SharedWorker");

  // Waffle's loader fetches emulator.html and then turns it into another
  // blob iframe. Inject this same bridge into that nested document too.
  if (!window.__workerBridgeFetchPatched) {
    window.__workerBridgeFetchPatched = true;
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async function(input, init) {
      let requestURL = "";
      try {
        requestURL = typeof input === "string" ? input : input.url;
      } catch (_) {}

      let response;
      try {
        response = await nativeFetch(input, init);
      } catch (error) {
        if (/ejs\.offline|\/cores\/|\/compression\//i.test(requestURL)) {
          console.error("[EJS network] Request failed:", requestURL, error);
        }
        throw error;
      }

      if (/ejs\.offline|\/cores\/|\/compression\//i.test(requestURL)) {
        console.info(
          "[EJS network] Response:",
          response.status,
          response.statusText,
          response.headers.get("content-type"),
          response.headers.get("content-length"),
          requestURL
        );
      }

      if (!response.ok || !/\/emulator\.html(?:[?#]|$)/i.test(requestURL)) {
        return response;
      }

      const source = await response.text();
      const bridgeScript = "(" + installWorkerBridge.toString() + ")();";
      const scriptTag = "<script>" + bridgeScript + "<\/script>";
      let patched = source;

      if (/<head\b[^>]*>/i.test(patched)) {
        patched = patched.replace(/<head\b[^>]*>/i, match => match + scriptTag);
      } else {
        patched = scriptTag + patched;
      }

      const headers = new Headers(response.headers);
      headers.delete("content-length");
      headers.delete("content-encoding");
      return new Response(patched, {
        status:response.status,
        statusText:response.statusText,
        headers
      });
    };
  }
}

const WORKER_BRIDGE_SOURCE = "(" + installWorkerBridge.toString() + ")();";

function injectWorkerBridge(html, baseURL) {
  const safeBase = baseURL.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  const baseTag = '<base href="' + safeBase + '">';
  const bridgeTag = "<script>" + WORKER_BRIDGE_SOURCE + "<\/script>";

  html = html.replace(/<base\b[^>]*>/i, "");
  if (/<head\b[^>]*>/i.test(html)) {
    html = html.replace(/<head\b[^>]*>/i, match => match + baseTag + bridgeTag);
  } else {
    html = baseTag + bridgeTag + html;
  }
  return html;
}

async function launchGame(game, preferredHost) {
  const hosts = preferredHost
    ? [preferredHost].concat(HOSTS.filter(host => host !== preferredHost))
    : HOSTS.slice();

  statusNode.textContent = "Preparing " + game.name + "...";
  for (const host of hosts) {
    try {
      statusNode.textContent = "Downloading " + game.name + " from " + host.name + "...";
      const response = await fetchWithTimeout(fileURL(host, game.html), 30000);
      let html = await response.text();
      if (!/<html[\s>]/i.test(html)) throw new Error("Host did not return an HTML document.");

      const baseURL = host.base + encodedPath(game.html.substring(0, game.html.lastIndexOf("/") + 1));
      html = injectWorkerBridge(html, baseURL);

      const blobURL = URL.createObjectURL(new Blob([html], {
        type:"text/html;charset=utf-8"
      }));

      statusNode.textContent = "Opening " + game.name + " (" + host.name + ")...";
      location.href = blobURL;
      return;
    } catch (error) {
      console.warn(host.name + " launch failed for " + game.name + ":", error);
    }
  }

  statusNode.textContent = "Unable to launch " + game.name + " from any source.";
  alert(
    game.name + " could not be loaded from the available hosts.\n\n" +
    "If the console shows a worker error, copy it and send it to me."
  );
}

function renderGames() {
  gamesNode.innerHTML = "";
  if (!games.length) {
    gamesNode.innerHTML = '<div class="empty">No games with both a Cover folder and an HTML launcher were found.</div>';
    statusNode.textContent = "0 games found.";
    return;
  }

  for (const game of games) {
    const card = document.createElement("div");
    card.className = "game";

    const image = document.createElement("img");
    image.alt = game.name;
    image.loading = "lazy";
    loadCover(image, game.cover);
    image.addEventListener("click", () => launchGame(game));

    const name = document.createElement("div");
    name.className = "game-name";
    name.textContent = game.name;

    const play = document.createElement("button");
    play.type = "button";
    play.className = "play";
    play.textContent = "PLAY";
    play.addEventListener("click", () => launchGame(game));

    const alternates = document.createElement("div");
    alternates.className = "alternates";
    for (const host of HOSTS) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = host.name;
      button.addEventListener("click", () => launchGame(game, host));
      alternates.appendChild(button);
    }

    card.append(image, name, play, alternates);
    gamesNode.appendChild(card);
  }

  statusNode.textContent = games.length + " games discovered.";
}

document.getElementById("rescan").addEventListener("click", scanGames);
scanGames();
</script>
</body>
</html>
