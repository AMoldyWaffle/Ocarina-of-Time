<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ocarina of Time — Launcher</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid #2a2a2a; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header button { margin-left: auto; background: #2a2a2a; color: #eee; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  header button:hover { background: #3a3a3a; }
  main { padding: 20px; }
  #gameGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .card:hover { background: #232323; border-color: #3a3a3a; }
  .card h2 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0; font-size: 12px; color: #999; }
  #status { padding: 0 20px 20px; color: #888; font-size: 13px; }
  #player { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 50; }
  #player.open { display: flex; }
  #playerBar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #181818; border-bottom: 1px solid #2a2a2a; }
  #playerBar button { background: #2a2a2a; color: #eee; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  #playerBar button:hover { background: #3a3a3a; }
  #playerTitle { font-size: 13px; color: #bbb; }
  #gameFrame { flex: 1; width: 100%; border: 0; background: #000; }
  #log { position: fixed; left: 0; right: 0; bottom: 0; max-height: 130px; overflow: auto; margin: 0; padding: 6px 10px;
         font: 11px/1.4 ui-monospace, monospace; background: rgba(0,0,0,.78); color: #8f8; border-top: 1px solid #2a2a2a;
         z-index: 60; display: none; white-space: pre-wrap; }
  #log.open { display: block; }
</style>
</head>
<body>

<header>
  <h1>Ocarina of Time</h1>
  <button id="toggleLog">Log</button>
</header>

<main>
  <div id="gameGrid"></div>
  <div id="status">Scanning Games/…</div>
</main>

<div id="player">
  <div id="playerBar">
    <button id="btnBack">← Back</button>
    <span id="playerTitle"></span>
    <button id="btnReload">Reload</button>
  </div>
  <iframe id="gameFrame"
          allow="fullscreen; gamepad; autoplay; clipboard-read; clipboard-write"
          allowfullscreen></iframe>
</div>

<pre id="log"></pre>

<script>
/* ================================================================ */
/* Logging                                                          */
/* ================================================================ */
const logEl = document.getElementById('log');
function log(level, msg) {
  const line = `[${new Date().toLocaleTimeString()}] [${level}] ${msg}`;
  (level === 'ERROR' ? console.error : console.log)(line);
  logEl.textContent += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
document.getElementById('toggleLog').addEventListener('click', () => logEl.classList.toggle('open'));

/* ================================================================ */
/* Repo config                                                      */
/* ================================================================ */
const REPO       = 'AMoldyWaffle/Ocarina-of-Time';
const PAGES_BASE = 'https://amoldywaffle.github.io/Ocarina-of-Time/';
const GAMES_DIR  = 'Games';

/* ================================================================ */
/* Cross-origin scripts that need rewriting into blob URLs          */
/* (add more here if the games start using other cross-origin workers) */
/* ================================================================ */
const WORKER_URLS = [
  'https://amoldywaffle.github.io/fuze/wiring/worker.js',
];

/* ================================================================ */
/* Discovery: scan Games/ via GitHub Contents API                   */
/* ================================================================ */
function prettify(name) {
  return name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim();
}
async function discoverGames() {
  const api = `https://api.github.com/repos/${REPO}/contents/${GAMES_DIR}`;
  log('INFO', `Scanning ${api}`);
  const res = await fetch(api, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (!res.ok) throw new Error(`GitHub API HTTP ${res.status} ${res.statusText}`);
  const items = await res.json();
  if (!Array.isArray(items)) throw new Error('Unexpected GitHub API response');
  const dirs = items.filter(i => i.type === 'dir');
  log('INFO', `Found ${dirs.length} subfolder(s) in ${GAMES_DIR}/: ${dirs.map(d => d.name).join(', ') || '(none)'}`);
  return dirs.map(d => ({
    title: prettify(d.name),
    url:   `${PAGES_BASE}${GAMES_DIR}/${d.name}/index.html`,
    mode:  'blob',
  }));
}

/* ================================================================ */
/* Injected shim: fixes URL + SharedWorker/Worker cross-origin     */
/* ================================================================ */
const INJECTED_SHIM = String.raw`
(function () {
  if (window.__launcherShimInstalled) return;
  window.__launcherShimInstalled = true;

  var RealURL = window.URL;

  /* ---------- 1. URL constructor fix ---------- */
  if (RealURL) {
    function safeBase(b) {
      if (b === null || b === undefined) return document.baseURI || location.href;
      var s = String(b);
      if (s === '' || s === 'null' || s === 'undefined' ||
          s === 'about:blank' || s === 'about:srcdoc' ||
          s.slice(0, 5) === 'blob:') {
        return document.baseURI || location.href;
      }
      return b;
    }
    var PatchedURL = new Proxy(RealURL, {
      construct: function (target, args) {
        var a = Array.prototype.slice.call(args);
        if (a.length >= 2) a[1] = safeBase(a[1]);
        else if (a.length === 1 && (a[0] == null || String(a[0]) === 'null')) {
          a[0] = document.baseURI || location.href;
        }
        try { return Reflect.construct(target, a); }
        catch (e) {
          if (a.length >= 2) {
            try { return Reflect.construct(target, [String(a[0]), document.baseURI || location.href]); }
            catch (e2) {}
          }
          throw e;
        }
      },
      apply: function (target, thisArg, args) { return Reflect.construct(target, args); }
    });
    window.URL = PatchedURL;
    RealURL = PatchedURL;
  }

  /* ---------- 2. Cross-origin Worker / SharedWorker fix ---------- */
  var WORKER_URLS = ` + JSON.stringify(WORKER_URLS) + `;
  var blobCache = {};

  function urlMatches(url) {
    var s = String(url);
    for (var i = 0; i < WORKER_URLS.length; i++) {
      var w = WORKER_URLS[i];
      if (s === w || s.indexOf(w + '?') === 0 || s.indexOf(w + '#') === 0) return true;
    }
    return false;
  }

  function fetchWorkerAsBlobUrl(fullUrl) {
    if (blobCache[fullUrl]) return blobCache[fullUrl];

    var xhr = new XMLHttpRequest();
    try {
      xhr.open('GET', fullUrl, false); // synchronous, only at bootstrap
      xhr.send(null);
    } catch (e) {
      try { console.warn('[shim] worker fetch failed:', fullUrl, e); } catch (_) {}
      return null;
    }
    if (xhr.status < 200 || xhr.status >= 300) {
      try { console.warn('[shim] worker fetch HTTP', xhr.status, fullUrl); } catch (_) {}
      return null;
    }

    var originalDir;
    try { originalDir = new URL('.', fullUrl).href; } catch (_) { originalDir = fullUrl; }

    // Prepended prelude: importScripts() relative paths resolve against the
    // *original* GitHub-Pages directory, not the blob URL.
    var prelude =
      'var __ORIG_BASE__ = ' + JSON.stringify(originalDir) + ';\n' +
      '(function () {\n' +
      '  try {\n' +
      '    var _importScripts = self.importScripts.bind(self);\n' +
      '    self.importScripts = function () {\n' +
      '      var args = Array.prototype.slice.call(arguments).map(function (u) {\n' +
      '        try { return new URL(u, __ORIG_BASE__).href; } catch (e) { return u; }\n' +
      '      });\n' +
      '      return _importScripts.apply(null, args);\n' +
      '    };\n' +
      '  } catch (e) {}\n' +
      '})();\n';

    var src = prelude + xhr.responseText;
    var blob = new Blob([src], { type: 'application/javascript' });
    var blobUrl = RealURL.createObjectURL(blob);
    blobCache[fullUrl] = blobUrl;
    try { console.log('[shim] worker blobified:', fullUrl, '->', blobUrl); } catch (_) {}
    return blobUrl;
  }

  function rewriteCtor(OriginalCtor) {
    if (!OriginalCtor) return OriginalCtor;
    return new Proxy(OriginalCtor, {
      construct: function (target, args) {
        var a = Array.prototype.slice.call(args);
        if (a.length >= 1 && urlMatches(a[0])) {
          var blobUrl = fetchWorkerAsBlobUrl(String(a[0]));
          if (blobUrl) a[0] = blobUrl;
        }
        return Reflect.construct(target, a);
      }
    });
  }

  if (window.SharedWorker) window.SharedWorker = rewriteCtor(window.SharedWorker);
  if (window.Worker)       window.Worker       = rewriteCtor(window.Worker);

  /* ---------- 3. Pre-fetch worker scripts (avoids blocking later) ---------- */
  // Sync XHR — happens once, at game bootstrap, before the game's scripts run.
  for (var i = 0; i < WORKER_URLS.length; i++) {
    try { fetchWorkerAsBlobUrl(WORKER_URLS[i]); } catch (_) {}
  }
})();
`;

/* ================================================================ */
/* Rewrite fetched HTML: <base href> + shim                        */
/* ================================================================ */
function prepareGameHtml(rawHtml, pageUrl) {
  const dirUrl = new URL('.', pageUrl).href;
  const doctypeMatch = rawHtml.match(/<!doctype[^>]*>/i);
  const doctype = doctypeMatch ? doctypeMatch[0] : '<!DOCTYPE html>';

  const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
  doc.querySelectorAll('base').forEach(el => el.remove());

  const shimEl = doc.createElement('script');
  shimEl.textContent = INJECTED_SHIM;

  const baseEl = doc.createElement('base');
  baseEl.setAttribute('href', dirUrl);

  const head = doc.head || doc.documentElement;
  head.insertBefore(shimEl, head.firstChild);
  head.insertBefore(baseEl, head.firstChild);

  return doctype + '\n' + doc.documentElement.outerHTML;
}

/* ================================================================ */
/* Launch / teardown                                                */
/* ================================================================ */
const frame       = document.getElementById('gameFrame');
const playerEl    = document.getElementById('player');
const playerTitle = document.getElementById('playerTitle');
let currentBlobUrl = null;
let currentGame    = null;

function revokeBlob() {
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
}
function openPlayer(game) {
  currentGame = game;
  playerTitle.textContent = game.title;
  playerEl.classList.add('open');
}
function closePlayer() {
  playerEl.classList.remove('open');
  frame.onload = null;
  frame.src = 'about:blank';
  revokeBlob();
  currentGame = null;
  log('INFO', 'Launcher frame closed.');
}

async function launch(game) {
  openPlayer(game);
  revokeBlob();
  try {
    log('INFO', `Starting ${game.title}`);
    log('INFO', 'Downloading HTML from GitHub Pages');
    const res = await fetch(game.url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText} — ${game.url}`);
    const rawHtml = await res.text();
    log('INFO', `Loaded HTML from GitHub Pages (${rawHtml.length} bytes)`);
    const prepared = prepareGameHtml(rawHtml, game.url);
    currentBlobUrl = URL.createObjectURL(new Blob([prepared], { type: 'text/html' }));
    frame.onload = () => {
      log('INFO', 'Game is running inside the launcher frame.');
      try {
        frame.contentWindow.focus();
        frame.contentWindow.addEventListener('error', e => {
          log('ERROR', `[${game.title}] ${e.message || e.type}`);
        });
      } catch (_) {}
    };
    frame.src = currentBlobUrl;
  } catch (err) {
    log('ERROR', `Blob load failed: ${err && err.message ? err.message : err}`);
    log('INFO', 'Falling back to direct iframe load');
    frame.src = game.url;
  }
}

/* ================================================================ */
/* UI                                                              */
/* ================================================================ */
const grid     = document.getElementById('gameGrid');
const statusEl = document.getElementById('status');

function renderGames(games) {
  grid.innerHTML = '';
  statusEl.textContent = `${games.length} game(s) found in ${GAMES_DIR}/`;
  for (const game of games) {
    const card = document.createElement('button');
    card.className = 'card';
    const h2 = document.createElement('h2'); h2.textContent = game.title;
    const p  = document.createElement('p');  p.textContent  = game.url.split('/').slice(-2, -1)[0];
    card.append(h2, p);
    card.addEventListener('click', () => launch(game));
    grid.appendChild(card);
  }
}

document.getElementById('btnBack').addEventListener('click', closePlayer);
document.getElementById('btnReload').addEventListener('click', () => { if (currentGame) launch(currentGame); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.fullscreenElement) return;
  if (playerEl.classList.contains('open')) closePlayer();
});

/* ================================================================ */
/* Boot                                                            */
/* ================================================================ */
(async () => {
  try {
    const games = await discoverGames();
    renderGames(games);
    if (games.length === 0) {
      statusEl.textContent = `No subfolders found inside ${GAMES_DIR}/. Check the folder name (case-sensitive).`;
    }
  } catch (e) {
    log('ERROR', 'Discovery failed: ' + e.message);
    statusEl.textContent = 'Discovery failed: ' + e.message;
  }
})();
</script>
</body>
</html>
