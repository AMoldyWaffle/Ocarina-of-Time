
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 30px;
    background: #191920;
}

header h1 { margin: 0; letter-spacing: 3px; }

header p { color: #999; }

.toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 20px;
}

button {
    padding: 10px 15px;
    background: #292936;
    color: white;
    border: 1px solid #444455;
    border-radius: 7px;
    cursor: pointer;
}

button:hover { background: #454566; }

#status {
    text-align: center;
    padding: 12px;
    color: #aaa;
}

#games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 220px));
    justify-content: center;
    gap: 22px;
    padding: 20px;
}

.game {
    background: #1b1b24;
    border: 1px solid #30303c;
    border-radius: 12px;
    overflow: hidden;
}

.game img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    background: #252530;
    cursor: pointer;
}

.game-name {
    text-align: center;
    padding: 12px;
    font-weight: bold;
}

.game button {
    width: calc(100% - 16px);
    margin: 4px 8px;
    font-size: 11px;
}

.game .play {
    background: #41417a;
    font-size: 14px;
    font-weight: bold;
    margin-top: 0;
}

.game .alternates {
    padding: 5px 4px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
}

.alternates button {
    width: 100%;
    margin: 0;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #888;
    padding: 50px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #555;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>GAME LIBRARY</h1>
    <p>Automatic Repository Game Launcher</p>
</header>

<div class="toolbar">
    <button onclick="scanGames()">Rescan Repository</button>
</div>

<div id="status">Initializing...</div>

<div id="games">
    <div class="empty">Searching for games...</div>
</div>

<footer>OCARINA OF TIME</footer>

<script>

// ==========================================
// CONFIGURATION
// ==========================================

const OWNER = "AMoldyWaffle";
const REPO = "Ocarina-of-Time";
const BRANCH = "main";
const GAME_DIRECTORY = "Games";

const REPO_ROOT =
    `${OWNER}/${REPO}`;

const PAGES =
    "https://amoldywaffle.github.io/Ocarina-of-Time/";

const GITHUB_API =
    `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

const JSDELIVR_API =
    `https://data.jsdelivr.com/v1/packages/gh/${OWNER}/${REPO}@${BRANCH}?structure=flat`;


// ==========================================
// ALL AVAILABLE FILE HOSTS
// ==========================================

const HOSTS = [

    {
        name: "GitHub Pages",
        base: PAGES,
        type: "pages"
    },

    {
        name: "jsDelivr",
        base: `https://cdn.jsdelivr.net/gh/${REPO_ROOT}@${BRANCH}/`,
        type: "cdn"
    },

    {
        name: "Fastly CDN",
        base: `https://fastly.jsdelivr.net/gh/${REPO_ROOT}@${BRANCH}/`,
        type: "cdn"
    },

    {
        name: "Gcore CDN",
        base: `https://gcore.jsdelivr.net/gh/${REPO_ROOT}@${BRANCH}/`,
        type: "cdn"
    },

    {
        name: "GitHub Raw",
        base: `https://raw.githubusercontent.com/${REPO_ROOT}/${BRANCH}/`,
        type: "raw"
    }

];


// ==========================================
// STATE
// ==========================================

const gamesContainer = document.getElementById("games");
const statusText = document.getElementById("status");

let games = [];


// ==========================================
// URL GENERATOR
// ==========================================

function makeURL(host, path) {

    const encoded = path.split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return host.base + encoded;

}


// ==========================================
// TIMEOUT FETCH
// ==========================================

async function request(url, timeout = 12000) {

    const controller = new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        timeout
    );

    try {

        const response = await fetch(url, {
            signal: controller.signal,
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        return response;

    } finally {

        clearTimeout(timer);

    }

}


// ==========================================
// REPOSITORY SCANNER
// ==========================================

async function getRepositoryFiles() {

    const scanners = [

        {
            name: "GitHub API",
            url: GITHUB_API,
            parse: data => {

                if (!data.tree || data.truncated) {
                    throw new Error("Invalid GitHub tree");
                }

                return data.tree
                    .filter(item => item.type === "blob")
                    .map(item => item.path);

            }
        },

        {
            name: "jsDelivr Repository API",
            url: JSDELIVR_API,
            parse: data => {

                if (!data.files || !Array.isArray(data.files)) {
                    throw new Error("Invalid jsDelivr listing");
                }

                return data.files.map(item =>
                    typeof item === "string"
                        ? item
                        : item.name
                ).filter(Boolean);

            }
        }

    ];

    for (const scanner of scanners) {

        try {

            statusText.textContent =
                "Scanning using " + scanner.name + "...";

            console.log("Trying scanner:", scanner.name);

            const response = await request(scanner.url);

            const data = await response.json();

            const paths = scanner.parse(data);

            if (!paths.length) {
                throw new Error("No files returned");
            }

            console.log(
                "Repository scan successful:",
                scanner.name
            );

            statusText.textContent =
                "Repository found through " + scanner.name;

            return paths.map(path =>
                path.replace(/^\/+/, "")
            );

        } catch (error) {

            console.warn(
                scanner.name + " failed:",
                error
            );

        }

    }

    throw new Error(
        "All repository scanning services failed."
    );

}


// ==========================================
// DISCOVER GAMES
// ==========================================

async function scanGames() {

    gamesContainer.innerHTML = "";
    statusText.textContent = "Connecting to repository...";

    try {

        const paths = await getRepositoryFiles();

        const prefix = GAME_DIRECTORY + "/";

        const folders = new Map();

        for (const path of paths) {

            if (!path.startsWith(prefix)) continue;

            const parts = path.split("/");

            if (parts.length < 3) continue;

            const folder = parts[1];

            if (!folders.has(folder)) {
                folders.set(folder, []);
            }

            folders.get(folder).push(path);

        }

        games = [];

        for (const [folder, files] of folders) {

            // Find cover image.

            const covers = files.filter(path => {

                const parts = path.split("/");

                return (
                    parts.length >= 4 &&
                    parts[2].toLowerCase() === "cover" &&
                    /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(path)
                );

            });

            const cover =
                covers.find(path =>
                    path.split("/").pop().toLowerCase() === "cover.png"
                ) || covers[0];

            // Find HTML.

            const htmlFiles = files.filter(path =>
                /\.html?$/i.test(path)
            );

            let html = htmlFiles.find(path =>
                path.toLowerCase() ===
                `${prefix}${folder}/index.html`.toLowerCase()
            );

            if (!html) {
                html = htmlFiles.find(path =>
                    path.split("/").length === 3
                );
            }

            if (!html) {
                html = htmlFiles[0];
            }

            if (cover && html) {

                games.push({
                    name: folder,
                    cover: cover,
                    html: html
                });

            }

        }

        games.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        displayGames();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Unable to retrieve repository information.";

        gamesContainer.innerHTML = `
            <div class="empty">
                <h3>Repository connection failed</h3>
                <p>${escapeHTML(error.message)}</p>
                <p>All available scanning services failed.</p>
                <button onclick="scanGames()">Try Again</button>
            </div>
        `;

    }

}


// ==========================================
// IMAGE FALLBACK SYSTEM
// ==========================================

function loadCover(image, path) {

    let index = 0;

    function attempt() {

        if (index >= HOSTS.length) {

            image.removeAttribute("src");
            image.alt = "All cover sources failed";

            return;

        }

        const host = HOSTS[index++];

        image.dataset.source = host.name;

        console.log(
            "Loading cover through:",
            host.name,
            path
        );

        image.src = makeURL(host, path);

    }

    image.onerror = attempt;

    attempt();

}


// ==========================================
// DISPLAY GAMES
// ==========================================

function displayGames() {

    gamesContainer.innerHTML = "";

    if (!games.length) {

        gamesContainer.innerHTML =
            '<div class="empty">No compatible games found.</div>';

        statusText.textContent = "0 games found.";

        return;

    }

    for (const game of games) {

        const card = document.createElement("div");
        card.className = "game";

        const image = document.createElement("img");

        image.alt = game.name;
        image.loading = "lazy";

        loadCover(image, game.cover);

        image.onclick = () => launchGame(game);

        const name = document.createElement("div");
        name.className = "game-name";
        name.textContent = game.name;

        const play = document.createElement("button");
        play.className = "play";
        play.textContent = "PLAY";

        play.onclick = () => launchGame(game);

        const alternates = document.createElement("div");
        alternates.className = "alternates";

        // Every host gets a button, even if automatic
        // launching has not succeeded.

        for (const host of HOSTS) {

            const button = document.createElement("button");

            button.textContent = host.name;

            button.onclick = () => {
                launchWithHost(game, host);
            };

            alternates.appendChild(button);

        }

        card.appendChild(image);
        card.appendChild(name);
        card.appendChild(play);
        card.appendChild(alternates);

        gamesContainer.appendChild(card);

    }

    statusText.textContent =
        games.length + " games discovered.";

}


// ==========================================
// FETCH AND PREPARE HTML
// ==========================================

async function fetchGameHTML(game, host) {

    const url = makeURL(host, game.html);

    const response = await request(url, 20000);

    let html = await response.text();

    if (
        !html.trim().toLowerCase().startsWith("<!doctype") &&
        !html.trim().toLowerCase().startsWith("<html") &&
        !/<html[\s>]/i.test(html)
    ) {
        throw new Error("Response does not look like HTML");
    }

    // Preserve relative game assets.
    // For CDN and Raw sources, use the same host
    // as the HTML file for relative dependencies.

    const directory = game.html.substring(
        0,
        game.html.lastIndexOf("/") + 1
    );

    const baseURL = host.base + directory;

    const baseTag =
        `<base href="${baseURL}">`;

    if (/<base\b[^>]*>/i.test(html)) {

        html = html.replace(
            /<base\b[^>]*>/i,
            baseTag
        );

    } else if (/<head\b[^>]*>/i.test(html)) {

        html = html.replace(
            /<head\b[^>]*>/i,
            match => match + baseTag
        );

    } else {

        html = baseTag + html;

    }

    return html;

}


// ==========================================
// LAUNCH THROUGH SELECTED HOST
// ==========================================

async function launchWithHost(game, host) {

    statusText.textContent =
        "Loading " + game.name + " through " + host.name + "...";

    try {

        // GitHub Pages: use the original page directly.
        // This preserves its normal browser headers and origin.

        if (host.type === "pages") {

            const url = makeURL(host, game.html);

            const response = await request(url, 15000);

            const type =
                response.headers.get("content-type") || "";

            if (
                !type.includes("text/html") &&
                !type.includes("application/xhtml+xml")
            ) {
                throw new Error("Pages did not return HTML");
            }

            window.location.href = url;

            return;

        }

        // CDN and Raw: fetch the HTML and create
        // a browser-executable document.

        const html = await fetchGameHTML(game, host);

        const blob = new Blob(
            [html],
            { type: "text/html;charset=utf-8" }
        );

        const blobURL = URL.createObjectURL(blob);

        statusText.textContent =
            "Opening " + game.name + " through " + host.name;

        window.location.href = blobURL;

    } catch (error) {

        console.error(
            "Launch failed:",
            host.name,
            error
        );

        statusText.textContent =
            host.name + " failed. Try another source.";

        alert(
            game.name + " could not load through " +
            host.name + ".\n\n" + error.message
        );

    }

}


// ==========================================
// AUTOMATIC LAUNCH FALLBACK
// ==========================================

async function launchGame(game) {

    const automaticHosts = HOSTS;

    statusText.textContent =
        "Trying available sources for " + game.name + "...";

    for (const host of automaticHosts) {

        try {

            statusText.textContent =
                "Attempting " + host.name + "...";

            if (host.type === "pages") {

                const url = makeURL(host, game.html);

                const response = await request(url, 10000);

                const type =
                    response.headers.get("content-type") || "";

                if (!type.includes("text/html")) {
                    throw new Error("Invalid HTML response");
                }

                window.location.href = url;

                return;

            }

            const html = await fetchGameHTML(game, host);

            const blob = new Blob(
                [html],
                { type: "text/html;charset=utf-8" }
            );

            window.location.href =
                URL.createObjectURL(blob);

            return;

        } catch (error) {

            console.warn(
                "Fallback failed:",
                host.name,
                error
            );

        }

    }

    statusText.textContent =
        "Every game host failed.";

    alert(
        "None of the available sources could load " +
        game.name +
        ". Try the individual source buttons."
    );

}


// ==========================================
// HTML ESCAPING
// ==========================================

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}


// ==========================================
// START
// ==========================================

scanGames();

</script>

</body>
</html>
