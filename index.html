
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>END OF LIGHT</title>
<style>
*{box-sizing:border-box}
html{min-height:100%;overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;min-height:100vh;overflow-x:hidden;background:#03040d;color:#eef1ff;font-family:Arial,Helvetica,sans-serif}
#spaceBackground{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,#171044 0%,#08091d 45%,#03040d 80%)}
#spaceBackground:before{content:"";position:absolute;inset:-45%;background:radial-gradient(ellipse at 25% 35%,#38208055 0%,transparent 35%),radial-gradient(ellipse at 75% 55%,#075a8050 0%,transparent 38%),radial-gradient(ellipse at 50% 80%,#541d6650 0%,transparent 35%);filter:blur(55px);animation:nebulaDrift 28s ease-in-out infinite alternate}
#spaceBackground:after{content:"";position:absolute;inset:-100%;opacity:.55;background-image:radial-gradient(1px 1px at 10% 20%,#fff 99%,transparent),radial-gradient(2px 2px at 30% 70%,#cbd9ff 99%,transparent),radial-gradient(1px 1px at 50% 40%,#fff 99%,transparent),radial-gradient(1px 1px at 70% 80%,#b8caff 99%,transparent),radial-gradient(2px 2px at 90% 15%,#fff 99%,transparent),radial-gradient(1px 1px at 80% 45%,#fff 99%,transparent);background-size:310px 280px;animation:starDrift 100s linear infinite}
.shooting-star{position:absolute;width:180px;height:2px;opacity:0;background:linear-gradient(90deg,transparent,#a9d9ff,#fff);filter:drop-shadow(0 0 6px #8ccaff);transform:rotate(-35deg);animation:shoot 9s linear infinite}
.shooting-star:nth-child(1){top:18%;left:75%;animation-delay:1s}
.shooting-star:nth-child(2){top:48%;left:45%;animation-delay:5s;animation-duration:12s}
.shooting-star:nth-child(3){top:70%;left:90%;animation-delay:8s;animation-duration:11s}
@keyframes nebulaDrift{0%{transform:translate(-3%,-2%) rotate(0) scale(1)}100%{transform:translate(4%,3%) rotate(12deg) scale(1.12)}}
@keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(280px)}}
@keyframes shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-35deg)}75%{opacity:1}85%{opacity:0;transform:translate(-420px,260px) rotate(-35deg)}100%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 15px #8b7aff55,0 0 35px #7164ff22}50%{text-shadow:0 0 22px #a99cffaa,0 0 55px #7164ff66}}
@keyframes orbitSpin{to{rotate:360deg}}
.page{position:relative;z-index:1;max-width:1250px;margin:auto;padding:48px 28px 80px}
header{text-align:center;margin:30px auto 44px;animation:fadeUp .9s ease both}
.eyebrow{font-size:11px;letter-spacing:5px;color:#a9a0df;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(38px,7vw,76px);font-weight:800;letter-spacing:clamp(5px,1.5vw,15px);margin:0;color:#f5f3ff;animation:titleGlow 5s ease-in-out infinite}
.subtitle{font-size:14px;color:#9ba2c9;letter-spacing:2px;margin-top:18px}
.orbit{width:170px;height:170px;border:1px solid #9185ff35;border-radius:50%;position:absolute;top:35px;left:50%;translate:-50% 0;pointer-events:none;animation:orbitSpin 38s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #9185ff28;border-radius:50%;inset:18px;transform:rotateX(65deg) rotate(35deg)}
.orbit:after{inset:38px;transform:rotateX(65deg) rotate(-35deg)}
.header-content{position:relative;z-index:1}
.search-wrap{max-width:550px;margin:0 auto 44px;position:relative;animation:fadeUp 1s .15s both}
#search{width:100%;padding:16px 20px;border-radius:30px;border:1px solid #8c83c65c;background:#0c1023cc;color:#fff;font-size:15px;outline:none;box-shadow:0 0 25px #6656d51a;transition:.25s}
#search:focus{border-color:#a99aff;box-shadow:0 0 28px #7566ff44}
#search::placeholder{color:#858bad}
.status{text-align:center;color:#8e96bd;font-size:12px;letter-spacing:1px;margin:0 auto 28px;min-height:18px}
.section-title{display:flex;align-items:center;gap:14px;margin:38px 0 20px;color:#c9c5ed;font-size:12px;letter-spacing:4px;text-transform:uppercase}
.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,#8c80d955,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{min-width:0;position:relative;overflow:hidden;border:1px solid #7774a33d;border-radius:14px;background:linear-gradient(145deg,#15182dcc,#090d1dcc);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;animation:fadeUp .6s both}
.card:hover{transform:translateY(-6px);border-color:#a89aff99;box-shadow:0 12px 35px #6558ca2c,0 0 18px #7062bd20}
.cover{width:100%;aspect-ratio:16/10;display:block;object-fit:cover;background:radial-gradient(circle at center,#24204a,#080b18);border-bottom:1px solid #7774a333}
.cover-placeholder{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#29234f,#090b18);color:#7774b0;font-size:34px;border-bottom:1px solid #7774a333}
.card-info{padding:14px 15px 16px}
.card-title{font-size:14px;font-weight:700;line-height:1.4;color:#f0efff;overflow-wrap:anywhere}
.card-subtitle{font-size:10px;letter-spacing:1px;color:#858bb5;margin-top:7px;text-transform:uppercase}
.beta-tag,.newgame-tag{display:inline-block;font-size:9px;letter-spacing:1px;border-radius:20px;padding:4px 8px;margin-top:10px}.beta-tag{color:#f0c5ff;border:1px solid #c47be866}.newgame-tag{color:#b8f3ff;border:1px solid #55cde866}
.empty{text-align:center;color:#858bb5;padding:45px 10px;font-size:14px}
footer{text-align:center;color:#626b96;font-size:10px;letter-spacing:2px;margin-top:70px}
#viewer{display:none;position:fixed;inset:0;z-index:20;background:#02030bf5}
#viewer.active{display:flex;flex-direction:column}
.viewer-bar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090c1d;border-bottom:1px solid #7774a344}
#viewerTitle{font-size:12px;letter-spacing:2px;color:#d9d5ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#closeViewer{border:1px solid #9185ff66;background:#17152d;color:#fff;border-radius:20px;padding:9px 16px;cursor:pointer;font-size:12px}
#closeViewer:hover{background:#30275b}
#frame{width:100%;height:calc(100% - 54px);border:0;background:#000}
@media(max-width:600px){.page{padding:35px 15px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-info{padding:11px}.card-title{font-size:12px}.orbit{top:18px;width:135px;height:135px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="spaceBackground" aria-hidden="true">
  <i class="shooting-star"></i>
  <i class="shooting-star"></i>
  <i class="shooting-star"></i>
</div>

<main class="page">
  <header>
    <div class="orbit"></div>
    <div class="header-content">
      <div class="eyebrow">A collection beyond the stars</div>
      <h1>END OF LIGHT</h1>
      <div class="subtitle">Beyond the edge of the universe</div>
    </div>
  </header>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search the cosmos..." autocomplete="off">
  </div>

  <div class="status" id="status">Mapping the stars...</div>

  <section id="newGamesSection" hidden>
    <div class="section-title">New Games</div>
    <div class="grid" id="newGamesGrid"></div>
  </section>


  <section id="mainSection">
    <div class="section-title">The Collection</div>
    <div class="grid" id="mainGrid"></div>
  </section>

  <div class="empty" id="empty" hidden>No entries discovered.</div>
  <footer>END OF LIGHT · EXPLORE THE UNKNOWN</footer>
</main>

<div id="viewer">
  <div class="viewer-bar">
    <div id="viewerTitle">NOW EXPLORING</div>
    <button id="closeViewer">← Return</button>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
</div>

<script>
'use strict';

const OWNER = 'AMoldyWaffle';
const REPO = 'Ocarina-of-Time';
const BRANCH = 'main';
const GAMES_DIR = 'Games';

const API_ROOT = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW_ROOT = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;

const statusEl = document.getElementById('status');
const searchEl = document.getElementById('search');
const newGamesGrid = document.getElementById('newGamesGrid');
const newGamesSection = document.getElementById('newGamesSection');
const mainGrid = document.getElementById('mainGrid');
const mainSection = document.getElementById('mainSection');
const emptyEl = document.getElementById('empty');
const viewer = document.getElementById('viewer');
const frame = document.getElementById('frame');
const viewerTitle = document.getElementById('viewerTitle');

let entries = [];
let activeBlobUrl = null;

function setFrameHtml(html) {
  if (activeBlobUrl) {
    URL.revokeObjectURL(activeBlobUrl);
    activeBlobUrl = null;
  }
  activeBlobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  frame.src = activeBlobUrl;
}

function setStatus(message) {
  statusEl.textContent = message;
}

function encodePath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

function rawUrl(path) {
  return RAW_ROOT + encodePath(path);
}

// Current source first; the older launcher sources are only tried when needed.
const LEGACY_CDN_ROOT = `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/`;
const ALL_ORIGINS_ROOT = 'https://api.allorigins.win/get?url=';

function legacyCdnUrl(path) {
  return LEGACY_CDN_ROOT + encodePath(path);
}

async function fetchJson(url) {
  const attempts = [
    { label: 'current API', url },
    { label: 'older API proxy', url: ALL_ORIGINS_ROOT + encodeURIComponent(url) }
  ];
  let lastError;

  // The older launcher pinned its tree request to the latest commit SHA.
  try {
    const commitResponse = await fetch(`${API_ROOT}/commits/${encodeURIComponent(BRANCH)}`, { cache: 'no-store' });
    if (commitResponse.ok) {
      const commit = await commitResponse.json();
      if (commit.sha) {
        const shaTreeUrl = url.replace(`/git/trees/${BRANCH}?`, `/git/trees/${commit.sha}?`);
        if (shaTreeUrl !== url) attempts.push({ label: 'older commit-pinned API', url: shaTreeUrl });
      }
    }
  } catch (_) {}

  for (const attempt of attempts) {
    try {
      const response = await fetch(attempt.url, {
        headers: { Accept: attempt.label.includes('proxy') ? 'application/json' : 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      if (attempt.label.includes('proxy')) {
        const wrapped = await response.json();
        if (!wrapped || typeof wrapped.contents !== 'string') throw new Error('Proxy returned no contents');
        return JSON.parse(wrapped.contents);
      }
      return await response.json();
    } catch (error) {
      lastError = error;
      console.warn(`[launcher] ${attempt.label} failed; trying next source:`, error.message);
    }
  }
  throw new Error(`All repository-listing sources failed: ${lastError ? lastError.message : 'unknown error'}`);
}

function decodeBase64Text(value) {
  const clean = String(value || '').replace(/\s+/g, '');
  const binary = atob(clean);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

async function fetchTextWithFallback(path) {
  const attempts = [
    { label: 'current raw', url: rawUrl(path) },
    { label: 'older CDN', url: legacyCdnUrl(path) },
    { label: 'older AllOrigins raw', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl(path)) }
  ];
  let lastError;

  for (const attempt of attempts) {
    try {
      const response = await fetch(attempt.url, { cache: 'no-store', mode: 'cors' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text) throw new Error('The server returned an empty file');
      if (/\.html?$/i.test(path)) {
        if (!/<html[\s>]/i.test(text) && !/<body[\s>]/i.test(text)) throw new Error('The server returned an error message instead of an HTML document');
      } else if (/^(<!doctype html|<html[\s>])/i.test(text.trim())) {
        throw new Error('Received an HTML error page instead of the requested file');
      }
      console.info(`[launcher] Loaded ${path} using ${attempt.label}`);
      return { text, sourceUrl: attempt.url, sourceLabel: attempt.label };
    } catch (error) {
      lastError = error;
      console.warn(`[launcher] ${attempt.label} failed for ${path}:`, error.message);
    }
  }

  // Original launcher fallback: GitHub Contents API base64 response.
  try {
    const contentsUrl = `${API_ROOT}/contents/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`;
    const response = await fetch(contentsUrl, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data && data.encoding === 'base64' && data.content) {
      console.info(`[launcher] Loaded ${path} using older Contents API fallback`);
      return { text: decodeBase64Text(data.content), sourceUrl: legacyCdnUrl(path), sourceLabel: 'older Contents API' };
    }
    throw new Error('Contents API did not return base64 file data');
  } catch (error) {
    lastError = error;
  }

  // The older version also routed API responses through AllOrigins.
  try {
    const contentsUrl = `${API_ROOT}/contents/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`;
    const response = await fetch(ALL_ORIGINS_ROOT + encodeURIComponent(contentsUrl), { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const wrapped = await response.json();
    const data = wrapped && typeof wrapped.contents === 'string' ? JSON.parse(wrapped.contents) : null;
    if (data && data.encoding === 'base64' && data.content) {
      console.info(`[launcher] Loaded ${path} using older AllOrigins + Contents API fallback`);
      return { text: decodeBase64Text(data.content), sourceUrl: legacyCdnUrl(path), sourceLabel: 'older AllOrigins + Contents API' };
    }
    throw new Error('AllOrigins did not return file data');
  } catch (error) {
    lastError = error;
  }

  throw new Error(`Could not load ${path} from any source: ${lastError ? lastError.message : 'unknown error'}`);
}

async function loadCoverImage(img, path) {
  const attempts = [rawUrl(path), legacyCdnUrl(path), 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl(path))];
  for (const url of attempts) {
    try {
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      return;
    } catch (_) {}
  }

  // Last old-style fallback: fetch base64 through the Contents API and use a Blob URL.
  try {
    const contentsUrl = `${API_ROOT}/contents/${encodePath(path)}?ref=${encodeURIComponent(BRANCH)}`;
    let response;
    try {
      response = await fetch(contentsUrl, { cache: 'no-store' });
    } catch (_) {
      response = await fetch(ALL_ORIGINS_ROOT + encodeURIComponent(contentsUrl), { cache: 'no-store' });
      if (response.ok) {
        const wrapper = await response.json();
        response = new Response(wrapper.contents, { status: 200, headers: { 'Content-Type': 'application/json' } });
      }
    }
    if (!response.ok) throw new Error('Contents API unavailable');
    let data = await response.json();
    if (data && typeof data.contents === 'string' && !data.content) data = JSON.parse(data.contents);
    if (!data || data.encoding !== 'base64' || !data.content) throw new Error('No base64 image data');
    const bytes = Uint8Array.from(atob(data.content.replace(/\s+/g, '')), ch => ch.charCodeAt(0));
    const mime = data.type === 'file' ? (path.match(/\.png$/i) ? 'image/png' : path.match(/\.webp$/i) ? 'image/webp' : path.match(/\.gif$/i) ? 'image/gif' : 'image/jpeg') : 'application/octet-stream';
    img.src = URL.createObjectURL(new Blob([bytes], { type: mime }));
    return;
  } catch (_) {}

  const placeholder = document.createElement('div');
  placeholder.className = 'cover-placeholder';
  placeholder.textContent = '✧';
  img.replaceWith(placeholder);
}

function getFileName(path) {
  return path.split('/').pop() || '';
}

function isImage(path) {
  return /\.(png|jpe?g|gif|webp|avif)$/i.test(path);
}

function isHtml(path) {
  return /\.html?$/i.test(path);
}

function buildEntries(tree) {
  const prefix = GAMES_DIR + '/';
  const folders = new Map();

  // First collect every folder directly inside Games/.
  for (const item of tree) {
    if (item.type !== 'blob' || !item.path.startsWith(prefix)) continue;

    const relative = item.path.slice(prefix.length);
    const parts = relative.split('/');
    if (parts.length < 2) continue;

    const folderName = parts[0];
    if (!folders.has(folderName)) {
      folders.set(folderName, {
        name: folderName,
        htmlFiles: [],
        coverFiles: [],
        beta: false,
        newGame: false
      });
    }

    const entry = folders.get(folderName);
    const fileName = getFileName(item.path);
    const remainder = parts.slice(1);

    // Marker files are placed directly inside the entry folder.
    if (remainder.length === 1 && /^beta/i.test(fileName)) {
      entry.beta = true;
    }
    if (remainder.length === 1 && /^newgame/i.test(fileName)) {
      entry.newGame = true;
    }

    // The launch HTML must be directly inside the entry folder.
    if (remainder.length === 1 && isHtml(fileName)) {
      entry.htmlFiles.push(item.path);
    }

    // Cover images must be inside the Cover subfolder.
    if (remainder.length >= 2 &&
        remainder[0].toLowerCase() === 'cover' &&
        isImage(fileName)) {
      entry.coverFiles.push(item.path);
    }
  }

  const results = [];

  for (const entry of folders.values()) {
    // Preserve the original requirements: Cover image + root HTML file.
    if (!entry.coverFiles.length || !entry.htmlFiles.length) continue;

    entry.htmlFiles.sort((a, b) => {
      const aIndex = /^index\.html?$/i.test(getFileName(a)) ? 0 : 1;
      const bIndex = /^index\.html?$/i.test(getFileName(b)) ? 0 : 1;
      return aIndex - bIndex || a.localeCompare(b);
    });

    entry.coverFiles.sort((a, b) => a.localeCompare(b));

    results.push({
      name: entry.name,
      html: entry.htmlFiles[0],
      cover: entry.coverFiles[0],
      beta: entry.beta,
      newGame: entry.newGame
    });
  }

  return results.sort((a, b) => a.name.localeCompare(b.name));
}

function makeCard(entry) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.search = entry.name.toLowerCase();

  const img = document.createElement('img');
  img.className = 'cover';
  img.alt = '';
  img.loading = 'lazy';
  loadCoverImage(img, entry.cover);

  card.appendChild(img);

  const info = document.createElement('div');
  info.className = 'card-info';

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = entry.name;
  info.appendChild(title);

  const subtitle = document.createElement('div');
  subtitle.className = 'card-subtitle';
  subtitle.textContent = 'Ready to explore';
  info.appendChild(subtitle);

  if (entry.beta) {
    const tag = document.createElement('span');
    tag.className = 'beta-tag';
    tag.textContent = 'BETA';
    info.appendChild(tag);
  }

  if (entry.newGame) {
    const tag = document.createElement('span');
    tag.className = 'newgame-tag';
    tag.textContent = 'NEW';
    info.appendChild(tag);
  }

  card.appendChild(info);
  card.addEventListener('click', () => launchEntry(entry));

  return card;
}

function renderSection(grid, section, list) {
  grid.replaceChildren();
  section.hidden = list.length === 0;

  list.forEach((entry, index) => {
    const card = makeCard(entry);
    card.style.animationDelay = `${Math.min(index * 35, 350)}ms`;
    grid.appendChild(card);
  });
}

function renderCards(list) {
  const newGameItems = list.filter(entry => entry.newGame);
  const regularItems = list.filter(entry => !entry.newGame);

  renderSection(newGamesGrid, newGamesSection, newGameItems);
  renderSection(mainGrid, mainSection, regularItems);

  emptyEl.hidden = list.length !== 0;
}

function filterCards() {
  const query = searchEl.value.trim().toLowerCase();
  const filtered = entries.filter(entry =>
    entry.name.toLowerCase().includes(query)
  );
  renderCards(filtered);
}

async function launchEntry(entry) {
  if (!entry.html) return;

  viewerTitle.textContent = entry.name.toUpperCase();
  viewer.classList.add('active');
  viewer.style.display = 'flex';
  document.body.style.overflow = 'hidden';

  setFrameHtml('<!DOCTYPE html><html><body style="background:#000;color:white;font-family:Arial;padding:20px">Opening...</body></html>');

  try {
    const loaded = await fetchTextWithFallback(entry.html);
    let html = loaded.text;

    if (!/<html[\s>]/i.test(html) && !/<body[\s>]/i.test(html)) {
      throw new Error('The selected file does not appear to be a valid HTML document.');
    }

    const basePath = entry.html.split('/').slice(0, -1).join('/') + '/';
    const currentBase = rawUrl(basePath);
    const legacyBase = legacyCdnUrl(basePath);
    const selectedBase = loaded.sourceLabel === 'older CDN' ? legacyBase : currentBase;
    const fallbackScript = `<script>(function(){
      var rawBase=${JSON.stringify(currentBase)};
      var oldBase=${JSON.stringify(legacyBase)};
      function oldUrl(value){
        try{var u=typeof value==='string'?value:(value&&value.url)||'';u=new URL(u,document.baseURI).href;if(u.indexOf(rawBase)===0)return oldBase+u.slice(rawBase.length);}catch(e){}
        return null;
      }
      var nativeFetch=window.fetch&&window.fetch.bind(window);
      if(nativeFetch)window.fetch=function(input,init){
        var alt=oldUrl(input);
        return nativeFetch(input,init).then(function(response){if(!response.ok&&alt)return nativeFetch(alt,init);return response;}).catch(function(error){if(alt)return nativeFetch(alt,init);throw error;});
      };
      function patchWorker(name){var Native=window[name];if(!Native)return;try{window[name]=function(url,options){try{return new Native(url,options);}catch(error){var alt=oldUrl(url);if(alt)return new Native(alt,options);throw error;};};window[name].prototype=Native.prototype;}catch(e){}}
      patchWorker('Worker');patchWorker('SharedWorker');
      document.addEventListener('error',function(event){var el=event.target;if(!el)return;var prop=('src' in el)?'src':(('href' in el)?'href':null);if(!prop)return;var alt=oldUrl(el[prop]);if(alt&&!el.dataset.legacyFallback){el.dataset.legacyFallback='1';el[prop]=alt;}},true);
    })();<\/script>`;
    const baseTag = `<base href="${selectedBase}">`;

    if (/<head[\s>]/i.test(html)) {
      html = html.replace(/<head([^>]*)>/i, match => match + baseTag + fallbackScript);
    } else if (/<html[\s>]/i.test(html)) {
      html = html.replace(/<html([^>]*)>/i, match =>
        match + '<head>' + baseTag + fallbackScript + '</head>'
      );
    } else {
      html = `<!DOCTYPE html><html><head>${baseTag}${fallbackScript}</head><body>${html}</body></html>`;
    }

    setFrameHtml(html);
  } catch (error) {
    console.error('Launch failed:', error);
    setFrameHtml(`<!DOCTYPE html><html><body style="background:#080b18;color:#fff;font-family:Arial;padding:30px"><h2>Unable to open this entry</h2><p>${escapeHtml(error.message)}</p><p>Check the browser console for details.</p></body></html>`);
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function closeViewer() {
  viewer.classList.remove('active');
  viewer.style.display = 'none';
  frame.src = 'about:blank';
  if (activeBlobUrl) {
    URL.revokeObjectURL(activeBlobUrl);
    activeBlobUrl = null;
  }
  document.body.style.overflow = '';
}

document.getElementById('closeViewer').addEventListener('click', closeViewer);

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && viewer.classList.contains('active')) {
    closeViewer();
  }
});

searchEl.addEventListener('input', filterCards);

async function init() {
  try {
    setStatus('Mapping the stars...');

    const treeData = await fetchJson(
      `${API_ROOT}/git/trees/${BRANCH}?recursive=1`
    );

    if (!Array.isArray(treeData.tree)) {
      throw new Error('The repository listing could not be read.');
    }

    if (treeData.truncated) {
      console.warn('The repository tree was truncated by the API.');
    }

    entries = buildEntries(treeData.tree);

    if (!entries.length) {
      setStatus('No entries found. Check the repository folder structure.');
      renderCards([]);
      return;
    }

    renderCards(entries);
    setStatus(`${entries.length} destinations discovered`);
  } catch (error) {
    console.error('Collection loading failed:', error);
    setStatus('Unable to map the collection: ' + error.message);
    emptyEl.hidden = false;
    emptyEl.textContent = 'The collection could not be loaded. Check the browser console for details.';
  }
}

init();
</script>
