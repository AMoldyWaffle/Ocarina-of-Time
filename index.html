
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 35px 15px;
    background: #191920;
    border-bottom: 1px solid #30303a;
}

header h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 3px;
}

header p { color: #999; }

.toolbar {
    display: flex;
    justify-content: center;
    padding: 20px;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    padding: 10px 15px;
    background: #292936;
    color: white;
    border: 1px solid #444455;
    border-radius: 8px;
    cursor: pointer;
}

button:hover { background: #41415a; }

#status {
    text-align: center;
    color: #999;
    padding: 10px;
}

#games {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(180px, 220px)
    );
    justify-content: center;
    gap: 25px;
    padding: 25px;
}

.game {
    background: #1b1b24;
    border: 1px solid #30303c;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
}

.game:hover {
    transform: translateY(-5px);
    border-color: #8585d5;
}

.cover-button {
    padding: 0;
    width: 100%;
    border: none;
    border-radius: 0;
    background: transparent;
}

.game img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    background: #252530;
}

.game-name {
    padding: 13px;
    text-align: center;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.launch-button {
    width: calc(100% - 20px);
    margin: 0 10px 10px;
    background: #34345a;
}

.alternates {
    padding: 0 10px 12px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
}

.alternates button {
    font-size: 10px;
    padding: 6px 8px;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #888;
    padding: 60px 15px;
}

footer {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>GAME LIBRARY</h1>
    <p>Your personal game collection</p>
</header>

<div class="toolbar">
    <button onclick="scanGames()">Refresh Library</button>
</div>

<div id="status">Connecting to repository...</div>

<div id="games">
    <div class="empty">Loading games...</div>
</div>

<footer>OCARINA OF TIME GAME LIBRARY</footer>

<script>

// ==========================================
// CONFIGURATION
// ==========================================

const OWNER = "AMoldyWaffle";
const REPOSITORY = "Ocarina-of-Time";
const BRANCH = "main";

const GAME_DIRECTORY = "Games";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPOSITORY}/git/trees/${BRANCH}?recursive=1`;

const SITE_BASE =
    "https://amoldywaffle.github.io/Ocarina-of-Time/";


// ==========================================
// LINK PROVIDERS
// ==========================================

// Order matters.
// Automatic launching tries these in sequence.

const PROVIDERS = [

    {
        name: "GitHub Pages",
        id: "pages",
        base: SITE_BASE,
        automatic: true
    },

    {
        name: "jsDelivr",
        id: "jsdelivr",
        base: `https://cdn.jsdelivr.net/gh/${OWNER}/${REPOSITORY}@${BRANCH}/`,
        automatic: true
    },

    {
        name: "jsDelivr Mirror",
        id: "fastly",
        base: `https://fastly.jsdelivr.net/gh/${OWNER}/${REPOSITORY}@${BRANCH}/`,
        automatic: true
    },

    {
        name: "GitHub Raw",
        id: "raw",
        base: `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}/`,
        automatic: false
    }

];


// ==========================================
// ELEMENTS
// ==========================================

const gamesContainer = document.getElementById("games");
const statusText = document.getElementById("status");

let discoveredGames = [];


// ==========================================
// URL GENERATOR
// ==========================================

function getURL(provider, path) {

    const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return provider.base + encodedPath;

}

function getAllURLs(path) {

    return PROVIDERS.map(provider => ({
        provider: provider,
        url: getURL(provider, path)
    }));

}


// ==========================================
// REPOSITORY SCANNER
// ==========================================

async function scanGames() {

    gamesContainer.innerHTML = "";
    statusText.textContent = "Scanning repository...";

    try {

        const response = await fetch(API_URL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(
                "GitHub API error: " + response.status
            );
        }

        const data = await response.json();

        if (!data.tree || data.truncated) {
            throw new Error(
                "Repository tree unavailable or truncated."
            );
        }

        const files = data.tree.filter(file =>
            file.type === "blob"
        );

        const prefix = GAME_DIRECTORY + "/";
        const folders = new Map();

        // Organize files into game folders.

        for (const file of files) {

            if (!file.path.startsWith(prefix)) continue;

            const remaining = file.path.slice(prefix.length);
            const parts = remaining.split("/");

            if (parts.length < 2) continue;

            const folder = parts[0];

            if (!folders.has(folder)) {
                folders.set(folder, []);
            }

            folders.get(folder).push(file);

        }


        // Inspect each game folder.

        discoveredGames = [];

        for (const [folderName, folderFiles] of folders) {

            let cover = null;
            let html = null;

            // Find Cover directory images.

            const covers = folderFiles.filter(file => {

                const parts = file.path.split("/");
                const filename = parts[parts.length - 1];

                return (
                    parts.length >= 4 &&
                    parts[2].toLowerCase() === "cover" &&
                    /\.(png|jpe?g|webp|gif|bmp|avif)$/i.test(filename)
                );

            });

            if (covers.length) {

                cover = covers.find(file =>
                    file.path.split("/").pop().toLowerCase() === "cover.png"
                ) || covers[0];

            }

            // Find HTML files.

            const htmlFiles = folderFiles.filter(file =>
                /\.html?$/i.test(file.path)
            );

            if (htmlFiles.length) {

                html = htmlFiles.find(file =>
                    file.path.toLowerCase() ===
                    `${prefix}${folderName}/index.html`.toLowerCase()
                );

                if (!html) {
                    html = htmlFiles.find(file =>
                        file.path.split("/").length === 3
                    );
                }

                if (!html) {
                    html = htmlFiles[0];
                }

            }

            // Require both files.

            if (cover && html) {

                discoveredGames.push({
                    name: folderName,
                    cover: cover.path,
                    html: html.path
                });

            }

        }

        discoveredGames.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        displayGames();

    } catch (error) {

        console.error(error);

        statusText.textContent = "Repository scan failed.";

        gamesContainer.innerHTML = `
            <div class="empty">
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


// ==========================================
// COVER IMAGE FALLBACKS
// ==========================================

function setupCoverImage(image, path) {

    const urls = getAllURLs(path);

    let current = 0;

    function tryNext() {

        if (current >= urls.length) {
            image.removeAttribute("src");
            image.alt = "Cover unavailable";
            return;
        }

        image.src = urls[current].url;
        current++;

    }

    image.onerror = tryNext;

    tryNext();

}


// ==========================================
// DISPLAY GAMES
// ==========================================

function displayGames() {

    gamesContainer.innerHTML = "";

    if (!discoveredGames.length) {

        gamesContainer.innerHTML = `
            <div class="empty">
                No compatible games found.
            </div>
        `;

        statusText.textContent = "0 games found.";

        return;
    }

    for (const game of discoveredGames) {

        const card = document.createElement("div");
        card.className = "game";

        // Cover.

        const coverButton = document.createElement("button");
        coverButton.className = "cover-button";

        const image = document.createElement("img");

        image.alt = game.name;
        image.loading = "lazy";

        setupCoverImage(image, game.cover);

        coverButton.appendChild(image);

        coverButton.onclick = () => launchGame(game);

        // Name.

        const name = document.createElement("div");
        name.className = "game-name";
        name.textContent = game.name;

        // Automatic launch.

        const launch = document.createElement("button");
        launch.className = "launch-button";
        launch.textContent = "PLAY";

        launch.onclick = () => launchGame(game);

        // Manual alternative sources.

        const alternates = document.createElement("div");
        alternates.className = "alternates";

        for (const provider of PROVIDERS) {

            const button = document.createElement("button");

            button.textContent = provider.name;

            button.title = "Open using " + provider.name;

            button.onclick = () => {

                openGameDirectly(game, provider);

            };

            alternates.appendChild(button);

        }

        card.appendChild(coverButton);
        card.appendChild(name);
        card.appendChild(launch);
        card.appendChild(alternates);

        gamesContainer.appendChild(card);

    }

    statusText.textContent =
        discoveredGames.length + " games discovered.";

}


// ==========================================
// AUTOMATIC FALLBACK LAUNCHER
// ==========================================

async function launchGame(game) {

    statusText.textContent =
        "Preparing " + game.name + "...";

    const providers = PROVIDERS.filter(provider =>
        provider.automatic
    );

    for (const provider of providers) {

        const url = getURL(provider, game.html);

        statusText.textContent =
            `Trying ${provider.name} for ${game.name}...`;

        try {

            const controller = new AbortController();

            const timeout = setTimeout(
                () => controller.abort(),
                10000
            );

            let response;

            try {

                response = await fetch(url, {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal
                });

            } finally {

                clearTimeout(timeout);

            }

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const contentType =
                response.headers.get("content-type") || "";

            // Don't automatically launch plain-text files.

            if (
                !contentType.includes("text/html") &&
                !contentType.includes("application/xhtml+xml")
            ) {
                throw new Error(
                    "The server did not return an HTML document."
                );
            }

            statusText.textContent =
                "Launching through " + provider.name + "...";

            window.location.assign(url);

            return;

        } catch (error) {

            console.warn(
                provider.name + " failed:",
                error
            );

        }

    }

    statusText.textContent =
        "Automatic sources failed. Choose a manual source below.";

    alert(
        "Automatic launching failed for " + game.name +
        ". Try one of its alternative source buttons."
    );

}


// ==========================================
// MANUAL SOURCE LAUNCHING
// ==========================================

function openGameDirectly(game, provider) {

    const url = getURL(provider, game.html);

    window.open(url, "_blank");

}


// ==========================================
// HTML ESCAPING
// ==========================================

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}


// ==========================================
// START
// ==========================================

scanGames();

</script>

</body>
</html>
