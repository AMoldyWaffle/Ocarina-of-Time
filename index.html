<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocarina of Time</title>
  <link id="favicon" rel="icon">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
    h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; color: #f0c040; }
    #searchWrap { max-width: 1200px; margin: 0 auto 2rem; display: flex; justify-content: center; }
    #search { width: 100%; max-width: 520px; padding: .75rem 1rem; font-size: 1rem; background: #16213e; border: 1px solid #0f3460; border-radius: 8px; color: #e0e0e0; }
    #status { text-align: center; margin-top: 3rem; color: #aaa; }
    .section { max-width: 1200px; margin: 0 auto 2.5rem; }
    .section-title { font-size: 1.3rem; color: #f0c040; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 1px solid #0f3460; }
    #betaSection .section-title { color: #ff9966; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
    .card { background: #16213e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px #0006; cursor: pointer; transition: transform .2s; }
    .card:hover { transform: translateY(-4px); }
    .cover { position: relative; aspect-ratio: 1; background: #0f0f1a; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #777; }
    .folder-name { padding: .75rem 1rem; text-align: center; color: #f0c040; background: #0f3460; overflow-wrap: anywhere; }
    #betaSection .folder-name { color: #ff9966; }
    #noResults { text-align: center; padding: 2rem; color: #aaa; }
    .error { color: #ff6b6b !important; }
    #viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
    #viewer.open { display: flex; }
    #viewerBar { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; background: #16213e; }
    #viewerBar button { background: #0f3460; color: #f0c040; border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; }
    #viewerTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #viewerFrame { flex: 1; border: 0; width: 100%; background: #000; }
    @media(max-width:600px) { body { padding: 1rem; } .grid { grid-template-columns: repeat(auto-fill,minmax(145px,1fr)); } }
  </style>
</head>
<body>
  <h1>Ocarina of Time</h1>
  <div id="searchWrap">
    <input id="search" type="search" placeholder="Search games…" autocomplete="off" disabled>
  </div>
  <div id="status">Loading game list…</div>
  <div id="betaSection" class="section" hidden></div>
  <div id="mainSection" class="section" hidden></div>
  <div id="noResults" hidden>No games match your search.</div>

  <div id="viewer">
    <div id="viewerBar">
      <button id="closeViewer">← Back</button>
      <span id="viewerTitle"></span>
    </div>
    <iframe id="viewerFrame" title="Game" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads allow-presentation allow-orientation-lock"></iframe>
  </div>

<script>
(async function () {
  'use strict';

  const OWNER = 'AMoldyWaffle';
  const REPO = 'Ocarina-of-Time';
  const BRANCH = 'main';
  const GAMES_DIR = 'Games';

  const TREE_URL =
    `https://data.jsdelivr.com/v1/packages/gh/${OWNER}/${REPO}@${BRANCH}?structure=tree`;

  const rawFile = path =>
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/` +
    path.split('/').map(encodeURIComponent).join('/');

  const statusEl = document.getElementById('status');
  const searchInput = document.getElementById('search');
  const betaSection = document.getElementById('betaSection');
  const mainSection = document.getElementById('mainSection');
  const noResults = document.getElementById('noResults');
  const viewer = document.getElementById('viewer');
  const viewerFrame = document.getElementById('viewerFrame');
  const viewerTitle = document.getElementById('viewerTitle');
  const faviconEl = document.getElementById('favicon');

  const isImage = name => /\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i.test(name);

  function flattenTree(nodes, parent = '', output = []) {
    for (const node of nodes || []) {
      const path = parent ? `${parent}/${node.name}` : node.name;

      output.push({
        type: node.type === 'directory' ? 'tree' : 'blob',
        name: node.name,
        path
      });

      if (node.type === 'directory' && Array.isArray(node.files)) {
        flattenTree(node.files, path, output);
      }
    }
    return output;
  }

  async function getTree() {
    const response = await fetch(TREE_URL, {
      cache: 'no-store',
      mode: 'cors',
      credentials: 'omit'
    });

    if (!response.ok) {
      throw new Error(`Repository listing failed: HTTP ${response.status}`);
    }

    const data = await response.json();
    if (!Array.isArray(data.files)) {
      throw new Error('Unexpected jsDelivr repository tree format.');
    }

    return flattenTree(data.files);
  }

  function showCoverFallback(cover) {
    const placeholder = document.createElement('div');
    placeholder.className = 'cover-placeholder';
    placeholder.textContent = 'No cover';
    cover.replaceChildren(placeholder);
  }

  function loadCover(cover, imagePath) {
    const img = new Image();
    img.alt = 'Game cover';
    img.loading = 'lazy';
    img.decoding = 'async';

    img.onload = () => cover.replaceChildren(img);
    img.onerror = () => showCoverFallback(cover);
    img.src = rawFile(imagePath);
  }

  function injectBase(html, baseHref) {
    const baseTag = `<base href="${baseHref}">`;
    html = html.replace(/<base\b[^>]*>/gi, '');

    if (/<head\b[^>]*>/i.test(html)) {
      return html.replace(/<head\b[^>]*>/i, match => match + '\n' + baseTag);
    }

    if (/<html\b[^>]*>/i.test(html)) {
      return html.replace(/<html\b[^>]*>/i, match =>
        match + '\n<head>' + baseTag + '</head>'
      );
    }

    return baseTag + '\n' + html;
  }

  function closeViewer() {
    viewer.classList.remove('open');
    viewerFrame.srcdoc = '';
    document.body.style.overflow = '';
  }

  document.getElementById('closeViewer').addEventListener('click', closeViewer);

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && viewer.classList.contains('open')) {
      closeViewer();
    }
  });

  async function launchGame(htmlPath, folderName) {
    viewerTitle.textContent = folderName + ' — loading…';
    viewerFrame.srcdoc =
      '<!DOCTYPE html><html><body style="background:#111;color:#ccc;' +
      'font-family:sans-serif;display:grid;place-items:center;height:100vh">' +
      'Loading game…</body></html>';

    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';

    try {
      const response = await fetch(rawFile(htmlPath), {
        cache: 'no-store',
        mode: 'cors',
        credentials: 'omit'
      });

      if (!response.ok) {
        throw new Error(`Game HTML returned HTTP ${response.status}`);
      }

      let html = await response.text();

      const directory = htmlPath.includes('/')
        ? htmlPath.slice(0, htmlPath.lastIndexOf('/') + 1)
        : '';

      html = injectBase(html, rawFile(directory));

      viewerFrame.srcdoc = html;
      viewerTitle.textContent = folderName;
    } catch (error) {
      viewerTitle.textContent = folderName;
      viewerFrame.srcdoc =
        '<!DOCTYPE html><html><body style="background:#111;color:#ff6b6b;' +
        'font-family:sans-serif;padding:2rem">Failed to load game: ' +
        String(error.message).replace(/[<>&]/g, '') +
        '</body></html>';
      console.error('[game launch]', error);
    }
  }

  function buildCard(item) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = item.folderName.toLowerCase();
    card.title = 'Play ' + item.folderName;

    const cover = document.createElement('div');
    cover.className = 'cover';

    const placeholder = document.createElement('div');
    placeholder.className = 'cover-placeholder';
    placeholder.textContent = 'Loading…';
    cover.appendChild(placeholder);

    const name = document.createElement('div');
    name.className = 'folder-name';
    name.textContent = item.folderName;

    card.append(cover, name);
    card.addEventListener('click', () =>
      launchGame(item.htmlPath, item.folderName)
    );

    loadCover(cover, item.imagePath);
    return card;
  }

  function renderSection(section, title, items) {
    if (!items.length) return;

    section.hidden = false;

    const heading = document.createElement('h2');
    heading.className = 'section-title';
    heading.textContent = title;

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const item of items) {
      grid.appendChild(buildCard(item));
    }

    section.append(heading, grid);
  }

  function applyFilter() {
    const query = searchInput.value.trim().toLowerCase();
    let anyVisible = false;

    for (const section of [betaSection, mainSection]) {
      const grid = section.querySelector('.grid');
      if (!grid) continue;

      let visible = 0;

      for (const card of grid.children) {
        const matches = !query || card.dataset.name.includes(query);
        card.style.display = matches ? '' : 'none';
        if (matches) visible++;
      }

      section.hidden = visible === 0;
      if (visible) anyVisible = true;
    }

    noResults.hidden = anyVisible;
  }

  searchInput.addEventListener('input', applyFilter);

  try {
    const tree = await getTree();

    const childrenOf = new Map();
    const allDirs = new Set();

    for (const item of tree) {
      if (item.type === 'tree') allDirs.add(item.path);

      const parts = item.path.split('/');
      const parent = parts.length === 1 ? '' : parts.slice(0, -1).join('/');

      if (!childrenOf.has(parent)) childrenOf.set(parent, []);
      childrenOf.get(parent).push(item);
    }

    const rootChildren = childrenOf.get('') || [];
    const gamesRoot = rootChildren.find(item =>
      item.type === 'tree' && item.path === GAMES_DIR
    );

    if (!gamesRoot) {
      throw new Error(`No "${GAMES_DIR}" folder found in repository root.`);
    }

    // Find favicon in either supported location.
    const faviconDirs = ['favicon', `${GAMES_DIR}/favicon`];

    for (const directory of faviconDirs) {
      const images = (childrenOf.get(directory) || [])
        .filter(item => item.type === 'blob' && isImage(item.name));

      if (images.length) {
        const favicon = images.find(item => /^favicon\./i.test(item.name)) || images[0];
        faviconEl.href = rawFile(favicon.path);
        break;
      }
    }

    const results = [];
    const prefix = GAMES_DIR + '/';

    for (const dirPath of allDirs) {
      if (!dirPath.startsWith(prefix)) continue;
      if (faviconDirs.includes(dirPath)) continue;

      const children = childrenOf.get(dirPath) || [];

      const coverDir = children.find(item =>
        item.type === 'tree' && item.path === `${dirPath}/Cover`
      );

      if (!coverDir) continue;

      const htmlFiles = children.filter(item =>
        item.type === 'blob' &&
        item.path.startsWith(dirPath + '/') &&
        !item.path.slice(dirPath.length + 1).includes('/') &&
        /\.html?$/i.test(item.name)
      );

      if (!htmlFiles.length) continue;

      const coverImages = (childrenOf.get(coverDir.path) || [])
        .filter(item => item.type === 'blob' && isImage(item.name));

      if (!coverImages.length) continue;

      const htmlFile =
        htmlFiles.find(item => /^index\.html?$/i.test(item.name)) ||
        htmlFiles.sort((a, b) => a.name.localeCompare(b.name))[0];

      const isBeta = children.some(item =>
        item.type === 'blob' && /^beta/i.test(item.name)
      );

      results.push({
        folderName: dirPath.split('/').pop(),
        imagePath: coverImages[0].path,
        htmlPath: htmlFile.path,
        isBeta
      });
    }

    if (!results.length) {
      throw new Error('No valid game folders found inside Games/.');
    }

    statusEl.style.display = 'none';
    searchInput.disabled = false;

    renderSection(
      betaSection,
      'Beta',
      results.filter(item => item.isBeta)
    );

    renderSection(
      mainSection,
      'Games',
      results.filter(item => !item.isBeta)
    );

    applyFilter();

  } catch (error) {
    statusEl.textContent = 'Failed to load game list: ' + error.message;
    statusEl.classList.add('error');
    console.error('[launcher]', error);
  }
})();
</script>
</body>
</html>
