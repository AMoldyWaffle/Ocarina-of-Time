<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening game…</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#ddd;font:14px system-ui,sans-serif}
body{display:grid;place-items:center}
</style>
</head>
<body>
<div id="status">Opening game…</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const gameUrl = params.get("game");
const title = params.get("title") || "Game";

if (!gameUrl) {
  document.getElementById("status").textContent = "Missing game URL.";
} else {
  document.title = title;
  // Replace this small loader document inside the launcher's existing iframe.
  // The final game therefore runs at its original GitHub Pages URL and origin.
  location.replace(gameUrl);
}
</script>
</body>
</html>
