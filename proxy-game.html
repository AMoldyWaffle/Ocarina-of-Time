
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Opening game…</title>

<link rel="preconnect" href="https://amoldywaffle.github.io">
<link rel="preconnect" href="https://raw.githubusercontent.com">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#ddd;
  font:14px system-ui,sans-serif;
}

body{
  display:grid;
  place-items:center;
}
</style>
</head>

<body>

<div id="status">Opening game…</div>

<script>
"use strict";

(() => {

  const params = new URLSearchParams(location.search);

  const gameUrl = params.get("game");
  const title = params.get("title") || "Game";

  if (!gameUrl) {
    document.getElementById("status").textContent =
      "Missing game URL.";
    return;
  }

  let destination;

  try {
    destination = new URL(gameUrl);
  } catch {
    document.getElementById("status").textContent =
      "Invalid game URL.";
    return;
  }

  // Only allow games hosted on your GitHub Pages domain.

  if (
    destination.protocol !== "https:" ||
    destination.hostname !== "amoldywaffle.github.io" ||
    !destination.pathname.startsWith("/Ocarina-of-Time/Games/")
  ) {
    document.getElementById("status").textContent =
      "Game URL is not permitted.";
    return;
  }

  document.title = title;

  // Immediately navigate to the actual game.
  // No additional loader or initialization is required.

  location.replace(destination.href);

})();
</script>

</body>
</html>
